media:
  input: books/covers
  output: /books/covers

content:
  - name: edge
    label: Books
    type: collection
    path: _edge/books
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, topic, year]
      sort: date
      order: desc
    fields:
      - name: title
        label: Book title
        type: string
        required: true
      - name: subtitle
        label: One-line summary
        type: string
      - name: logline
        label: Logline for X
        description: "One line, e.g. 'Ordinary people out-predict intelligence analysts..., in a tournament-tested guide to better judgment'. Posted on X with the link. Keep it under 250 characters."
        type: text
      - name: authors
        label: Authors
        type: string
        list: true
      - name: year
        label: Year published
        type: number
      - name: date
        label: Date (newest appear first on the site and in "Latest")
        type: date
      - name: topic
        label: Topic
        type: select
        options:
          values: ["Football", "Betting & markets", "Sports analytics", "Thinking & decisions", "Personal development", "Work & leadership"]
      - name: cover
        label: Cover image
        description: Upload the book cover (portrait). Leave as is for imported books.
        type: image
      - name: draft
        label: Draft (hide from the site)
        type: boolean
      - name: body
        label: Takeaways
        description: Write the review. For the special boxes, use a bold line "Key ideas:" followed by a bullet list, and a paragraph starting with bold "Worth it if:".
        type: rich-text
  - name: quotes
    label: Quotes
    type: file
    path: quotes/quotes.json
    format: json
    list: true
    fields:
      - name: id
        label: Number
        description: Next number in line (shown as #N and used in links). Leave empty and it is filled from the position in the list.
        type: number
      - name: date
        label: Date added
        type: date
        required: true
      - name: category
        label: Chapter
        type: select
        required: true
        options:
          values: ["Action & initiative", "Discipline & consistency", "Health & daily habits", "Excellence & work ethic", "Resilience & inner growth", "Happiness & gratitude", "Relationships & character", "Authenticity & independence", "Time & money", "Rules for life"]
      - name: title
        label: Core message (optional heading)
        type: string
      - name: text
        label: Quote
        description: Plain text. Leave an empty line between paragraphs. Lines starting with "- " become a bullet list.
        type: text
        required: true
      - name: context
        label: Context (optional)
        type: string
      - name: author
        label: Who said it (optional)
        description: Just the person's name, e.g. "Carl Jung". Becomes a filter pill on the site; leave empty if unknown.
        type: string
      - name: source
        label: Source (optional)
        description: e.g. "The Psychology of Money by Morgan Housel" or "Attributed to Carl Jung"
        type: string
      - name: note
        label: Note (optional)
        type: string
      - name: draft
        label: Draft (hide from the site)
        type: boolean
