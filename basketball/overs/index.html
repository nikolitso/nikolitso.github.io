<script>
const $ = id => document.getElementById(id);
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayName = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const short = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const pct = (x, d=0) => x == null ? '–' : (x*100).toFixed(d) + '%';
const sgn = (x, d=1) => x == null ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
const roi = x => x == null ? '–' : sgn(x*100, 1) + '%';
const cls = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
const sn = s => s.replace('-', '–');
let view = 'home', lg = 'all', open = null;
const LG = Object.fromEntries(DATA.leagues.map(l => [l.key, l]));
const lgName = k => `${LG[k].country} · ${LG[k].name}`;
const lgFull = l => l.country === 'Europe' ? l.name : `${l.country} <span class="muted">${l.name}</span>`;
const lgShort = k => LG[k].country === 'Europe' ? LG[k].name : LG[k].country;   // EuroLeague and EuroCup share a country
const inLg = x => lg === 'all' || x.lg === lg;
const R = DATA.rule;
const LE = () => LIVE.edge ?? R.edge;
const RL = k => !LIVE.leagues || LIVE.leagues.includes(k);
const LIVE = window.LIVE || {updated: DATA.updated, fixtures: DATA.fixtures, picks: [], tracked: 0, start: '1 Nov 2026', taken: {n: 0}, over: {n: 0}, under: {n: 0}, rule: {n: 0}};
LIVE.fixtures = LIVE.fixtures.filter(g => LG[g.lg]);                       // leagues no longer on the page
LIVE.picks = (LIVE.picks || []).filter(b => LG[b.lg]);
if (LIVE.leagues) LIVE.leagues = LIVE.leagues.filter(k => LG[k]);

$('sub').textContent = `${DATA.leagues.length} Leagues · backtest 2022–23 to 2025–26 · ${DATA.season.slice(0, 4)}–${DATA.season.slice(7)} record since 1 Oct 2026 · updated ${LIVE.updated} (Athens)`;

// top tiles: the whole 2026-27 record, as on the Picks tab (ROI = return over wins + losses)
{
  const set = [...((DATA.cur || {}).bets || []), ...LIVE.picks.filter(b => b.done && b.ret != null)], won = set.filter(b => b.ret > 0).length, lost = set.filter(b => b.ret < 0).length;
  const units = set.reduce((a, b) => a + b.ret, 0), nOpen = LIVE.picks.filter(b => !b.done).length;
  // average line bet and average closing line, over every settled 2026-27 bet that has a close
  const cl = set.filter(b => b.close != null), avg = f => (cl.reduce((a, b) => a + f(b), 0) / cl.length).toFixed(1);
  $('top').innerHTML = [['Open picks', nOpen, nOpen ? 'to play' : 'none right now'], ['Record', `${won}–${lost}`, 'win – loss'],
    ['ROI', won + lost ? `<span class="${cls(units)}">${roi(units / (won + lost))}</span>` : '–', `${won + lost} settled picks`],
    ...(cl.length ? [['Opening line', avg(b => b.line), `avg of ${cl.length} settled picks`], ['Closing line', avg(b => b.close), `avg of ${cl.length} settled picks`], ['Actual total', avg(b => b.total), `avg of ${cl.length} settled picks`]] : [])]
    .map(([k, v, n]) => `<a class="tile" href="#view=picks"><span class="klabel">${k}</span><span class="stat">${v}</span><span class="small">${n}</span></a>`).join('');
}

function tiles(list){
  return `<div class="metrics">${list.map(([l, v, c]) => `<div class="metric"><div class="lbl">${l}</div><div class="big ${c||''}">${v}</div></div>`).join('')}</div>`;
}

// one table row from a {n, w, roi} group
const grp = (label, g, extra='', more='') => g && g.n ? `<tr${extra}><td>${label}</td><td class="n">${g.n}</td><td class="n">${pct(g.w / g.n, 1)}</td><td class="n">${g.px ? g.px.toFixed(2) : '–'}</td><td class="n ${cls(g.roi)}">${roi(g.roi)}</td>${more}</tr>` : '';
const LHEAD = '<th class="n">Opening line</th><th class="n">Closing line</th>';
const GHEAD = (first, more='') => `<thead><tr><th>${first}</th><th class="n">Picks</th><th class="n">Hit</th><th class="n">Avg price</th><th class="n">ROI</th>${more}</tr></thead>`;
// average opening and closing line of a list of bets, as two table cells
const seasonOf = b => { const y = +b.dt.slice(0, 4); return +b.dt.slice(5, 7) >= 7 ? `${y}-${y + 1}` : `${y - 1}-${y}`; };
const lineAvg = (list, k) => (list.reduce((a, b) => a + b[k], 0) / list.length).toFixed(1);
const lineCells = list => { const c = list.filter(b => b.close != null); return c.length ? `<td class="n">${lineAvg(c, 'line')}</td><td class="n">${lineAvg(c, 'close')}</td>` : '<td class="n muted">–</td><td class="n muted">–</td>'; };

function renderFindings(){
  const F = DATA.findings;
  let h = `<div class="verdict"><h2>Do the model's overs make a profit?</h2><p>${F.verdict}</p></div>`;
  if (F.note) h += `<p class="note">${F.note}</p>`;
  h += tiles(F.tiles.map(t => [t[0], t[1], t[2]]));
  F.items.forEach((f, i) => { h += `<div class="find"><h3><span class="num">${String(i + 1).padStart(2, '0')}</span>${f.h}</h3><p>${f.p}</p></div>`; });
  return h;
}

function renderLeagues(){
  let h = `<p class="note">Regular-season games from ${sn(DATA.first)} on (2020–21 only warms the ratings up; play-offs are left out, as in the rule). The model column starts in 2022–23 and is all out of sample. <b>Over %</b>: how often the final score (overtime included) went over the closing line. Blind over: backing the over in every game at the average price. Opening and closing line: the average of those picks. Model overs: overs the rule picked at the opening line (edge above ${Math.round(R.edge*100)}%), count and ROI. Click a league for its seasons.</p>`;
  h += `<div class="scroll"><table><thead><tr><th>League</th><th class="n">Games</th><th class="n">Total / line</th><th class="n">Over %</th><th class="n">Blind over</th><th class="n">Model overs</th>${LHEAD}</tr></thead><tbody>`;
  const mod = g => g.n ? `${g.n} <span class="${cls(g.roi)}">${roi(g.roi)}</span>` : '<span class="muted">–</span>';
  const row = (label, s, attrs='', list=[]) => `<tr${attrs}><td>${label}</td><td class="n">${s.games}</td><td class="n">${s.avg_total.toFixed(1)} / ${s.avg_line.toFixed(1)}</td><td class="n">${pct(s.over, 1)}</td>
    <td class="n ${cls(s.blind_over)}">${roi(s.blind_over)}</td>
    <td class="n">${mod(s.mo)}</td>${lineCells(list)}</tr>`;
  const tierName = {europe: 'European competitions', top: 'Top divisions', second: 'Second divisions'};
  for (const tier of ['europe', 'top', 'second']){
    if (!DATA.leagues.some(l => l.tier === tier)) continue;
    h += `<tr><td colspan="8" class="tier" style="padding-top:18px">${tierName[tier]}</td></tr>`;
    for (const l of DATA.leagues.filter(l => l.tier === tier)){
      const on = open === l.key;
      h += row(`<span class="caret">${on ? '▾' : '▸'}</span> ${lgFull(l)}`, l.all, ` class="srow${on ? ' on' : ''}" data-open="${l.key}"`, DATA.bets.filter(b => b.lg === l.key));
      if (on) for (const s of l.seasons) h += row(sn(s.season) + (s.season === DATA.tuned ? ' (tuned on)' : '') + (s.season === DATA.season ? ' (so far)' : ''), s, ' class="sub"', [...DATA.bets, ...((DATA.cur || {}).bets || [])].filter(b => b.lg === l.key && seasonOf(b) === s.season));
    }
  }
  return h + '</tbody></table></div>';
}

function renderBacktest(){
  const B = DATA.backtest, S = lg === 'all' ? B.all : B.leagues[lg];
  let h = `<p class="note">${B.note} Click a column heading to sort.</p>`;
  if (!S || !S.rule.n) return h + '<p class="empty">The rule made no picks in this league.</p>';
  const BT = DATA.bets.filter(inLg);
  h += tiles([['Picks', S.rule.n], ['Hit rate', pct(S.rule.w / S.rule.n, 1)], ['ROI', roi(S.rule.roi), cls(S.rule.roi)],
              ['Opening line', lineAvg(BT, 'line')], ['Closing line', lineAvg(BT, 'close')]]);
  h += `<h2>By season</h2><div class="scroll"><table style="max-width:980px">${GHEAD('Season', LHEAD)}<tbody>`;
  for (const s of S.seasons) h += grp(sn(s.season) + (s.season === DATA.tuned ? ' <span class="muted">(tuned on)</span>' : '') + (s.season === DATA.season ? ' <span class="muted">(so far)</span>' : ''), s, '', lineCells(BT.filter(b => seasonOf(b) === s.season)));
  h += '</tbody></table></div>';
  if (lg === 'all'){
    h += `<h2>By league</h2><p class="note">Unseen seasons. Click a league to see it alone.</p><div class="scroll"><table style="max-width:980px">${GHEAD('League', LHEAD)}<tbody>`;
    for (const l of DATA.leagues.filter(l => B.leagues[l.key] && B.leagues[l.key].rule.n).sort((a, b) => B.leagues[b.key].rule.roi - B.leagues[a.key].rule.roi))
      h += grp(`<a href="#view=backtest&lg=${l.key}" style="color:inherit;text-decoration:none">${lgFull(l)}</a>`, B.leagues[l.key].rule, '', lineCells(DATA.bets.filter(b => b.lg === l.key)));
    h += '</tbody></table></div>';
  }
  h += `<h2>By edge</h2><div class="scroll"><table style="max-width:980px">${GHEAD('Edge above', LHEAD)}<tbody>`;
  const byEdge = [...BT].sort((x, y) => y.edge - x.edge);   // bets store a rounded edge, so take each row's count from the top
  for (const e of S.edges) h += grp(`${Math.round(e.edge * 100)}%`, e, '', lineCells(byEdge.slice(0, e.n)));
  h += `</tbody></table></div><h2>By month</h2><div class="scroll"><table style="max-width:980px">${GHEAD('Month', LHEAD)}<tbody>`;
  for (const m of S.months) h += grp(MON[m.m - 1], m, '', lineCells(BT.filter(b => +b.dt.slice(5, 7) === m.m)));
  h += '</tbody></table></div>';
  h += `<h2>By line</h2><p class="note">The opening line in 10-point bands.</p><div class="scroll"><table style="max-width:980px">${GHEAD('Line band', LHEAD)}<tbody>`;
  for (const b of S.lines || []) h += grp(`${b.lo}–${b.lo + 9.5}`, b, '', lineCells(BT.filter(x => x.line >= b.lo && x.line < b.lo + 10)));
  h += '</tbody></table></div>';
  return h + bets();
}

function bets(){
  const list = DATA.bets.filter(inLg);
  if (!list.length) return '';
  let run = 0;
  const rows = list.map(b => { run += b.ret;
    return `<tr><td data-s="${b.dt}">${short(b.dt)} ${b.dt.slice(0,4)}</td>${lg === 'all' ? `<td>${lgShort(b.lg)}</td>` : ''}<td class="wr">${b.home} – ${b.away}</td><td class="n">${b.side === 'o' ? 'Over' : 'Under'} ${b.line}</td><td class="n">${b.px.toFixed(2)}</td><td class="n">${b.mu.toFixed(1)}</td><td class="n">${pct(b.p)}</td><td class="n">${sgn(b.edge*100, 0)}%</td><td class="n">${b.close ?? '–'}</td><td class="n ${b.ret > 0 ? 'w' : b.ret < 0 ? 'l' : ''}">${b.total}</td></tr>`; });
  return `<h2>Every pick, latest first</h2><p class="note">${list.length} picks in unseen seasons${list.length > 400 ? ', the latest 400 shown' : ''}.</p><div class="scroll"><table><thead><tr><th>Date</th>${lg === 'all' ? '<th>League</th>' : ''}<th>Match</th><th class="n">Pick</th><th class="n">Price</th><th class="n">Model</th><th class="n">Chance</th><th class="n">Edge</th><th class="n">Closing line</th><th class="n">Total</th></tr></thead><tbody>${rows.reverse().slice(0, 400).join('')}</tbody></table></div>`;
}

function renderProjections(){
  let h = `<p class="note">Games in the next 7 days with the model's projected total (fitted on earlier games only) next to the market's consensus line. Only overs that meet the rule (regular season, both teams ${LIVE.min_gp ?? 3}+ games) get an edge here; highlighted games are logged in the Picks tab at the line and price shown when they were first seen, and their edge is the one at that moment, while the line and prices keep updating. Click a match for its page, with the projection and how it was produced. Click a column heading to sort.</p>`;
  const fx = LIVE.fixtures.filter(inLg);
  if (!fx.length) return h + '<p class="empty">No games in the next 7 days.</p>';
  const taken = Object.fromEntries(LIVE.picks.map(b => [b.home + '|' + b.away, b]));   // a pick keeps the edge it was taken at
  const byDay = {};
  fx.forEach(g => (byDay[g.dt.slice(0,10)] ||= []).push(g));
  const head = `<thead><tr><th>Time</th>${lg === 'all' ? '<th>League</th>' : ''}<th>Match</th><th class="n">Model</th><th class="n">Line</th><th class="n">Over</th><th class="n">Under</th><th class="n">Over chance</th><th class="n">Over edge</th></tr></thead>`;
  for (const [d, gs] of Object.entries(byDay)){
    h += `<h2 class="day">${dayName(d)}</h2><div class="scroll"><table class="proj">${head}<tbody>`;
    for (const g of gs){
      const t = g.pick && taken[g.home + '|' + g.away], e = t ? t.edge : g.line == null || !(g.ok ?? RL(g.lg)) ? null : g.eo;
      h += `<tr${g.pick ? ' class="pk"' : ''}><td>${g.dt.slice(11)}</td>${lg === 'all' ? `<td>${lgShort(g.lg)}</td>` : ''}
        <td class="wr">${g.slug ? `<a class="gm" href="games/${g.slug}/">${g.home} – ${g.away}</a>` : `${g.home} – ${g.away}`}${g.pick ? `<span class="badge">${g.pick}</span>` : ''}</td><td class="n"><b>${g.mu.toFixed(1)}</b></td>
        ${g.line == null ? '<td class="n muted" colspan="5">no line yet</td>' : `<td class="n">${g.line}</td><td class="n">${g.op.toFixed(2)}</td><td class="n">${g.up.toFixed(2)}</td><td class="n">${pct(g.p)}</td><td class="n ${t || e > LE() ? 'pos' : 'muted'}">${e == null ? '–' : sgn(e*100, 0) + '%'}</td>`}</tr>`;
    }
    h += '</tbody></table></div>';
  }
  return h;
}

function renderPicks(){
  // open picks first, then this season's record: October bets (same rules, worked out from results) + bets logged live
  const open = LIVE.picks.filter(b => !b.done).sort((a, b) => a.dt < b.dt ? -1 : 1);
  const fx = Object.fromEntries(LIVE.fixtures.map(g => [g.home + '|' + g.away, g]));
  let h = `<p class="note">Picks to take: overs where the model's edge is above ${Math.round(LE()*100)}% at the line on offer, regular season, both teams ${LIVE.min_gp ?? 3}+ games${LIVE.max_line && LIVE.max_line < 999 ? `, line under ${LIVE.max_line}` : ''}, equal stakes. ROI = profit ÷ total staked on won and lost picks; pushes are left out. Every hour the model checks every game in the next 7 days; a pick is logged the first time its edge clears the bar, at that line and the average price, and never changed. Take it as early as possible, as the line tends to move toward it. Updated ${LIVE.updated} (Athens).</p>`;
  if (!open.length) h += '<p class="empty">No open picks right now. New ones appear here as lines open.</p>';
  else {
    h += `<h2>Open picks</h2><div class="scroll"><table class="proj"><thead><tr><th>Tip-off</th><th>League</th><th>Match</th><th class="n">Pick</th><th class="n">Price</th><th class="n">Model total</th><th class="n">Edge</th><th class="n">Line now</th></tr></thead><tbody>` +
      open.map(b => { const g = fx[b.home + '|' + b.away] || {};
        return `<tr class="pk"><td data-s="${b.dt}">${dayName(b.dt)} ${b.dt.slice(11)}</td><td>${lgShort(b.lg)}</td><td class="wr">${b.home} – ${b.away}</td><td class="n"><b>Over ${b.line}</b></td><td class="n">${b.px.toFixed(2)}</td><td class="n">${g.mu != null ? g.mu.toFixed(1) : '–'}</td><td class="n pos">${sgn(b.edge*100, 0)}%</td><td class="n">${g.line ?? '–'}</td></tr>`; }).join('') +
      '</tbody></table></div>';
  }
  const pre = ((DATA.cur || {}).bets || []).map(b => ({...b, side: 'o', pre: true, done: true, close: b.close ?? null}));
  const all = [...pre, ...LIVE.picks].sort((a, b) => a.dt < b.dt ? -1 : 1);
  const set = all.filter(b => b.done && b.ret != null), won = set.filter(b => b.ret > 0).length;
  const units = set.reduce((a, b) => a + b.ret, 0), nDec = set.filter(b => b.ret !== 0).length, R_ = nDec ? units / nDec : null;
  const cl = all.filter(b => b.close != null), up = cl.filter(b => b.close > b.line).length, dn = cl.filter(b => b.close < b.line).length;
  h += `<h2>The ${sn(DATA.season)} record</h2>`;
  h += tiles([['Picks', String(all.length)], ['Settled', String(set.length)], ['Hit rate', set.length ? pct(won / set.length, 1) : '–'],
              ['ROI', roi(R_), cls(R_)],
              ['Closing line moved toward the pick', cl.length ? pct(up / cl.length) : '–'], ['Closing line moved against it', cl.length ? pct(dn / cl.length) : '–']]);
  h += `<p class="note">The closing line moved toward the pick when it ended above the line picked. A few hundred picks are needed before the record says much. Click a column heading to sort.</p>`;
  if (!set.length) return h + '<p class="empty">No settled picks yet.</p>';
  let run = 0;
  const rows = all.filter(b => b.done).map(b => {   // open picks are in the table above
    if (b.ret != null) run += b.ret;
    const res = !b.done ? '<td class="n muted">to play</td>' : b.ret == null ? '<td class="n muted">void</td>' :
      `<td class="n">${b.total}</td>`;
    return `<tr><td data-s="${b.dt}">${short(b.dt)}${b.dt.length > 10 ? ' ' + b.dt.slice(11) : ''}</td><td>${lgShort(b.lg)}</td><td class="wr">${b.home} – ${b.away}</td><td class="n"><b>Over ${b.line}</b></td>
      <td class="n">${b.px.toFixed(2)}</td><td class="n pos">${sgn(b.edge*100, 0)}%</td><td class="n">${b.close ?? '–'}</td>${res}</tr>`;
  });
  return h + `<h2>Settled picks, latest first</h2><div class="scroll"><table><thead><tr><th>Tip-off</th><th>League</th><th>Match</th><th class="n">Pick</th><th class="n">Price</th><th class="n">Edge</th><th class="n">Closing line</th><th class="n">Total</th></tr></thead><tbody>${rows.reverse().join('')}</tbody></table></div>`;
}

// click a column heading to sort its table (again to reverse); league groups keep their season rows
function cellAt(r, col){ let i = 0; for (const c of r.cells){ if (col < i + c.colSpan) return c.colSpan > 1 ? null : c; i += c.colSpan; } return null; }
document.addEventListener('click', e => {
  const th = e.target.closest('#out th'); if (!th) return;
  const table = th.closest('table'), tb = table.tBodies[0]; if (!tb) return;
  let col = 0; for (const x of th.parentNode.children){ if (x === th) break; col += x.colSpan; }
  const dir = th.classList.contains('sd') ? 'asc' : 'desc', num = th.classList.contains('n');
  table.querySelectorAll('th').forEach(x => x.classList.remove('sa', 'sd'));
  th.classList.add(dir === 'asc' ? 'sa' : 'sd');
  const groups = [];
  for (const r of [...tb.rows]){
    if (r.querySelector('td.tier')){ r.style.display = 'none'; continue; }
    if (r.classList.contains('sub') && groups.length) groups[groups.length - 1].push(r); else groups.push([r]);
  }
  const key = r => { const c = cellAt(r, col); if (!c) return null; if (c.dataset.s) return c.dataset.s;
    const t = c.textContent.replace(/−/g, '-').replace(/,/g, '').trim(); if (!t || t === '–') return null;
    if (!num) return t.toLowerCase(); const m = t.match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
  groups.sort((a, b) => { const x = key(a[0]), y = key(b[0]); if (x === y) return 0; if (x == null) return 1; if (y == null) return -1;
    return (x < y ? -1 : 1) * (dir === 'asc' ? 1 : -1); });
  groups.flat().forEach(r => tb.appendChild(r));
});

function renderMethod(){ return `<div class="doc">${DATA.method}</div>`; }

document.addEventListener('click', e => {
  const r = e.target.closest('tr.srow');
  if (!r || !r.dataset.open) return;
  open = open === r.dataset.open ? null : r.dataset.open;
  render();
});

function renderTesting(){
  const T = LIVE.test || {names: {}, picks: []}, nm = k => T.names[k] || k, n = Object.keys(T.names).length;
  let h = `<p class="note">Every league outside the main ${DATA.leagues.length}, run live under the same rules${T.start ? ` since ${T.start}` : ''}: overs only, edge above ${Math.round(LE()*100)}% at the line on offer, regular season, both teams ${LIVE.min_gp ?? 3}+ games${LIVE.max_line && LIVE.max_line < 999 ? `, line under ${LIVE.max_line}` : ''}, equal stakes. ROI = profit ÷ total staked on won and lost picks; pushes are left out. These picks are kept apart and do not count in the record on the other tabs. A league can join the main list once a long run of picks shows a steady profit. Click a column heading to sort.</p>`;
  const open = T.picks.filter(b => !b.done).sort((a, b) => a.dt < b.dt ? -1 : 1), done = T.picks.filter(b => b.done);
  const set = done.filter(b => b.ret != null), won = set.filter(b => b.ret > 0).length, units = set.reduce((a, b) => a + b.ret, 0), nDec = set.filter(b => b.ret !== 0).length, R_ = nDec ? units / nDec : null;
  h += tiles([['Leagues', String(n || '–')], ['Picks', String(T.picks.length)], ['Open picks', String(open.length)], ['Settled', String(set.length)],
              ['Hit rate', set.length ? pct(won / set.length, 1) : '–'], ['ROI', roi(R_), cls(R_)]]);
  h += '<h2>Open picks</h2>';
  h += !open.length ? '<p class="empty">No open picks in the testing leagues right now.</p>' :
    `<div class="scroll"><table class="proj"><thead><tr><th>Tip-off</th><th>League</th><th>Match</th><th class="n">Pick</th><th class="n">Price</th><th class="n">Model total</th><th class="n">Edge</th><th class="n">Line now</th></tr></thead><tbody>` +
    open.map(b => `<tr><td data-s="${b.dt}">${dayName(b.dt)} ${b.dt.slice(11)}</td><td>${nm(b.lg)}</td><td class="wr">${b.home} – ${b.away}</td><td class="n"><b>Over ${b.line}</b></td><td class="n">${b.px.toFixed(2)}</td><td class="n">${b.mu.toFixed(1)}</td><td class="n pos">${sgn(b.edge*100, 0)}%</td><td class="n">${b.now ?? '–'}</td></tr>`).join('') + '</tbody></table></div>';
  const tail = () => { const list = Object.values(T.names).sort((a, b) => a.localeCompare(b));
  h += `<h2>The ${list.length} testing leagues</h2><ul class="lglist">${list.map(x => `<li>${x}</li>`).join('')}</ul>`; return h; };
  if (!set.length) return tail();
  const by = {};
  set.forEach(b => (by[b.lg] ||= []).push(b));
  h += `<h2>By league</h2><div class="scroll"><table style="max-width:760px"><thead><tr><th>League</th><th class="n">Picks</th><th class="n">Hit rate</th><th class="n">ROI</th></tr></thead><tbody>` +
    Object.entries(by).map(([k, l]) => [k, l, l.reduce((a, b) => a + b.ret, 0)]).sort((a, b) => b[2] - a[2]).map(([k, l, u]) =>
      `<tr><td>${nm(k)}</td><td class="n">${l.length}</td><td class="n">${pct(l.filter(b => b.ret > 0).length / l.length, 1)}</td><td class="n ${cls(u)}">${roi(u / (l.filter(b => b.ret !== 0).length || 1))}</td></tr>`).join('') + '</tbody></table></div>';
  let run = 0;
  const rows = done.map(b => {
    if (b.ret != null) run += b.ret;
    const res = b.ret == null ? '<td class="n muted">void</td>' : `<td class="n">${b.total}</td>`;
    return `<tr><td data-s="${b.dt}">${short(b.dt)} ${b.dt.slice(11)}</td><td>${nm(b.lg)}</td><td class="wr">${b.home} – ${b.away}</td><td class="n"><b>Over ${b.line}</b></td><td class="n">${b.px.toFixed(2)}</td><td class="n pos">${sgn(b.edge*100, 0)}%</td><td class="n">${b.close ?? '–'}</td>${res}</tr>`; });
  h += `<h2>Settled picks, latest first</h2><div class="scroll"><table><thead><tr><th>Tip-off</th><th>League</th><th>Match</th><th class="n">Pick</th><th class="n">Price</th><th class="n">Edge</th><th class="n">Closing line</th><th class="n">Total</th></tr></thead><tbody>${rows.reverse().join('')}</tbody></table></div>`;
  return tail();
}

const RENDER = {home: renderFindings, picks: renderPicks, leagues: renderLeagues, backtest: renderBacktest, projections: renderProjections, testing: renderTesting, method: renderMethod};
const CHIPS = {backtest: 1, projections: 1};
function render(){
  document.querySelectorAll('#tabs a').forEach(a => { a.classList.toggle('on', a.dataset.view === view); a.href = `#view=${a.dataset.view}${lg === 'all' || !CHIPS[a.dataset.view] ? '' : '&lg=' + lg}`; });
  let keys = DATA.leagues.map(l => l.key);
  if (view === 'backtest') keys = keys.filter(k => DATA.backtest.leagues[k] && DATA.backtest.leagues[k].rule.n);
  if (view === 'projections') keys = keys.filter(k => LIVE.fixtures.some(g => g.lg === k));
  const chips = CHIPS[view] ? [['all', 'All leagues'], ...keys.map(k => [k, lgShort(k)])] : [];
  $('chips').innerHTML = chips.map(([k, t]) => `<a href="#view=${view}${k === 'all' ? '' : '&lg=' + k}" class="${k === lg ? 'on' : ''}">${t}</a>`).join('');
  $('top').style.display = $('sub').style.display = view === 'testing' ? 'none' : '';     // the main record stays off the testing tab
  $('out').innerHTML = RENDER[view]();
}
function fromHash(){
  const m = location.hash.match(/view=(\w+)/), l = location.hash.match(/lg=([\w-]+)/);
  const old = {live: 'picks', findings: 'home'}, v = m && (old[m[1]] || m[1]);   // old links: Live test is part of Picks, Findings is Home
  view = RENDER[v] ? v : 'home';
  lg = l && LG[l[1]] ? l[1] : 'all';
  render();
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
