<script>
const $ = id => document.getElementById(id);
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayName = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const short = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const pct = (x, d=0) => x == null ? '–' : (x*100).toFixed(d) + '%';
const sgn = (x, d=1) => x == null ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
const roi = x => x == null ? '–' : sgn(x*100, 1) + '%';
const cls = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
const sn = s => s.replace('-', '–');
let view = 'findings', lg = 'all', open = null;
const LG = Object.fromEntries(DATA.leagues.map(l => [l.key, l]));
const lgName = k => `${LG[k].country} · ${LG[k].name}`;
const inLg = x => lg === 'all' || x.lg === lg;
const R = DATA.rule;
const LE = () => LIVE.edge ?? R.edge;
const RL = k => !LIVE.leagues || LIVE.leagues.includes(k);
const LIVE = window.LIVE || {updated: DATA.updated, fixtures: DATA.fixtures, picks: [], tracked: 0, start: '1 Nov 2026', taken: {n: 0}, over: {n: 0}, under: {n: 0}, rule: {n: 0}};

$('sub').textContent = `${DATA.leagues.length} European leagues · 2020–21 (warm-up) to ${sn(DATA.season)} · live test since ${LIVE.start} · updated ${LIVE.updated} (Athens)`;

function tiles(list){
  return `<div class="metrics">${list.map(([l, v, c]) => `<div class="metric"><div class="lbl">${l}</div><div class="big ${c||''}">${v}</div></div>`).join('')}</div>`;
}

// one table row from a {n, w, roi} group
const grp = (label, g, extra='') => g && g.n ? `<tr${extra}><td>${label}</td><td class="n">${g.n}</td><td class="n">${pct(g.w / g.n, 1)}</td><td class="n">${g.px ? g.px.toFixed(2) : '–'}</td><td class="n ${cls(g.roi)}">${roi(g.roi)}</td></tr>` : '';
const GHEAD = first => `<thead><tr><th>${first}</th><th class="n">Bets</th><th class="n">Hit</th><th class="n">Avg price</th><th class="n">ROI</th></tr></thead>`;

function renderFindings(){
  const F = DATA.findings;
  let h = `<div class="verdict"><h2>The short answer</h2><p>${F.verdict}</p></div>`;
  h += tiles(F.tiles.map(t => [t[0], t[1], t[2]]));
  F.items.forEach((f, i) => { h += `<div class="find"><h3><span class="num">${String(i + 1).padStart(2, '0')}</span>${f.h}</h3><p>${f.p}</p></div>`; });
  return h;
}

function renderLeagues(){
  let h = `<p class="note">Every league from ${sn(DATA.first)} on (2020–21 only warms the ratings up). The model columns start in 2022–23 and are all out of sample. <b>Over %</b>: how often the final score (overtime included) went over the closing line. Blind over / under: backing every game at the average price. Model columns: bets the rule placed at the opening line (edge above ${R.edge*100}%), count and ROI. Click a league for its seasons.</p>`;
  h += `<div class="scroll"><table><thead><tr><th>League</th><th class="n">Games</th><th class="n">Total / line</th><th class="n">Over %</th><th class="n">Blind over</th><th class="n">Blind under</th><th class="n">Model overs</th><th class="n">Model unders</th></tr></thead><tbody>`;
  const mod = g => g.n ? `${g.n} <span class="${cls(g.roi)}">${roi(g.roi)}</span>` : '<span class="muted">–</span>';
  const row = (label, s, attrs='') => `<tr${attrs}><td>${label}</td><td class="n">${s.games}</td><td class="n">${s.avg_total.toFixed(1)} / ${s.avg_line.toFixed(1)}</td><td class="n">${pct(s.over, 1)}</td>
    <td class="n ${cls(s.blind_over)}">${roi(s.blind_over)}</td><td class="n ${cls(s.blind_under)}">${roi(s.blind_under)}</td>
    <td class="n">${mod(s.mo)}</td><td class="n">${mod(s.mu)}</td></tr>`;
  const tierName = {europe: 'European competitions', top: 'Top divisions', second: 'Second divisions'};
  for (const tier of ['europe', 'top', 'second']){
    h += `<tr><td colspan="8" class="tier" style="padding-top:18px">${tierName[tier]}</td></tr>`;
    for (const l of DATA.leagues.filter(l => l.tier === tier)){
      const on = open === l.key;
      h += row(`<span class="caret">${on ? '▾' : '▸'}</span> ${l.country} <span class="muted">${l.name}</span>`, l.all, ` class="srow${on ? ' on' : ''}" data-open="${l.key}"`);
      if (on) for (const s of l.seasons) h += row(sn(s.season) + (s.season === DATA.tuned ? ' (tuned on)' : '') + (s.season === DATA.season ? ' (so far)' : ''), s, ' class="sub"');
    }
  }
  return h + '</tbody></table></div>';
}

function renderBacktest(){
  const B = DATA.backtest, S = lg === 'all' ? B.all : B.leagues[lg];
  let h = `<p class="note">${B.note} Click a column heading to sort.</p>`;
  if (!S || !S.rule.n) return h + '<p class="empty">The rule placed no bets in this league.</p>';
  h += tiles([['Bets', S.rule.n], ['Hit rate', pct(S.rule.w / S.rule.n, 1)], ['ROI', roi(S.rule.roi), cls(S.rule.roi)], ['Units', sgn(S.rule.roi * S.rule.n, 1), cls(S.rule.roi)]]);
  h += `<h2>By season</h2><div class="scroll"><table style="max-width:820px">${GHEAD('Season')}<tbody>`;
  for (const s of S.seasons) h += grp(sn(s.season) + (s.season === DATA.tuned ? ' <span class="muted">(tuned on)</span>' : '') + (s.season === DATA.season ? ' <span class="muted">(so far)</span>' : ''), s);
  h += '</tbody></table></div>';
  if (lg === 'all'){
    h += `<h2>By league</h2><p class="note">Unseen seasons. Click a league to see it alone.</p><div class="scroll"><table style="max-width:820px">${GHEAD('League')}<tbody>`;
    for (const l of DATA.leagues.filter(l => B.leagues[l.key] && B.leagues[l.key].rule.n).sort((a, b) => B.leagues[b.key].rule.roi - B.leagues[a.key].rule.roi))
      h += grp(`<a href="#view=backtest&lg=${l.key}" style="color:inherit;text-decoration:none">${l.country} <span class="muted">${l.name}</span></a>`, B.leagues[l.key].rule);
    h += '</tbody></table></div>';
  }
  h += `<div class="cols2"><div><h2>By edge</h2><div class="scroll"><table>${GHEAD('Edge above')}<tbody>`;
  for (const e of S.edges) h += grp(`${Math.round(e.edge * 100)}%`, e);
  h += `</tbody></table></div></div><div><h2>By month</h2><div class="scroll"><table>${GHEAD('Month')}<tbody>`;
  for (const m of S.months) h += grp(MON[m.m - 1], m);
  h += '</tbody></table></div></div></div>';
  return h + bets();
}

function bets(){
  const list = DATA.bets.filter(inLg);
  if (!list.length) return '';
  let run = 0;
  const rows = list.map(b => { run += b.ret;
    return `<tr><td data-s="${b.dt}">${short(b.dt)} ${b.dt.slice(0,4)}</td>${lg === 'all' ? `<td>${LG[b.lg].country}</td>` : ''}<td class="wr">${b.home} – ${b.away}</td><td class="n">${b.side === 'o' ? 'Over' : 'Under'} ${b.line}</td><td class="n">${b.px.toFixed(2)}</td><td class="n">${b.mu.toFixed(1)}</td><td class="n">${pct(b.p)}</td><td class="n">${sgn(b.edge*100, 0)}%</td><td class="n ${b.ret > 0 ? 'w' : b.ret < 0 ? 'l' : ''}">${b.total}</td><td class="n ${cls(b.ret)}">${sgn(b.ret, 2)}</td><td class="n ${cls(run)}">${sgn(run, 1)}</td></tr>`; });
  return `<h2>Every bet, latest first</h2><p class="note">${list.length} bets in unseen seasons${list.length > 400 ? ', the latest 400 shown' : ''}.</p><div class="scroll"><table><thead><tr><th>Date</th>${lg === 'all' ? '<th>League</th>' : ''}<th>Match</th><th class="n">Bet</th><th class="n">Price</th><th class="n">Model</th><th class="n">Chance</th><th class="n">Edge</th><th class="n">Total</th><th class="n">Units</th><th class="n">Running</th></tr></thead><tbody>${rows.reverse().slice(0, 400).join('')}</tbody></table></div>`;
}

function renderProjections(){
  let h = `<p class="note">Games in the next 7 days with the model's projected total (fitted on earlier games only) next to the bookmakers' consensus line. Only overs in the live-test leagues get an edge here; highlighted games are logged in the Live test tab at the line and price shown when they were first seen. Click a column heading to sort.</p>`;
  const fx = LIVE.fixtures.filter(inLg);
  if (!fx.length) return h + '<p class="empty">No games in the next 7 days.</p>';
  const byDay = {};
  fx.forEach(g => (byDay[g.dt.slice(0,10)] ||= []).push(g));
  const head = `<thead><tr><th>Time</th>${lg === 'all' ? '<th>League</th>' : ''}<th>Match</th><th class="n">Model</th><th class="n">Line</th><th class="n">Over</th><th class="n">Under</th><th class="n">Over chance</th><th class="n">Over edge</th></tr></thead>`;
  for (const [d, gs] of Object.entries(byDay)){
    h += `<h2 class="day">${dayName(d)}</h2><div class="scroll"><table class="proj">${head}<tbody>`;
    for (const g of gs){
      const e = g.line == null || !RL(g.lg) ? null : g.eo;
      h += `<tr${g.pick ? ' class="pk"' : ''}><td>${g.dt.slice(11)}</td>${lg === 'all' ? `<td>${LG[g.lg].country}</td>` : ''}
        <td class="wr">${g.home} – ${g.away}${g.pick ? `<span class="badge">${g.pick}</span>` : ''}</td><td class="n"><b>${g.mu.toFixed(1)}</b></td>
        ${g.line == null ? '<td class="n muted" colspan="5">no line yet</td>' : `<td class="n">${g.line}</td><td class="n">${g.op.toFixed(2)}</td><td class="n">${g.up.toFixed(2)}</td><td class="n">${pct(g.p)}</td><td class="n ${e > LE() ? 'pos' : 'muted'}">${e == null ? '–' : sgn(e*100, 0) + '%'}</td>`}</tr>`;
    }
    h += '</tbody></table></div>';
  }
  return h;
}

function renderLive(){
  const T = LIVE.taken, st = x => x.settled ? `${x.settled} settled, ${x.w} won, ROI <b class="${cls(x.roi)}">${roi(x.roi)}</b>` : 'none settled yet';
  const lgs = (LIVE.leagues || []).map(k => LG[k].country + ' ' + LG[k].name).join(', '), B = LIVE.bt;
  let h = `<p class="note"><b>The rule: overs only</b>, edge above ${Math.round(LE()*100)}%, in the ${(LIVE.leagues || []).length} leagues whose backtest bets made +15% or more: ${lgs}. ${B ? `Backtest of this rule: ${B.n} bets, ${pct(B.w / B.n, 1)} hit, ROI ${roi(B.roi)}. The leagues were picked after seeing those results, so expect less live.` : ''}</p>
    <p class="note">Followed for real from ${LIVE.start}: every 3 hours the model checks every game in the next 7 days, and the first time the over's edge is above ${Math.round(LE()*100)}% at the line on offer, that bet is logged at that line and the average price, and never changed. ${LIVE.tracked.toLocaleString()} games with a line seen so far.</p>`;
  h += tiles([['Bets logged', String(T.n)], ['Settled', String(T.settled || 0)], ['Hit rate', T.settled ? pct(T.w / T.settled, 1) : '–'],
              ['ROI', roi(T.roi), cls(T.roi)], ['ROI at the best price', roi(T.roi_best), cls(T.roi_best)],
              ['Close moved our way', T.clv_pos == null ? '–' : pct(T.clv_pos)], ['Against us', T.clv_neg == null ? '–' : pct(T.clv_neg)]]);
  h += `<p class="note">Backtest version (the opening line the books report, judged when first seen): ${LIVE.rule.n} bets, ${st(LIVE.rule)}. A few hundred bets are needed before the record says much. Click a column heading to sort.</p>`;
  if (!LIVE.picks.length) return h + '<p class="empty">No bets yet. The rule fires on about one game in a hundred.</p>';
  let run = 0;
  const rows = LIVE.picks.map(b => {
    if (b.ret != null) run += b.ret;
    const res = !b.done ? '<td class="n muted" colspan="3">to play</td>' : b.ret == null ? '<td class="n muted" colspan="3">void</td>' :
      `<td class="n">${b.total}</td><td class="n ${cls(b.ret)}">${sgn(b.ret, 2)}</td><td class="n ${cls(run)}">${sgn(run, 2)}</td>`;
    return `<tr><td data-s="${b.dt}">${short(b.dt)} ${b.dt.slice(11)}</td><td>${LG[b.lg].country}</td><td class="wr">${b.home} – ${b.away}</td><td class="n"><b>${b.side === 'o' ? 'Over' : 'Under'} ${b.line}</b></td>
      <td class="n">${b.px.toFixed(2)}</td><td class="n pos">${sgn(b.edge*100, 0)}%</td><td class="n">${Math.round(b.hours)}h</td><td class="n">${b.close ?? '–'}</td>${res}</tr>`;
  });
  return h + `<h2>Every bet, latest first</h2><div class="scroll"><table><thead><tr><th>Tip-off</th><th>League</th><th>Match</th><th class="n">Bet</th><th class="n">Price</th><th class="n">Edge</th><th class="n">Before</th><th class="n">Close</th><th class="n">Total</th><th class="n">Units</th><th class="n">Running</th></tr></thead><tbody>${rows.reverse().join('')}</tbody></table></div>`;
}

// click a column heading to sort its table (again to reverse); league groups keep their season rows
function cellAt(r, col){ let i = 0; for (const c of r.cells){ if (col < i + c.colSpan) return c.colSpan > 1 ? null : c; i += c.colSpan; } return null; }
document.addEventListener('click', e => {
  const th = e.target.closest('#out th'); if (!th) return;
  const table = th.closest('table'), tb = table.tBodies[0]; if (!tb) return;
  let col = 0; for (const x of th.parentNode.children){ if (x === th) break; col += x.colSpan; }
  const dir = th.classList.contains('sd') ? 'asc' : 'desc', num = th.classList.contains('n');
  table.querySelectorAll('th').forEach(x => x.classList.remove('sa', 'sd'));
  th.classList.add(dir === 'asc' ? 'sa' : 'sd');
  const groups = [];
  for (const r of [...tb.rows]){
    if (r.querySelector('td.tier')){ r.style.display = 'none'; continue; }
    if (r.classList.contains('sub') && groups.length) groups[groups.length - 1].push(r); else groups.push([r]);
  }
  const key = r => { const c = cellAt(r, col); if (!c) return null; if (c.dataset.s) return c.dataset.s;
    const t = c.textContent.replace(/−/g, '-').replace(/,/g, '').trim(); if (!t || t === '–') return null;
    if (!num) return t.toLowerCase(); const m = t.match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
  groups.sort((a, b) => { const x = key(a[0]), y = key(b[0]); if (x === y) return 0; if (x == null) return 1; if (y == null) return -1;
    return (x < y ? -1 : 1) * (dir === 'asc' ? 1 : -1); });
  groups.flat().forEach(r => tb.appendChild(r));
});

function renderMethod(){ return `<div class="doc">${DATA.method}</div>`; }

document.addEventListener('click', e => {
  const r = e.target.closest('tr.srow');
  if (!r || !r.dataset.open) return;
  open = open === r.dataset.open ? null : r.dataset.open;
  render();
});

const RENDER = {findings: renderFindings, leagues: renderLeagues, backtest: renderBacktest, live: renderLive, projections: renderProjections, method: renderMethod};
const CHIPS = {backtest: 1, projections: 1};
function render(){
  document.querySelectorAll('#tabs a').forEach(a => { a.classList.toggle('on', a.dataset.view === view); a.href = `#view=${a.dataset.view}${lg === 'all' || !CHIPS[a.dataset.view] ? '' : '&lg=' + lg}`; });
  let keys = DATA.leagues.map(l => l.key);
  if (view === 'backtest') keys = keys.filter(k => DATA.backtest.leagues[k] && DATA.backtest.leagues[k].rule.n);
  if (view === 'projections') keys = keys.filter(k => LIVE.fixtures.some(g => g.lg === k));
  const chips = CHIPS[view] ? [['all', 'All leagues'], ...keys.map(k => [k, LG[k].country + (DATA.leagues.filter(l => l.country === LG[k].country).length > 1 ? ' ' + LG[k].name : '')])] : [];
  $('chips').innerHTML = chips.map(([k, t]) => `<a href="#view=${view}${k === 'all' ? '' : '&lg=' + k}" class="${k === lg ? 'on' : ''}">${t}</a>`).join('');
  $('out').innerHTML = RENDER[view]();
}
function fromHash(){
  const m = location.hash.match(/view=(\w+)/), l = location.hash.match(/lg=([\w-]+)/);
  view = m && RENDER[m[1]] ? m[1] : 'findings';
  lg = l && LG[l[1]] ? l[1] : 'all';
  render();
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
</body>
