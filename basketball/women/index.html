<script>
const $ = id => document.getElementById(id);
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayName = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const short = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const pct = (x, d=0) => x == null ? '–' : (x*100).toFixed(d) + '%';
const sgn = (x, d=1) => x == null ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
const roi = x => x == null ? '–' : sgn(x*100, 1) + '%';
const cls = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
const sn = s => s.replace('-', '–');
let view = 'home', lg = 'all', open = null;
const ALLG = [...DATA.leagues, ...(DATA.past || [])];   // past: on the list in an earlier season, not now
const LG = Object.fromEntries(ALLG.map(l => [l.key, l]));
const lgName = k => `${LG[k].country} · ${LG[k].name}`;
const lgFull = l => l.country === 'Europe' ? l.name : `${l.country} <span class="muted">${l.name}</span>`;
const lgShort = k => (LG[k] || {short: k}).short;
const wl = b => b.ret > 0 ? 'w' : b.ret < 0 ? 'l' : '';   // settled winners green, losers red
const sd = b => b.side === 'u' ? 'Under' : 'Over';
const inLg = x => lg === 'all' || x.lg === lg;
const R = DATA.rule;
const LE = () => LIVE.edge ?? R.edge;
const RL = k => !LIVE.leagues || LIVE.leagues.includes(k);
const LIVE = window.LIVE || {updated: DATA.updated, fixtures: DATA.fixtures, picks: [], tracked: 0, start: '8 Nov 2026', taken: {n: 0}, over: {n: 0}, under: {n: 0}, rule: {n: 0}};
LIVE.fixtures = LIVE.fixtures.filter(g => LG[g.lg] && (!g.gp || Math.min(...g.gp) >= (LIVE.min_gp ?? 4)));   // leagues no longer on the page; games only once both teams have the minimum games
LIVE.picks = LIVE.picks || [];   // every logged pick stays in the record, even from a league no longer on the page
if (LIVE.leagues) LIVE.leagues = LIVE.leagues.filter(k => LG[k]);

$('sub').textContent = `${DATA.leagues.length} Leagues · backtest 2021–22 to 2025–26 · 2026–27 record since ${LIVE.start} · updated ${LIVE.updated} (Athens)`;

// top tiles: the whole 2026-27 record, as on the Live test tab (ROI = return over wins + losses)
{
  const set = [...((DATA.cur || {}).bets || []), ...LIVE.picks.filter(b => b.done && b.ret != null)], won = set.filter(b => b.ret > 0).length, lost = set.filter(b => b.ret < 0).length;
  const units = set.reduce((a, b) => a + b.ret, 0), nOpen = LIVE.picks.filter(b => !b.done).length;
  // average line bet and average closing line, over every settled 2026-27 bet that has a close
  const cl = set.filter(b => b.close != null), avg = (L, f) => L.length ? (L.reduce((a, b) => a + f(b), 0) / L.length).toFixed(1) : '–';
  // the same picks at the closing line and price (overs); pushes left out, as for the ROI at opening
  const cc = cl.filter(b => b.cpx != null && b.total !== b.close), uc = cc.reduce((a, b) => a + (b.total > b.close ? b.cpx - 1 : -1), 0);
  const mu = set.filter(b => b.mu != null), nS = `${set.length} settled picks`;
  $('top').innerHTML = [['Open picks', nOpen, nOpen ? 'to play' : 'none right now'], ['Picks', set.length, 'settled'], ['Hit rate', won + lost ? pct(won / (won + lost), 1) : '–', `${won}–${lost} win – loss`],
    ['ROI at opening', won + lost ? `<span class="${cls(units)}">${roi(units / (won + lost))}</span>` : '–', nS],
    ['ROI at closing', cc.length ? `<span class="${cls(uc)}">${roi(uc / cc.length)}</span>` : '–', `${cc.length} settled picks`],
    ...(K => [['Profit', set.length ? `<span class="${cls(K.u)}">${uFmt(K.u)}</span>` : '–', 'units, 1 unit a pick'], ['Max drawdown', set.length ? (K.dd ? '−' + K.dd.toFixed(1) : '0') : '–', 'units, deepest fall from a high'], ['Longest losing run', set.length ? K.worst : '–', 'losses in a row']])(runs(set)),
    ['Opening line', avg(cl, b => b.line), `avg of ${cl.length} settled picks`], ['Closing line', avg(cl, b => b.close), `avg of ${cl.length} settled picks`],
    ['Model line', avg(mu, b => b.mu), `avg of ${mu.length} settled picks`], ['Actual total', avg(cl, b => b.total), `avg of ${cl.length} settled picks`],
    ['Closing line moved toward the pick', cl.length ? pct(cl.filter(b => b.close > b.line).length / cl.length) : '–', `of ${cl.length} settled picks`],
    ['Closing line moved against it', cl.length ? pct(cl.filter(b => b.close < b.line).length / cl.length) : '–', `of ${cl.length} settled picks`]]
    .map(([k, v, n]) => `<a class="tile" href="#view=livetest"><span class="klabel">${k}</span><span class="stat">${v}</span><span class="small">${n}</span></a>`).join('');
}

// profit in units, the deepest fall from a high point (units) and the longest run of losses, in date order; pushes change nothing
function runs(list){
  let u = 0, hi = 0, dd = 0, run = 0, worst = 0;
  for (const b of [...list].sort((a, c) => a.dt < c.dt ? -1 : 1)){
    u += b.ret; hi = Math.max(hi, u); dd = Math.max(dd, hi - u);
    if (b.ret < 0) worst = Math.max(worst, ++run); else if (b.ret > 0) run = 0;
  }
  return {u, dd, worst};
}
function uFmt(u){ return `${u >= 0 ? '+' : '−'}${Math.abs(u).toFixed(1)}`; }

function tiles(list){
  return `<div class="metrics">${list.map(([l, v, c]) => `<div class="metric"><div class="lbl">${l}</div><div class="big ${c||''}">${v}</div></div>`).join('')}</div>`;
}

// one table row from a {n, w, roi} group
const grp = (label, g, extra='', more='') => g && g.n ? `<tr${extra}><td>${label}</td><td class="n">${g.n}</td><td class="n">${pct(g.w / g.n, 1)}</td><td class="n">${g.px ? g.px.toFixed(2) : '–'}</td><td class="n ${cls(g.roi)}">${roi(g.roi)}</td>${more}</tr>` : '';
const LHEAD = '<th class="n">Model line</th><th class="n">Opening line</th><th class="n">Closing line</th><th class="n">Result</th>';
const gap = x => Math.round((x.mu - x.line) * 10) / 10;   // points the model total is above the line
const stat = r => ({n: r.length, w: r.filter(x => x.ret > 0).length, px: r.reduce((s, x) => s + x.px, 0) / r.length, roi: r.reduce((s, x) => s + x.ret, 0) / r.length});
const sideTable = (first, rows) => `<div class="scroll"><table>${GHEAD(first, LHEAD)}<tbody>${rows.map(([label, r]) => grp(label, stat(r), '', lineCells(r))).join('')}</tbody></table></div>`;
const GHEAD = (first, more='') => `<thead><tr><th>${first}</th><th class="n">Picks</th><th class="n">Hit</th><th class="n">Avg price</th><th class="n">ROI</th>${more}</tr></thead>`;
// average opening and closing line of a list of bets, as two table cells
const seasonOf = b => { const y = +b.dt.slice(0, 4); return +b.dt.slice(5, 7) >= 7 ? `${y}-${y + 1}` : `${y - 1}-${y}`; };
const lineAvg = (list, k) => (list.reduce((a, b) => a + b[k], 0) / list.length).toFixed(1);
const lineCells = list => { const c = list.filter(b => b.close != null && b.open != null); return c.length ? ['mu', 'open', 'close', 'total'].map(k => `<td class="n">${lineAvg(c, k)}</td>`).join('') : '<td class="n muted">–</td>'.repeat(4); };

// Edge now for a pick: orange above the bar, yellow at the bar or under, red below 0
const edgeNow = v => v == null ? '<td class="n muted">–</td>' : `<td class="n ${v > LE() ? 'pos' : v > 0 ? 'elow' : 'eneg'}">${sgn(v*100, 0)}%</td>`;

// the backtest layout, the same as the overs page: tiles, then edge, league, line, stage, season, month, every pick
// rows marked (skipped) are games every other rule let through that one rule kept out; they are in no other figure
const BHEAD = '<th class="n">Opening line</th><th class="n">Closing line</th><th class="n">Model line</th><th class="n">Actual total</th>';   // pace and 3-pt luck only on the match pages (13 Nov 2026, as the men's page)
const avgOf = (list, k) => { const q = list.filter(b => b[k] != null); return q.length ? `<td class="n">${sgn(q.reduce((a, b) => a + b[k], 0) / q.length, 1)}</td>` : '<td class="n muted">–</td>'; };
const btCells = list => { const c = list.filter(b => b.close != null);
  return (c.length ? ['line', 'close', 'mu', 'total'].map(k => `<td class="n">${lineAvg(c, k)}</td>`).join('') : '<td class="n muted">–</td>'.repeat(4)); };
const btTable = (first, rows, note='') => `${note ? `<p class="note">${note}</p>` : ''}<div class="scroll"><table style="max-width:1040px">${GHEAD(first, BHEAD)}<tbody>${rows.filter(r => r[1].length).map(([label, r]) => grp(label, stat(r), '', btCells(r))).join('')}</tbody></table></div>`;
const SKIPPED = ' <span class="muted">(skipped)</span>';
const skipped = k => (DATA[k] || []).filter(inLg);
// k bands with the same number of picks each (the last ones one fewer), sorted by key; label is the band's lowest to highest value
function qbands(list, key, k, fmt){
  const d = list.filter(b => b[key] != null).sort((a, b) => a[key] - b[key]);
  if (d.length < k) return [];
  return [...Array(k).keys()].map(i => d.slice(Math.round(d.length * i / k), Math.round(d.length * (i + 1) / k))).map(r => [`${fmt(r[0][key])} to ${fmt(r[r.length - 1][key])}`, r]);
}
const NB = 4;   // four bands: of 2 to 8, the one whose band results repeated best between 2021–23 and 2024–26 (11 Nov 2026)

// calibration: the model's chance of the pick against how often it won, in four bands with a quarter of the picks each
function calTable(list, note){
  const d = list.filter(b => b.p != null && b.ret != null && b.ret !== 0).sort((a, b) => a.p - b.p);
  if (!d.length) return '';
  const rows = qbands(d, 'p', NB, x => pct(x, 1));
  rows.push(['<b>All</b>', d]);
  const tr = ([label, r]) => { const p = r.reduce((a, b) => a + b.p, 0) / r.length, w = r.filter(b => b.ret > 0).length / r.length, df = (w - p) * 100;
    return `<tr><td>${label}</td><td class="n">${r.length}</td><td class="n">${pct(p, 1)}</td><td class="n">${pct(w, 1)}</td><td class="n ${cls(df)}">${sgn(df, 1)} pts</td></tr>`; };
  return `<h2>Calibration</h2><p class="note">${note}</p><div class="scroll"><table style="max-width:640px"><thead><tr><th>Model's chance</th><th class="n">Picks</th><th class="n">Model said</th><th class="n">Won</th><th class="n">Difference</th></tr></thead><tbody>${rows.map(tr).join('')}</tbody></table></div>`;
}

function btBody(BT, S, pool, leagues){
  let h = calTable(BT, "How often the picks won against the chance the model gave them, at the opening line. A well-calibrated model wins about as often as it says. Won above the chance means the model was too cautious on these picks; below it, too confident. The picks are split by the model's chance into four bands with a quarter of the picks each. Pushes are left out.");
  const T = stat(BT), C = BT.filter(b => b.close != null), EP = Math.round(R.edge * 100);
  h += `<h2>By edge</h2>` + btTable('Edge', qbands(BT, 'edge', NB, x => (x * 100).toFixed(1) + '%'),
    `Edge: the model's chance of the over × the price − 1, at the opening line. The picks, all above the ${EP}% bar, in four bands with a quarter of the picks each.`);
  h += `<h2>By line</h2>` + btTable('Line band', [['Under 130', 0, 130], ['130–139.5', 130, 140], ['140 and over', 140, 999]].map(([label, lo, hi]) => [label, BT.filter(x => x.line >= lo && x.line < hi)]), 'The opening line in three bands.');
  h += `<h2>By stage</h2>` + btTable('Stage', [['Regular season', BT], [`Play-offs${SKIPPED}`, skipped('skipped_po')]],
    'The second row is the play-off games the rule skips: every other rule met, with the chance worked out as for a regular-season game.');
  h += `<h2>By season</h2>` + btTable('Season', S.seasons.map(s => [sn(s.season), BT.filter(x => seasonOf(x) === s.season)]));
  h += `<h2>By month</h2>` + btTable('Month', S.months.map(m => [MON[m.m - 1], BT.filter(x => +x.dt.slice(5, 7) === m.m)]));
  return h + bets(BT);
}

  const howNote = `<p class="note"><b>The pick.</b> The over, when the model's edge is above ${Math.round(LE()*100)}%: regular season, both teams ${LIVE.min_gp ?? 4}+ games in, the projected total at least 4 points above the line, pace not taking more than 1 point off the model total, and a line ending in .5.<br><b>When.</b> Every hour the model checks the next 7 days. A pick is logged the first time its edge clears the bar, at that line and the average price, and never changed. Women's lines rarely move, so there is no rush to take it. <b>Edge now</b> is the edge at the line and price on offer now: yellow when it has fallen to the bar or below, red when it is gone.<br><b>Scoring.</b> Equal stakes. ROI is profit ÷ amount staked; pushes don't count. Updated ${LIVE.updated} (Athens).</p>`;
  let h = '';
  if (!open.length) h += '<p class="empty">No open picks right now. New ones appear here as lines open.</p>';
  else {
    h += `<h2>Open picks</h2><div class="scroll"><table class="proj"><thead><tr><th>Tip-off</th><th>League</th><th>Match</th><th class="n">Pick</th><th class="n">Price</th><th class="n">Model total</th><th class="n">Edge</th><th class="n">Line now</th><th class="n">Line diff</th><th class="n">Edge now</th></tr></thead><tbody>` +
      open.map(b => { const g = fx[b.home + '|' + b.away] || {};
        return `<tr class="pk"><td data-s="${b.dt}">${dayName(b.dt)} ${b.dt.slice(11)}</td><td>${lgShort(b.lg)}</td><td class="wr">${g.slug ? `<a class="gm" href="games/${g.slug}/">${b.home} – ${b.away}</a>` : `${b.home} – ${b.away}`}</td><td class="n"><b>${sd(b)} ${b.line}</b></td><td class="n">${b.px.toFixed(2)}</td><td class="n">${(g.mu ?? b.mu).toFixed(1)}</td><td class="n pos">${sgn(b.edge*100, 0)}%</td><td class="n">${g.line ?? b.now ?? '–'}</td><td class="n">${sgn(Math.round((b.mu - (b.pace ?? 0) - (LIVE.start_pts ?? 0) - b.line) * 10) / 10, 1)}</td>${edgeNow(g.line != null ? g.eo : null)}</tr>`; }).join('') +
      '</tbody></table></div>';
  }
  const pre = ((DATA.cur || {}).bets || []).map(b => ({...b, pre: true, done: true, close: b.close ?? null}));
  const all = [...pre, ...LIVE.picks].sort((a, b) => a.dt < b.dt ? -1 : 1);
  const set = all.filter(b => b.done && b.ret != null), won = set.filter(b => b.ret > 0).length;
  const units = set.reduce((a, b) => a + b.ret, 0), nDec = set.filter(b => b.ret !== 0).length, R_ = nDec ? units / nDec : null;
  const mv = b => (b.close - b.line) * (b.side === 'u' ? -1 : 1), cl = all.filter(b => !b.pre && b.close != null), up = cl.filter(b => mv(b) > 0).length, dn = cl.filter(b => mv(b) < 0).length;
  h += `<h2>The ${sn(DATA.season)} record</h2>`;
  h += `<p class="note">The closing line moved toward the pick when it ended above the line picked. A few hundred picks are needed before the record says much. Picks stay as they were logged, under the rules of their day. The record starts on ${LIVE.start}, under the rules in How it works. Click a column heading to sort.</p>`;
  if (!set.length) return h + howNote + '<p class="empty">No settled picks yet.</p>';
  h += liveTables(set.filter(b => !b.pre));
  let run = 0;
  const rows = all.filter(b => b.done).map(b => {   // open picks are in the table above
    if (b.ret != null) run += b.ret;
    const res = b.ret == null ? '<span class="pill">Void</span>' : b.ret > 0 ? '<span class="pill pos">Won</span>' : b.ret < 0 ? '<span class="pill neg">Lost</span>' : '<span class="pill">Push</span>';
    const mvc = b.close == null ? '<td class="n muted">–</td>' : `<td class="n">${b.close}${b.close > b.line ? ' <span class="pos">▲</span>' : b.close < b.line ? ' <span class="neg">▼</span>' : ''}</td>`;
    return `<tr><td data-s="${b.dt}">${short(b.dt)}${b.dt.length > 10 ? ' ' + b.dt.slice(11) : ''}${b.pre ? ' <span class="muted">backtest</span>' : ''}</td><td>${lgShort(b.lg)}</td><td class="wr">${b.slug ? `<a class="gm" href="games/${b.slug}/">${b.home} – ${b.away}</a>` : `${b.home} – ${b.away}`}</td><td class="n ${b.done ? wl(b) : ''}"><b>${sd(b)} ${b.line}</b></td>
      <td class="n">${b.px.toFixed(2)}</td><td class="n">${b.mu != null ? b.mu.toFixed(1) : '–'}</td><td class="n pos">${sgn(b.edge*100, 0)}%</td>${mvc}<td class="n ${wl(b)}"><b>${b.total ?? '–'}</b></td><td class="n">${res}</td>
      <td class="n ${cls(b.ret)}">${b.ret == null ? '–' : sgn(b.ret, 2)}</td><td class="n ${cls(run)}">${sgn(run, 2)}</td></tr>`;
  });
  return h + howNote + `<h2>Settled picks, latest first</h2><p class="note">Closing line: ▲ moved toward the pick, ▼ against it. Profit at 1 unit a pick; Running is the total so far. Click a match for its page, with the model total as it stood before tip-off and how it was built.</p><div class="scroll"><table class="proj settled"><thead><tr><th>Tip-off</th><th>League</th><th>Match</th><th class="n">Pick</th><th class="n">Price</th><th class="n">Model total</th><th class="n">Edge</th><th class="n">Closing line</th><th class="n">Total</th><th class="n">Result</th><th class="n">Profit</th><th class="n">Running</th></tr></thead><tbody>${rows.reverse().join('')}</tbody></table></div>`;
}

// click a column heading to sort its table (again to reverse); league groups keep their season rows
function cellAt(r, col){ let i = 0; for (const c of r.cells){ if (col < i + c.colSpan) return c.colSpan > 1 ? null : c; i += c.colSpan; } return null; }
document.addEventListener('click', e => {
  const th = e.target.closest('#out th'); if (!th) return;
  const table = th.closest('table'), tb = table.tBodies[0]; if (!tb) return;
  let col = 0; for (const x of th.parentNode.children){ if (x === th) break; col += x.colSpan; }
  const dir = th.classList.contains('sd') ? 'asc' : 'desc', num = th.classList.contains('n');
  table.querySelectorAll('th').forEach(x => x.classList.remove('sa', 'sd'));
  th.classList.add(dir === 'asc' ? 'sa' : 'sd');
  const groups = [];
  for (const r of [...tb.rows]){
    if (r.querySelector('td.tier')){ r.style.display = 'none'; continue; }
    if (r.classList.contains('sub') && groups.length) groups[groups.length - 1].push(r); else groups.push([r]);
  }
  const key = r => { const c = cellAt(r, col); if (!c) return null; if (c.dataset.s) return c.dataset.s;
    const t = c.textContent.replace(/−/g, '-').replace(/,/g, '').trim(); if (!t || t === '–') return null;
    if (!num) return t.toLowerCase(); const m = t.match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
  groups.sort((a, b) => { const x = key(a[0]), y = key(b[0]); if (x === y) return 0; if (x == null) return 1; if (y == null) return -1;
    return (x < y ? -1 : 1) * (dir === 'asc' ? 1 : -1); });
  groups.flat().forEach(r => tb.appendChild(r));
});

function renderMethod(){ return `<div class="doc">${DATA.method}</div>`; }

document.addEventListener('click', e => {
  const r = e.target.closest('tr.srow');
  if (!r || !r.dataset.open) return;
  open = open === r.dataset.open ? null : r.dataset.open;
  render();
  if (open && view === 'leagues') { const a = document.getElementById('lgan'); if (a) a.scrollIntoView({behavior: 'smooth', block: 'start'}); }
});

const RENDER = {home: renderFindings, livetest: renderPicks, leagues: renderLeagues, backtest: renderBacktest, projections: renderProjections, method: renderMethod};
const CHIPS = {projections: 1};
function render(){
  document.querySelectorAll('#tabs a').forEach(a => { a.classList.toggle('on', a.dataset.view === view); a.href = `#view=${a.dataset.view}${lg === 'all' || !CHIPS[a.dataset.view] ? '' : '&lg=' + lg}`; });
  let keys = ALLG.map(l => l.key);
  if (view === 'backtest') keys = keys.filter(k => DATA.bets.some(b => b.lg === k));
  if (view === 'projections') keys = DATA.leagues.map(l => l.key).filter(k => LIVE.fixtures.some(g => g.lg === k));
  const chips = CHIPS[view] ? [['all', 'All leagues'], ...keys.map(k => [k, lgShort(k)])] : [];
  $('chips').innerHTML = chips.map(([k, t]) => `<a href="#view=${view}${k === 'all' ? '' : '&lg=' + k}" class="${k === lg ? 'on' : ''}">${t}</a>`).join('');
  $('top').style.display = $('sub').style.display = view === 'backtest' ? 'none' : '';   // the live record tiles are not shown on the backtest
  const BTb = view === 'backtest' ? DATA.bets.filter(inLg) : [];   // the backtest tiles sit on top of the Backtest tab, where the record tiles are on the other tabs
  $('btop').innerHTML = BTb.length ? (() => { const T = stat(BTb), C = BTb.filter(b => b.close != null); const cc = C.filter(b => b.cpx != null && b.total !== b.close), rc = cc.length ? cc.reduce((a, b) => a + (b.total > b.close ? b.cpx - 1 : -1), 0) / cc.length : null; const K = runs(BTb); return tiles([['Picks', T.n], ['Hit rate', pct(T.w / T.n, 1)], ['ROI at opening', roi(T.roi), cls(T.roi)], ['ROI at closing', rc != null ? roi(rc) : '–', cls(rc)], ['Profit, units', uFmt(K.u), cls(K.u)], ['Max drawdown, units', K.dd ? '−' + K.dd.toFixed(1) : '0'], ['Longest losing run', K.worst], ['Opening line', lineAvg(C, 'line')], ['Closing line', lineAvg(C, 'close')], ['Model line', lineAvg(C, 'mu')], ['Actual total', lineAvg(C, 'total')], ['Closing line moved toward the pick', pct(C.filter(b => b.close > b.line).length / C.length)], ['Closing line moved against it', pct(C.filter(b => b.close < b.line).length / C.length)]]); })() : '';
  $('out').innerHTML = RENDER[view]();
}
function fromHash(){
  const m = location.hash.match(/view=(\w+)/), l = location.hash.match(/lg=([\w-]+)/);
  const old = {live: 'livetest', picks: 'livetest', findings: 'home', picksover: 'livetest', picksunder: 'livetest', overs: 'backtest', unders: 'backtest', testing: 'backtest'}, v = m && (old[m[1]] || m[1]);   // old links: Live test is part of Picks, Findings is Home
  view = RENDER[v] ? v : 'home';
  lg = l && LG[l[1]] ? l[1] : 'all';
  render();
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
