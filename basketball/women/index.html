<script>
const D = window.DATA, L = window.LIVE || {picks: [], updated: ""};
const out = document.getElementById("out"), $top = document.getElementById("top"), $sub = document.getElementById("sub");
const sgn = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
const pc = v => `<span class="${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${sgn(v)}%</span>`;
const un = v => `<span class="${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${sgn(v, 2)}u</span>`;
const when = ts => new Date(ts * 1000).toLocaleString("en-GB", {timeZone: "Europe/Athens", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"});
const done = L.picks.filter(p => p.r !== undefined), open = L.picks.filter(p => p.r === undefined);
function rec(ps) {
  const w = ps.filter(p => p.r > 0).length, l = ps.filter(p => p.r < 0).length, u = ps.reduce((a, p) => a + p.r, 0);
  return {w, l, u, roi: ps.length ? u / ps.length * 100 : 0, n: ps.length};
}
const all = rec(done);
$top.innerHTML = [["Open picks", open.length], ["Record", `${all.w}–${all.l}`], ["Return", all.n ? un(all.u) : "–"], ["ROI", all.n ? pc(all.roi) : "–"]]
  .map(([k, v]) => `<div class="tile"><span class="klabel">${k}</span><span class="stat">${v}</span></div>`).join("");
$sub.textContent = `${D.comps} competitions · backtest 2023–24 to Oct 2026 · live test since 6 Nov 2026`;

function tbl(cols, rows) {
  const id = "t" + Math.random().toString(36).slice(2);
  return `<div class="scroll"><table class="sortable" id="${id}"><thead><tr>${cols.map(c => `<th class="sort${c.n ? " n" : ""}">${c.h}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr>${cols.map(c => `<td class="${c.n ? "n" : ""}" data-v="${c.v ? c.v(r) : ""}">${c.f(r)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`;
}
const STAT = [{h: "", f: r => r.s, v: r => r.s}, {h: "Picks", n: 1, f: r => r.n, v: r => r.n}, {h: "Hit", n: 1, f: r => r.hit.toFixed(1) + "%", v: r => r.hit},
  {h: "Units", n: 1, f: r => sgn(r.u), v: r => r.u}, {h: "ROI", n: 1, f: r => pc(r.roi), v: r => r.roi},
  {h: "Open", n: 1, f: r => r.o === undefined ? "–" : r.o.toFixed(1), v: r => r.o}, {h: "Close", n: 1, f: r => r.c === undefined ? "–" : r.c.toFixed(1), v: r => r.c}];
const stat = (head, rows) => tbl([{...STAT[0], h: head}, ...STAT.slice(1)], rows);

const V = {
home() {
  const a = D.s1.all, b = D.s2.all, m = D.market;
  return `<div class="verdict"><h2>Is there a gap in the pricing?</h2><p>In the backtest, yes. Two signals made a profit, and the first one held up all the way to the closing line, which the same model does not do in men's basketball. That is a backtest result, not proof: the live record only began on 6 Nov 2026, and the 2026–27 games before that were a loss for the model. Break-even at these prices is about 54.6%.</p></div>
  <div class="find"><h3><span class="num">1</span>Women's lines barely move</h3><p>${m[0].moved}% of lines moved between open and close in 2025–26, against ${m[1].moved}% in the men's leagues, and by ${m[0].mv} points on average against ${m[1].mv}. The moves add almost nothing: the average miss goes from ${m[0].mae_o} points at the open to ${m[0].mae_c} at the close.</p></div>
  <div class="find"><h3><span class="num">2</span>A simple team model finds value at the close</h3><p>Overs and unders with an edge above 4%: ${a.n.toLocaleString("en-GB")} picks, ${a.hit}% hit, ${sgn(a.roi)}% ROI. The same code on men's games made no reliable profit at the close.</p></div>
  <div class="find"><h3><span class="num">3</span>A line far from the others is often wrong</h3><p>When one book opened 5 to 12 points from the rest, the favourable side made ${sgn(b.roi)}% over ${b.n} picks, positive in 2024–25, 2025–26 and so far in 2026–27. It is unknown how many of those opening lines could really have been taken, which is what the live test measures.</p></div>
  <div class="find"><h3><span class="num">4</span>Betting blind loses</h3><p>Overs and unders lose in every season once the margin of about 9% is paid. Choosing leagues by their past over rate did not make a reliable profit.</p></div>`;
},
picks() {
  const P = {model: "Model", gap: "Line gap"};
  const cols = [{h: "Tip-off", f: p => when(p.ts), v: p => p.ts}, {h: "League", f: p => p.league, v: p => p.league}, {h: "Game", f: p => `${p.home} – ${p.away}`, v: p => p.home},
    {h: "Signal", f: p => P[p.sig], v: p => p.sig}, {h: "Pick", f: p => `${p.side} ${p.line}`, v: p => p.line}, {h: "Open", n: 1, f: p => p.open ?? "–", v: p => p.open ?? 0}, {h: "Price", n: 1, f: p => p.price.toFixed(2), v: p => p.price}];
  const res = [...cols, {h: "Close", n: 1, f: p => p.close ?? "–", v: p => p.close ?? 0}, {h: "Total", n: 1, f: p => p.total, v: p => p.total}, {h: "Return", n: 1, f: p => un(p.r), v: p => p.r}];
  const by = k => rec(done.filter(p => p.sig === k));
  const row = (n, r) => `<tr><td>${n}</td><td class="n">${r.n}</td><td class="n">${r.w}–${r.l}</td><td class="n">${r.n ? un(r.u) : "–"}</td><td class="n">${r.n ? pc(r.roi) : "–"}</td></tr>`;
  let h = `<p class="note">Picks are logged at the line and price on offer the first time a signal fires, and never changed. Prices are the average of the books at that line. A few hundred picks are needed before the record says much.</p>`;
  h += `<h2>Record</h2><div class="scroll"><table><thead><tr><th>Signal</th><th class="n">Picks</th><th class="n">Record</th><th class="n">Return</th><th class="n">ROI</th></tr></thead><tbody>${row("Model", by("model"))}${row("Line gap", by("gap"))}</tbody></table></div>`;
  h += `<h2>Open picks</h2>` + (open.length ? tbl(cols, [...open].sort((a, b) => a.ts - b.ts)) : `<p class="empty">No open picks.</p>`);
  h += `<h2>Results</h2>` + (done.length ? tbl(res, [...done].sort((a, b) => b.ts - a.ts)) : `<p class="empty">No results yet.</p>`);
  return h + (L.updated ? `<p class="muted">Updated ${L.updated} Athens time.</p>` : "");
},
backtest() {
  const s = D.s1;
  let h = `<p class="note">Each season's model is fitted only on earlier seasons. The 2026–27 rows are the games before the live test began. Click a column heading to sort.</p>`;
  h += `<h2>Model at the closing line</h2><div class="metrics">${[["Picks", s.all.n.toLocaleString("en-GB")], ["Hit", s.all.hit + "%"], ["ROI", sgn(s.all.roi) + "%"], ["Units", sgn(s.all.u)], ["Worst run", "−" + s.dd + "u"], ["Opening line", s.all.o.toFixed(1)], ["Closing line", s.all.c.toFixed(1)], ["Actual total", s.all.t.toFixed(1)]].map(([k, v]) => `<div class="metric"><div class="lbl">${k}</div><div class="big">${v}</div></div>`).join("")}</div>`;
  h += `<div class="cols2"><div>${stat("Season", s.seasons)}</div><div>${stat("Side", s.sides)}</div></div>`;
  h += `<h2>By line</h2><p class="note">Closing line of the pick, in 10-point bands.</p>` + stat("Line", s.bands);
  h += `<h2>By edge</h2><p class="note">The rule is 4%+; the 2%+ row shows what a lower bar would have done.</p>` + stat("Edge", s.edges);
  h += `<h2>By league</h2><p class="note">Most leagues have too few picks to judge on their own, so no league has been dropped.</p>` + stat("League", s.leagues);
  return h;
},
market() {
  const m = D.market;
  let h = `<p class="note">The 2025–26 season, women's competitions next to the men's leagues from the totals study.</p>`;
  h += tbl([{h: "", f: r => r.s}, {h: "Games", n: 1, f: r => r.games.toLocaleString("en-GB")}, {h: "Avg line", n: 1, f: r => r.line}, {h: "Lines moved", n: 1, f: r => r.moved + "%"}, {h: "Avg move", n: 1, f: r => r.mv}, {h: "Miss at open", n: 1, f: r => r.mae_o}, {h: "Miss at close", n: 1, f: r => r.mae_c}, {h: "Margin", n: 1, f: r => r.mar + "%"}], m);
  const B = [{h: "Picks", n: 1, f: r => r.n.toLocaleString("en-GB"), v: r => r.n}];
  const O = [{h: "Over %", n: 1, f: r => r.over.toFixed(1) + "%", v: r => r.over}, {h: "Blind over", n: 1, f: r => pc(r.ro), v: r => r.ro}, {h: "Blind under", n: 1, f: r => pc(r.ru), v: r => r.ru}];
  h += `<h2>By season</h2>` + tbl([{h: "Season", f: r => r.s, v: r => r.s}, ...B, {h: "Books a game", n: 1, f: r => r.books, v: r => r.books}, ...O], D.seasons);
  h += `<h2>By league, 2023–24 on</h2><p class="note">Leagues with 100 or more priced games, at the closing line. Choosing leagues from these columns did not make a reliable profit in testing.</p>`;
  h += tbl([{h: "League", f: r => r.s, v: r => r.s}, ...B, {h: "Avg line", n: 1, f: r => r.line, v: r => r.line}, {h: "Avg total", n: 1, f: r => r.act, v: r => r.act}, ...O], D.leagues);
  return h;
},
method() {
  return `<div class="doc"><h3><span class="num">1</span>Data</h3><p>${D.games.toLocaleString("en-GB")} priced games in ${D.comps} European competitions from 2020–21, with opening and closing total lines. A book's overtime market settles on the final score and its regulation market on the score after four quarters. Placeholder lines and lines far from any plausible total were removed.</p>
  <h3><span class="num">2</span>Model</h3><p>Each team gets a points tendency from its earlier games, with recent games counting more and earlier seasons counting less. The settings come from the men's totals model and were not tuned on women's games.</p>
  <h3><span class="num">3</span>Model signal</h3><ul><li>Overs and unders</li><li>Edge above 4% at the line on offer</li><li>Both teams at least 3 games into the season</li><li>Model within 12 points of the line</li></ul>
  <h3><span class="num">4</span>Line gap signal</h3><ul><li>At least three books pricing the game</li><li>One book 5 to 12 points from the median of the others</li><li>Take the favourable side at that book: the over at a low line, the under at a high one</li></ul>
  <h3><span class="num">5</span>Live test</h3><p>The rules were frozen on 6 Nov 2026 and picks are logged about every hour. In the live test the line gap signal uses the lines on offer at that moment, not the reported openings, so every pick is a price that was there to take. Stake limits are not measured, and they can be low in these markets.</p></div>`;
}};
function sortable() {
  out.querySelectorAll("table.sortable").forEach(t => t.querySelectorAll("th").forEach((th, i) => th.onclick = () => {
    const b = t.tBodies[0], d = th.dataset.d === "1" ? -1 : 1; th.dataset.d = d === 1 ? "1" : "0";
    const val = r => { const s = r.cells[i].dataset.v, n = parseFloat(s); return s !== "" && !isNaN(n) ? n : s; };
    [...b.rows].sort((x, y) => { const p = val(x), q = val(y); return (p > q ? 1 : p < q ? -1 : 0) * d; }).forEach(r => b.appendChild(r));
  }));
}
function show() {
  const v = (location.hash.match(/view=(\w+)/) || [])[1], k = V[v] ? v : "home";
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.view === k));
  out.innerHTML = V[k](); sortable();
}
addEventListener("hashchange", show); show();
</script>
</body>
</html>
