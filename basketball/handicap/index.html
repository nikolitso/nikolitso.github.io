<script>
const $ = id => document.getElementById(id);
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dayName = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${DAYS[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(2)}`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (x, d=0) => x == null ? '–' : (x*100).toFixed(d) + '%';
const sgn = (x, d=1) => x == null ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
const hc = x => x == null ? '–' : x === 0 ? '0' : sgn(x);    // the home margin: home favourite by 5.5 = +5.5 (user's choice, 14 Nov 2026)
const f1 = x => x == null ? '–' : x.toFixed(1);
const LG = Object.fromEntries(LIVE.leagues.map(l => [l.key, l]));
const lgName = k => LG[k] ? `${LG[k].country} · ${LG[k].name}` : k;
const lgShort = k => LG[k] ? LG[k].country : k;
const GP = LIVE.min_gp;
let view = 'matches', lg = 'all';
const AGE = LIVE.ts ? (Date.now() / 1000 - LIVE.ts) / 3600 : null;
const inLg = g => lg === 'all' || g.lg === lg;

function tiles(list){ return list.map(([l, v, c]) => `<div class="tile"><span class="klabel">${l}</span><span class="stat">${v}</span><span class="small">${c}</span></div>`).join(''); }
function topTiles(){
  const t = LIVE.tally[lg] || LIVE.tally.all, F = LIVE.fixtures.filter(inLg);
  const o = t.ow + t.ol, c = t.cw + t.cl;
  return tiles([
    ['Played', t.n, `games estimated this season`],
    ['Side covered at opening', o ? pct(t.ow / o, 1) : '–', `${t.ow}–${t.ol} cover · fail`],
    ['Side covered at closing', c ? pct(t.cw / c, 1) : '–', `${t.cw}–${t.cl} cover · fail`],
    ['Miss: model', f1(t.mm), 'points from the final margin'],
    ['Miss: closing line', f1(t.ml), 'points from the final margin'],
  ]);
}

const mark = v => v == null ? '<span class="muted">–</span>' : v ? '<b class="w">✓</b>' : '<b class="l">✗</b>';
function renderMatches(){
  const F = LIVE.fixtures.filter(inLg), P = LIVE.played.filter(inLg);
  let h = '';
  h += `<h2>Next games</h2>`;
  if (!F.length) h += '<p class="empty">No games in the next 7 days.</p>';
  const byDay = {};
  F.forEach(g => (byDay[g.when.slice(0, 10)] ||= []).push(g));
  for (const [d, list] of Object.entries(byDay)) {
    h += `<h2 class="day">${dayName(d)}</h2><div class="scroll"><table class="mk proj"><tr><th>Time</th>${lg === 'all' ? '<th>League</th>' : ''}<th>Game</th><th class="n">Model</th><th class="n">Line</th><th class="n">Opening</th><th class="n">Diff</th><th>Model's side</th><th class="n">Chance</th></tr>`;
    h += list.map(g => {
      const side = g.line != null && g.ok && g.mu !== g.line ? (g.mu > g.line ? g.home : g.away) : null;
      const p = side ? (g.mu > g.line ? g.p : 1 - g.p) : null;
      return `<tr class="${g.ok ? '' : 'few'}"><td class="n">${g.when.slice(11)}</td>${lg === 'all' ? `<td>${esc(lgShort(g.lg))}</td>` : ''}<td class="wr">${wkLink(g)}</td><td class="n tot">${g.ok ? hc(g.mu) : '–'}</td><td class="n">${hc(g.line)}</td><td class="n">${hc(g.open)}</td><td class="n">${side ? f1(Math.abs(g.mu - g.line)) : '–'}</td><td>${side ? esc(side) : g.ok && g.line == null ? '<span class="muted">no line yet</span>' : '<span class="muted">–</span>'}</td><td class="n">${p != null ? pct(p) : '–'}</td></tr>`;
    }).join('') + '</table></div>';
  }
  h += `<h2>Played this season</h2><p class="muted">Each game's estimate from the games before that day, as the page showed it before tip-off, against the opening and closing handicap. ✓ the model's side covered, ✗ it did not.</p>`;
  if (!P.length) return h + '<p class="empty">No games yet with both teams past ' + GP + ' games.</p>';
  h += `<div class="scroll"><table class="mk"><tr><th>Date</th>${lg === 'all' ? '<th>League</th>' : ''}<th>Game</th><th class="n">Score</th><th class="n">Model</th><th class="n">Opening</th><th>Side</th><th class="n">Cov.</th><th class="n">Closing</th><th>Side</th><th class="n">Cov.</th></tr>`;
  h += P.map(g => `<tr><td class="n">${dayName(g.date)}</td>${lg === 'all' ? `<td>${esc(lgShort(g.lg))}</td>` : ''}<td class="wr">${wkLink(g)}</td><td class="n">${g.hp}–${g.ap}</td><td class="n tot">${hc(g.mu)}</td><td class="n">${hc(g.open)}</td><td>${g.so ? esc(g[g.so]) : '–'}</td><td class="n">${mark(g.co)}</td><td class="n">${hc(g.line)}</td><td>${g.sc ? esc(g[g.sc]) : '–'}</td><td class="n">${mark(g.cc)}</td></tr>`).join('');
  return h + '</table></div>';
}

function renderTeams(){
  const t = (LIVE.tables || {})[lg];
  if (!t) return '';
  return `<h2>${esc(lgName(lg))}</h2><p class="muted">Points better or worse than the league's average team, from this season's games only. Home edge ${sgn(t.hca)} points. A game's margin = home edge + home strength − away strength.</p><table class="mk mini" style="max-width:520px"><tr><th>#</th><th>Team</th><th class="n">Games</th><th class="n">Strength</th></tr>${t.teams.map((x, i) => `<tr class="${x[1] < GP ? 'few' : ''}"><td class="n">${i + 1}</td><td>${esc(x[0])}</td><td class="n">${x[1]}</td><td class="n">${sgn(x[2])}</td></tr>`).join('')}</table>`;
}

function renderMethod(){
  const E = LIVE.example, P = LIVE.params, sdG = LIVE.sd['greece-basket-league'], sdC = LIVE.sd['cyprus-division-a'];
  return `<div class="doc">
<h3><span class="num">1</span>A projected margin for every game</h3>
<p>Each team gets one number, its <b>strength</b>: how many points better or worse than its league's average team it is. It comes from this season's games only, because rosters change from year to year, with recent games counting more (half-life ${P.half_life} days) and pulled toward 0 while a team has few games. Each league also has a <b>home edge</b>: the average home margin, this season and earlier ones. Overtime counts, as the books settle the handicap. The Teams tab lists every team's strength.</p>
<div class="calc">projected home margin = home edge + home strength − away strength</div>
${E ? `<p>Example: ${esc(E.home)} v ${esc(E.away)} (${dayName(E.date)}): the model had the home side by ${sgn(E.mu)}, a handicap of ${hc(E.mu)}; the books opened at ${hc(E.open)} and closed at ${hc(E.line)}. Final score ${E.hp}–${E.ap}.</p>` : ''}
<h3><span class="num">2</span>Only after ${GP} games</h3>
<p>An estimate is shown once both teams have played at least <b>${GP} games</b> of the regular season, so that a team's strength rests on enough of its own games; before that the number is mostly the league average. Play-off games are left out.</p>
<h3><span class="num">3</span>Against the handicap</h3>
<p>The line is the books' handicap for the home side: the median of each book's main handicap (the one it prices closest to evens), at the opening and at the latest or closing line. The <b>model's side</b> is the home team when the projected margin is above the line, the away team when below; <b>Diff</b> is the gap in points. The <b>chance</b> that side covers assumes the final margin falls around the projection with the league's usual miss: about ${f1(sdG)} points in Greece and ${f1(sdC)} in Cyprus.</p>
<div class="calc">chance the home side covers = P(margin &gt; line), margin ~ Normal(projection, league miss)</div>
<h3><span class="num">4</span>Projected total and points</h3>
<p>Each match page also projects the total: the <a class="gm" href="/basketball/overs/#view=method">totals page</a>'s model (league average plus both teams' scoring numbers), plus 0.67 points per possession of pace above the league average and minus 0.83 per point of 3-point luck (hot shooting tends to cool). Those two numbers were fitted on 2022–26 games of the 43 totals leagues; fitted on 2022–25 alone, they cut the miss on unseen 2025–27 games from 17.86 to 17.81 points (Greece and Cyprus: 17.69 to 17.55). Each side's points = (total ± margin) ÷ 2.</p>
<h3><span class="num">5</span>Match by match</h3>
<p>Click any match for its full calculation: the home edge, each team's games behind its strength, the projected margin, the line and the chance. The page shows estimates only: no picks and no betting record. <b>Played this season</b> keeps every game's estimate as it stood before tip-off, worked out from the games before that day, with the result and whether the model's side covered at the opening and the closing handicap. The model cannot see news: injuries, rest and roster moves count only once they show up in results, while the line knows them.</p>
<h3><span class="num">6</span>Data</h3>
<p>Results and handicaps for the two leagues of the <a class="gm" href="/basketball/">basketball projections</a>, the Greek Basket League and Cyprus Division A. The model's settings were fitted once on 2021–22 results of 43 leagues, since two leagues alone give too few games to set them. The page refreshes every hour or so.</p>
</div>`;
}


// one match, step by step: how its estimate is built (#view=game&id=...)
const wkLink = g => `<a class="gm" href="#view=game&id=${encodeURIComponent(g.id)}">${esc(g.home)} – ${esc(g.away)}</a>`;
const phi = z => { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2), p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; };
function gamesTable(team, list, r){
  if (!list.length) return `<p class="muted">No games this season yet.</p>`;
  return `<details style="margin:6px 0"><summary style="cursor:pointer">${esc(team)}: ${list.length} games behind the strength ${sgn(r)}</summary><div class="scroll"><table class="mk mini"><tr><th>Date</th><th>Opponent</th><th class="n">Score</th><th class="n">Margin</th><th class="n">Opp. strength</th><th class="n">Adjusted</th></tr>${list.map(x => `<tr><td class="n">${dayName(x[0])}</td><td>${x[2] === 'H' ? '' : '@ '}${esc(x[1])}</td><td class="n">${x[3]}–${x[4]}</td><td class="n">${sgn(x[5], 0)}</td><td class="n">${sgn(x[6])}</td><td class="n">${sgn(x[7])}</td></tr>`).join('')}</table></div></details>`;
}
function renderGame(){
  const id = (location.hash.match(/id=([^&]+)/) || [])[1], gid = id && decodeURIComponent(id);
  const g = LIVE.fixtures.find(x => x.id === gid) || LIVE.played.find(x => x.id === gid);
  if (!g || !g.wk) return '<p class="empty">This game is no longer on the page: estimates cover the next 7 days and this season\'s played games.</p>';
  const W = g.wk, done = g.hp != null, line = g.line, sd = g.sd, est = g.ok !== false, mu = W.hca + W.rh - W.ra;
  const step = (n, t) => `<h3><span class="num">${n}</span>${t}</h3>`, calc = x => `<div class="calc">${x}</div>`;
  const tbl = (head, rows, w = 620) => `<div class="scroll"><table class="mk mini" style="max-width:${w}px"><tr>${head.map((x, i) => `<th${i ? ' class="n"' : ''}>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`;
  const pts = (hm, tot) => tot == null || hm == null ? ['–', '–'] : [f1((tot + hm) / 2), f1((tot - hm) / 2)];
  const T = g.tot == null ? '–' : f1(g.tot);
  let h = `<p><a class="gm" href="#view=matches&lg=${g.lg}">← All matches</a></p>`;
  h += `<h2 style="margin-top:6px">${esc(g.home)} – ${esc(g.away)}</h2><p class="muted">${esc(lgName(g.lg))} · ${dayName(g.when || g.date)}${g.when ? ' ' + g.when.slice(11) : ''}${done ? ` · final <b>${g.hp}–${g.ap}</b>` : ''} · games played ${g.gh}·${g.ga}${est ? '' : ` · <b>no estimate yet</b>: a team has fewer than ${GP} games`}</p>`;
  h += `<div class="doc"><h2 class="day">The model, step by step</h2>`;
  h += step(1, 'Home edge') + `<p>The league's average home margin, recent games counting more: <b>${sgn(W.hca)}</b>.</p>`;
  h += step(2, `${esc(g.home)} strength`) + `<p>Points better (+) or worse (−) than the league's average team, from this season's results, each margin adjusted for the opponent and the venue: <b>${sgn(W.rh)}</b>.</p>${gamesTable(g.home, W.th, W.rh)}`;
  h += step(3, `${esc(g.away)} strength`) + `<p>The same for the away side: <b>${sgn(W.ra)}</b>.</p>${gamesTable(g.away, W.ta, W.ra)}`;
  h += step(4, 'Projected margin') + calc(`home edge + home strength − away strength<br>${sgn(W.hca)} ${W.rh < 0 ? '−' : '+'} ${Math.abs(W.rh).toFixed(1)} ${W.ra < 0 ? '+' : '−'} ${Math.abs(W.ra).toFixed(1)} = <b>${sgn(mu)}</b> for ${esc(g.home)} (the model's handicap; home favourite = +)`);
  const PL = g.pl || {}, tb = g.tb != null ? g.tb : g.tot;
  const tr = (n, x) => `<tr><td>${esc(n)}</td><td class="n">${x ? sgn(x[0]) : '–'}</td><td class="n">${x && x[2] != null ? sgn(x[2]) : '–'}</td></tr>`;
  h += step(5, 'Projected total') + `<p>The <a class="gm" href="/basketball/overs/#view=method">totals page</a>'s model (the league's average total plus both teams' scoring numbers), then pace and 3-point luck: each possession of pace above the league average${PL.avg ? ` (${f1(PL.avg)})` : ''} adds 0.67 points, and each point of 3-point luck takes off 0.83, as hot shooting tends to cool (fitted on 31,600 games of 43 leagues).</p>`
    + (PL.home ? tbl(['Team', 'Pace', '3-pt luck'], [tr(g.home, PL.home), tr(g.away, PL.away), `<tr class="sum"><td>This game</td><td class="n">${PL.pace != null ? sgn(PL.pace) : '–'}</td><td class="n">${PL.luck != null ? sgn(PL.luck) : '–'}</td></tr>`], 520) : '')
    + calc(`totals model ${tb == null ? '–' : f1(tb)} + pace ${g.tpace == null ? '0 (not enough games)' : sgn(g.tpace)} + luck ${g.tluck == null ? '0 (not enough games)' : sgn(g.tluck)} = <b>${T}</b> points`);
  const [mh, ma] = pts(est ? g.mu : null, g.tot);
  h += step(6, 'Points for each side') + calc(`${esc(g.home)} = (total + margin) ÷ 2 = <b>${mh}</b><br>${esc(g.away)} = (total − margin) ÷ 2 = <b>${ma}</b>`);
  const modelRow = cls => `<tr class="${cls}"><td><b>Model</b></td><td class="n">${mh}</td><td class="n">${ma}</td><td class="n">${est ? hc(g.mu) : '–'}</td><td class="n">${T}</td></tr>`;
  h += tbl(['', esc(g.home), esc(g.away), 'Handicap', 'Total'], [modelRow('sum')], 760);
  // last: the books
  h += `<h2 class="day">Against the books</h2>`;
  const [bh, ba] = pts(line, g.tline);
  const rows = [modelRow(''), `<tr><td>Books (${done ? 'closing' : 'latest'})</td><td class="n">${bh}</td><td class="n">${ba}</td><td class="n">${hc(line)}</td><td class="n">${g.tline == null ? '–' : f1(g.tline)}</td></tr>`];
  if (done) rows.push(`<tr class="sum"><td>Final</td><td class="n">${g.hp}</td><td class="n">${g.ap}</td><td class="n">${sgn(g.hp - g.ap, 0)}</td><td class="n">${g.hp + g.ap}</td></tr>`);
  h += tbl(['', esc(g.home), esc(g.away), 'Handicap', 'Total'], rows, 760);
  if (line == null) h += `<p class="muted">No handicap from the books yet.</p>`;
  else if (est) {
    const pH = ln => 1 - phi((ln - g.mu) / sd);
    const lr = (lab, ln) => { if (ln == null) return ''; const d = g.mu - ln, s = d === 0 ? null : d > 0 ? 'home' : 'away', p = pH(ln);
      return `<tr><td>${lab}</td><td class="n">${hc(ln)}</td><td class="n">${f1(Math.abs(d))}</td><td class="n">${s ? esc(g[s]) : '–'}</td><td class="n">${s ? pct(s === 'home' ? p : 1 - p, 0) : '–'}</td></tr>`; };
    h += tbl(['Line', 'Handicap', 'Diff', "Model's side", 'Chance'], [lr(done ? 'Closing' : 'Latest', line), g.open != null && g.open !== line ? lr('Opening', g.open) : ''], 620);
    h += `<p class="muted">Diff: points between the model and the line. Chance: the model's chance its side covers, with the league's usual miss of ${f1(sd)} points (normal curve). Line: median of ${g.books} books.</p>`;
    if (done) {
      const res = (s, c) => s ? `${esc(g[s])} ${c == null ? 'push' : c ? '<b class="w">✓</b>' : '<b class="l">✗</b>'}` : '–';
      h += `<p>Result: opening ${res(g.so, g.co)} · closing ${res(g.sc, g.cc)} · model missed the margin by ${f1(Math.abs(g.hp - g.ap - g.mu))}, the line by ${f1(Math.abs(g.hp - g.ap - line))}.</p>`;
    }
  }
  return h + '</div>';
}
const SECTIONS = [['str', 'Team strength'], ['mk', 'Vs Market'], ['std', 'Standings'], ['rat', 'Team ratings'], ['rd', 'Box scores and reports'], ['lg', 'League stats'], ['fat', 'Fatigue factor'], ['off', 'Official table'], ['ros', 'Rosters and imports']];
const RENDER = {matches: renderMatches, teams: renderTeams, method: renderMethod, game: renderGame};
function render(){
  document.querySelectorAll('#tabs a').forEach(a => { a.classList.toggle('on', a.dataset.view === (view === 'game' ? 'matches' : view)); a.href = `#view=${a.dataset.view}${lg === 'all' || a.dataset.view === 'method' ? '' : '&lg=' + lg}`; });
  const keys = LIVE.leagues.map(l => l.key), chips = view === 'method' || view === 'game' ? [] : keys.map(k => [k, lgShort(k)]);   // one pill per league, no combined view
  $('chips').innerHTML = chips.map(([k, t]) => `<a href="#view=${view}${k === 'all' ? '' : '&lg=' + k}" class="${k === lg ? 'on' : ''}">${esc(t)}</a>`).join('');
  /* the league page's sections, each opening on its own pane there */
  const page = {'greece-basket-league': 'greece', 'cyprus-division-a': 'cyprus'}[lg];
  $('secs').innerHTML = page && view !== 'method' && view !== 'game' ? SECTIONS.map(([k, t]) => `<a href="/basketball/${page}/#${k}">${t}</a>`).join('') : '';
  $('top').innerHTML = view === 'matches' ? topTiles() : '';
  $('out').innerHTML = RENDER[view]();
}
function fromHash(){
  const m = location.hash.match(/view=(\w+)/), l = location.hash.match(/lg=([\w-]+)/);
  const old = {projections: 'matches', backtest: 'matches', leagues: 'matches'};   // links from the first version
  view = m ? (RENDER[m[1]] ? m[1] : old[m[1]] || 'matches') : 'matches';
  lg = l && LG[l[1]] ? l[1] : (view === 'method' ? 'all' : LIVE.leagues[0].key);
  render();
}
$('sub').innerHTML = (AGE > 8 ? `<span class="stale">Not updated for ${Math.floor(AGE)} hours: estimates and lines may be out of date.</span> · ` : '') + `Updated ${LIVE.updated} (Athens)`;
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
