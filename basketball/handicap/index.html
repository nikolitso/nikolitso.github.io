<script>
const $ = id => document.getElementById(id);
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dayName = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${DAYS[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(2)}`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (x, d=0) => x == null ? '–' : (x*100).toFixed(d) + '%';
const sgn = (x, d=1) => x == null ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
const hc = x => x == null ? '–' : x === 0 ? '0' : sgn(x);    // the home margin: home favourite by 5.5 = +5.5 (user's choice, 14 Nov 2026)

function renderMethod(){

<div class="calc">projected home margin = home edge + home strength − away strength</div>
${E ? `<p>Example: ${esc(E.home)} v ${esc(E.away)} (${dayName(E.date)}): the model had the home side by ${sgn(E.mu)}, a handicap of ${hc(E.mu)}; the books opened at ${hc(E.open)} and closed at ${hc(E.line)}. Final score ${E.hp}–${E.ap}.</p>` : ''}
<h3><span class="num">2</span>The market's view, absences and fatigue</h3>
<p>The same fit run on the books' closing handicaps of earlier games (instead of the results) gives the market's view of each team; the model's margin = 0.69 × results margin + 0.56 × market margin − 0.30. Weights fitted on 2022–25 games of the two leagues (563); on unseen 2025–27 games (190) the miss fell from 12.02 to 11.78 points (Greece 12.60 to 12.41, Cyprus 11.07 to 10.76). The attack/defence Team ratings were tested as a third part and added nothing, so they are left out. The books' closing line itself still missed by less (11.70). The blend is used for the projected score only: against the books (Diff, side, chance, covered) the page uses the model's own view, results + absences + fatigue, because the market part mostly repeats the line (unseen 2025–27, opening line: own view's side covered 56.8%, the blend's 52.6%).</p>
<p>Results alone cannot see who plays. Since 14 Nov 2026 the margin adds each team's line-up change from the <a class="gm" href="/basketball/greece/#str">Team strength</a> model, which values every player from the official box scores and knows who is out (missed the last game, or ruled out by club news, often imports): (the team's average line-up cost in its games so far − the cost of the line-up expected next) × possessions ÷ 100. Players back or a new import count the other way. The value is frozen at tip-off, so a played game keeps what the page showed. Not backtested: there is no line-up history before this season. <b>Fatigue</b> is added the same way, from the league pages' Fatigue factor: a team 2 days after a European game loses 1.9 points, 3 days after 0.9.</p>
<h3><span class="num">3</span>Only after ${GP} games</h3>
<p>An estimate is shown once both teams have played at least <b>${GP} games</b> of the regular season, so that a team's strength rests on enough of its own games; before that the number is mostly the league average. Play-off games are left out.</p>
<h3><span class="num">4</span>Against the handicap</h3>
<p>The line is the books' handicap for the home side: the median of each book's main handicap (the one it prices closest to evens), at the opening and at the latest or closing line. The <b>model's side</b> is the home team when the projected margin is above the line, the away team when below; <b>Diff</b> is the gap in points. The <b>chance</b> that side covers assumes the final margin falls around the projection with the league's usual miss: about ${f1(sdG)} points in Greece and ${f1(sdC)} in Cyprus.</p>
<div class="calc">chance the home side covers = P(margin &gt; line), margin ~ Normal(projection, league miss)</div>
<h3><span class="num">5</span>Projected total and points</h3>
<p>Each match page also projects the total: the <a class="gm" href="/basketball/overs/#view=method">totals page</a>'s model (league average plus both teams' scoring numbers), plus pace and 3-point luck, with each league's own weights fitted on its 2022–26 games: Greece +0.45 points per possession of pace above the league average and −0.51 per point of 3-point luck; Cyprus +1.63 and −0.13 (hot shooting tends to cool). Fitted on 2022–25 alone, they cut the miss on unseen 2025–27 games from 18.38 to 18.30 points in Greece and from 16.56 to 16.30 in Cyprus. Each side's points = (total ± margin) ÷ 2.</p>
<h3><span class="num">6</span>Live test: the 2026–27 season</h3>
<p>The model is frozen from 14 Nov 2026 for the rest of the season: results margin + absences + fatigue against the books' line, settings and weights as on this page, no tuning. Every game is judged at the opening and the closing handicap in <b>Played this season</b> and the tiles above it. Prices are about 1.87, so the model's side needs to cover about 53.5% of games to make a profit; the season, not this page's history, decides whether it does.</p>
<h3><span class="num">7</span>Match by match</h3>
<p>Click any match for its full calculation: the home edge, each team's games behind its strength, the projected margin, the line and the chance. The page shows estimates only: no picks and no betting record. <b>Played this season</b> keeps every game's estimate as it stood before tip-off, worked out from the games before that day, with the result and whether the model's side covered at the opening and the closing handicap. The model sees news through the absences step only (missed last game, or club news added by hand); anything else counts once it shows up in results or the lines.</p>
<h3><span class="num">8</span>Data</h3>
<p>Results and handicaps for the two leagues of the <a class="gm" href="/basketball/">basketball projections</a>, the Greek Basket League and Cyprus Division A. The model's settings were fitted once on 2021–22 results of 43 leagues, since two leagues alone give too few games to set them. The page refreshes every hour or so.</p>
</div>`;
}
