<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Greek wine and food pairing: choose a dish, an ingredient or a grape and find the wines that suit it. 950+ Greek wines from 110+ estates, in English and Greek.">
<link rel="canonical" href="https://antonisnikolitsopoulos.com/wine/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Greek Wine &amp; Food Pairing Finder">
<meta property="og:description" content="Choose a dish, an ingredient or a grape and find the Greek wines that suit it.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://antonisnikolitsopoulos.com/wine/">
<meta property="og:image" content="https://antonisnikolitsopoulos.com/wine.jpg">
<title>Greek Wine &amp; Food Pairing Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500;700&family=Playfair+Display:wght@500;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#150a0d; --bg2:#1c0e12; --panel:rgba(255,246,232,.045); --panel2:rgba(255,246,232,.07);
  --line:rgba(226,196,150,.16); --line2:rgba(226,196,150,.34);
  --cream:#f6ecdb; --text:#eadfcd; --muted:#bba998; --gold:#d6b066; --gold2:#e8cb8f;
  --wine:#7d2236; --wine2:#5c1627; --white:#e9d98d; --rose:#e79aa6; --red:#b13a52;
  --display:"Playfair Display","Noto Serif",Georgia,serif; --body:"Source Serif 4","Noto Serif",Georgia,serif;
  --label:600 11px/1.2 "Source Serif 4","Noto Serif",Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.65 var(--body);-webkit-font-smoothing:antialiased}
::selection{background:var(--wine);color:var(--cream)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
/* wine glow, a faint grape cluster, and a soft vignette behind everything */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 55% at 100% -5%,rgba(125,34,54,.42),transparent 70%),
             radial-gradient(60% 50% at -5% 105%,rgba(92,22,39,.38),transparent 70%),
             radial-gradient(90% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.35))}
.wrap{position:relative;max-width:1000px;margin:0 auto;padding:0 20px 96px}
header{padding:44px 0 30px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px 16px;flex-wrap:wrap}
@media(max-width:1020px){.brand .kicker{display:none}}
@media(max-width:760px){.top{display:grid;grid-template-columns:auto 1fr auto;}.top .views{grid-column:1/-1;grid-row:2;width:100%}.top .lang{grid-column:3;grid-row:1}}
.brand{display:flex;align-items:center;gap:14px}
.logo{display:block;line-height:0;flex:none;transition:transform .2s}
.logo:hover{transform:translateY(-2px)}
.logo svg{width:38px;height:44px}
.kicker{font:var(--label);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.lang{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.18)}
.lang button{font:var(--label);letter-spacing:.12em;color:var(--muted);background:transparent;border:0;padding:8px 14px;cursor:pointer;transition:color .2s}
.lang button:hover{color:var(--cream)}
.lang button.on{background:linear-gradient(180deg,var(--wine),var(--wine2));color:var(--cream)}
.views{scrollbar-width:none;display:flex;gap:6px;margin:0;padding:5px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;width:max-content;max-width:100%;overflow-x:auto}
.views button{font:var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:11px 18px;cursor:pointer;white-space:nowrap;transition:color .2s,background .2s}
.views button:hover{color:var(--cream)}
.views button.on{color:var(--cream);background:linear-gradient(180deg,var(--wine),var(--wine2));box-shadow:0 0 0 1px var(--gold) inset}
h1{font:700 clamp(36px,6.4vw,60px)/1.08 var(--display);color:var(--cream);margin:30px 0 14px;letter-spacing:-.01em}
h1::after{content:"";display:block;width:64px;height:2px;margin-top:18px;background:linear-gradient(90deg,var(--gold),transparent)}
.lede{color:var(--text);opacity:.82;max-width:640px;margin:0;font-size:19px}
.search{margin:30px 0 8px;position:relative}
.search input{width:100%;padding:17px 20px 17px 52px;font:inherit;font-size:19px;color:var(--cream);background:rgba(0,0,0,.28);
  border:1px solid var(--line2);border-radius:14px;outline:none;transition:border-color .2s,box-shadow .2s;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='%23d6b066' stroke-width='1.8' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-4-4'/></svg>");
  background-repeat:no-repeat;background-position:18px center}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(214,176,102,.14)}
.chips-label{font:var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:24px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.collapsed{max-height:92px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
.chips-toggle{background:none;border:0;color:var(--gold);font:500 15px var(--body);cursor:pointer;padding:8px 0 0;text-decoration:underline;text-decoration-color:rgba(214,176,102,.5);text-underline-offset:4px}
.chips-toggle:hover{color:var(--gold2)}
.chip{font:500 15px/1.2 var(--body);color:var(--text);background:var(--panel);border:1px solid var(--line);
  padding:9px 15px;border-radius:999px;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.chip:hover{border-color:var(--gold);color:var(--cream)}
.chip.on{background:linear-gradient(180deg,var(--wine),var(--wine2));color:var(--cream);border-color:var(--gold)}
main{margin-top:14px}
h2{font:500 clamp(26px,4vw,32px)/1.2 var(--display);color:var(--cream);margin:52px 0 6px}
.count{font:var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:18px;margin-top:20px}
.card{background:linear-gradient(180deg,rgba(255,246,232,.06),rgba(255,246,232,.025));border:1px solid var(--line);border-radius:16px;padding:24px 26px;
  box-shadow:0 14px 34px rgba(0,0,0,.28);transition:border-color .2s}
.card:hover{border-color:var(--line2)}
.card h3{font:700 22px/1.3 var(--display);color:var(--cream);margin:0 0 6px}
.meta{font:400 14px/1.5 var(--body);color:var(--muted);letter-spacing:.01em}
.grape{margin:14px 0 6px}
.grape b{color:var(--gold2);font-weight:600}
.why{margin:0 0 12px;color:var(--text)}
.labels{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.labels li{display:flex;gap:11px;align-items:baseline;font-size:16.5px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted);transform:translateY(-1px);box-shadow:0 0 0 3px rgba(255,255,255,.05)}
.dot.White{background:var(--white)}.dot.Rosé{background:var(--rose)}.dot.Red{background:var(--red)}
.more{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.more b{display:block;font:var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.wine .notes{margin:12px 0 0;font-size:17px;color:var(--text)}
.wine dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:16.5px}
.wine dt{font:var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);padding-top:6px}
.wine dd{margin:0;color:var(--text)}
.also{color:var(--muted)}
.empty{color:var(--muted);padding:34px 0}
.profile{border-color:var(--line2);background:linear-gradient(180deg,rgba(125,34,54,.22),rgba(255,246,232,.03))}
.profile h3{font-size:30px}
.profile .tagline{margin:8px 0 18px;color:var(--text);font-size:18px}
.profile ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.profile li{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:4px 18px;font-size:16.5px}
.profile li b{font:var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding-top:6px}
@media(max-width:560px){.profile li{grid-template-columns:1fr}}
[hidden]{display:none!important}
.mapwrap{position:relative;width:min(1240px,calc(100vw - 56px));left:50%;transform:translateX(-50%);margin:28px 0 0}
.gmap{width:100%;height:auto;display:block;filter:drop-shadow(0 12px 30px rgba(0,0,0,.35))}
.gmap .lbl{fill:var(--cream);font:600 10.5px var(--body);paint-order:stroke;stroke:#1a0d0f;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.gmap .pt.on + .lbl{fill:var(--gold2)}
@media(max-width:640px){.gmap .lbl{display:none}.gmap .pt text{font-size:12px}}
.gmap .land{fill:rgba(255,246,232,.07);stroke:rgba(226,196,150,.38);stroke-width:1.4;stroke-linejoin:round}
.gmap .pt{cursor:pointer}
.gmap .empty circle{fill:transparent;stroke:rgba(226,196,150,.5);stroke-width:1.2;stroke-dasharray:3 2}
.gmap .empty{cursor:default}
.mapinfo .legend{font-size:15px;opacity:.7;margin-top:14px}
.gmap .pt circle{fill:var(--wine);stroke:var(--gold);stroke-width:1.6;transition:fill .2s,r .2s}
.gmap .pt:hover circle,.gmap .pt:focus circle{fill:#a23048}
.gmap .pt.on circle{fill:var(--gold);stroke:var(--cream)}
.gmap .pt text{fill:var(--cream);font:600 10px var(--body);text-anchor:middle;pointer-events:none}
.gmap .pt.on text{fill:#1a0d0f}
@media(min-width:900px){.mapinfo{position:absolute;left:0;bottom:0;max-width:34%}}
@media(max-width:899px){.mapinfo{margin-top:18px}}
.mapinfo h3{font:700 clamp(24px,3.4vw,32px)/1.2 var(--display);color:var(--cream);margin:0 0 8px}
.mapinfo p{margin:0 0 14px;color:var(--text);opacity:.85}
.mapinfo button{font:500 15px var(--body);color:var(--gold);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(214,176,102,.5);text-underline-offset:4px}
.pills{display:grid;gap:14px;margin-top:24px}
@media(min-width:780px){.pills{grid-template-columns:1fr 1fr}}
.pill{background:linear-gradient(180deg,rgba(255,246,232,.06),rgba(255,246,232,.025));border:1px solid var(--line);border-radius:26px;transition:border-color .2s,box-shadow .2s;box-shadow:0 10px 26px rgba(0,0,0,.24)}
.pill:hover{border-color:var(--line2)}
.pill[open]{grid-column:1/-1;border-color:var(--gold);border-radius:22px}
.pill summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;padding:20px 26px}
.pill summary::-webkit-details-marker{display:none}
.rank{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;margin-right:10px;border-radius:50%;background:linear-gradient(180deg,var(--wine),var(--wine2));box-shadow:0 0 0 1px var(--gold) inset;color:var(--cream);font:600 13px/1 var(--body);vertical-align:2px}
.fav-title{margin-top:30px}
.pill-name{display:block;font:700 21px/1.3 var(--display);color:var(--cream)}
.pill-top{grid-column:1;display:flex;gap:11px;align-items:baseline;font-size:16.5px;color:var(--text)}
.pill-top b{font-weight:600;color:var(--cream)}
.pill-top small{display:block;color:var(--muted);font:400 14px var(--body)}
.pill-plus{grid-column:2;grid-row:1/3;width:32px;height:32px;border:1px solid var(--line2);border-radius:50%;position:relative}
.pill-plus::before,.pill-plus::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.5px;background:var(--gold);transform:translate(-50%,-50%)}
.pill-plus::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .2s}
.pill[open] .pill-plus::after{transform:translate(-50%,-50%) rotate(0)}
.pill-body{padding:6px 26px 26px;border-top:1px solid var(--line)}
.pill-body .meta{margin:14px 0 6px}
.pill-body ul{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:20px}
.pill-body li{display:grid;grid-template-columns:auto 1fr;gap:3px 11px;align-items:baseline;font-size:17px}
.pill-body li small{grid-column:2;color:var(--muted);font:400 14px var(--body)}
.pill-body li p{grid-column:2;margin:3px 0 0;font-size:16px;color:var(--text);opacity:.9}
@media(min-width:900px){.pill-body ul{grid-template-columns:1fr 1fr;gap:22px 40px}}
.lrow{display:grid;grid-template-columns:minmax(190px,1.1fr) 2fr 1.4fr;gap:8px 28px;padding:22px 0;border-bottom:1px solid var(--line)}
.lrow h3{font:700 20px/1.3 var(--display);color:var(--cream);margin:0 0 6px}
.lrow .lcol{font-size:16.5px;color:var(--text)}
.lrow .lcol b{display:block;font:var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.lrow .lcol.also{color:var(--muted)}
@media(max-width:780px){.lrow{grid-template-columns:1fr}}
a.wl{color:var(--cream);text-decoration:underline;text-decoration-color:rgba(214,176,102,.6);text-decoration-thickness:1px;text-underline-offset:4px;cursor:pointer;transition:text-decoration-color .2s,color .2s}
a.wl:hover{color:var(--gold2);text-decoration-color:var(--gold)}
.site{font-size:14px}
footer{margin-top:72px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font:400 14px var(--body)}
@media(min-width:780px){.grid.two{grid-template-columns:1fr 1fr}}

/* illustrations: hero landscape, bottle icons, dish icons */
.hero{margin:18px 0 22px;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 50px -28px #000;line-height:0}
.hero svg{display:block;width:100%;height:auto;max-height:240px}
.hero.sm svg{max-height:120px}
.bt{flex:none;width:14px;height:32px}
.lrow h3,.card.wine h3{display:flex;align-items:center;gap:10px}
.lrow h3 a{flex:1;min-width:0}
.ic{width:30px;height:30px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.chead{display:flex;gap:14px;align-items:flex-start}
.chead h3{margin-top:0}
.chead .ic{margin-top:2px}
@media(max-width:560px){.hero svg{max-height:120px}}

/* seasonal opening */
.season{margin:6px 0 34px;border:1px solid var(--line2);border-radius:20px;padding:30px 30px 26px;background:linear-gradient(135deg,rgba(125,34,54,.34),rgba(255,246,232,.04) 60%);box-shadow:0 24px 60px -34px #000}
.season .skick{display:flex;align-items:center;gap:10px;font:var(--label);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.season .skick svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.season h2{font:700 clamp(28px,5vw,40px)/1.15 var(--display);color:var(--cream);margin:10px 0 8px}
.season .slede{max-width:62ch;color:var(--text);margin:0 0 22px}
.season .spicks{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.season .spick{background:rgba(10,4,6,.35);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.season .spick .sw{font:var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.season .spick h3{display:flex;gap:10px;align-items:center;font:700 19px/1.3 var(--display);color:var(--cream);margin:0 0 4px}
.season .spick .meta{font-size:15px}
.season .sdishes{margin-top:18px;font-size:16px;color:var(--muted)}
.season .sdishes b{font:var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-right:8px}

.season .stitle{font:var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:26px 0 12px}
.season .spick .sw{display:flex;align-items:center;gap:10px}
.season .rank{display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,var(--wine),var(--wine2));border:1px solid var(--gold);color:var(--cream);font:700 12px var(--display);letter-spacing:0}
.season .stwo{display:grid;gap:8px 40px;grid-template-columns:1fr 1fr}
@media(max-width:760px){.season .stwo{grid-template-columns:1fr}}
.season .slist{list-style:none;margin:0;padding:0}
.season .slist li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.season .slist li:last-child{border-bottom:0}
.season .slist small{display:block;color:var(--muted);font-size:14.5px;line-height:1.4}
.season .stwo > div:first-child .slist{margin-top:0}

.season .slist.big{display:grid;grid-template-columns:1fr 1fr;gap:0 44px}
@media(max-width:760px){.season .slist.big{grid-template-columns:1fr}}
.season .slist.big li{padding:14px 0}
.season .slist .dish{font:700 19px/1.3 var(--display);color:var(--cream)}
.season .pw{display:flex;gap:10px;align-items:center;margin-top:5px}
.season .pw .bt{width:11px;height:26px}
.season .pw a{font-size:16.5px}
.season .pr{flex:1;min-width:0}
@media(max-width:560px){.views{width:100%;overflow:visible}.views button{flex:1;white-space:normal;text-align:center;padding:10px 6px;font-size:10px;letter-spacing:.08em;line-height:1.3}body{font-size:17px}.wrap{padding:0 16px 80px}.card{padding:20px}.pill summary{padding:18px 20px}.pill-body{padding:4px 20px 22px}}
</style>
</head>

<div class="wrap">
<header>
  <div class="top">
    <div class="brand"><a class="logo" href="/wine/" aria-label="Greek Wine &amp; Food Pairing: start page"><svg viewBox="0 0 44 50" aria-hidden="true"><path d="M22 3c0 5 1 8 0 12" stroke="#d6b066" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M23 9c5-6 12-6 17-2-4 6-11 7-17 2z" fill="#6f8f3c" stroke="#d6b066" stroke-width="1"/><g fill="#7d2236" stroke="#d6b066" stroke-width="1.2"><circle cx="11" cy="19" r="5.2"/><circle cx="22" cy="19" r="5.2"/><circle cx="33" cy="19" r="5.2"/><circle cx="16.500" cy="28" r="5.2"/><circle cx="27.500" cy="28" r="5.2"/><circle cx="22" cy="37" r="5.2"/></g><circle cx="22" cy="44" r="3.600" fill="#7d2236" stroke="#d6b066" stroke-width="1.200"/><g fill="#fff" fill-opacity=".28"><circle cx="9.500" cy="17" r="1.400"/><circle cx="20.500" cy="17" r="1.400"/><circle cx="31.500" cy="17" r="1.400"/><circle cx="15" cy="26" r="1.400"/><circle cx="26" cy="26" r="1.400"/><circle cx="20.500" cy="35" r="1.400"/></g></svg></a><div class="kicker" id="kicker"></div></div>

      <button type="button" data-lang="en">EN</button><button type="button" data-lang="el">ΕΛ</button>

  </div>
  <div class="hero" id="hero" aria-hidden="true"></div>
  <div id="season"></div>

  <div class="search"><input id="q" type="search" autocomplete="off"></div>
  <div id="finderChips">
    <div class="chips-label" id="catsLabel"></div><div class="chips" id="cats"></div>
    <div class="chips-label" id="tagsLabel"></div><div class="chips" id="tags"></div>
    <div class="chips-label" id="grapesLabel"></div><div class="chips" id="grapes"></div>

function seasonHtml() {
  const mi = monthIndex(), S = MONTHS[mi], now = new Date(), week = Math.floor((now - new Date(now.getFullYear(), 0, 1)) / 6048e5);
  const hash = id => { let h = week * 31 + mi * 101; for (const c of id) h = (h * 33 + c.charCodeAt(0)) % 9973; return h; };

  const dishPool = ALLR.filter(r => S.cats.includes(r.category) && inSeason(r, mi + 1))

    const id = ids.find(x => !usedW.has(x)) || ids[0];

    if (!state.cat) html += section(t('wines'), ws, wineCard, true);
    if (!html) html = `<p class="empty">${esc(t('none'))}</p>`;
  }
  document.getElementById('out').innerHTML = html;
  chips(document.getElementById('cats'), cats, 'cat', c => lang === 'el' ? catEl[c] : c, true);
  chips(document.getElementById('tags'), tags, 'tag', x => lang === 'el' ? tagEl[x] : x, true, true);
  chips(document.getElementById('grapes'), G.map(g => g.key), 'grape', k => lang === 'el' ? gByKey[k].el_name : k, true, true);
}

document.addEventListener('toggle', e => { const d = e.target.closest && e.target.closest('details.pill'); if (d) { d.open ? openEstates.add(d.dataset.w) : openEstates.delete(d.dataset.w); } }, true);
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; state.grape = ''; render(); });
document.addEventListener('click', e => {
  const lg = e.target.closest('.logo');
  if (lg) { e.preventDefault(); view = 'home'; state = {q: '', cat: '', tag: '', grape: '', region: '', colour: '', variety: ''}; document.getElementById('q').value = ''; try { history.replaceState(null, '', '/wine/'); } catch (x) {} render(); window.scrollTo({top: 0, behavior: 'smooth'}); return; }
  const vb = e.target.closest('.views button');
  if (vb) { view = vb.dataset.view; state = {q: '', cat: '', tag: '', grape: '', region: '', colour: ''}; document.getElementById('q').value = ''; try { history.replaceState(null, '', HASH[view]); } catch (x) {} render(); return; }
  const pt = e.target.closest('.gmap .pt:not(.empty)');
  if (pt) { state.region = state.region === pt.dataset.region ? '' : pt.dataset.region; render(); const tgt = document.querySelector('.pills'); if (state.region && tgt) tgt.scrollIntoView({behavior: 'smooth', block: 'start'}); return; }
  if (e.target.closest('[data-mapclear]')) { state.region = ''; render(); return; }
  const ct = e.target.closest('.chips-toggle');
  if (ct) { const id = ct.dataset.for; expandedRows.has(id) ? expandedRows.delete(id) : expandedRows.add(id); render(); return; }
  const lb = e.target.closest('.lang button');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('wine-lang', lang); } catch (x) {} render(); return; }
  const c = e.target.closest('.chip');
  if (c) {
    const {k, v} = c.dataset, on = state[k] === v;
    if (k === 'grape') { state = {q: '', cat: '', tag: '', grape: on ? '' : v, region: '', colour: ''}; document.getElementById('q').value = ''; }
    else { state[k] = on ? '' : v; state.grape = ''; }
    render(); return;
  }
  const rl = e.target.closest('a.rl');
  if (rl) {
    const r = ALLR.find(x => x.name === rl.dataset.dish), nm = L(r, 'name');
    view = 'finder'; state = {q: nm, cat: '', tag: '', grape: '', region: '', colour: ''}; document.getElementById('q').value = nm; render();
    window.scrollTo({top: 0, behavior: 'smooth'}); return;
  }
  const a = e.target.closest('a.wl');
  if (a) {
    const w = byId[a.dataset.wine];
    view = 'finder'; try { history.replaceState(null, '', '#finder'); } catch (x) {}
    const nm = lang === 'el' ? w.el.name : w.wine;
    state = {q: nm, cat: '', tag: '', grape: '', region: '', colour: ''}; document.getElementById('q').value = nm; render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
});
render();
document.addEventListener('keydown', e => { const g = e.target.closest && e.target.closest('.gmap .pt'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', {bubbles: true})); } });
</script>
</body>
