<title>Pairing Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Mono:wght@400;500&family=Noto+Serif:wght@500;700&family=Playfair+Display:wght@500;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d0c; --panel:#171513; --line:#2c2823; --cream:#f1e8d6; --muted:#a79d8a;
  --gold:#c9a24b; --white:#d9c97a; --rose:#d98a8f; --red:#9a2d3b;
  --display:"Playfair Display","Noto Serif",Georgia,serif; --mono:"IBM Plex Mono","Noto Sans Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:17px/1.55 "Source Serif 4",Georgia,serif}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 80px}
header{padding:40px 0 28px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kicker{font:500 12px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:500 12px var(--mono);letter-spacing:.1em;color:var(--muted);background:transparent;border:0;padding:6px 12px;cursor:pointer}
.lang button.on{background:var(--gold);color:#17120a}
h1{font:700 clamp(34px,6vw,56px)/1.05 var(--display);margin:14px 0 12px}
.lede{color:var(--muted);max-width:620px;margin:0}
.search{margin:28px 0 18px}
.search input{width:100%;padding:16px 18px;font:inherit;font-size:19px;color:var(--cream);background:var(--panel);
  border:1px solid var(--line);border-radius:4px;outline:none}
.search input:focus{border-color:var(--gold)}
.chips-label{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px var(--mono);color:var(--cream);background:transparent;border:1px solid var(--line);
  padding:6px 12px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);color:#17120a;border-color:var(--gold)}
h2{font:500 26px var(--display);margin:40px 0 4px}
.count{font:400 12px var(--mono);color:var(--muted);letter-spacing:.08em}
.grid{display:grid;gap:14px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px 20px}
.card h3{font:700 20px/1.25 var(--display);margin:0 0 4px}
.meta{font:400 12px var(--mono);color:var(--muted);letter-spacing:.04em}
.grape{margin:12px 0 4px}
.grape b{color:var(--gold);font-weight:600}
.why{margin:0 0 10px;color:#d8cfbd}
.labels{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.labels li{display:flex;gap:10px;align-items:baseline;font-size:15.5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted);transform:translateY(-1px)}
.dot.White{background:var(--white)}.dot.Rosé{background:var(--rose)}.dot.Red{background:var(--red)}
.tag{font:400 11px var(--mono);color:var(--muted);border:1px dashed var(--line);padding:1px 6px;border-radius:3px;white-space:nowrap}
.wine .notes{margin:10px 0 0;font-size:15.5px;color:#d8cfbd}
.wine dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.wine dt{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding-top:3px}
.wine dd{margin:0;color:#d8cfbd}
.also{color:var(--muted)}
.empty{color:var(--muted);padding:30px 0}
a.wl{color:var(--cream);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px;cursor:pointer}
footer{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font:400 12px var(--mono)}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <div class="kicker" id="kicker"></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="el">ΕΛ</button>
    </div>
  </div>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <div class="search"><input id="q" type="search" autocomplete="off"></div>
  <div class="chips-label" id="catsLabel"></div><div class="chips" id="cats"></div>
  <div class="chips-label" id="tagsLabel"></div><div class="chips" id="tags"></div>
</header>
<main id="out"></main>
<footer id="foot"></footer>
</div>

const UI = {
  en: {
    docTitle: 'Pairing Finder', kicker: 'Greek wine · Food pairing', title: 'The Pairing Finder',
    lede: 'Choose a dish, an ingredient or a type of food. The page returns the grape that suits it best, and the bottles that fit.',
    placeholder: 'Try moussaka, octopus, lamb, feta, tomato…', cats: 'Dish type', tags: 'Food or occasion',
    begin: 'Where to begin', beginText: (r, w) => `Pick a chip above, or type a dish. ${r} dishes and ${w} wines are loaded.`,
    allDishes: 'All dishes', dishes: 'Dishes', wines: 'Wines', result: 'result', results: 'results',
    none: 'No match yet. Try a simpler word, such as the main ingredient.',
    bestGrape: 'Best grape', alt: 'alternative', notListed: 'not in the list yet',
    pairs: 'Pairs with', also: 'Also try',
    foot: (w, r, t) => `${w} wines · ${r} dishes · ${t} food categories`,
  },
  el: {
    docTitle: 'Οδηγός Ταιριάσματος', kicker: 'Ελληνικό κρασί · Κρασί και φαγητό', title: 'Ο Οδηγός Ταιριάσματος',
    lede: 'Επιλέξτε ένα πιάτο, ένα υλικό ή ένα είδος φαγητού. Η σελίδα προτείνει την ποικιλία που ταιριάζει καλύτερα και τα μπουκάλια που της πάνε.',
    placeholder: 'Δοκιμάστε μουσακά, χταπόδι, αρνί, φέτα, ντομάτα…', cats: 'Είδος πιάτου', tags: 'Φαγητό ή περίσταση',
    begin: 'Από πού να ξεκινήσετε', beginText: (r, w) => `Επιλέξτε ένα κουμπί παραπάνω ή γράψτε ένα πιάτο. Φορτώθηκαν ${r} πιάτα και ${w} κρασιά.`,
    allDishes: 'Όλα τα πιάτα', dishes: 'Πιάτα', wines: 'Κρασιά', result: 'αποτέλεσμα', results: 'αποτελέσματα',
    none: 'Δεν βρέθηκε αντιστοιχία. Δοκιμάστε μια απλούστερη λέξη, όπως το κύριο υλικό.',
    bestGrape: 'Καλύτερη ποικιλία', alt: 'εναλλακτικά', notListed: 'δεν υπάρχει ακόμη στη λίστα',
    pairs: 'Ταιριάζει με', also: 'Δοκιμάστε επίσης',
    foot: (w, r, t) => `${w} κρασιά · ${r} πιάτα · ${t} κατηγορίες φαγητού`,
  },
};

let lang = 'en';
try {
  const q = new URLSearchParams(location.search).get('lang'), s = localStorage.getItem('wine-lang');
  lang = q === 'el' || q === 'en' ? q : s === 'el' || s === 'en' ? s : (navigator.language || '').toLowerCase().startsWith('el') ? 'el' : 'en';
} catch (e) {}
const t = k => UI[lang][k];
const L = (o, k) => lang === 'el' && o.el && o.el[k] !== undefined ? o.el[k] : o[k];

// accent-, case- and final-sigma-insensitive, so Greek and English both match
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ς/g, 'σ');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const cats = [...new Set(R.map(r => r.category))];
const catEl = Object.fromEntries(R.map(r => [r.category, r.el.category]));
const tagCount = {}, tagEl = {};
W.forEach(w => w.tags.forEach((x, i) => { tagCount[x] = (tagCount[x] || 0) + 1; tagEl[x] = w.el.tags[i]; }));
const tags = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a] || a.localeCompare(b));
let state = {q: '', cat: '', tag: ''};

const colourKey = w => w.colour.startsWith('Red') ? 'Red' : w.colour.startsWith('Ros') ? 'Rosé' : 'White';
const wineText = w => norm([w.wine, w.winery, w.grapes, w.colour, w.pairs, w.also, w.tags.join(' '),
  w.el.grapes, w.el.colour, w.el.pairs, w.el.also, w.el.tags.join(' ')].join(' '));
const recipeText = r => norm([r.name, r.category, r.ingredients, r.grape, r.alt,
  r.el.name, r.el.category, r.el.ingredients, r.el.grape, r.el.alt].join(' '));

function chips(el, items, key, label) {
  el.innerHTML = items.map(i => `<button class="chip${state[key] === i ? ' on' : ''}" data-k="${key}" data-v="${esc(i)}">${esc(label(i))}</button>`).join('');
}
function labelHtml(l) {
  const w = byId[l.name];
  if (!l.listed || !w) return `<li><span class="dot"></span><span>${esc(l.name)} <span class="tag">${esc(t('notListed'))}</span></span></li>`;
  return `<li><span class="dot ${colourKey(w)}"></span><a class="wl" data-wine="${esc(w.id)}">${esc(l.name)}</a></li>`;
}
function recipeCard(r) {
  const alt = L(r, 'alt');
  return `<article class="card"><h3>${esc(L(r, 'name'))}</h3>
    <div class="meta">${esc(L(r, 'category'))} · ${esc(L(r, 'ingredients'))}</div>
    <p class="grape">${esc(t('bestGrape'))}: <b>${esc(L(r, 'grape'))}</b>${alt ? ` <span class="also">· ${esc(t('alt'))}: ${esc(alt)}</span>` : ''}</p>
    <p class="why">${esc(L(r, 'why'))}.</p><ul class="labels">${r.labels.map(labelHtml).join('')}</ul></article>`;
}
function wineCard(w) {
  const also = L(w, 'also'), pairs = L(w, 'pairs');
  return `<article class="card wine">
    <h3>${esc(w.wine)}</h3>
    <div class="meta"><span class="dot ${colourKey(w)}" style="display:inline-block"></span> ${esc(w.winery)} · ${esc(L(w, 'colour'))} · ${esc(L(w, 'grapes'))}${w.vintage ? ' · ' + esc(w.vintage) : ''}</div>
    ${(L(w, 'nose') + L(w, 'palate')).trim() ? `<p class="notes">${esc(L(w, 'nose'))} ${esc(L(w, 'palate'))}</p>` : ''}
    <dl>${pairs ? `<dt>${esc(t('pairs'))}</dt><dd>${esc(pairs)}</dd>` : ''}${also ? `<dt>${esc(t('also'))}</dt><dd class="also">${esc(also)}</dd>` : ''}</dl></article>`;
}
function section(title, items, render, two) {
  if (!items.length) return '';
  return `<h2>${esc(title)}</h2><div class="count">${items.length} ${items.length === 1 ? t('result') : t('results')}</div>
    <div class="grid${two ? ' two' : ''}">${items.map(render).join('')}</div>`;
}

function render() {
  document.documentElement.lang = lang;
  document.title = t('docTitle');
  document.getElementById('kicker').textContent = t('kicker');
  document.getElementById('title').textContent = t('title');
  document.getElementById('lede').textContent = t('lede');
  document.getElementById('q').placeholder = t('placeholder');
  document.getElementById('catsLabel').textContent = t('cats');
  document.getElementById('tagsLabel').textContent = t('tags');
  document.getElementById('foot').textContent = t('foot')(W.length, R.length, tags.length);
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));

  const terms = norm(state.q.trim()).split(/\s+/).filter(Boolean);
  const all = tx => terms.every(x => tx.includes(x));
  let rs = R, ws = W;
  if (state.cat) rs = rs.filter(r => r.category === state.cat);
  if (state.tag) ws = ws.filter(w => w.tags.includes(state.tag));
  if (terms.length) { rs = rs.filter(r => all(recipeText(r))); ws = ws.filter(w => all(wineText(w))); }
  let html = '';
  if (!(state.q.trim() || state.cat || state.tag)) {
    html = `<h2>${esc(t('begin'))}</h2><p class="lede">${esc(t('beginText')(R.length, W.length))}</p>` + section(t('allDishes'), R, recipeCard, true);
  } else {
    // a dish-type chip shows dishes only; a food chip shows wines only; free text shows both
    if (!state.tag) html += section(t('dishes'), rs, recipeCard, true);
    if (!state.cat) html += section(t('wines'), ws, wineCard, true);
    if (!html) html = `<p class="empty">${esc(t('none'))}</p>`;
  }
  document.getElementById('out').innerHTML = html;
  chips(document.getElementById('cats'), cats, 'cat', c => lang === 'el' ? catEl[c] : c);
  chips(document.getElementById('tags'), tags, 'tag', x => lang === 'el' ? tagEl[x] : x);
}

document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
document.addEventListener('click', e => {
  const lb = e.target.closest('.lang button');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('wine-lang', lang); } catch (x) {} render(); return; }
  const c = e.target.closest('.chip');
  if (c) { const {k, v} = c.dataset; state[k] = state[k] === v ? '' : v; render(); return; }
  const a = e.target.closest('a.wl');
  if (a) {
    const w = byId[a.dataset.wine];
    state = {q: w.wine, cat: '', tag: ''}; document.getElementById('q').value = w.wine; render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
});
render();
</script>
</body>
</html>
