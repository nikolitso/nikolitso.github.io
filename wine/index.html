<style>
:root{
  --bg:#0e0d0c; --panel:#171513; --line:#2c2823; --cream:#f1e8d6; --muted:#a79d8a;
  --gold:#c9a24b; --white:#d9c97a; --rose:#d98a8f; --red:#9a2d3b;
  --display:"Playfair Display","Noto Serif",Georgia,serif; --mono:"IBM Plex Mono","Noto Sans Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:17px/1.55 "Source Serif 4",Georgia,serif}
/* wine-red glow and a faint grape cluster behind everything */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 50% at 100% 0%,rgba(122,31,52,.30),transparent 70%),
             radial-gradient(55% 45% at 0% 100%,rgba(90,24,40,.24),transparent 70%),
             url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 520'><g fill='%237a1f34' fill-opacity='.22' stroke='%23c9a24b' stroke-opacity='.11' stroke-width='1.5'><circle cx='80' cy='130' r='31'/><circle cx='140' cy='130' r='31'/><circle cx='200' cy='130' r='31'/><circle cx='260' cy='130' r='31'/><circle cx='320' cy='130' r='31'/><circle cx='110' cy='190' r='31'/><circle cx='170' cy='190' r='31'/><circle cx='230' cy='190' r='31'/><circle cx='290' cy='190' r='31'/><circle cx='140' cy='250' r='31'/><circle cx='200' cy='250' r='31'/><circle cx='260' cy='250' r='31'/><circle cx='170' cy='310' r='31'/><circle cx='230' cy='310' r='31'/><circle cx='200' cy='370' r='31'/></g><path d='M200 20 C200 50 205 70 200 100' stroke='%23c9a24b' stroke-opacity='.22' stroke-width='5' fill='none'/><path d='M205 60 C250 20 300 30 335 62 C300 92 250 97 205 60Z' fill='%23c9a24b' fill-opacity='.09'/></svg>") no-repeat right -30px top 24px/min(460px,58vw) auto}
.wrap{position:relative}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 80px}
header{padding:40px 0 28px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kicker{font:500 12px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:500 12px var(--mono);letter-spacing:.1em;color:var(--muted);background:transparent;border:0;padding:6px 12px;cursor:pointer}
.lang button.on{background:var(--gold);color:#17120a}
h1{font:700 clamp(34px,6vw,56px)/1.05 var(--display);margin:14px 0 12px}
.lede{color:var(--muted);max-width:620px;margin:0}
.search{margin:28px 0 18px}
.search input{width:100%;padding:16px 18px;font:inherit;font-size:19px;color:var(--cream);background:var(--panel);
  border:1px solid var(--line);border-radius:4px;outline:none}
.search input:focus{border-color:var(--gold)}
.chips-label{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px var(--mono);color:var(--cream);background:transparent;border:1px solid var(--line);
  padding:6px 12px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);color:#17120a;border-color:var(--gold)}
h2{font:500 26px var(--display);margin:40px 0 4px}
.count{font:400 12px var(--mono);color:var(--muted);letter-spacing:.08em}
.grid{display:grid;gap:14px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px 20px}
.card h3{font:700 20px/1.25 var(--display);margin:0 0 4px}
.meta{font:400 12px var(--mono);color:var(--muted);letter-spacing:.04em}
.grape{margin:12px 0 4px}
.grape b{color:var(--gold);font-weight:600}
.why{margin:0 0 10px;color:#d8cfbd}
.labels{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.labels li{display:flex;gap:10px;align-items:baseline;font-size:15.5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted);transform:translateY(-1px)}
.dot.White{background:var(--white)}.dot.Rosé{background:var(--rose)}.dot.Red{background:var(--red)}
.tag{font:400 11px var(--mono);color:var(--muted);border:1px dashed var(--line);padding:1px 6px;border-radius:3px;white-space:nowrap}
.more{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.more b{display:block;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.wine .notes{margin:10px 0 0;font-size:15.5px;color:#d8cfbd}
.wine dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.wine dt{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding-top:3px}
.wine dd{margin:0;color:#d8cfbd}
.also{color:var(--muted)}
.empty{color:var(--muted);padding:30px 0}
.profile{border-color:var(--gold)}
.profile h3{font-size:26px}
.profile .tagline{margin:6px 0 14px;color:#d8cfbd}
.profile ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.profile li{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:4px 16px;font-size:15.5px}
.profile li b{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding-top:4px}
@media(max-width:560px){.profile li{grid-template-columns:1fr}}
.views{display:flex;gap:22px;margin-top:22px;border-bottom:1px solid var(--line)}
.views button{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 0;margin-bottom:-1px;cursor:pointer}
.views button.on{color:var(--cream);border-bottom-color:var(--gold)}
[hidden]{display:none!important}
.lrow{display:grid;grid-template-columns:minmax(180px,1.1fr) 2fr 1.4fr;gap:6px 24px;padding:16px 0;border-bottom:1px solid var(--line)}
.lrow h3{font:700 18px/1.25 var(--display);margin:0 0 4px}
.lrow .lcol{font-size:15px;color:#d8cfbd}
.lrow .lcol b{display:block;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.lrow .lcol.also{color:var(--muted)}
@media(max-width:760px){.lrow{grid-template-columns:1fr}}
a.wl{color:var(--cream);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px;cursor:pointer}
footer{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font:400 12px var(--mono)}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}
</style>
</head>

  return `<div class="lrow"><div><h3><a class="wl" data-wine="${esc(w.id)}">${esc(L(w, 'name'))}</a></h3>
    <div class="meta"><span class="dot ${colourKey(w)}" style="display:inline-block"></span> ${esc(L(w, 'region'))} · ${esc(L(w, 'colour'))}${L(w, 'grapes') ? ' · ' + esc(L(w, 'grapes')) : ''}${w.vintage ? ' · ' + esc(w.vintage) : ''}</div></div>
    <div class="lcol">${pairs ? `<b>${esc(t('pairs'))}</b>${esc(pairs)}` : ''}</div>
    <div class="lcol also">${also ? `<b>${esc(t('also'))}</b>${esc(also)}` : ''}</div></div>`;
}
function renderList() {
  const terms = norm(state.q.trim()).split(/\s+/).filter(Boolean);
  const ws = W.filter(w => (!state.region || w.region === state.region) && (!state.colour || colourKey(w) === state.colour) && (!state.variety || w.vars.includes(state.variety))
    && terms.every(x => wineText(w).includes(x)));
  if (!ws.length) return `<p class="empty">${esc(t('none'))}</p>`;
  return wineries.map(name => {
    const g = ws.filter(w => w.winery === name);
    return g.length ? `<h2>${esc(lang === 'el' ? wineryEl[name] : name)}</h2><div class="count">${g.length} ${g.length === 1 ? t('wine') : t('winesN')}</div>${g.map(listRow).join('')}` : '';
  }).join('');
}
function section(title, items, render, two) {
  if (!items.length) return '';
  return `<h2>${esc(title)}</h2><div class="count">${items.length} ${items.length === 1 ? t('result') : t('results')}</div>
    <div class="grid${two ? ' two' : ''}">${items.map(render).join('')}</div>`;
}

function render() {
  document.documentElement.lang = lang;
  document.title = t('docTitle');
  document.getElementById('kicker').textContent = t('kicker');
  document.getElementById('title').textContent = view === 'list' ? t('listTitle') : t('title');
  document.getElementById('lede').textContent = view === 'list' ? t('listLede') : t('lede');
  document.querySelectorAll('.views button').forEach(b => { b.textContent = t(b.dataset.view === 'list' ? 'viewList' : 'viewFinder'); b.classList.toggle('on', b.dataset.view === view); });
  document.getElementById('finderChips').hidden = view === 'list';
  document.getElementById('listChips').hidden = view !== 'list';
  document.getElementById('wineryLabel').textContent = t('winery');
  document.getElementById('varietyLabel').textContent = t('grapes');
  document.getElementById('colourLabel').textContent = t('colour');
  document.getElementById('q').placeholder = t('placeholder');
  document.getElementById('catsLabel').textContent = t('cats');
  document.getElementById('tagsLabel').textContent = t('tags');
  document.getElementById('grapesLabel').textContent = t('grapes');
  document.getElementById('foot').textContent = t('foot')(W.length, R.length, tags.length);
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));

  if (view === 'list') {
    document.getElementById('out').innerHTML = renderList();
    chips(document.getElementById('varieties'), varieties, 'variety', v => lang === 'el' ? D.varietyEl[v] : v, true);
    chips(document.getElementById('wineries'), regions, 'region', x => lang === 'el' ? regionEl[x] : x, true);
    chips(document.getElementById('colours'), ['White', 'Rosé', 'Red'], 'colour', c => t('col')[c]);
    return;
  }
  const terms = norm(state.q.trim()).split(/\s+/).filter(Boolean);
  const all = tx => terms.every(x => tx.includes(x));
  let rs = R, ws = W;
  if (state.cat) rs = rs.filter(r => r.category === state.cat);
  if (state.tag) ws = ws.filter(w => w.tags.includes(state.tag));
  if (terms.length) { rs = rs.filter(r => all(recipeText(r))); ws = ws.filter(w => all(wineText(w))); }
  let html = '';
  if (state.grape) {
    const g = gByKey[state.grape], gw = W.filter(w => w.grapes.includes(g.key)), gr = R.filter(r => r.grape.startsWith(g.key));
    html = profileCard(g) + section(t('wines'), gw, wineCard, true) + section(t('bestFor'), gr, recipeCard, true);
  } else if (!(state.q.trim() || state.cat || state.tag)) {
    html = `<h2>${esc(t('begin'))}</h2><p class="lede">${esc(t('beginText')(R.length, W.length))}</p>` + section(t('allDishes'), R, recipeCard, true);
  } else {
    // a dish-type chip shows dishes only; a food chip shows wines only; free text shows both
    if (!state.tag) html += section(t('dishes'), rs, recipeCard, true);
    if (!state.cat) html += section(t('wines'), ws, wineCard, true);
    if (!html) html = `<p class="empty">${esc(t('none'))}</p>`;
  }
  document.getElementById('out').innerHTML = html;
  chips(document.getElementById('cats'), cats, 'cat', c => lang === 'el' ? catEl[c] : c);
  chips(document.getElementById('tags'), tags, 'tag', x => lang === 'el' ? tagEl[x] : x);
  chips(document.getElementById('grapes'), G.map(g => g.key), 'grape', k => lang === 'el' ? gByKey[k].el_name : k, true);
}

document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; state.grape = ''; render(); });
document.addEventListener('click', e => {
  const vb = e.target.closest('.views button');
  if (vb) { view = vb.dataset.view; state = {q: '', cat: '', tag: '', grape: '', region: '', colour: ''}; document.getElementById('q').value = ''; try { history.replaceState(null, '', '#' + view); } catch (x) {} render(); return; }
  const lb = e.target.closest('.lang button');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('wine-lang', lang); } catch (x) {} render(); return; }
  const c = e.target.closest('.chip');
  if (c) {
    const {k, v} = c.dataset, on = state[k] === v;
    if (k === 'grape') { state = {q: '', cat: '', tag: '', grape: on ? '' : v, region: '', colour: ''}; document.getElementById('q').value = ''; }
    else { state[k] = on ? '' : v; state.grape = ''; }
    render(); return;
  }
  const rl = e.target.closest('a.rl');
  if (rl) {
    const r = R.find(x => x.name === rl.dataset.dish), nm = L(r, 'name');
    view = 'finder'; state = {q: nm, cat: '', tag: '', grape: '', region: '', colour: ''}; document.getElementById('q').value = nm; render();
    window.scrollTo({top: 0, behavior: 'smooth'}); return;
  }
  const a = e.target.closest('a.wl');
  if (a) {
    const w = byId[a.dataset.wine];
    view = 'finder'; try { history.replaceState(null, '', '#finder'); } catch (x) {}
    const nm = lang === 'el' ? w.el.name : w.wine;
    state = {q: nm, cat: '', tag: '', grape: '', region: '', colour: ''}; document.getElementById('q').value = nm; render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
});
render();
</script>
</body>
</html>
