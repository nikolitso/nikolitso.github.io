<style>
:root{
  --bg:#0c1424; --panel:#131d33; --line:#26334f; --text:#f1ead9; --muted:#9aa4ba;
  --gold:#d4af37; --win:#6fcf97; --loss:#eb7a6c;
  --serif:'Playfair Display',Georgia,serif; --body:'Source Serif 4',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding:40px 16px 80px}
h1{font:700 clamp(30px,5vw,46px)/1.1 var(--serif);margin:0 0 6px}
h1 a{color:inherit;text-decoration:none}
h1 a:hover{color:var(--gold)}
.home-link{display:inline-block;margin-bottom:14px;font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.home-link:hover{color:var(--gold)}
.sub{font:400 13px var(--mono);color:var(--muted);letter-spacing:.04em;margin-bottom:32px}
.tabs{display:flex;flex-wrap:wrap;gap:10px 28px;border-bottom:1px solid var(--line);margin:0 0 26px}
.tabs a{border-bottom:2px solid transparent;color:var(--muted);font:600 18px var(--serif);padding:0 0 10px;margin-bottom:-1px;cursor:pointer;text-decoration:none}
.tabs a.on{color:var(--text);border-color:var(--gold)}
.tabs a:hover{color:var(--text)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:0 0 18px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content}
.seg button{background:none;border:0;color:var(--muted);font:500 13px var(--mono);padding:8px 16px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
.seg button.on{background:var(--gold);color:#0c1424}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:500 12px var(--mono);padding:5px 12px;cursor:pointer}
.chip:hover{color:var(--text)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#0c1424}
h2{font:600 22px var(--serif);margin:30px 0 12px}
h2.day{font-size:20px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(520px,100%),1fr));gap:18px}
.grid>.card{min-width:0}
.grid>.mcard{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:0;align-content:start}
.mcard .top{padding-bottom:4px}
.card td:first-child{white-space:normal}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 18px 10px}
.card h3{font:600 24px var(--serif);margin:0}
.live{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--gold);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:1px}
.card .ko{font:500 14px var(--mono);color:var(--text);letter-spacing:.06em}
.wdl{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 6px;background:var(--line)}
.wdl i{display:block} .wdl i:nth-child(1){background:var(--gold)} .wdl i:nth-child(2){background:#59657f} .wdl i:nth-child(3){background:#5b7bd5}
.wdlt{display:flex;justify-content:space-between;font:400 14px var(--mono);color:var(--muted)}
.wdlt b{color:var(--text);font-weight:500}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:400 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-size:15px;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:13.5px}
td.tot{color:var(--gold);font-weight:500}
.card table{margin-top:6px}
table.mk{margin-bottom:6px}table.mk td,table.mk th{padding:6px 7px}
.stack{display:grid;gap:18px}
.mkcols{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:start;margin-top:8px}
@media(max-width:900px){.mkcols{grid-template-columns:1fr}.mkcols table{display:block;overflow-x:auto}}
.stack>.card{min-width:0}
.wdlt i{font-style:normal;color:var(--gold)}
.wdlt span:nth-child(2){text-align:center}.wdlt span:last-child{text-align:right}
.coach .who{display:inline-block;min-width:118px;color:var(--muted)}
.tenure{font:400 12px/1.4 var(--mono);color:var(--muted);margin-top:2px}
.coach{font:400 13.5px/1.55 var(--mono);color:var(--muted);margin-top:2px}
.coach b{color:var(--text);font-weight:500}
.coach .wc{display:inline-block;width:7ch;text-align:right}
table.tm{max-width:1000px}table.tm .gl{border-left:1px solid var(--line);padding-left:12px}
table.tm tr.grp th{color:var(--gold);border-bottom:0;padding-bottom:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px 14px;flex-wrap:wrap}
.ref{font:400 13.5px/1.55 var(--mono);color:var(--muted);margin-top:6px}
.ref b{color:var(--text);font-weight:500}
.card tr:last-child td{border-bottom:0}
.ln{font:400 12px var(--mono);color:var(--muted);text-align:right}
.ln span{display:inline-block;min-width:92px}
.ln b{color:var(--text);font-weight:500}
.ln .hi{color:var(--win)} .ln .lo{color:var(--loss)}
th.sort{cursor:pointer;user-select:none} th.sort:hover,th.sort.on{color:var(--gold)}
.w{color:var(--win)} .l{color:var(--loss)}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.note{font:400 15px/1.55 var(--body);color:var(--muted);border-left:2px solid var(--gold);padding:2px 0 2px 14px;margin:0 0 14px;max-width:820px}
.note b{color:var(--text);font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 18px}
.refsub{font:600 18px var(--serif);margin:8px 0 8px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.metric .lbl{font:400 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.metric .big{font:500 24px var(--mono);color:var(--gold)}
.scroll{overflow-x:auto}
.doc{max-width:860px}
.doc p,.doc li{font-size:16.5px;line-height:1.65;margin:0 0 14px}
.doc ul{padding-left:20px;margin:0 0 14px}
.doc h3{font:600 18px var(--serif);margin:28px 0 8px;display:flex;align-items:center;gap:10px}
.doc .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#0c1424;font:600 13px var(--mono);flex:none}
.calc{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:12px 16px;margin:0 0 14px;font:400 14px/2 var(--mono);overflow-x:auto}
.calc i{font-style:normal;color:var(--muted);font-size:12px}
.calc b{color:var(--gold);font-weight:500}
table.mini{margin:0 0 16px}
.abbr{display:none}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:18px;margin:6px 0 10px}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;min-width:0}
.chart h3{font:600 17px var(--serif);margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chart svg{display:block;width:100%;height:auto}
.chart .cap{font:400 14px/1.5 var(--body);color:var(--muted);margin:6px 0 0}
.key{font:400 12px var(--mono);color:var(--muted);display:flex;gap:14px}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart .hit{fill:transparent;cursor:default}
.chart .bar.hl{opacity:.75}
.tip{position:fixed;pointer-events:none;background:#0d1220;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:400 12.5px/1.5 var(--mono);color:var(--text);z-index:10;display:none;white-space:nowrap}
.tip b{color:var(--gold);font-weight:500}
tr.avg td,tr.few td{color:var(--muted)} tr.avg td:first-child{font-style:italic}
tr.sum td{border-top:1px solid var(--line);font-weight:600}
table.rp td.cm{white-space:normal;min-width:320px;font-size:14.5px;line-height:1.45;color:var(--muted)}
table.rp td{vertical-align:top}
.rate{display:inline-block;min-width:40px;text-align:center;border-radius:999px;padding:1px 8px;font:500 12.5px var(--mono)}
.r-good{background:rgba(111,207,151,.14);color:var(--win)} .r-mid{background:rgba(154,164,186,.13);color:var(--text)}
.r-warn{background:rgba(212,175,55,.15);color:var(--gold)} .r-bad{background:rgba(217,105,90,.18);color:var(--loss)}
button.reflink{background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;text-align:left;cursor:pointer;text-decoration:underline dotted color-mix(in srgb,var(--muted) 70%,transparent);text-underline-offset:3px}
button.reflink:hover{color:var(--gold);text-decoration-color:var(--gold)}
dialog#refdlg{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;width:min(1100px,96vw);max-height:90vh}
dialog#refdlg::backdrop{background:rgba(5,9,18,.72)}
#refdlg .dh{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line);z-index:1}
#refdlg .dh h2{margin:0}
#refdlg .db{padding:16px 20px 20px}
#refdlg .x{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);font:500 13px var(--mono);padding:6px 12px;cursor:pointer}
#refdlg .x:hover{color:var(--text)}
#refdlg .metrics{grid-template-columns:repeat(auto-fit,minmax(min(140px,40vw),1fr))}
th.rs{cursor:pointer;user-select:none} th.rs:hover,th.rs.on{color:var(--gold)}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.ln span{min-width:0;margin-left:8px}.card{padding:14px 10px 8px}td,th{padding:6px 4px}
  .card td{font-size:14px}.card td.n{font-size:12.5px}.full{display:none}.abbr{display:inline}.wdlt{flex-wrap:wrap;gap:2px 12px}}
</style>
</head>

<script>
const D = window.SL, $ = id => document.getElementById(id);
// goal kicks and throw-ins show on Projections only (user, 1 Nov 2026)
const PROJ_ONLY = ['goal_kicks', 'throw_ins'];
const L = D.labels, PROJ_ORDER = D.order, ORDER = D.order.filter(s => !PROJ_ONLY.includes(s));
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayName = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const pct = x => Math.round(x*100) + '%';
const dec = s => ['xg','goals'].includes(s) ? 2 : 1;
const f = (x, s) => x == null ? '–' : (+x).toFixed(s === 'possession' ? 0 : dec(s));
// actual counts are whole numbers; only xG has decimals
const fa = (x, s) => s === 'xg' ? f(x, s) : x == null ? '–' : String(Math.round(x));
let view = 'projections', pjMode = 'match', pjStat = 'goals', rsStat = 'goals', tmStat = 'goals', tmSort = ['for', -1];

$('sub').textContent = `${D.season.replace('-','–')} · updated ${D.updated} (Athens) · ratings from the ${D.history.games} games since ${D.history.from}–${String(+D.history.from + 1).slice(2)}`;

function linesHtml(lines){
  if (!lines) return '';
  return lines.map(([ln, p]) => `<span>O ${ln} <b class="${p >= .6 ? 'hi' : p <= .4 ? 'lo' : ''}">${pct(p)}</b></span>`).join('');
}

const mult = x => `×${x.toFixed(2)}`;
// model chances shown as odds with a 5% bookmaker-style margin
const MARGIN = 1.05;
const modelOdds = p => (p > 0 ? Math.max(1.01, 1 / (p * MARGIN)) : 99).toFixed(2);
const monthYear = s => { const d = new Date(s + 'T12:00'); return `${MON[d.getMonth()]} ${d.getFullYear()}`; };
// the referee factor uses his last 20 games (refs.py LAST_N)
const refWindow = r => `${r.games} game${r.games === 1 ? '' : 's'} since ${r.from.replace('-', '–')}`;
const surname = n => n.split(' ').slice(-1)[0];
const coachOne = c => c ? `<b>${surname(c[0])}</b> ${c[2]} game${c[2] === 1 ? '' : 's'} since ${monthYear(c[1])}` : '–';
const coachHtml = (c, home, away) => c ? `<div class="coach"><span class="who">${home}</span> ${coachOne(c.home)}</div><div class="coach"><span class="who">${away}</span> ${coachOne(c.away)}</div>` : '';
// league games each side's projection rests on: the model's window, and how many are from this season
const sampleOne = (n, x) => `${n} <b>${x.rebuilt ? x.season : x.window}</b>`;
const seasonLbl = x => x.slice(2, 4) + '–' + x.slice(7, 9);
const weightOne = x => (x.seasons || [x.weight]).map(w => `<span class="wc">${w > 0 ? `<b>${Math.round(w * 100)}%</b>` : '–'}</span>`).join('');
// rebuilt clubs (new coach and squad): only games since the given date count for them
const longDate = s => { const d = new Date(s + 'T12:00'); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const rebuiltOne = x => x.rebuilt ? ` <span class="muted" style="margin-left:1ch" title="Rebuilt club: only games since ${longDate(x.rebuilt.since)} count (${x.rebuilt.why})">rebuilt</span>` : '';
const sampleTip = g => 'Recent games count more: each game fades with age, and games from earlier seasons count less again. ' + [['home', g.home], ['away', g.away]].map(([k, n]) => `${n}: ${g.sample[k].season} of ${g.sample[k].window} games are from this season` + (g.sample[k].weight != null ? `, and they carry ${Math.round(g.sample[k].weight * 100)}% of the weight` : '')).join('; ') + '. Shares are averaged over the stats; How it works has them stat by stat.';
const sampleHtml = g => g.sample ? `<div class="coach sample" title="${sampleTip(g)}"><span class="who">Stats from</span> ${sampleOne(g.home, g.sample.home)} · ${sampleOne(g.away, g.sample.away)} league games since ${D.history.from}–${String(+D.history.from + 1).slice(2)}</div>`
  + (g.sample.home.weight != null ? `<div class="coach sample" title="${sampleTip(g)}"><span class="who">Weight</span>${(D.history.seasons || []).map(x => `<span class="wc">${seasonLbl(x)}</span>`).join('')}</div>`
    + [['home', g.home], ['away', g.away]].map(([k, n]) => `<div class="coach sample" title="${sampleTip(g)}"><span class="who">${n}</span>${weightOne(g.sample[k])}${rebuiltOne(g.sample[k])}</div>`).join('') : '') : '';
// compact coach tenure under a match in tables: "Mazzarri 7 · Leto 43 games in charge"
const tenureOne = c => c ? `${surname(c[0])} ${c[2]}` : '–';
const tenureLine = g => g && g.coaches ? `<div class="tenure" title="League games in charge of the current coach">${tenureOne(g.coaches.home)} · ${tenureOne(g.coaches.away)} games in charge</div>` : '';
// a referee appointed after the last model update: named, with his record since 2024-25, but not in the projections
function refRecord(name){
  const row = window.SLREF && window.SLREF.cards.find(c => c[0] === name);
  if (row && !(window.SLREFGAMES || {}).complete) return {games: row[1], cards: row[2]};
  const gs = refRows().filter(g => g.ref === name && g.season >= '2024-25' && g.hc != null);
  return gs.length ? {games: gs.length, cards: avgOf(gs.map(g => g.hc + g.ac)), partial: !(window.SLREFGAMES || {}).complete} : null;
}
function refHtml(r){
  if (!r) return '<div class="ref">Referee <b>not announced</b></div>';
  if (r.pending){
    const x = refRecord(r.name);
    return `<div class="ref">Referee <b>${refLink(r.name)}</b>${r.from ? ` (${r.from})` : ''} · ${x ? `${x.games} league game${x.games === 1 ? '' : 's'} since 2024–25${x.partial ? ' read so far' : ''}, <b>${x.cards.toFixed(1)}</b> cards per game` : 'no league games since 2024–25 in the data'} · appointed after the last model update, not in these projections yet</div>`;
  }
  // appointed after the last model update: factor estimated on this page (see "How it works"), applied to cards and fouls
  if (r.est){
    const fl = r.fouls_games ? `fouls ${mult(r.fouls)} (${r.fouls_games} game${r.fouls_games === 1 ? '' : 's'} this season)` : 'fouls ×1.00 (no games this season)';
    return `<div class="ref" title="Appointed after the last model update. Factors estimated from the referee's record, pulled hard toward ×1.00; the model's own factor replaces them at its next update.">Referee <b>${refLink(r.name)}</b>${r.country ? ` (${r.country})` : ''} · ${r.games ? `${r.games} game${r.games === 1 ? '' : 's'} since 2024–25${r.partial ? ' read so far' : ''}, <b>${r.avg.cards.toFixed(1)}</b> cards per game` : 'no league games since 2024–25'} · cards ${mult(r.cards)} · ${fl} · <span class="muted">estimated factors</span></div>`;
  }
  if (!r.games) return `<div class="ref">Referee <b>${r.name}</b> · no league games since ${r.from.replace('-', '–')} · no adjustment</div>`;
  return `<div class="ref">Referee <b>${r.name}</b> · ${refWindow(r)} · <b>${r.avg.cards.toFixed(1)}</b> cards (${mult(r.cards)}) · <b>${r.avg.fouls.toFixed(1)}</b> fouls (${mult(r.fouls)}) per game</div>`;
}

// one line per stat: goals 2.5 always, others the half-point next to the projection

function matchCard(g){
  const r = g.result, t = g.kickoff.slice(11) + (g.started ? ' <span class="live">Started</span>' : '');
  const rows = PROJ_ORDER.map(s => {
    const x = g.stats[s];
    return `<tr><td>${L[s]}</td><td class="n">${f(x.home, s)}</td><td class="n">${f(x.away, s)}</td>`+
      `<td class="n tot">${x.total == null ? '' : f(x.total, s)}</td></tr>`;
  }).join('');
  return `<div class="card mcard"><div class="top"><div class="ko">${t}</div><h3>${g.home} <span class="muted">–</span> ${g.away}</h3>${refHtml(g.ref)}${coachHtml(g.coaches, g.home, g.away)}${sampleHtml(g)}</div>
    <div><div class="wdl"><i style="width:${r.home*100}%"></i><i style="width:${r.draw*100}%"></i><i style="width:${r.away*100}%"></i></div>
    <div class="wdlt"><span>Home <b>${pct(r.home)}</b><br><i>${modelOdds(r.home)}</i></span><span>Draw <b>${pct(r.draw)}</b><br><i>${modelOdds(r.draw)}</i></span><span>Away <b>${pct(r.away)}</b><br><i>${modelOdds(r.away)}</i></span></div></div>
    <table><thead><tr><th>Stat</th><th class="n"><span class="full">${g.home}</span><span class="abbr">Home</span></th><th class="n"><span class="full">${g.away}</span><span class="abbr">Away</span></th><th class="n">Total</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function chipsHtml(id, cur, list){
  return `<div class="chips" id="${id}">` + list.map(s => `<button class="chip${s === cur ? ' on' : ''}" data-s="${s}">${L[s]}</button>`).join('') + '</div>';
}

function renderProjections(){
  if (!D.fixtures.length) return '<p class="empty">No fixtures scheduled in the next two weeks.</p>';
  let h = `<div class="bar"><div class="seg" id="pjmode"><button data-m="match" class="${pjMode==='match'?'on':''}">By match</button><button data-m="stat" class="${pjMode==='stat'?'on':''}">By stat</button></div>`;
  if (pjMode === 'stat') h += chipsHtml('pjstat', pjStat, PROJ_ORDER);
  h += '</div>';
  if (D.fixtures.some(g => g.ref && g.ref.est)) h += `<p class="note">This round's referees were appointed after the last model update, so their effect on cards and fouls is estimated here: each referee's cards per game since 2024–25 (fouls: this season's games against the model's projection) next to the league's, pulled hard toward ×1.00, because in testing a referee's past said little about his next game's cards. The model's own referee factors replace these at its next update. Bookie comparisons and value bets use the adjusted numbers.</p>`;
  const byDay = {};
  D.fixtures.forEach(g => (byDay[g.kickoff.slice(0,10)] ||= []).push(g));
  if (pjMode === 'match'){
    for (const [d, gs] of Object.entries(byDay)) h += `<h2 class="day">${dayName(d)}</h2><div class="grid">${gs.map(matchCard).join('')}</div>`;
    return h;
  }
  const s = pjStat;
  h += `<div class="scroll"><table><thead><tr><th>Kick-off</th><th>Match</th><th class="n">Home</th><th class="n">Away</th>${s==='possession'?'':'<th class="n">Total</th>'}<th class="n">${s==='possession'||s==='xg'?'':'Over'}</th></tr></thead><tbody>`;
  for (const g of D.fixtures){
    const x = g.stats[s];
    const rf = (s === 'cards' || s === 'fouls') && g.ref && !g.ref.pending ? ` <span class="muted" style="font-size:12px">· ${g.ref.name}${g.ref.games ? ' ' + mult(g.ref[s]) : ''}</span>` : '';
    h += `<tr><td class="muted">${dayName(g.kickoff)} ${g.kickoff.slice(11)}${g.started ? ' <span class="live">Started</span>' : ''}</td><td>${g.home} – ${g.away}${rf}${tenureLine(g)}</td><td class="n">${f(x.home,s)}</td><td class="n">${f(x.away,s)}</td>${s==='possession'?'':`<td class="n tot">${f(x.total,s)}</td>`}<td class="ln">${linesHtml(x.lines)}</td></tr>`;
  }
  return h + '</tbody></table></div>';
}

function renderResults(){
  const s = rsStat, poss = s === 'possession';
  let h = `<p class="note">Every game this season, with the projection the model would have made the day before it (only earlier games used) next to what happened.</p>
    <div class="bar">${chipsHtml('rsstat', s, ORDER)}</div>`;
  const rows = D.results.filter(g => g.stats[s][2] != null);
  let err = 0;
  rows.forEach(g => { const [ph, pa, ah, aa] = g.stats[s]; err += poss ? Math.abs(ph - ah) : Math.abs(ph + pa - ah - aa); });
  h += `<div class="metrics"><div class="metric"><div class="lbl">Games</div><div class="big">${rows.length}</div></div>
    <div class="metric"><div class="lbl">Avg miss, ${poss ? 'home share' : 'match total'}</div><div class="big">${rows.length ? (err/rows.length).toFixed(2) : '–'}</div></div></div>`;
  h += `<div class="scroll"><table><thead><tr><th>Date</th><th>Match</th><th class="n">Projected</th><th class="n">Actual</th>${poss ? '' : '<th class="n">Proj. total</th><th class="n">Actual total</th>'}<th class="n">Miss</th></tr></thead><tbody>`;
  for (const g of rows){
    const [ph, pa, ah, aa] = g.stats[s];
    const miss = poss ? ah - ph : ah + aa - ph - pa;
    h += `<tr><td class="muted">${dayName(g.date)}</td><td>${g.home} – ${g.away}</td><td class="n">${f(ph,s)} – ${f(pa,s)}</td><td class="n">${fa(ah,s)} – ${fa(aa,s)}</td>`+
      (poss ? '' : `<td class="n">${f(ph+pa,s)}</td><td class="n tot">${fa(ah+aa,s)}</td>`)+
      `<td class="n muted">${miss > 0 ? '+' : ''}${f(miss,s)}</td></tr>`;
  }
  return h + '</tbody></table></div>';
}

function renderTeams(){
  const s = tmStat;
  let h = `<p class="note">Per-game averages. <b>This season</b> covers every game this season. <b>Current coach</b> covers only the games since the coach took over, which can include last season. <b>For</b> is what the team produced, <b>against</b> is what its opponents produced. A coach with only a few games is mostly luck: the projections themselves use the whole of the last three seasons.</p>
    <div class="bar">${chipsHtml('tmstat', s, ORDER)}</div>`;
  const [key, dir] = tmSort;
  const val = (t, k) => (k.startsWith('c_') ? t.coach?.[k.slice(2)]?.[s] : t[k][s]) ?? -1;
  const rows = D.teams.slice().sort((a, b) => key === 'team' ? dir * a.team.localeCompare(b.team) : dir * (val(a, key) - val(b, key)));
  const th = (k, lbl, n, cls = '') => `<th class="sort${n ? ' n' : ''}${k === key ? ' on' : ''} ${cls}" data-k="${k}">${lbl}${k === key ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  h += `<div class="scroll"><table class="tm"><thead>
    <tr class="grp"><th colspan="1"></th><th colspan="3" class="gl">This season</th><th colspan="5" class="gl">Current coach</th></tr>
    <tr>${th('team','Team')}<th class="n gl">Games</th>${th('for','For',1)}${th('against','Against',1)}<th class="gl">Coach</th><th>Since</th><th class="n">Games</th>${th('c_for','For',1)}${th('c_against','Against',1)}</tr></thead><tbody>`;
  for (const t of rows){
    const c = t.coach;
    h += `<tr><td>${t.team}</td><td class="n muted gl">${t.games}</td><td class="n tot">${f(t.for[s],s)}</td><td class="n">${f(t.against[s],s)}</td>` +
      (c ? `<td class="gl">${c.name}</td><td class="muted">${monthYear(c.since)}</td><td class="n muted">${c.games}</td><td class="n tot">${f(c.for[s],s)}</td><td class="n">${f(c.against[s],s)}</td>`
         : `<td class="gl muted" colspan="5">–</td>`) + '</tr>';
  }
  return h + '</tbody></table></div>';
}

const sgn = x => (x >= 0 ? '+ ' : '− ') + Math.abs(x).toFixed(1);
const vsAvg = (x, more, less) => Math.abs(x - 1) < .02 ? 'about average' : x > 1 ? `${Math.round((x-1)*100)}% ${more} than average` : `${Math.round((1-x)*100)}% ${less} than average`;
const ago = d => d < 300 ? `${Math.round(d/30)} months` : d < 500 ? '1 year' : `${Math.round(d/365)} years`;
function poisson(mu){ const p = [Math.exp(-mu)]; for (let i = 1; i <= 10; i++) p.push(p[i-1] * mu / i); return p; }

function renderMethod(){
  const A = D.accuracy, E = D.example, MD = D.market_drive;
  let h = '<div class="doc">';
  h += `<h2 style="margin-top:0">The idea</h2>
  <p>Every number on the Projections tab is built the same way. Start from what an average Super League game produces, then adjust it for how good or bad each team is at that stat. Goals and the result are our own, independent of the bookmakers, so they can be compared with the odds. The match odds are only used as an input for other stats: who is the favourite for cards, and a small adjustment to shots, SoT and saves. Cards also take into account who is the favourite (again from the odds), and cards and fouls take into account the referee.</p>`;
  if (E){
    const H = E.home, W = E.away, c = E.stats.corners, k = E.stats.cards, g = E.stats.goals, P = E.possession;
    const tH = D.teams.find(t => t.team === H), tW = D.teams.find(t => t.team === W);
    const x = (a, b, d) => (a * b * d).toFixed(2);
    const bal = (v, m) => (+v.toFixed(2) * +m.toFixed(2)).toFixed(2);
    const lines = ls => ls.map(([ln, p]) => `over ${ln}: <b>${pct(p)}</b>`).join(' · ');
    h += `<h2>Worked example: ${H} – ${W}</h2>
    <p>Here is every step for this round's <b>${H} – ${W}</b>, starting with corners. All the figures are the real ones behind the match card.</p>

    <h3><span class="num">1</span>Start from the league</h3>
    <p>In the Super League an average home team wins <b>${c.mu_home.toFixed(2)}</b> corners per game, and an average away team <b>${c.mu_away.toFixed(2)}</b>. Home advantage is already in these two numbers, which is why every stat has a home and an away average.</p>

    <h3><span class="num">2</span>Rate each team</h3>
    <p>Every team gets two ratings per stat. <b>For</b> is how much it produces and <b>against</b> is how much it lets opponents produce. 1.00 means league average.</p>
    <div class="scroll"><table class="mini"><thead><tr><th>Corners</th><th class="n">For</th><th>In words</th><th class="n">Against</th><th>In words</th></tr></thead><tbody>
      <tr><td>${H}</td><td class="n tot">${c.home_for.toFixed(2)}</td><td class="muted">wins ${vsAvg(c.home_for,'more','fewer')}</td><td class="n tot">${c.home_against.toFixed(2)}</td><td class="muted">concedes ${vsAvg(c.home_against,'more','fewer')}</td></tr>
      <tr><td>${W}</td><td class="n tot">${c.away_for.toFixed(2)}</td><td class="muted">wins ${vsAvg(c.away_for,'more','fewer')}</td><td class="n tot">${c.away_against.toFixed(2)}</td><td class="muted">concedes ${vsAvg(c.away_against,'more','fewer')}</td></tr>
    </tbody></table></div>
    <p>These ratings are not just this season's averages. This season ${H} win ${f(tH.for.corners,'corners')} and concede ${f(tH.against.corners,'corners')} corners a game, and ${W} win ${f(tW.for.corners,'corners')} and concede ${f(tW.against.corners,'corners')}, but that is only ${tH.games} and ${tW.games} games. The ratings use the games since ${D.history.from}–${String(+D.history.from + 1).slice(2)} (this season and the two before), with this season counting most: for corners, a game from ${ago(c.half_life)} ago counts half as much as last week's, and a game from an earlier season counts half again. They also adjust for opponents: winning 6 corners against a side that rarely concedes them is worth more than winning 6 against one that concedes plenty.</p>

    <h3><span class="num">3</span>Multiply</h3>
    <div class="calc">
      ${H} corners = ${c.mu_home.toFixed(2)} <i>home average</i> × ${c.home_for.toFixed(2)} <i>${H} for</i> × ${c.away_against.toFixed(2)} <i>${W} against</i> = <b>${x(c.mu_home,c.home_for,c.away_against)}</b><br>
      ${W} corners = ${c.mu_away.toFixed(2)} <i>away average</i> × ${c.away_for.toFixed(2)} <i>${W} for</i> × ${c.home_against.toFixed(2)} <i>${H} against</i> = <b>${x(c.mu_away,c.away_for,c.home_against)}</b><br>
      Match total = <b>${c.proj.total.toFixed(1)}</b> corners
    </div>
    <p>${W} ${c.away_for > 1 ? 'win more corners than most teams' : 'win fewer corners than most teams'}, and ${H} ${c.home_against > 1 ? 'concede more than most' : 'concede fewer than most'}. ${H} ${c.home_for < 1 ? 'win fewer than most' : 'win more than most'}, against a side that ${c.away_against < 1 ? 'rarely concedes them' : 'concedes plenty'}.</p>

    <h3><span class="num">4</span>Turn the projection into an over chance</h3>
    <p>${c.proj.total.toFixed(1)} is what this game would average if it could be played many times over. Any single game lands above or below. I measured how widely real totals have spread around their projections in more than 1,000 past games, and used that spread to get the chance of going over the line:</p>
    <div class="calc">${lines(c.proj.lines)}</div>
    <p>The line is the half-point next to the projected total: ${c.proj.total.toFixed(1)} corners gives over ${Math.floor(c.proj.total) + .5}, and 25.1 shots would give over 25.5. Goals always use 2.5, in every match.</p>

    <h3><span class="num">5</span>Cards: who is the favourite</h3>
    <p>Cards start the same way, from each team's ratings:</p>
    <div class="calc">
      ${H} cards = ${k.mu_home.toFixed(2)} × ${k.home_for.toFixed(2)} × ${k.away_against.toFixed(2)} = ${x(k.mu_home,k.home_for,k.away_against)}<br>
      ${W} cards = ${k.mu_away.toFixed(2)} × ${k.away_for.toFixed(2)} × ${k.home_against.toFixed(2)} = ${x(k.mu_away,k.away_for,k.home_against)}
    </div>
    <p>Ratings know how many cards a club usually gets, but not how one-sided this particular game is. A team that's clearly better spends the game on the ball and commits fewer fouls, while even games get scrappy. In past games, a side expected to score 1.5 goals more than its opponent got about a quarter fewer cards than its usual level. Who is the favourite, and by how much, comes from the match odds: in testing on the ${MD.games} games since 2025–26, odds-based favourites cut the miss on match cards from ${MD.cards.teams_only.toFixed(2)} to ${MD.cards.market.toFixed(2)}, against ${MD.cards.model.toFixed(2)} using our own goal projections.</p>
    <p>Here ${E.balance.home < E.balance.away ? H : W} are the favourites (the odds make them ${Math.abs(g.proj.home - g.proj.away).toFixed(1)} goals better, see step 7), so their cards go down and ${E.balance.home < E.balance.away ? W : H}'s ${(E.balance.home < E.balance.away ? E.balance.away : E.balance.home) >= 1 ? 'go up slightly' : 'barely change'}:</p>
    <div class="calc">${H} ${x(k.mu_home,k.home_for,k.away_against)} × ${E.balance.home.toFixed(2)} = <b>${bal(k.mu_home*k.home_for*k.away_against, E.balance.home)}</b> · ${W} ${x(k.mu_away,k.away_for,k.home_against)} × ${E.balance.away.toFixed(2)} = <b>${bal(k.mu_away*k.away_for*k.home_against, E.balance.away)}</b></div>

    <h3><span class="num">6</span>Add the referee (cards and fouls)</h3>`;
    const cH = +bal(k.mu_home*k.home_for*k.away_against, E.balance.home), cW = +bal(k.mu_away*k.away_for*k.home_against, E.balance.away);
    if (E.ref && E.ref.games){
      h += `<p>The referee is <b>${E.ref.name}</b>. His factor comes from his games since the start of last season (here ${refWindow(E.ref)}, averaging ${E.ref.avg.cards.toFixed(1)} cards and ${E.ref.avg.fouls.toFixed(1)} fouls a game), because referees change over time. In testing, recent games beat a referee's whole history, clearly so for fouls. In those games cards came out ${Math.abs(E.ref.cards - 1) < .02 ? 'almost exactly in line with' : E.ref.cards > 1 ? 'above' : 'below'} what the teams and the favourite effect would project. That gives him a factor of <b>${mult(E.ref.cards)}</b>, applied to both teams:</p>
      <div class="calc">${H} ${cH.toFixed(2)} × ${E.ref.cards.toFixed(2)} = <b>${(cH * +E.ref.cards.toFixed(2)).toFixed(2)}</b> · ${W} ${cW.toFixed(2)} × ${E.ref.cards.toFixed(2)} = <b>${(cW * +E.ref.cards.toFixed(2)).toFixed(2)}</b> · total <b>${k.proj.total.toFixed(1)}</b><br>${lines(k.proj.lines)}</div>`;
    } else {
      h += `<p>${E.ref ? `The referee, ${E.ref.name}, has no Super League games in the data` : 'The referee has not been announced yet'}, so there is no adjustment and the total stays at <b>${k.proj.total.toFixed(1)}</b>.</p>`;
    }
    const B = A.cards.balance;
    h += `<p>A referee's factor is pulled hard toward ×1.00, because a referee's past is a weak guide here: in testing, games with the referees who looked strictest had no more cards than games with the most lenient. I also tested whether some referees go easier on Olympiakos, Panathinaikos, AEK and PAOK. Their past lean didn't repeat, and the team ratings already know the Big-4 get fewer cards.</p>
    <p>For fouls, the referee took the average miss on match fouls from ${A.fouls.mae.toFixed(2)} to ${A.fouls.ref_mae.toFixed(2)} in testing.</p>`;

    const ph = poisson(g.proj.home), pa = poisson(g.proj.away);
    let best = [0, 0, 0];
    ph.forEach((p, i) => pa.forEach((q, j) => { if (p*q > best[2]) best = [i, j, p*q]; }));
    h += `<h3><span class="num">7</span>Who wins</h3>
    <p>Goals are projected exactly like corners:</p>
    <div class="calc">
      ${H} goals = ${g.mu_home.toFixed(2)} × ${g.home_for.toFixed(2)} × ${g.away_against.toFixed(2)} = <b>${E.model_goals[0].toFixed(2)}</b><br>
      ${W} goals = ${g.mu_away.toFixed(2)} × ${g.away_for.toFixed(2)} × ${g.home_against.toFixed(2)} = <b>${E.model_goals[1].toFixed(2)}</b>
    </div>
    ${E.market_goals ? `<p>For comparison, the bookie's odds imply ${H} <b>${E.market_goals[0].toFixed(2)}</b> and ${W} <b>${E.market_goals[1].toFixed(2)}</b> goals. We keep our own numbers so they can be compared with the market (see Open bets), but on goals the market has been the more accurate of the two in testing, so treat goal and result differences with caution.</p>` : ''}
    <p>Goals are rare, random events. A team expected to score ${g.proj.home.toFixed(2)} scores 0 in ${pct(ph[0])} of games, 1 in ${pct(ph[1])} and 2 in ${pct(ph[2])}. Doing this for both teams gives a chance for every score, and the most likely is <b>${best[0]}–${best[1]}</b> (${pct(best[2])}). Adding up all the scores: <b>${H} win ${pct(E.result.home)}</b>, <b>draw ${pct(E.result.draw)}</b>, <b>${W} win ${pct(E.result.away)}</b>.</p>

    <h3><span class="num">8</span>Possession</h3>
    <p>Possession is a split that always adds to 100%, so it can't be multiplied like the counts. Each team has one possession strength (points above or below an even split), and the home side gets a small edge:</p>
    <div class="calc">${H} possession = 50 ${sgn(P.edge)} <i>home edge</i> ${sgn(P.home)} <i>${H}</i> ${sgn(-P.away)} <i>${W}</i> = <b>${P.proj.toFixed(1)}%</b> · ${W} ${(100 - P.proj).toFixed(1)}%</div>
    <p>Shots, SoT, xG, fouls, goal kicks, throw-ins and saves all work like corners, each with its own averages and ratings. Shots, SoT and goalkeeper saves then get a small adjustment from the match odds: favourites take more shots and force more saves than their ratings alone suggest. In testing on 284 games since 2025–26 this made them about 1% more accurate (shots 1.4%, SoT 1.0%, saves 0.9%). I tested the same for xG, corners, fouls, goal kicks, throw-ins and possession, but the odds didn't help there, so those come from the ratings alone.</p>`;
  }
  h += `<h2>Where the ratings come from</h2>
  <ul>
    <li><b>Data:</b> the ${D.history.games} Super League games since ${D.history.from}–${String(+D.history.from + 1).slice(2)}, this season and the two before. Older seasons are left out because teams change too much; in testing, going further back made almost no difference. Goalkeeper saves before 2025 are worked out as the opponent's SoT minus goals.</li>
    <li><b>Recent games count more, and this season most of all.</b> Every game fades with age, and a game from an earlier season is cut again on top of that (the last column). How fast depends on the stat: the ones that change quickly with a team's coach and style fade fastest, mostly random ones need a long history to read. ${D.history.weights ? `Today this season already carries about ${Math.round(Object.values(D.history.weights).reduce((a, w) => a + w[0], 0) / Object.keys(D.history.weights).length * 100)}% of a team's weight on average, and the share grows every week. ` : ''}Every match card shows that share for both teams.</li>
  </ul>
  <div class="scroll"><table class="mini" style="max-width:520px"><thead><tr><th>Stat</th><th>A game this old counts half</th><th class="n">Earlier seasons also count</th></tr></thead><tbody>`;
  if (E) for (const s of ORDER) h += `<tr><td>${L[s]}</td><td class="muted">${ago(E.half_lives[s])}</td><td class="n">${E.past_w && E.past_w[s] < 1 ? '×' + (+E.past_w[s].toFixed(2)) : 'no extra cut'}${(D.coach_window || []).includes(s) ? ', same coach only' : ''}</td></tr>`;
  h += `</tbody></table></div>`;
  if (D.history.weights) {
    const SS = D.history.seasons;
    h += `<p>What that adds up to today, by season. For the stats marked “same coach only” it's the average over all teams, so it includes the many whose coach is new this season and who have no earlier games at all; for the rest it's the league median for a team with all three seasons behind it. Every match card shows the same split for its two teams, averaged over the stats.</p>
  <div class="scroll"><table class="mini" style="max-width:600px"><thead><tr><th>Stat</th>${SS.map((x, i) => `<th class="n">${seasonLbl(x)}${i == 0 ? ' (this season)' : ''}</th>`).join('')}</tr></thead><tbody>`;
    for (const s of ORDER) if (D.history.weights[s]) h += `<tr><td>${L[s]}</td>${D.history.weights[s].map((w, i) => `<td class="n">${i == 0 ? '<b>' : ''}${Math.round(w * 100)}%${i == 0 ? '</b>' : ''}</td>`).join('')}</tr>`;
    h += `</tbody></table></div>`;
  }
  h += `
  <ul>
    <li><b>Small samples are pulled toward the club's usual level.</b> After four games a team isn't really a corner machine because it won 9 in one of them. In Greece the Big 4 stay big and the small clubs stay small, so a team is pulled toward its own long-run level (every season since 2019), not toward the league average: Olympiakos toward Olympiakos, a promoted side toward a typical promoted side. Before this, the model under-rated the Big 4: they scored 9% more goals than it projected. Fouls and throw-ins follow the coach more than the club, so they are still pulled toward the league average.</li>
    <li><b>The Big 4 against the small clubs.</b> Even with that, a small club facing Olympiakos, PAOK, AEK or Panathinaikos has scored 15–20% fewer goals than projected in every season since 2019. So in those games the small club's goals are multiplied by ×${D.matchup['small v big'].toFixed(2)} and the big club's by ×${D.matchup['big v small'].toFixed(2)} (half of the gap seen so far, which tested best season by season). This feeds the goals line and the 1X2 chances.</li>
    <li><b>Promoted teams</b> start from how promoted sides have usually done. For corners that's ${E ? Math.round((1 - E.newcomer[0])*100) : 15}% fewer won and ${E ? Math.round((E.newcomer[1] - 1)*100) : 12}% more conceded than average. Their own results take over as games come in.</li>
    ${(D.coach_window || []).length ? `<li><b>Same coach only.</b> For ${D.coach_window.map(s => lc(s)).join(', ')}, a team's own numbers start this season, or at its current coach's first game if he was already there before. Games under an earlier coach don't count. Until a new coach has enough games, the team is pulled toward the club's usual level, not the league average: replaying 2023–24 and 2024–25, this was as accurate as using every game, while dropping the club level as well made projections miss 2–6% more. Shots, fouls, throw-ins and possession lost a little with this rule, so they still use every game, faded.</li>` : ''}
    ${Object.keys(D.rebuilt || {}).length ? `<li><b>Rebuilt clubs.</b> Sometimes a club's past says little about it now: a new coach and a new squad. For these teams the earlier games are dropped altogether, and the rating isn't pulled toward the club's usual level, only toward the league average until enough new games are in. ${Object.entries(D.rebuilt).map(([t, x]) => `<b>${t}</b>: only games since ${longDate(x.since)} (${x.why}).`).join(' ')} This is a judgement call, set by hand, not something the model finds by itself.</li>` : ''}
    <li><b>How these were picked.</b> For every stat I replayed each game since 2023–24 with 20 combinations of fade speed and earlier-season cut, and took the one that gives this season the most weight while missing no more than 0.05% more than the old setting (in practice, no difference). Pushing further did cost accuracy: for goals, giving this season more than about 55% made the projections miss more, because 7–10 games of one season are still mostly luck. Throw-ins already fade fastest, so they stay as they were.</li>
    <li><b>None of these settings are guesses.</b> For each stat I tried several combinations on every game since 2023–24, each time using only games played before that date, and kept the one that missed least.</li>
  </ul>

  <h2>How accurate is it?</h2>
  <p>Every game since 2023–24 was replayed, each time projecting with only the games played before it. <b>Average miss</b> is how far a team's projected number ended up from what it really did. If OFI were projected 3.2 corners and got 5, that's a miss of 1.8; this column is the average over every team in every game.</p>
  <p><b>Better than guessing the average</b> compares that with the simplest possible guess: give every team the league average (4.9 corners at home, 3.9 away), whoever they are. Above 10% means the model really knows something about the teams. Around 5% or less means it's close to a guess, so don't lean on it.</p>
  <div class="scroll"><table class="mini" style="max-width:600px"><thead><tr><th>Stat</th><th class="n">Average miss</th><th class="n">Better than guessing the average</th></tr></thead><tbody>`;
  for (const s of ORDER){
    const a = A[s], gain = 1 - a.team_mae / a.baseline;
    h += `<tr><td>${L[s]}</td><td class="n">${a.team_mae.toFixed(2)}${s === 'possession' ? ' pts' : ''}</td><td class="n ${gain >= .1 ? 'w' : gain < .06 ? 'muted' : ''}">${pct(gain)}</td></tr>`;
  }
  h += `</tbody></table></div>
  <p>A single game is mostly luck, so no model gets near zero. Even knowing a team's true average exactly, its corners would still miss by about 1.7 a game.</p>
  <p>Over chances have held up: when the page said 60%, it happened about 60% of the time. Cards went over a few points more often than shown.</p>

  <h2>What it doesn't know</h2>
  <p>The model only sees past match stats. It doesn't know about injuries, suspensions, rotation, a new coach, the weather, or how much a game matters (derbies, cup weeks, the end of the season). Factor those in yourself, especially for cards and fouls, where the model barely beats the league average.</p>
  </div>`;
  return h;
}

// Vs Bookie: the bookmaker's main line for each stat (the one closest to 50/50), its fair
// over chance with the margin removed, and ours on the same line
const BOOK_STATS = ['goals','corners','cards','sot','shots','fouls','saves'];
const pts = d => `${d > 0 ? '+' : ''}${Math.round(d * 100)}`;
// Vs Bookie shows a difference only from 10 points (as displayed, after rounding)
const big10 = d => Math.abs(Math.round(d * 100)) >= 10;

function marketRows(g){
  const m = g.market, out = [];
  for (const s of BOOK_STATS){
    const ls = m.stats[s];
    if (!ls || !ls.length) continue;
    const [ln, ov, un, fair, ours] = ls.reduce((a, b) => Math.abs(b[3] - .5) < Math.abs(a[3] - .5) ? b : a);
    out.push({s, ln, ov, un, fair, ours, diff: ours - fair, total: g.stats[s].total});
  }
  return out;
}

function renderMarket(){
  const games = D.fixtures.filter(g => g.market);
  if (!games.length) return '<p class="empty">No bookie odds for this round yet.</p>';
  const T = D.market_test;
  let h = `<p class="note">The bookie's odds for this round next to the model, for every stat${D.odds_pulled ? ` (pulled ${dayName(D.odds_pulled.slice(0,10))} ${D.odds_pulled.slice(11)} Athens)` : ''}. For each stat the line is the bookie's main one (closest to 50/50). <b>Bookie %</b> is the bookie's chance of over with its margin taken out; <b>Model %</b> is the model's chance on the same line, and <b>Model odds</b> are those chances turned into odds with a ${Math.round((MARGIN - 1) * 100)}% margin, comparable with the bookie's. Differences of 10 points or more are highlighted. This is the full comparison, including markets we don't trust for betting; the short list of bets worth considering, with their record, is on <a href="#view=open" style="color:var(--gold)" onclick="setView('open')">Open bets</a>, the record on <a href="#view=settled" style="color:var(--gold)" onclick="setView('settled')">Settled bets</a>.</p>
  <p class="note"><b>On result and goals the market has been sharper than the model:</b> over ${T.games} games since ${T.since}, its closing odds predicted results better (log loss ${T.ll_market.toFixed(3)} vs ${T.ll_ours.toFixed(3)}), and backing the model's disagreements lost ${Math.round(-T.roi_1x2 * 100)}% per bet on 1X2 and ${Math.round(-T.roi_ou * 100 * 10) / 10}% on over/under 2.5. For the other stats, read the differences with care: the bookie's shots lines run about 2 shots above the model in every game, which looks like a different way of counting shots rather than value. Every pull of the bookie's odds is saved so this can be checked after a few rounds.</p>`;
  const all = [];
  games.forEach(g => marketRows(g).forEach(r => all.push({...r, g})));
  const big = all.filter(r => Math.abs(r.diff) >= .1 && r.s !== 'shots').sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff)).slice(0, 8);
  if (big.length){
    h += `<h2>Biggest differences</h2><div class="scroll"><table class="mk"><thead><tr><th>Match</th><th>Stat</th><th class="n">Model total</th><th class="n">Line</th><th class="n">Bookie %</th><th class="n">Model %</th><th class="n">Diff</th><th class="n">Model side · bookie odds</th></tr></thead><tbody>`;
    for (const r of big) h += `<tr><td>${r.g.home} – ${r.g.away}</td><td>${L[r.s]}</td><td class="n">${f(r.total, r.s)}</td><td class="n">${r.ln}</td><td class="n">${pct(r.fair)}</td><td class="n tot">${pct(r.ours)}</td><td class="n ${r.diff > 0 ? 'w' : 'l'}">${pts(r.diff)}</td><td class="n">${r.diff > 0 ? 'Over ' + r.ov.toFixed(2) : 'Under ' + r.un.toFixed(2)}</td></tr>`;
    h += '</tbody></table></div>';
  }
  const byDay = {};
  games.forEach(g => (byDay[g.kickoff.slice(0,10)] ||= []).push(g));
  for (const [d, gs] of Object.entries(byDay)){
    h += `<h2 class="day">${dayName(d)}</h2><div class="stack">`;
    for (const g of gs){
      const res = g.market.result, mr = [g.result.home, g.result.draw, g.result.away];
      h += `<div class="card"><div class="ko">${g.kickoff.slice(11)}${g.started ? ' <span class="live">Started</span> <span class="muted" style="font-size:12px;letter-spacing:0">closing odds, last pull before kick-off</span>' : ''}</div><h3>${g.home} <span class="muted">–</span> ${g.away}</h3>${sampleHtml(g)}<div class="mkcols">`;
      if (res) h += `<table class="mk"><thead><tr><th>Result</th><th class="n">1</th><th class="n">X</th><th class="n">2</th></tr></thead><tbody>
        <tr><td class="muted">Bookie odds</td>${res.odds.map(o => `<td class="n">${o.toFixed(2)}</td>`).join('')}</tr>
        <tr><td class="muted">Model odds</td>${mr.map(p => `<td class="n tot">${modelOdds(p)}</td>`).join('')}</tr>
        <tr><td class="muted">Bookie %</td>${res.fair.map(p => `<td class="n">${pct(p)}</td>`).join('')}</tr>
        <tr><td class="muted">Model %</td>${mr.map((p, i) => `<td class="n tot">${pct(p)} ${big10(p - res.fair[i]) ? `<span class="${p > res.fair[i] ? 'w' : 'l'}" style="font-size:11px">${pts(p - res.fair[i])}</span>` : ''}</td>`).join('')}</tr></tbody></table>`;
      h += `<table class="mk"><thead><tr><th>Stat</th><th class="n">Model total</th><th class="n">Line</th><th class="n">Bookie odds<br>over · under</th><th class="n">Model odds<br>over · under</th><th class="n">Bookie %</th><th class="n">Model %</th><th class="n">Diff</th></tr></thead><tbody>`;
      for (const r of marketRows(g)){
        const hot = big10(r.diff);
        h += `<tr><td>${L[r.s]}</td><td class="n">${f(r.total, r.s)}</td><td class="n">${r.ln}</td><td class="n muted">${r.ov.toFixed(2)} · ${r.un.toFixed(2)}</td><td class="n tot">${modelOdds(r.ours)} · ${modelOdds(1 - r.ours)}</td><td class="n">${pct(r.fair)}</td><td class="n tot">${pct(r.ours)}</td><td class="n ${r.diff > 0 ? 'w' : 'l'}">${hot ? pts(r.diff) : ''}</td></tr>`;
      }
      h += '</tbody></table></div></div>';
    }
    h += '</div>';
  }
  return h;
}

// Value bets: bookie prices where the model's chance x the odds is at least 1 + min_ev
const lc = s => ({sot: 'SoT', saves: 'GK saves', xg: 'xG', result: 'match result'})[s] || L[s].toLowerCase();
const betName = b => b.stat === 'result' ? ({1: 'Home win', X: 'Draw', 2: 'Away win'})[b.side] : `${b.side === 'over' ? 'Over' : 'Under'} ${b.line} ${lc(b.stat)}`;
const evPct = x => `${x >= 0 ? '+' : ''}${Math.round(x * 100)}%`;

// minimum EV picked on the Open bets / Settled bets tabs (10%, 20%, 30%+; default 10%)
const EV_STEPS = [.10, .20, .30];
let valMin = .10;
try { const v = +localStorage.getItem('sl-valmin'); if (EV_STEPS.includes(v)) valMin = v; } catch (e) {}

function summary(bs){
  const n = bs.length, won = bs.filter(b => b.result === 'won').length, profit = bs.reduce((a, b) => a + b.profit, 0);
  return {n, won, profit, hit: n ? won / n : null, odds: n ? bs.reduce((a, b) => a + b.odds, 0) / n : null, roi: n ? profit / n : null};
}

function recordTable(title, groups, note, byEv){
  const rows = Object.entries(groups).map(([k, bs]) => [k, summary(bs)]).sort(byEv ? (a, b) => parseInt(a[0]) - parseInt(b[0]) : (a, b) => b[1].n - a[1].n);
  if (!rows.length) return '';
  let h = `<h2>${title}</h2>${note ? `<p class="muted" style="margin:-4px 0 10px;font-size:14px">${note}</p>` : ''}<div class="scroll"><table class="mk" style="max-width:820px"><thead><tr><th></th><th class="n">Bets</th><th class="n">Won</th><th class="n">Hit rate</th><th class="n">Avg odds</th><th class="n">Profit</th><th class="n">Per bet</th></tr></thead><tbody>`;
  for (const [k, r] of rows) h += `<tr><td>${k}</td><td class="n">${r.n}</td><td class="n">${r.won}</td><td class="n">${pct(r.hit)}</td><td class="n muted">${r.odds.toFixed(2)}</td><td class="n ${r.profit >= 0 ? 'w' : 'l'}">${r.profit > 0 ? '+' : ''}${r.profit.toFixed(2)}</td><td class="n ${r.roi >= 0 ? 'w' : 'l'}">${evPct(r.roi)}</td></tr>`;
  return h + '</tbody></table></div>';
}

// Value bets in two tabs: Open bets (coming games and started ones waiting for a result) and Settled bets
// (every settled bet and the record). The minimum EV picked applies to both.
function renderValue(mode){
  const V = D.value, R = V.record;
  // coming bets in kick-off order, biggest EV first within a game
  const bets = V.bets.filter(b => b.ev >= valMin - 1e-9).sort((a, b) => a.kickoff.localeCompare(b.kickoff) || a.home.localeCompare(b.home) || b.ev - a.ev);
  const settled = R.settled.filter(b => b.ev >= valMin - 1e-9);
  const all = summary(settled);
  const label = x => x >= .3 ? '30%+' : Math.round(x * 100) + '%';
  const evBar = `<div class="bar"><span class="muted" style="font:400 13px var(--mono)">Minimum EV</span><div class="seg" id="valmin">${EV_STEPS.map(x => `<button data-v="${x}" class="${x === valMin ? 'on' : ''}">${label(x)}</button>`).join('')}</div></div>`;
  const started = (R.started || []).filter(b => b.ev >= valMin - 1e-9);
  if (mode === 'settled') return renderSettled(settled, all, evBar);
  let h = `<p class="note">A bet is <b>value</b> when the model's chance of it winning, times the bookie's odds, comes to more than 1: on average it would return more than the stake. <b>EV</b> = model chance × bookie odds − 1, the expected return per 1 staked (EV +20% = 1.20 back per 1, on average). The bookie's own chance is shown for comparison only. Level lines only: for each game and stat, the bookie's main line (the one it prices closest to 50-50, odds around 2.00 each side), and only when its own chance is between ${Math.round(V.fair_range[0] * 100)}% and ${Math.round(V.fair_range[1] * 100)}%.</p>
  <p class="note"><b>Not listed:</b> ${Object.entries(V.skip).map(([s, why]) => `<b>${lc(s)}</b>: ${why}`).join('; ')}. A very large EV usually means the model is missing something (a new coach, injuries, a change of style) rather than a gift, so check those first. Every bet from EV +5% is recorded with its odds at the last update before kick-off and settled when the results come in; results and the record are on <a href="#view=settled" style="color:var(--gold)" onclick="setView('settled')">Settled bets</a>.</p>
  ${evBar}`;
  h += `<div class="metrics">
    <div class="metric"><div class="lbl">Value bets coming up</div><div class="big">${bets.length}</div></div>
    <div class="metric"><div class="lbl">Started, waiting for result</div><div class="big">${started.length}</div></div>
    <div class="metric"><div class="lbl">Settled so far</div><div class="big">${all.n}</div></div>
    <div class="metric"><div class="lbl">Return per bet</div><div class="big">${all.n ? evPct(all.roi) : '–'}</div></div></div>`;
  if (!bets.length) h += `<p class="empty">No bets at EV ${label(valMin)} or more for the coming games.</p>`;
  else {
    h += `<h2>Coming games</h2><div class="scroll"><table class="mk"><thead><tr><th>Kick-off</th><th>Match</th><th>Bet</th><th class="n">Bookie odds</th><th class="n">Model odds</th><th class="n">Bookie %</th><th class="n">Model %</th><th class="n">EV</th></tr></thead><tbody>`;
    for (const b of bets) h += `<tr><td class="muted">${dayName(b.kickoff)} ${b.kickoff.slice(11)}</td><td>${b.home} – ${b.away}</td><td><b>${betName(b)}</b></td><td class="n">${b.odds.toFixed(2)}</td><td class="n tot">${modelOdds(b.ours)}</td><td class="n">${pct(b.fair)}</td><td class="n tot">${pct(b.ours)}</td><td class="n ${b.ev >= .15 ? 'w' : ''}">${evPct(b.ev)}</td></tr>`;
    h += '</tbody></table></div>';
  }
  // kicked off, result not in the data yet (settled on the next update after the stats arrive)
  if (started.length){
    h += `<h2>Started, waiting for result</h2><p class="muted" style="margin:-4px 0 10px;font-size:14px">These games have kicked off. Each bet is settled when the game's stats arrive in the data, usually a day or two after.</p><div class="scroll"><table class="mk"><thead><tr><th>Kick-off</th><th>Match</th><th>Bet</th><th class="n">Bookie odds</th><th class="n">Model %</th><th class="n">EV</th></tr></thead><tbody>`;
    for (const b of started) h += `<tr><td class="muted">${dayName(b.kickoff)} ${b.kickoff.slice(11)}</td><td>${b.home} – ${b.away}</td><td><b>${betName(b)}</b></td><td class="n">${b.odds.toFixed(2)}</td><td class="n tot">${pct(b.ours)}</td><td class="n">${evPct(b.ev)}</td></tr>`;
    h += '</tbody></table></div>';
  }
  return h;
}
// market picked on Settled bets ('all' or a stat); the pills list the markets with settled bets, with their count
let stMkt = 'all';
try { stMkt = localStorage.getItem('sl-stmkt') || 'all'; } catch (e) {}
const mktName = s => s === 'result' ? 'Result' : L[s];
function renderSettled(settled, all, evBar){
  const counts = settled.reduce((c, b) => (c[b.stat] = (c[b.stat] || 0) + 1, c), {});
  const mkts = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || mktName(a).localeCompare(mktName(b)));
  if (stMkt !== 'all' && !counts[stMkt]) stMkt = 'all';
  if (stMkt !== 'all'){ settled = settled.filter(b => b.stat === stMkt); all = summary(settled); }
  let h = `<p class="note">Every value bet that has been settled, with what happened, and the running record (1 unit staked on each). The minimum EV and the market you pick filter both.</p>
  ${evBar}<div class="chips" id="stmk" style="margin:-4px 0 18px">${[['all', `All ${Object.values(counts).reduce((a, b) => a + b, 0)}`], ...mkts.map(m => [m, `${mktName(m)} ${counts[m]}`])]
    .map(([m, t]) => `<button class="chip${m === stMkt ? ' on' : ''}" data-s="${m}">${t}</button>`).join('')}</div>`;
  h += `<div class="metrics">
    <div class="metric"><div class="lbl">Settled so far</div><div class="big">${all.n}</div></div>
    <div class="metric"><div class="lbl">Hit rate</div><div class="big">${all.n ? pct(all.hit) : '–'}</div></div>
    <div class="metric"><div class="lbl">Profit (1 unit each)</div><div class="big">${all.n ? (all.profit > 0 ? '+' : '') + all.profit.toFixed(2) : '–'}</div></div>
    <div class="metric"><div class="lbl">Return per bet</div><div class="big">${all.n ? evPct(all.roi) : '–'}</div></div></div>`;
  if (!settled.length) return h + `<p class="muted" style="margin-top:18px">No settled bets yet at this EV level: the record starts once results for logged bets are in the data.</p>`;
  h += `<h2>${stMkt === 'all' ? 'All settled bets' : `Settled ${mktName(stMkt).toLowerCase()} bets`}</h2><p class="muted" style="margin:-4px 0 10px;font-size:14px">Every bet from EV +${Math.round(valMin * 100)}% with its result, newest first; the record by market, side and EV follows below.</p><div class="scroll"><table class="mk"><thead><tr><th>Date</th><th>Match</th><th>Bet</th><th class="n">Odds</th><th class="n">EV</th><th class="n" title="What happened: the final score for 1X2 bets, the match total for the rest">Actual</th><th class="n">Result</th></tr></thead><tbody>`;
  for (const b of settled) h += `<tr><td class="muted">${dayName(b.date)}</td><td>${b.home} – ${b.away}</td><td>${betName(b)}</td><td class="n">${b.odds.toFixed(2)}</td><td class="n">${evPct(b.ev)}</td><td class="n"><b>${b.actual ?? '–'}</b></td><td class="n ${b.result === 'won' ? 'w' : 'l'}">${b.result === 'won' ? 'Won +' + (b.odds - 1).toFixed(2) : 'Lost −1'}</td></tr>`;
  h += '</tbody></table></div>';
  const group = key => settled.reduce((g, b) => ((g[key(b)] ||= []).push(b), g), {});
  const band = b => b.ev >= .3 ? '30%+' : `${Math.floor(b.ev * 10) * 10}–${Math.floor(b.ev * 10) * 10 + 10}%`;
  h += recordTable('Record by market', group(b => b.stat === 'result' ? 'Result' : L[b.stat]),
    'A few dozen bets per market is still mostly luck: treat differences as a lead, not a verdict, until each market has 100 or more.');
  h += recordTable('Record by side', group(b => b.stat === 'result' ? 'Result' : b.side === 'over' ? 'Overs' : 'Unders'));
  h += recordTable('Record by market and side', group(b => b.stat === 'result' ? 'Result' : `${L[b.stat]} ${b.side}`));
  h += recordTable('Record by EV', group(band), 'If the model finds real value, bigger EV should mean bigger returns.', true);
  return h;
}

// Referees: card averages by referee and by the home team's odds, and the 2026-27 referee reports (referees.js)
const HOME_MORE = '#d9695a', AWAY_MORE = '#5b7bd5';
const n2 = x => (+x).toFixed(2), sg = x => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(2), pc = x => (+x).toFixed(1).replace(/\.0$/, '') + '%';
const round1 = x => (Math.round(x * 10 + 1e-9) / 10).toFixed(1);
const rateCls = x => x >= 8.295 ? 'r-good' : x >= 7.995 ? 'r-mid' : x >= 7.795 ? 'r-warn' : 'r-bad';
const rate = x => x == null ? '<span class="muted">–</span>' : `<span class="rate ${rateCls(x)}">${round1(x)}</span>`;
const ddmm = s => `${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(2,4)}`;

// bar from the baseline (y0) to y1, with the end away from the baseline rounded
function barPath(x, w, y0, y1){
  const r = Math.min(4, w / 2, Math.abs(y1 - y0)), up = y1 < y0, e = up ? r : -r;
  return `M${x},${y0}V${y1 + e}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + e}V${y0}Z`;
}
// one chart per stat over the odds ranges: 'total' = total cards, 'hcp' = home minus away cards
function oddsChart(rows, kind){
  const W = 560, H = 270, top = 26, bot = 46, left = 8, right = 8, n = rows.length, slot = (W - left - right) / n, bw = Math.min(40, slot * .56);
  const vals = rows.map(r => kind === 'total' ? r[4] : r[5]);

  const R = window.SLREF;
  if (!R) return '<p class="empty">Referee data is not available.</p>';
  const all = refGameList(), T = all ? refTables(all) : R;
  const sec = [['rf-cards', 'Card averages'], ['rf-odds', 'By the odds'], ['rf-big4', 'Big-4 games'], ['rf-small', 'Other games'], ['rf-report', 'Referee reports'], ['rf-rating', 'Ratings']];
  let h = `<p class="note">How many cards each referee shows, how cards follow the odds, and how each referee did this season. Card numbers cover league games since 2024–25 (Big-4 against Big-4 since 2021–22); ratings and comments are from diaititis.gr's referee reports. ${T.live ? `Worked out from all ${T.games} league games since 2024–25 in our own match data (the same games the model uses), refreshed with every update, so each round is in once its results are (last update ${window.SLREFGAMES.updated}, Athens). Cards are every yellow and red shown; home odds are the bookmakers' average closing 1X2 price.` : `A snapshot from ${dayName(R.updated)}; it switches to tables worked out from every game once those have all been read.`} Click a referee's name to see their games.</p>
    <div class="jump">${sec.map(([id, t]) => `<button class="chip" data-jump="${id}">${t}</button>`).join('')}</div>`;

  h += `<h2 id="rf-cards">Cards per game by referee</h2><div class="scroll"><table class="mk sortable" style="max-width:620px"><thead><tr><th>Referee</th><th class="n">Games</th><th class="n">Cards</th><th class="n">Home</th><th class="n">Away</th></tr></thead><tbody>`;
  for (const r of T.cards) h += `<tr class="${/avg$/.test(r[0]) ? 'avg' : ''}"><td>${/avg$/.test(r[0]) ? r[0].replace(/ avg$/, ' (average)') : refLink(r[0])}</td><td class="n">${r[1]}</td><td class="n tot">${n2(r[2])}</td><td class="n">${n2(r[3])}</td><td class="n">${n2(r[4])}</td></tr>`;
  h += '</tbody></table></div>';

  h += `<h2 id="rf-odds">Cards by the home team's odds</h2><p class="note">Games grouped by the home team's win odds. <b>Handicap</b> is home cards minus away cards; <b>Home more</b> and <b>Away more</b> are the share of games where that side got more cards (the rest were level).</p>`;
  h += oddsBlock(T.odds_all, null, capTotal(T.odds_all), capHcp(T.odds_all));
  h += `<h2 style="font-size:19px">Games with no Big-4 team</h2>`;
  h += oddsBlock(T.odds_small, T.odds_small_all, capTotal(T.odds_small), capHcp(T.odds_small));

  const b = T.big4_v_big4;
  h += `<h2 id="rf-big4">Big-4 against Big-4</h2><div class="scroll"><table class="mk" style="max-width:820px"><thead><tr><th>Seasons</th><th class="n">Games</th><th class="n">Home cards</th><th class="n">Away cards</th><th class="n">Total</th><th class="n">Handicap</th><th class="n">Home more</th><th class="n">Away more</th></tr></thead><tbody>
    <tr><td>${b[0]}</td><td class="n">${b[1]}</td><td class="n">${n2(b[2])}</td><td class="n">${n2(b[3])}</td><td class="n tot">${n2(b[4])}</td><td class="n">${sg(b[5])}</td><td class="n">${pc(b[6])}</td><td class="n">${pc(b[7])}</td></tr></tbody></table></div>`;
  if (T.h2h){
    h += `<h3 class="refsub">Head to head</h3><p class="note">Every league game between two Big-4 teams in the same span, one row per fixture: Panathinaikos – AEK is Panathinaikos at home, AEK – Panathinaikos the return game. <b>W</b>, <b>D</b>, <b>L</b> and <b>Win %</b> are the home side's; goals, cards and fouls are per game for the home (H) and away (A) side. Click a column to sort, a row to see its games.</p>
      <div class="scroll"><table class="mk h2h sortable" style="max-width:1100px"><thead><tr><th>Home – away</th><th class="n">Games</th><th class="n">W</th><th class="n">D</th><th class="n">L</th><th class="n" title="Home side's win %">Win %</th><th class="n" title="Home goals per game">Goals H</th><th class="n" title="Away goals per game">Goals A</th><th class="n" title="Home cards per game">Cards H</th><th class="n" title="Away cards per game">Cards A</th><th class="n">Total cards</th><th class="n" title="Home fouls per game">Fouls H</th><th class="n" title="Away fouls per game">Fouls A</th></tr></thead><tbody>`;
    const one = x => x == null ? '–' : x.toFixed(1);
    T.h2h.forEach((p, i) => {
      h += `<tr class="h2hrow" data-h2h="${i}" style="cursor:pointer"><td><span class="h2harrow">▸</span> ${p.a} – ${p.b}</td><td class="n">${p.n}</td><td class="n">${p.w}</td><td class="n">${p.d}</td><td class="n">${p.l}</td><td class="n">${p.n ? pc(100 * p.w / p.n) : '–'}</td><td class="n">${one(p.gf)}</td><td class="n">${one(p.ga)}</td><td class="n">${one(p.cf)}</td><td class="n">${one(p.ca)}</td><td class="n tot">${p.n ? n2(p.cf + p.ca) : '–'}</td><td class="n">${one(p.ff)}</td><td class="n">${one(p.fa)}</td></tr>
        <tr class="h2hgames follow" data-h2h="${i}" hidden><td colspan="13"><table class="mk" style="margin:4px 0 10px"><thead><tr><th>Date</th><th>Season</th><th>Match</th><th class="n">Score</th><th class="n">Cards</th><th class="n">Fouls</th><th>Referee</th></tr></thead><tbody>${
          p.games.map(g => `<tr><td class="muted">${ddmm(g.date)}</td><td class="muted">${refSeason(g.season)}</td><td>${g.home} – ${g.away}</td><td class="n">${g.hg}–${g.ag}</td><td class="n">${g.hc}–${g.ac}</td><td class="n">${g.hf == null ? '–' : `${g.hf}–${g.af}`}</td><td>${g.ref ? refLink(g.ref) : '<span class="muted">–</span>'}</td></tr>`).join('')
        }</tbody></table></td></tr>`;
    });
    h += '</tbody></table></div>';
  }

  h += `<h2>Greek referees in games with a Big-4 team</h2><p class="note">Games involving Olympiakos, Panathinaikos, AEK or PAOK, since 2024–25${T.live ? ', every referee' : ', for referees with 5 or more'}. <b>Big-4</b> is the cards the Big-4 side got per game, <b>Opp</b> its opponent's; <b>Handicap</b> is Big-4 minus opponent; <b>Big-4 fouls</b> and <b>Opp fouls</b> are fouls committed per game; <b>Win %</b> is the Big-4 side's. The last columns are the Big-4 side's results with that referee.</p>
    <div class="scroll"><table class="mk sortable"><thead><tr><th>Referee</th><th class="n">Games</th><th class="n" title="Cards the Big-4 side got per game">Big-4</th><th class="n" title="Cards its opponent got per game">Opp</th><th class="n">Total</th><th class="n">Handicap</th><th class="n" title="Fouls by the Big-4 side per game">Big-4 fouls</th><th class="n" title="Fouls by its opponent per game">Opp fouls</th><th class="n" title="Games where the Big-4 side got more cards">Big-4 more</th><th class="n" title="Games where the opponent got more cards">Opp more</th><th class="n">W</th><th class="n">D</th><th class="n">L</th><th class="n" title="Big-4 side's win %">Win %</th></tr></thead><tbody>`;
  const b4 = (r, cls = '') => `<tr class="${cls}"><td>${refLink(r[0], 'big4')}</td><td class="n">${r[1]}</td><td class="n">${n2(r[2])}</td><td class="n">${n2(r[3])}</td><td class="n tot">${n2(r[4])}</td><td class="n">${sg(r[5])}</td><td class="n">${r[6] == null ? '–' : n2(r[6])}</td><td class="n">${r[7] == null ? '–' : n2(r[7])}</td><td class="n">${pc(r[8])}</td><td class="n">${pc(r[9])}</td><td class="n">${r[10]}</td><td class="n">${r[11]}</td><td class="n">${r[12]}</td><td class="n">${pc(r[13])}</td></tr>`;
  T.big4.forEach(r => h += b4(r, r[1] < 5 ? 'few' : '')); h += b4(T.big4_avg, 'sum');
  h += `</tbody></table></div><p class="muted" style="font-size:14px;margin:6px 0 0">${T.live ? 'Referees with fewer than 5 games are in grey: too few to read much into.' : `The average row covers all ${T.big4_avg[1]} games, including the referees with fewer than 5 games, who aren't in the snapshot.`}</p>`;

  h += `<h2 id="rf-small">Greek referees in games with no Big-4 team</h2><p class="note">Since 2024–25${T.live ? ', every referee' : ', for referees with 5 or more such games'}. <b>Home %</b> and <b>Away %</b> are each side's share of the cards.</p>
    <div class="scroll"><table class="mk sortable" style="max-width:720px"><thead><tr><th>Referee</th><th class="n">Games</th><th class="n">Home</th><th class="n">Away</th><th class="n">Total</th><th class="n">Home %</th><th class="n">Away %</th></tr></thead><tbody>`;
  const sm = (r, cls = '') => `<tr class="${cls}"><td>${refLink(r[0], 'small')}</td><td class="n">${r[1]}</td><td class="n">${n2(r[2])}</td><td class="n">${n2(r[3])}</td><td class="n tot">${n2(r[4])}</td><td class="n">${pc(r[5])}</td><td class="n">${pc(r[6])}</td></tr>`;
  T.small.forEach(r => h += sm(r, r[1] < 5 ? 'few' : '')); h += sm(T.small_avg, 'sum');
  h += `</tbody></table></div><p class="muted" style="font-size:14px;margin:6px 0 0">${T.live ? 'Referees with fewer than 5 games are in grey: too few to read much into.' : `The average row covers all ${T.small_avg[1]} games, including the referees with fewer than 5 games, who aren't in the snapshot.`}</p>`;

  h += `<h2 id="rf-report">Referee reports 2026–27</h2><p class="note">Each game's referee, rated out of 10 by diaititis.gr, with a short summary. <b>Favoured</b> names the team that the key mistakes went for, where there was one.</p>
    <div class="scroll"><table class="mk rp sortable"><thead><tr><th data-ord>Date</th><th>Match</th><th class="n">Score</th><th>Referee</th><th class="n">Rating</th><th>Favoured</th><th data-nosort>Comment</th></tr></thead><tbody>`;
  for (const r of R.report) h += `<tr><td class="muted">${ddmm(r[0])}</td><td>${r[1].replace(' - ', ' – ')}</td><td class="n">${r[2].replace('-', '–')}</td><td>${refLink(r[3])}</td><td class="n">${rate(r[4])}</td><td>${r[5] ?? '<span class="muted">–</span>'}</td><td class="cm">${r[6]}</td></tr>`;
  h += '</tbody></table></div>';

  const rt = refRatings(R);
  h += `<h2 id="rf-rating">Referee ratings 2026–27</h2><p class="note">Average diaititis.gr rating per Greek referee this season, worked out from the reports above (referees from abroad left out).</p>
    <div class="scroll"><table class="mk sortable" style="max-width:520px"><thead><tr><th>Referee</th><th class="n">Games</th><th class="n">Rating</th><th class="n">Best</th><th class="n">Worst</th></tr></thead><tbody>`;
  for (const r of rt) h += `<tr><td>${refLink(r.ref)}</td><td class="n">${r.n}</td><td class="n">${rate(r.avg)}</td><td class="n">${r.best.toFixed(1)}</td><td class="n">${r.worst.toFixed(1)}</td></tr>`;
  return h + '</tbody></table></div>';
}
// click a column header to sort; averages stay on top, totals at the bottom; data-ord columns sort in the original order
function sortKey(td, ord, i){
  if (ord) return i;
  const t = td.textContent.trim();
  if (t === '–' || t === '') return null;
  const x = parseFloat(t.replace('−', '-').replace(/[%+]/g, ''));
  return /^[−+\-]?[\d.]+%?$/.test(t) ? x : t.toLowerCase();
}
function makeSortable(tbl){
  const body = tbl.tBodies[0], ths = [...tbl.tHead.rows[0].cells];
  [...body.rows].forEach((r, i) => r.dataset.i = i);
  // a "follow" row (the Big-4 head to head's game list) stays under the row above it
  const lead = [...body.rows].filter(r => !r.classList.contains('follow'));
  lead.forEach(r => { const n = r.nextElementSibling; if (n && n.classList.contains('follow')) r._follow = n; });
  ths.forEach((th, c) => {
    if ('nosort' in th.dataset) return;
    th.classList.add('rs'); th.dataset.label = th.textContent;
    th.onclick = () => {
      const ord = 'ord' in th.dataset, num = th.classList.contains('n');
      const dir = th.dataset.dir ? -th.dataset.dir : (ord || !num ? 1 : -1);
      ths.forEach(h => { if (h.dataset.label != null) { h.textContent = h.dataset.label; h.classList.remove('on'); delete h.dataset.dir; } });
      th.dataset.dir = dir; th.classList.add('on'); th.textContent = th.dataset.label + (dir > 0 ? ' ▲' : ' ▼');
      const rows = lead, top = rows.filter(r => r.classList.contains('avg')), bottom = rows.filter(r => r.classList.contains('sum'));
      const mid = rows.filter(r => !top.includes(r) && !bottom.includes(r)).map(r => [r, sortKey(r.cells[c], ord, +r.dataset.i)]);
      mid.sort(([, a], [, b]) => a == null ? 1 : b == null ? -1 : typeof a === 'number' && typeof b === 'number' ? dir * (a - b) : dir * String(a).localeCompare(String(b)));
      [...top, ...mid.map(m => m[0]), ...bottom].forEach(r => { body.appendChild(r); if (r._follow) body.appendChild(r._follow); });
    };
  });
}
function bindRefs(){
  document.querySelectorAll('table.sortable').forEach(makeSortable);
  document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => $(b.dataset.jump).scrollIntoView({behavior: 'smooth', block: 'start'}));
  const tip = $('tip');
  document.querySelectorAll('.chart .hit').forEach(el => {
    const bar = el.ownerSVGElement.querySelectorAll('.bar')[+el.dataset.i];
    el.onmousemove = e => { tip.innerHTML = el.dataset.tip.split('|').join('<br>'); tip.style.display = 'block';
      const w = tip.offsetWidth; tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
      bar.classList.add('hl'); };
    el.onmouseleave = () => { tip.style.display = 'none'; bar.classList.remove('hl'); };
  });
}

function render(){
  $('tip').style.display = 'none';
  $('out').innerHTML = {projections: renderProjections, open: () => renderValue('open'), settled: () => renderValue('settled'), market: renderMarket, results: renderResults, teams: renderTeams, refs: renderRefs, method: renderMethod}[view]();
  if (view === 'refs') bindRefs();
  document.querySelectorAll('#pjmode button').forEach(b => b.onclick = () => { pjMode = b.dataset.m; render(); });
  const chips = (id, set) => document.querySelectorAll(`#${id} .chip`).forEach(b => b.onclick = () => { set(b.dataset.s); render(); });
  chips('pjstat', s => pjStat = s); chips('rsstat', s => rsStat = s); chips('tmstat', s => tmStat = s);
  document.querySelectorAll('#stmk .chip').forEach(b => b.onclick = () => { stMkt = b.dataset.s; try { localStorage.setItem('sl-stmkt', stMkt); } catch (e) {} render(); });
  document.querySelectorAll('#valmin button').forEach(b => b.onclick = () => { valMin = +b.dataset.v; try { localStorage.setItem('sl-valmin', valMin); } catch (e) {} render(); });
  document.querySelectorAll('th.sort').forEach(t => t.onclick = () => { const k = t.dataset.k; tmSort = [k, tmSort[0] === k ? -tmSort[1] : (k === 'team' ? 1 : -1)]; render(); });
}
function setView(v){
  if (v === 'value') v = 'open';   // old links
  view = ['projections','open','settled','market','results','teams','refs','method'].includes(v) ? v : 'projections';
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.view === view));
  render();
}
document.querySelectorAll('#tabs a').forEach(a => a.onclick = e => { e.preventDefault(); history.replaceState(null, '', a.getAttribute('href')); setView(a.dataset.view); });
setView(new URLSearchParams(location.hash.slice(1)).get('view'));
</script>
