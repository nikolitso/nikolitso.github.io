<style>
:root{
  --bg:#0c1424; --panel:#131d33; --line:#26334f; --text:#f1ead9; --muted:#9aa4ba;
  --gold:#d4af37; --win:#6fcf97; --loss:#eb7a6c;
  --serif:'Playfair Display',Georgia,serif; --body:'Source Serif 4',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding:40px 16px 80px}
h1{font:700 clamp(30px,5vw,46px)/1.1 var(--serif);margin:0 0 6px}
h1 a{color:inherit;text-decoration:none}
h1 a:hover{color:var(--gold)}
.home-link{display:inline-block;margin-bottom:14px;font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.home-link:hover{color:var(--gold)}
.sub{font:400 13px var(--mono);color:var(--muted);letter-spacing:.04em;margin-bottom:32px}
.tabs{display:flex;flex-wrap:wrap;gap:10px 28px;border-bottom:1px solid var(--line);margin:0 0 26px}
.tabs a{border-bottom:2px solid transparent;color:var(--muted);font:600 18px var(--serif);padding:0 0 10px;margin-bottom:-1px;cursor:pointer;text-decoration:none}
.tabs a.on{color:var(--text);border-color:var(--gold)}
.tabs a:hover{color:var(--text)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:0 0 18px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content}
.seg button{background:none;border:0;color:var(--muted);font:500 13px var(--mono);padding:8px 16px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
.seg button.on{background:var(--gold);color:#0c1424}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:500 12px var(--mono);padding:5px 12px;cursor:pointer}
.chip:hover{color:var(--text)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#0c1424}
h2{font:600 22px var(--serif);margin:30px 0 12px}
h2.day{font-size:20px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(520px,100%),1fr));gap:18px}
.grid>.card{min-width:0}
.card td:first-child{white-space:normal}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 18px 10px}
.card h3{font:600 21px var(--serif);margin:0}
.card .ko{font:400 12px var(--mono);color:var(--muted);letter-spacing:.06em}
.wdl{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 6px;background:var(--line)}
.wdl i{display:block} .wdl i:nth-child(1){background:var(--gold)} .wdl i:nth-child(2){background:#59657f} .wdl i:nth-child(3){background:#5b7bd5}
.wdlt{display:flex;justify-content:space-between;font:400 12px var(--mono);color:var(--muted)}
.wdlt b{color:var(--text);font-weight:500}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:400 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-size:15px;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:13.5px}
td.tot{color:var(--gold);font-weight:500}
.card table{margin-top:6px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px 14px;flex-wrap:wrap}
.ref{font:400 11.5px/1.5 var(--mono);color:var(--muted);text-align:right;margin-left:auto}
.ref b{color:var(--text);font-weight:500}
.card tr:last-child td{border-bottom:0}
.ln{font:400 12px var(--mono);color:var(--muted);text-align:right}
.ln span{display:inline-block;min-width:92px}
.ln b{color:var(--text);font-weight:500}
.ln .hi{color:var(--win)} .ln .lo{color:var(--loss)}
th.sort{cursor:pointer;user-select:none} th.sort:hover,th.sort.on{color:var(--gold)}
.w{color:var(--win)} .l{color:var(--loss)}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.note{font:400 15px/1.55 var(--body);color:var(--muted);border-left:2px solid var(--gold);padding:2px 0 2px 14px;margin:0 0 14px;max-width:820px}
.note b{color:var(--text);font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 18px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.metric .lbl{font:400 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.metric .big{font:500 24px var(--mono);color:var(--gold)}
.scroll{overflow-x:auto}
.doc{max-width:860px}
.doc p,.doc li{font-size:16.5px;line-height:1.65;margin:0 0 14px}
.doc ul{padding-left:20px;margin:0 0 14px}
.doc h3{font:600 18px var(--serif);margin:28px 0 8px;display:flex;align-items:center;gap:10px}
.doc .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#0c1424;font:600 13px var(--mono);flex:none}
.calc{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:12px 16px;margin:0 0 14px;font:400 14px/2 var(--mono);overflow-x:auto}
.calc i{font-style:normal;color:var(--muted);font-size:12px}
.calc b{color:var(--gold);font-weight:500}
table.mini{margin:0 0 16px}
.abbr{display:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}.ln span{min-width:0;margin-left:8px}.card{padding:14px 10px 8px}td,th{padding:6px 4px}
  .card td{font-size:14px}.card td.n{font-size:12.5px}.full{display:none}.abbr{display:inline}.wdlt{flex-wrap:wrap;gap:2px 12px}}
</style>

<div class="wrap">
  <a class="home-link" href="/superleague/">&#8962; Home</a>
  <h1><a href="/superleague/">Greek Super League</a></h1>
  <div class="sub" id="sub"></div>

  <div class="tabs" id="tabs">
    <a href="#view=projections" data-view="projections" class="on">Projections</a>
    <a href="#view=results" data-view="results">Results</a>
    <a href="#view=teams" data-view="teams">Teams</a>
    <a href="#view=method" data-view="method">How it works</a>
  </div>
  <div id="out"></div>
</div>
<script src="data.js"></script>
<script>
const D = window.SL, $ = id => document.getElementById(id);
const L = D.labels, ORDER = D.order;
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayName = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const pct = x => Math.round(x*100) + '%';
const dec = s => ['xg','goals','woodwork'].includes(s) ? 2 : 1;
const f = (x, s) => x == null ? '–' : (+x).toFixed(s === 'possession' ? 0 : dec(s));
// actual counts are whole numbers; only xG has decimals
const fa = (x, s) => s === 'xg' ? f(x, s) : x == null ? '–' : String(Math.round(x));
let view = 'projections', pjMode = 'match', pjStat = 'corners', rsStat = 'goals', tmStat = 'goals', tmSort = ['for', -1];

$('sub').textContent = `${D.season.replace('-','–')} · updated ${D.updated} (Athens) · model built on ${D.history.games} games since ${D.history.from.slice(0,4)}`;

function linesHtml(lines){
  if (!lines) return '';
  return lines.map(([ln, p]) => `<span>O ${ln} <b class="${p >= .6 ? 'hi' : p <= .4 ? 'lo' : ''}">${pct(p)}</b></span>`).join('');
}

const mult = x => `×${x.toFixed(2)}`;
function refHtml(r){
  if (!r) return '<div class="ref">Referee <b>not announced</b></div>';
  if (!r.games) return `<div class="ref">Referee <b>${r.name}</b><br>no league games yet · no adjustment</div>`;
  return `<div class="ref">Referee <b>${r.name}</b><br>${r.games} game${r.games === 1 ? '' : 's'} · cards ${mult(r.cards)} · fouls ${mult(r.fouls)}</div>`;
}

// the line closest to a coin flip; all three show in the By stat view
const mainLine = lines => lines && [lines.reduce((a, b) => Math.abs(b[1] - .5) < Math.abs(a[1] - .5) ? b : a)];

function matchCard(g){
  const r = g.result, t = g.kickoff.slice(11);
  const rows = ORDER.map(s => {
    const x = g.stats[s];
    return `<tr><td>${L[s]}</td><td class="n">${f(x.home, s)}</td><td class="n">${f(x.away, s)}</td>`+
      `<td class="n tot">${x.total == null ? '' : f(x.total, s)}</td><td class="ln">${linesHtml(mainLine(x.lines))}</td></tr>`;
  }).join('');
  return `<div class="card"><div class="ko">${t}</div><div class="head"><h3>${g.home} <span class="muted">–</span> ${g.away}</h3>${refHtml(g.ref)}</div>
    <div class="wdl"><i style="width:${r.home*100}%"></i><i style="width:${r.draw*100}%"></i><i style="width:${r.away*100}%"></i></div>
    <div class="wdlt"><span>Home <b>${pct(r.home)}</b></span><span>Draw <b>${pct(r.draw)}</b></span><span>Away <b>${pct(r.away)}</b></span></div>
    <table><thead><tr><th>Stat</th><th class="n"><span class="full">${g.home}</span><span class="abbr">Home</span></th><th class="n"><span class="full">${g.away}</span><span class="abbr">Away</span></th><th class="n">Total</th><th class="n">Over</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function chipsHtml(id, cur, list){
  return `<div class="chips" id="${id}">` + list.map(s => `<button class="chip${s === cur ? ' on' : ''}" data-s="${s}">${L[s]}</button>`).join('') + '</div>';
}

function renderProjections(){
  if (!D.fixtures.length) return '<p class="empty">No fixtures scheduled in the next two weeks.</p>';
  let h = `<div class="bar"><div class="seg" id="pjmode"><button data-m="match" class="${pjMode==='match'?'on':''}">By match</button><button data-m="stat" class="${pjMode==='stat'?'on':''}">By stat</button></div>`;
  if (pjMode === 'stat') h += chipsHtml('pjstat', pjStat, ORDER);
  h += '</div>';
  const byDay = {};
  D.fixtures.forEach(g => (byDay[g.kickoff.slice(0,10)] ||= []).push(g));
  if (pjMode === 'match'){
    for (const [d, gs] of Object.entries(byDay)) h += `<h2 class="day">${dayName(d)}</h2><div class="grid">${gs.map(matchCard).join('')}</div>`;
    return h;
  }
  const s = pjStat;
  h += `<div class="scroll"><table><thead><tr><th>Kick-off</th><th>Match</th><th class="n">Home</th><th class="n">Away</th>${s==='possession'?'':'<th class="n">Total</th>'}<th class="n">${s==='possession'||s==='xg'?'':'Over line · chance'}</th></tr></thead><tbody>`;
  for (const g of D.fixtures){
    const x = g.stats[s];
    const rf = (s === 'cards' || s === 'fouls') && g.ref ? ` <span class="muted" style="font-size:12px">· ${g.ref.name}${g.ref.games ? ' ' + mult(g.ref[s]) : ''}</span>` : '';
    h += `<tr><td class="muted">${dayName(g.kickoff)} ${g.kickoff.slice(11)}</td><td>${g.home} – ${g.away}${rf}</td><td class="n">${f(x.home,s)}</td><td class="n">${f(x.away,s)}</td>${s==='possession'?'':`<td class="n tot">${f(x.total,s)}</td>`}<td class="ln">${linesHtml(x.lines)}</td></tr>`;
  }
  return h + '</tbody></table></div>';
}

function renderResults(){
  const s = rsStat, poss = s === 'possession';
  let h = `<p class="note">Every game this season, with the projection the model would have made the day before it (only earlier games used) next to what happened.</p>
    <div class="bar">${chipsHtml('rsstat', s, ORDER)}</div>`;
  const rows = D.results.filter(g => g.stats[s][2] != null);
  let err = 0;
  rows.forEach(g => { const [ph, pa, ah, aa] = g.stats[s]; err += poss ? Math.abs(ph - ah) : Math.abs(ph + pa - ah - aa); });
  h += `<div class="metrics"><div class="metric"><div class="lbl">Games</div><div class="big">${rows.length}</div></div>
    <div class="metric"><div class="lbl">Avg miss, ${poss ? 'home share' : 'match total'}</div><div class="big">${rows.length ? (err/rows.length).toFixed(2) : '–'}</div></div></div>`;
  h += `<div class="scroll"><table><thead><tr><th>Date</th><th>Match</th><th class="n">Projected</th><th class="n">Actual</th>${poss ? '' : '<th class="n">Proj. total</th><th class="n">Actual total</th>'}<th class="n">Miss</th></tr></thead><tbody>`;
  for (const g of rows){
    const [ph, pa, ah, aa] = g.stats[s];
    const miss = poss ? ah - ph : ah + aa - ph - pa;
    h += `<tr><td class="muted">${dayName(g.date)}</td><td>${g.home} – ${g.away}</td><td class="n">${f(ph,s)} – ${f(pa,s)}</td><td class="n">${fa(ah,s)} – ${fa(aa,s)}</td>`+
      (poss ? '' : `<td class="n">${f(ph+pa,s)}</td><td class="n tot">${fa(ah+aa,s)}</td>`)+
      `<td class="n muted">${miss > 0 ? '+' : ''}${f(miss,s)}</td></tr>`;
  }
  return h + '</tbody></table></div>';
}

function renderTeams(){
  const s = tmStat;
  let h = `<p class="note">Per-game averages this season. <b>For</b> is what the team produced, <b>against</b> is what its opponents produced.</p>
    <div class="bar">${chipsHtml('tmstat', s, ORDER)}</div>`;
  const [key, dir] = tmSort;
  const rows = D.teams.slice().sort((a, b) => key === 'team' ? dir * a.team.localeCompare(b.team) : dir * ((a[key][s] ?? -1) - (b[key][s] ?? -1)));
  const th = (k, lbl, n) => `<th class="sort${n ? ' n' : ''}${k === key ? ' on' : ''}" data-k="${k}">${lbl}${k === key ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  h += `<div class="scroll"><table style="max-width:640px"><thead><tr>${th('team','Team')}<th class="n">Games</th>${th('for','For',1)}${th('against','Against',1)}</tr></thead><tbody>`;
  for (const t of rows) h += `<tr><td>${t.team}</td><td class="n muted">${t.games}</td><td class="n tot">${f(t.for[s],s)}</td><td class="n">${f(t.against[s],s)}</td></tr>`;
  return h + '</tbody></table></div>';
}

const sgn = x => (x >= 0 ? '+ ' : '− ') + Math.abs(x).toFixed(1);
const vsAvg = (x, more, less) => Math.abs(x - 1) < .02 ? 'about average' : x > 1 ? `${Math.round((x-1)*100)}% ${more} than average` : `${Math.round((1-x)*100)}% ${less} than average`;
const ago = d => d < 300 ? `${Math.round(d/30)} months` : d < 500 ? '1 year' : `${Math.round(d/365)} years`;
function poisson(mu){ const p = [Math.exp(-mu)]; for (let i = 1; i <= 10; i++) p.push(p[i-1] * mu / i); return p; }

function renderMethod(){
  const A = D.accuracy, E = D.example;
  let h = '<div class="doc">';
  h += `<h2 style="margin-top:0">The idea</h2>
  <p>Every number on the Projections tab is built the same way. Start from what an average Super League game produces, then adjust it for how good or bad each team is at that stat, and finally for the referee (cards and fouls only).</p>`;
  if (E){
    const H = E.home, W = E.away, c = E.stats.corners, k = E.stats.cards, g = E.stats.goals, P = E.possession;
    const tH = D.teams.find(t => t.team === H), tW = D.teams.find(t => t.team === W);
    const x = (a, b, d) => (a * b * d).toFixed(2);
    const lines = ls => ls.map(([ln, p]) => `over ${ln}: <b>${pct(p)}</b>`).join(' · ');
    h += `<h2>Worked example: ${H} – ${W}</h2>
    <p>Here is every step for this round's <b>${H} – ${W}</b>, starting with corners. All the figures are the real ones behind the match card.</p>

    <h3><span class="num">1</span>Start from the league</h3>
    <p>In the Super League an average home team wins <b>${c.mu_home.toFixed(2)}</b> corners per game, and an average away team <b>${c.mu_away.toFixed(2)}</b>. Home advantage is already in these two numbers, which is why every stat has a home and an away average.</p>

    <h3><span class="num">2</span>Rate each team</h3>
    <p>Every team gets two ratings per stat. <b>For</b> is how much it produces and <b>against</b> is how much it lets opponents produce. 1.00 means league average.</p>
    <div class="scroll"><table class="mini"><thead><tr><th>Corners</th><th class="n">For</th><th>In words</th><th class="n">Against</th><th>In words</th></tr></thead><tbody>
      <tr><td>${H}</td><td class="n tot">${c.home_for.toFixed(2)}</td><td class="muted">wins ${vsAvg(c.home_for,'more','fewer')}</td><td class="n tot">${c.home_against.toFixed(2)}</td><td class="muted">concedes ${vsAvg(c.home_against,'more','fewer')}</td></tr>
      <tr><td>${W}</td><td class="n tot">${c.away_for.toFixed(2)}</td><td class="muted">wins ${vsAvg(c.away_for,'more','fewer')}</td><td class="n tot">${c.away_against.toFixed(2)}</td><td class="muted">concedes ${vsAvg(c.away_against,'more','fewer')}</td></tr>
    </tbody></table></div>
    <p>These ratings are not just this season's averages. This season ${H} win ${f(tH.for.corners,'corners')} and concede ${f(tH.against.corners,'corners')} corners a game, and ${W} win ${f(tW.for.corners,'corners')} and concede ${f(tW.against.corners,'corners')}, but that is only ${tH.games} and ${tW.games} games. The ratings use every game since ${D.history.from.slice(0,4)}. For corners, a game from ${ago(c.half_life)} ago counts half as much as last week's. They also adjust for opponents: winning 6 corners against a side that rarely concedes them is worth more than winning 6 against one that concedes plenty.</p>

    <h3><span class="num">3</span>Multiply</h3>
    <div class="calc">
      ${H} corners = ${c.mu_home.toFixed(2)} <i>home average</i> × ${c.home_for.toFixed(2)} <i>${H} for</i> × ${c.away_against.toFixed(2)} <i>${W} against</i> = <b>${x(c.mu_home,c.home_for,c.away_against)}</b><br>
      ${W} corners = ${c.mu_away.toFixed(2)} <i>away average</i> × ${c.away_for.toFixed(2)} <i>${W} for</i> × ${c.home_against.toFixed(2)} <i>${H} against</i> = <b>${x(c.mu_away,c.away_for,c.home_against)}</b><br>
      Match total = <b>${c.proj.total.toFixed(1)}</b> corners
    </div>
    <p>${W} ${c.away_for > 1 ? 'win more corners than most teams' : 'win fewer corners than most teams'}, and ${H} ${c.home_against > 1 ? 'concede more than most' : 'concede fewer than most'}. ${H} ${c.home_for < 1 ? 'win fewer than most' : 'win more than most'}, against a side that ${c.away_against < 1 ? 'rarely concedes them' : 'concedes plenty'}.</p>

    <h3><span class="num">4</span>Turn the projection into an over chance</h3>
    <p>${c.proj.total.toFixed(1)} is what this game would average if it could be played many times over. Any single game lands above or below. I measured how widely real totals have spread around their projections in more than 1,000 past games, and used that spread to get the chance of each line:</p>
    <div class="calc">${lines(c.proj.lines)}</div>
    <p>The match card shows the line closest to 50/50. The By stat view shows all three.</p>

    <h3><span class="num">5</span>Add the referee (cards and fouls)</h3>
    <p>Cards are worked out the same way. Without the referee:</p>
    <div class="calc">
      ${H} cards = ${k.mu_home.toFixed(2)} × ${k.home_for.toFixed(2)} × ${k.away_against.toFixed(2)} = ${x(k.mu_home,k.home_for,k.away_against)}<br>
      ${W} cards = ${k.mu_away.toFixed(2)} × ${k.away_for.toFixed(2)} × ${k.home_against.toFixed(2)} = ${x(k.mu_away,k.away_for,k.home_against)}
    </div>`;
    if (E.ref && E.ref.games){
      h += `<p>The referee is <b>${E.ref.name}</b>. In his ${E.ref.games} Super League games in the data, cards came out ${E.ref.cards >= 1 ? 'above' : 'below'} what the two teams alone would project. That gives him a factor of <b>${mult(E.ref.cards)}</b>, so both teams' cards are multiplied by it:</p>
      <div class="calc">${H} ${x(k.mu_home,k.home_for,k.away_against)} × ${E.ref.cards.toFixed(2)} = <b>${(+x(k.mu_home,k.home_for,k.away_against) * +E.ref.cards.toFixed(2)).toFixed(2)}</b> · ${W} ${x(k.mu_away,k.away_for,k.home_against)} × ${E.ref.cards.toFixed(2)} = <b>${(+x(k.mu_away,k.away_for,k.home_against) * +E.ref.cards.toFixed(2)).toFixed(2)}</b> · total <b>${k.proj.total.toFixed(1)}</b><br>${lines(k.proj.lines)}</div>`;
    } else {
      h += `<p>${E.ref ? `The referee, ${E.ref.name}, has no Super League games in the data` : 'The referee has not been announced yet'}, so there is no adjustment and the total stays at <b>${k.proj.total.toFixed(1)}</b>.</p>`;
    }
    h += `<p>A referee's factor is pulled hard toward ×1.00, because a referee's past is a weak guide here. In testing, games with the referees who looked strictest had no more cards than games with the most lenient. Adding referees cut the average miss on match cards only from ${A.cards.mae.toFixed(2)} to ${A.cards.ref_mae.toFixed(2)}, and on fouls from ${A.fouls.mae.toFixed(2)} to ${A.fouls.ref_mae.toFixed(2)}.</p>`;

    const ph = poisson(g.proj.home), pa = poisson(g.proj.away);
    let best = [0, 0, 0];
    ph.forEach((p, i) => pa.forEach((q, j) => { if (p*q > best[2]) best = [i, j, p*q]; }));
    h += `<h3><span class="num">6</span>Who wins</h3>
    <p>Goals are projected exactly like corners:</p>
    <div class="calc">
      ${H} goals = ${g.mu_home.toFixed(2)} × ${g.home_for.toFixed(2)} × ${g.away_against.toFixed(2)} = <b>${g.proj.home.toFixed(2)}</b><br>
      ${W} goals = ${g.mu_away.toFixed(2)} × ${g.away_for.toFixed(2)} × ${g.home_against.toFixed(2)} = <b>${g.proj.away.toFixed(2)}</b>
    </div>
    <p>Goals are rare, random events. A team expected to score ${g.proj.home.toFixed(2)} scores 0 in ${pct(ph[0])} of games, 1 in ${pct(ph[1])} and 2 in ${pct(ph[2])}. Doing this for both teams gives a chance for every score, and the most likely is <b>${best[0]}–${best[1]}</b> (${pct(best[2])}). Adding up all the scores: <b>${H} win ${pct(E.result.home)}</b>, <b>draw ${pct(E.result.draw)}</b>, <b>${W} win ${pct(E.result.away)}</b>.</p>

    <h3><span class="num">7</span>Possession</h3>
    <p>Possession is a split that always adds to 100%, so it can't be multiplied like the counts. Each team has one possession strength (points above or below an even split), and the home side gets a small edge:</p>
    <div class="calc">${H} possession = 50 ${sgn(P.edge)} <i>home edge</i> ${sgn(P.home)} <i>${H}</i> ${sgn(-P.away)} <i>${W}</i> = <b>${P.proj.toFixed(1)}%</b> · ${W} ${(100 - P.proj).toFixed(1)}%</div>
    <p>Shots, shots on target, xG, fouls, goal kicks, throw-ins, saves and woodwork all work like corners, each with its own averages and ratings.</p>`;
  }
  h += `<h2>Where the ratings come from</h2>
  <ul>
    <li><b>Data:</b> ${D.history.games} Super League games since ${D.history.from.slice(0,4)}–${D.history.from.slice(7,9)}. Goalkeeper saves before 2025 are worked out as the opponent's shots on target minus goals.</li>
    <li><b>Recent games count more.</b> How fast old games fade depends on the stat. The ones that change quickly with a team's coach and style fade fastest; mostly random ones need a long history to read:</li>
  </ul>
  <div class="scroll"><table class="mini" style="max-width:520px"><thead><tr><th>Stat</th><th>A game this old counts half</th></tr></thead><tbody>`;
  if (E) for (const s of ORDER) h += `<tr><td>${L[s]}</td><td class="muted">${ago(E.half_lives[s])}</td></tr>`;
  h += `</tbody></table></div>
  <ul>
    <li><b>Small samples are pulled toward average.</b> After four games a team isn't really a corner machine because it won 9 in one of them, so each team is treated as if it also played a few perfectly average games.</li>
    <li><b>Promoted teams</b> start from how promoted sides have usually done. For corners that's ${E ? Math.round((1 - E.newcomer[0])*100) : 15}% fewer won and ${E ? Math.round((E.newcomer[1] - 1)*100) : 12}% more conceded than average. Their own results take over as games come in.</li>
    <li><b>None of these settings are guesses.</b> For each stat I tried several combinations on every game since 2023–24, each time using only games played before that date, and kept the one that missed least.</li>
  </ul>

  <h2>How accurate is it?</h2>
  <p>The same test, game by game since 2023–24. <b>Model miss</b> is how far each team's projected number was from what it actually did, on average. <b>League-average miss</b> is the same thing if you had just used the league average for every team. <b>Better by</b> is the difference, and that's the value the model adds. <b>Miss on match total</b> is both teams together.</p>
  <div class="scroll"><table class="mini" style="max-width:760px"><thead><tr><th>Stat</th><th class="n">Model miss / team</th><th class="n">League-average miss</th><th class="n">Better by</th><th class="n">Miss on match total</th></tr></thead><tbody>`;
  for (const s of ORDER){
    const a = A[s];
    if (s === 'possession'){ h += `<tr><td>${L[s]}</td><td class="n">${a.mae.toFixed(2)} pts</td><td class="n muted">–</td><td class="n muted">–</td><td class="n muted">–</td></tr>`; continue; }
    const gain = 1 - a.team_mae / a.baseline;
    h += `<tr><td>${L[s]}</td><td class="n">${a.team_mae.toFixed(2)}</td><td class="n muted">${a.baseline.toFixed(2)}</td><td class="n ${gain > .05 ? 'w' : ''}">${pct(gain)}</td><td class="n">${a.mae.toFixed(2)}</td></tr>`;
  }
  h += `</tbody></table></div>
  <p>Over chances have held up: when the page said 60%, it happened about 60% of the time. Cards went over a few points more often than shown.</p>

  <h2>What it doesn't know</h2>
  <p>The model only sees past match stats. It doesn't know about injuries, suspensions, rotation, a new coach, the weather, or how much a game matters (derbies, cup weeks, the end of the season). Factor those in yourself, especially for cards and fouls, where the model barely beats the league average.</p>
  </div>`;
  return h;
}

function render(){
  $('out').innerHTML = {projections: renderProjections, results: renderResults, teams: renderTeams, method: renderMethod}[view]();
  document.querySelectorAll('#pjmode button').forEach(b => b.onclick = () => { pjMode = b.dataset.m; render(); });
  const chips = (id, set) => document.querySelectorAll(`#${id} .chip`).forEach(b => b.onclick = () => { set(b.dataset.s); render(); });
  chips('pjstat', s => pjStat = s); chips('rsstat', s => rsStat = s); chips('tmstat', s => tmStat = s);
  document.querySelectorAll('th.sort').forEach(t => t.onclick = () => { const k = t.dataset.k; tmSort = [k, tmSort[0] === k ? -tmSort[1] : (k === 'team' ? 1 : -1)]; render(); });
}
function setView(v){
  view = ['projections','results','teams','method'].includes(v) ? v : 'projections';
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.view === view));
  render();
}
document.querySelectorAll('#tabs a').forEach(a => a.onclick = e => { e.preventDefault(); history.replaceState(null, '', a.getAttribute('href')); setView(a.dataset.view); });
setView(new URLSearchParams(location.hash.slice(1)).get('view'));
</script>
</body>
