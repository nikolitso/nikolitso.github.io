*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 var(--body)}

tr.click{cursor:pointer} tr.click:hover td{background:rgba(212,175,55,.08)}

th.sort{cursor:pointer;user-select:none}th.sort:hover,th.sort.on{color:var(--gold)}

<div class="wrap">

  <h1><a href="/copa-libertadores-women/" data-home>Copa Libertadores Women</a></h1>

  <div class="tabs" id="tabs">

  </div>

        <button data-mode="team">Teams</button>
      </div>
    </div>
    <div><label for="a" id="la">Country</label><select id="a" class="pick"></select></div>
    <div class="vs">vs</div>

  </div>
  <div id="out"></div>
  </div>
</div>
<script src="data.js"></script>
<script>
const {matches, teams} = window.DATA;          // match: [edition, stage, date, home, away, homeGoals, awayGoals, 'PEN' | '', [odd1, oddX, odd2] | 0]
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = d => d.split('-').reverse().join('.');
const ALL_SEASONS = [...new Set(matches.map(m => m[0]))].sort();
const STAGES = ['Group', 'Play Offs'];
const STAGE_LABEL = {'Group': 'Main · Group', 'Play Offs': 'Play Offs'};
const CODE = {'Argentina':'ARG','Bolivia':'BOL','Brazil':'BRA','Chile':'CHI','Colombia':'COL','Ecuador':'ECU','Paraguay':'PAR','Peru':'PER','Uruguay':'URU','Venezuela':'VEN'};
const code = c => CODE[c] || c.slice(0, 3).toUpperCase();
const f2 = v => v.toFixed(2);
const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2);

let view = 'fixtures', mode = 'country';
const DEFAULT_SEASONS = 6;                      // last 6 editions: 5 past + the current one
let seasons = DEFAULT_SEASONS;                  // 0 = all editions
let stages = new Set(STAGES);
const keep = m => stages.has(m[1]) && (!seasons || ALL_SEASONS.indexOf(m[0]) >= ALL_SEASONS.length - seasons);

$('sub').textContent = `${matches.length} games · editions ${ALL_SEASONS[0]}–${ALL_SEASONS[ALL_SEASONS.length - 1]} · ${Object.keys(teams).length} teams · ${new Set(Object.values(teams)).size} countries`;

// ---------- shared sample bar
function sampleBar(id){
  const opts = [...Array(ALL_SEASONS.length - 1)].map((_, k) => k + 1).concat([0]).map(k =>
    `<option value="${k}"${k === seasons ? ' selected' : ''}>${k ? (k === 1 ? 'Last edition' : 'Last ' + k + ' editions') : 'All ' + ALL_SEASONS.length + ' editions'}</option>`).join('');
  return `<div class="fbar"><label>Sample <select id="${id}" class="peer">${opts}</select></label><span class="chips">` +
    STAGES.map(x => `<button type="button" class="chip${stages.has(x) ? ' on' : ''}" data-stage="${esc(x)}" aria-pressed="${stages.has(x)}">${esc(STAGE_LABEL[x])}</button>`).join('') + `</span></div>`;
}
function bindBar(box, id, rerender){
  box.querySelector('#' + id).onchange = e => { seasons = +e.target.value; sync(); rerender(); };
  box.querySelectorAll('.fbar .chip').forEach(b => b.onclick = () => {
    const st = b.dataset.stage;
    if (stages.has(st)){ if (stages.size > 1) stages.delete(st); }      // keep at least one stage
    else stages.add(st);
    sync(); rerender();
  });
}
const sampleText = () => (seasons ? `Sample: the ${seasons === 1 ? 'last edition' : 'last ' + seasons + ' editions'} (${ALL_SEASONS[ALL_SEASONS.length - seasons]} to ${ALL_SEASONS[ALL_SEASONS.length - 1]})` : `Sample: all ${ALL_SEASONS.length} editions (${ALL_SEASONS[0]}–${ALL_SEASONS[ALL_SEASONS.length - 1]})`) + `; stages: ${STAGES.filter(x => stages.has(x)).map(x => STAGE_LABEL[x]).join(', ')}.`;

// ---------- records
const ent = t => mode === 'team' ? t : teams[t];
function tally(){ return {w: 0, d: 0, l: 0, gf: 0, ga: 0, n: 0}; }
function add(r, gf, ga){ r.n++; r.gf += gf; r.ga += ga; gf > ga ? r.w++ : gf === ga ? r.d++ : r.l++; }
// every game re-oriented so that x comes first (same-entity games are left out)
function gamesFor(x){
  const out = [];
  for (const m of matches){
    if (!keep(m)) continue;
    const [, , , h, a, hg, ag] = m;
    const eh = ent(h), ea = ent(a);
    if (eh === ea) continue;
    if (eh === x) out.push({m, own: h, opp: a, oppE: ea, gf: hg, ga: ag, first: true});
    else if (ea === x) out.push({m, own: a, opp: h, oppE: eh, gf: ag, ga: hg, first: false});
  }
  return out;
}
function record(gs){ const r = tally(); gs.forEach(g => add(r, g.gf, g.ga)); return r; }
const avgPair = r => r.n ? f2(r.gf / r.n) + '–' + f2(r.ga / r.n) : '–';
const wdl = r => r.n ? `<b><span class="w">${r.w}</span>–<span class="d">${r.d}</span>–<span class="l">${r.l}</span></b>` : '<b>–</b>';

// ---------- Power rankings: Elo over all games in date order, for countries and for clubs
// Start 1500; K 20; no home advantage (the finals tournament is played at one venue); goal-difference multiplier as in World Football Elo.
// Draws (including shootouts) score 0.5. Country ratings skip games between clubs of the same country; club ratings count every game.
// The sample only changes the record columns; the rating always reflects today.
const RANK = {};
const entOf = (kind, t) => kind === 'club' ? t : teams[t];
function computeRankings(kind){
  const K = 20, elo = {}, get = c => (elo[c] ??= 1500);
  for (const m of matches.slice().sort((x, y) => x[2].localeCompare(y[2]))){
    const [, , , h, a, hg, ag] = m, ch = entOf(kind, h), ca = entOf(kind, a);
    if (ch === ca) continue;
    const rh = get(ch), ra = get(ca), gd = Math.abs(hg - ag);
    const exp = 1 / (1 + 10 ** ((ra - rh) / 400)), s = hg > ag ? 1 : hg === ag ? .5 : 0;
    const G = gd <= 1 ? 1 : gd === 2 ? 1.5 : (11 + gd) / 8;
    const d = K * G * (s - exp);
    elo[ch] = rh + d; elo[ca] = ra - d;
  }
  return Object.entries(elo).map(([c, e]) => ({c, elo: e})).sort((x, y) => y.elo - x.elo);
}
const rkSort = {country: {k: 'place', dir: 1}, club: {k: 'place', dir: 1}};
function renderRankings(kind = 'country'){
  RANK[kind] ||= computeRankings(kind);
  const club = kind === 'club', sort = rkSort[kind], boxId = club ? 'clView' : 'rkView', barId = club ? 'clSeasons' : 'rkSeasons';
  const st = {};
  for (const m of matches){
    if (!keep(m)) continue;
    const [, , , h, a, hg, ag] = m, ch = entOf(kind, h), ca = entOf(kind, a);
    if (ch === ca) continue;
    add(st[ch] ??= tally(), hg, ag); add(st[ca] ??= tally(), ag, hg);
  }
  const list = RANK[kind].map((r, i) => {
    const x = st[r.c] || tally();
    const gd = x.n ? (x.gf - x.ga) / x.n : null;
    const keys = {place: i + 1, name: r.c, rating: r.elo, games: x.n, wdl: x.n ? x.w - x.l : null, pct: x.n ? x.w / x.n : null,
      goals: x.n ? x.gf - x.ga : null, avgf: x.n ? x.gf / x.n : null, avga: x.n ? x.ga / x.n : null, margin: gd};
    return {keys, html: `<tr class="click" data-c="${esc(r.c)}"><td class="n">${i + 1}</td>
      <td><b>${esc(r.c)}</b> <span class="tag">(${esc(code(club ? teams[r.c] : r.c))})</span></td>
      <td class="n"><b class="hcp">${Math.round(r.elo)}</b></td>
      <td class="n">${x.n}</td>
      <td class="n">${x.n ? `<span class="w">${x.w}</span>–<span class="d">${x.d}</span>–<span class="l">${x.l}</span>` : '–'}</td>
      <td class="n">${x.n ? (x.w / x.n * 100).toFixed(0) + '%' : '–'}</td>
      <td class="n">${x.n ? x.gf + '–' + x.ga : '–'}</td>
      <td class="n">${x.n ? f2(x.gf / x.n) : '–'}</td>
      <td class="n">${x.n ? f2(x.ga / x.n) : '–'}</td>
      <td class="n">${gd === null ? '–' : sgn(gd)}</td></tr>`};
  });
  const {k, dir} = sort;
  list.sort((p, q) => {                                           // empty values always last
    const a = p.keys[k], b = q.keys[k];
    if (a === null || b === null) return (a === null) - (b === null) || p.keys.place - q.keys.place;
    return (typeof a === 'string' ? a.localeCompare(b) : a - b) * dir || p.keys.place - q.keys.place;
  });
  const rows = list.filter(x => x.keys.games).map(x => x.html).join('');       // no games in the sample: not listed
  const th = (key, label, cls, title) => `<th class="${cls} sort${key === k ? ' on' : ''}" data-k="${key}"${title ? ` title="${title}"` : ''}>${label}${key === k ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  const box = $(boxId);
  box.innerHTML = sampleBar(barId) + `<div class="scroll"><table><tr>${th('place', '#', 'n')}${th('name', club ? 'Club' : 'Country', '')}
    ${th('rating', 'Rating', 'n', 'Elo rating today: starts at 1500, rises with wins (more for beating strong sides, and by more goals)')}
    ${th('games', 'Games', 'n', club ? 'Games within the sample' : 'Games against clubs from other countries, within the sample')}${th('wdl', 'W–D–L', 'n', 'Sorted by wins minus losses')}${th('pct', 'Win %', 'n')}
    ${th('goals', 'Goals', 'n', 'Goals for–against; sorted by goal difference')}${th('avgf', 'Avg GF', 'n', 'Goals scored per game')}${th('avga', 'Avg GA', 'n', 'Goals conceded per game')}
    ${th('margin', 'Margin', 'n', 'Average goal difference per game')}</tr>${rows}</table></div>
    <div class="tag" style="margin-top:14px">${sampleText()} Games, W–D–L, goals and margin cover the sample only. Rating is an Elo rating updated game by game since ${ALL_SEASONS[0]} and always reflects today. ${club ? 'Every game counts, including those between clubs of the same country.' : 'Games between clubs from the same country are not counted.'} Matches level after extra time count as draws, including those settled on penalties. Click a column heading to sort, a ${club ? 'club' : 'country'} for its full record.</div>`;
  bindBar(box, barId, () => renderRankings(kind));
  box.querySelectorAll('th.sort').forEach(h => h.onclick = () => {              // first click: best first; again: reverse
    const key = h.dataset.k;
    rkSort[kind] = key === k ? {k, dir: -dir} : {k: key, dir: key === 'place' || key === 'name' || key === 'avga' ? 1 : -1};
    renderRankings(kind);
  });
  box.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => {
    setMode(club ? 'team' : 'country'); $('a').value = tr.dataset.c; $('b').value = '';
    setView('h2h'); sync(); renderH2H(); window.scrollTo({top: 0, behavior: 'smooth'});
  });
}

// ---------- Head to head
function names(){ return mode === 'team' ? Object.keys(teams).sort() : [...new Set(Object.values(teams))].sort(); }
function fillOptions(){
  const body = mode === 'team'
    ? [...new Set(Object.values(teams))].sort().map(c => `<optgroup label="${esc(c)}">` + Object.keys(teams).filter(t => teams[t] === c).sort().map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('') + '</optgroup>').join('')
    : names().map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  $('a').innerHTML = `<option value="">Select a ${mode}</option>` + body;
  $('b').innerHTML = `<option value="">Any ${mode} (optional)</option>` + body;
}
const oddsCell = o => o ? `${o[0].toFixed(2)} · ${o[1].toFixed(2)} · ${o[2].toFixed(2)}` : '';
function gameRow(g, withOdds){
  const [season, stage, date, h, a, hg, ag, pen, odds] = g.m;
  const res = g.gf > g.ga ? 'w' : g.gf === g.ga ? 'd' : 'l';
  const match = g.first ? `<b>${esc(g.own)}</b> – ${esc(g.opp)}` : `${esc(g.opp)} – <b>${esc(g.own)}</b>`;
  // odds are quoted for the match as listed (home · draw · away)
  return `<tr><td class="n">${fmtDate(date)}</td><td>${match}</td><td class="n ${res}">${hg}–${ag}${pen ? ' <span class="tag">pens</span>' : ''}</td><td class="tag">${esc(season)} · ${esc(stage)}</td>${withOdds ? `<td class="n tag">${oddsCell(odds)}</td>` : ''}</tr>`;
}
function renderH2H(){
  const box = $('out');
  const A = $('a').value.trim(), B = $('b').value.trim();
  const ok = n => names().includes(n);
  const put = h => { box.innerHTML = sampleBar('hSeasons') + h; bindBar(box, 'hSeasons', renderH2H); };
  if (!A){ put(`<div class="empty">Pick a ${mode} to see its record against everyone, or two to see their head to head.</div>`); return; }
  if (!ok(A)){ put(`<div class="empty">No ${mode} called “${esc(A)}”. Choose from the suggestions.</div>`); return; }
  const gs = gamesFor(A);

  if (B && ok(B)){
    if (A === B){ put(`<div class="empty">Pick two different ${mode === 'team' ? 'teams' : 'countries'}.</div>`); return; }
    const h = gs.filter(g => g.oppE === B).sort((x, y) => y.m[2].localeCompare(x.m[2]));
    if (!h.length){ put(`<div class="empty">${esc(A)} and ${esc(B)} have not met in this sample.</div>`); return; }
    const r = record(h), sub = x => mode === 'team' ? teams[x] : '';
    const gd = (r.gf - r.ga) / r.n;
    let html = `<div class="card"><div class="score">
      <div><div class="name">${esc(A)}</div><div class="ctry">${esc(sub(A))}</div></div>
      <div><div class="big">${r.w}–${r.d}–${r.l}</div><div class="lbl">${r.n} game${r.n > 1 ? 's' : ''} · W–D–L for ${esc(A)}</div></div>
      <div><div class="name">${esc(B)}</div><div class="ctry">${esc(sub(B))}</div></div></div>
      <div class="bar"><i style="width:${r.w / r.n * 100}%"></i><i class="d" style="width:${r.d / r.n * 100}%"></i><i class="l" style="width:${r.l / r.n * 100}%"></i></div>
      <div class="facts"><span>Goals <b>${r.gf}–${r.ga}</b></span><span>Avg goals <b>${avgPair(r)}</b></span><span>Avg total <b>${f2((r.gf + r.ga) / r.n)}</b></span><span>Avg margin <b>${sgn(gd)}</b> for ${esc(A)}</span><span>First meeting <b>${fmtDate(h[h.length - 1].m[2])}</b></span></div></div>`;
    if (mode === 'country'){
      const by = {};
      for (const g of h){ const k = g.own + '|' + g.opp; (by[k] ||= []).push(g); }
      const rows = Object.entries(by).map(([k, v]) => ({k, r: record(v)})).sort((x, y) => y.r.n - x.r.n);
      html += `<h2>By club</h2><div class="scroll"><table><tr><th>${esc(A)} club</th><th>${esc(B)} club</th><th class="n">P</th><th class="n">W–D–L</th><th class="n">Goals</th></tr>` +
        rows.map(({k, r}) => { const [o, p] = k.split('|'); return `<tr><td>${esc(o)}</td><td>${esc(p)}</td><td class="n">${r.n}</td><td class="n">${r.w}–${r.d}–${r.l}</td><td class="n">${r.gf}–${r.ga}</td></tr>`; }).join('') + `</table></div>`;
    }
    const withOdds = h.some(g => g.m[8]);
    html += `<h2>Games</h2><div class="scroll"><table><tr><th class="n">Date</th><th>Match</th><th class="n">Score</th><th>Competition</th>${withOdds ? '<th class="n" title="Pre-match 1X2 odds for the match as listed (home · draw · away), BetExplorer">Odds 1 · X · 2</th>' : ''}</tr>${h.map(g => gameRow(g, withOdds)).join('')}</table></div>
      <div class="tag" style="margin-top:14px">Scores after extra time; ties settled on penalties count as draws and are marked. Odds come from BetExplorer, which lists them for the 2025 edition only, and not for every game.</div>`;
    put(html);
    return;
  }

  // Single selection: record vs every opponent
  if (!gs.length){ put(`<div class="empty">No games found for ${esc(A)} in this sample.</div>`); return; }
  const by = {};
  for (const g of gs) (by[g.oppE] ||= []).push(g);
  const rows = Object.entries(by).map(([o, v]) => ({o, r: record(v)})).sort((x, y) => y.r.n - x.r.n || x.o.localeCompare(y.o));
  const tot = record(gs);
  put(`<div class="card"><div class="score"><div></div><div><div class="name">${esc(A)}</div><div class="ctry">${mode === 'team' ? esc(teams[A]) : ''}</div><div class="big" style="margin-top:12px">${tot.w}–${tot.d}–${tot.l}</div><div class="lbl">${tot.n} games · ${rows.length} opponents</div></div><div></div></div>
    <div class="facts"><span>Goals <b>${tot.gf}–${tot.ga}</b></span><span>Avg goals <b>${avgPair(tot)}</b></span><span>Avg margin <b>${sgn((tot.gf - tot.ga) / tot.n)}</b></span></div></div>
    <div class="tag" style="margin-bottom:8px">Click an opponent for the full head to head.</div>
    <div class="scroll"><table><tr><th>Opponent</th><th class="n">P</th><th class="n">W</th><th class="n">D</th><th class="n">L</th><th class="n">GF</th><th class="n">GA</th><th class="n" title="Average goals for–against per game">Avg goals</th></tr>` +
    rows.map(({o, r}) => `<tr class="click" data-o="${esc(o)}"><td>${esc(o)}${mode === 'team' ? ` <span class="tag">${esc(teams[o])}</span>` : ''}</td><td class="n">${r.n}</td><td class="n w">${r.w}</td><td class="n d">${r.d}</td><td class="n l">${r.l}</td><td class="n">${r.gf}</td><td class="n">${r.ga}</td><td class="n">${avgPair(r)}</td></tr>`).join('') + `</table></div>`);
  box.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => { $('b').value = tr.dataset.o; sync(); renderH2H(); window.scrollTo({top: 0, behavior: 'smooth'}); });
}

// ---------- Fixtures: the games still to play, with the head to head of the two countries and the odds
const FX = window.DATA.fixtures || [];
// record of country x against country y over the sample, from x's side
function countryH2H(x, y){
  const r = tally();
  for (const m of matches){
    if (!keep(m)) continue;
    const [, , , h, a, hg, ag] = m, ch = teams[h], ca = teams[a];
    if (ch === x && ca === y) add(r, hg, ag);
    else if (ch === y && ca === x) add(r, ag, hg);
  }
  return r;
}
function clubH2H(x, y){
  const r = tally();
  for (const m of matches){
    if (!keep(m)) continue;
    const [, , , h, a, hg, ag] = m;
    if (h === x && a === y) add(r, hg, ag);
    else if (h === y && a === x) add(r, ag, hg);
  }
  return r;
}
function oddsCells(o){
  if (!o) return '<td class="n tag">–</td>';
  const lo = Math.min(...o);
  return '<td class="n">' + o.map(v => v === lo ? `<span class="fav">${v.toFixed(2)}</span>` : v.toFixed(2)).join(' · ') + '</td>';
}
function renderFixtures(){
  const days = {};
  for (const f of FX) (days[f[0] || 'TBC'] ||= []).push(f);
  const keys = Object.keys(days).sort((x, y) => x === 'TBC' ? 1 : y === 'TBC' ? -1 : x.localeCompare(y));
  const dayName = d => d === 'TBC' ? 'Date to be set' : new Date(d + 'T12:00:00').toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long'});
  const body = keys.map(d => `<div class="day">${esc(dayName(d))}</div><div class="scroll"><table><tr><th class="n">Time</th><th>Grp</th><th>Match</th>
    <th class="n" title="Record of the home side's country against the away side's country in the sample: W–D–L from the home side's point of view">Country H2H</th>
    <th class="n" title="Goals for–against, home side's country">Goals</th><th class="n" title="Average goals for–against per game">Avg goals</th>
    <th class="n" title="Pre-match 1X2 odds, BetExplorer; the shortest price is in gold">Odds 1 · X · 2</th></tr>` +
    days[d].map(([date, time, grp, h, a, hc, ac, odds]) => {
      const same = hc === ac, r = same ? null : countryH2H(hc, ac), rc = clubH2H(h, a);
      return `<tr class="click" data-a="${esc(hc)}" data-b="${esc(ac)}"><td class="n">${esc(time || '–')}</td><td class="tag">${esc(grp)}</td>
        <td><b>${esc(h)}</b> – <b>${esc(a)}</b><br><span class="tag">${esc(code(hc))} v ${esc(code(ac))}${rc.n ? ` · clubs met ${rc.n}×: ${rc.w}–${rc.d}–${rc.l}` : ''}</span></td>
        <td class="n">${same ? '<span class="tag">same country</span>' : r.n ? wdl(r) + ` <span class="tag">${r.n}</span>` : '<span class="tag">no games</span>'}</td>
        <td class="n">${r && r.n ? r.gf + '–' + r.ga : '–'}</td><td class="n">${r && r.n ? avgPair(r) : '–'}</td>${oddsCells(odds)}</tr>`;
    }).join('') + `</table></div>`).join('');
  const box = $('fxView');
  box.innerHTML = sampleBar('fxSeasons') + (FX.length ? body : '<div class="empty">No fixtures to show.</div>') +
    `<div class="tag" style="margin-top:14px">${sampleText()} Country H2H is the record of the home side's country against the away side's country in the sample, W–D–L from the home side's point of view (extra-time draws, including penalty shootouts, count as draws). Times are Athens time. Odds are BetExplorer 1X2 prices, shown when listed; none are held for these games yet. Click a game for the full country head to head.</div>`;
  bindBar(box, 'fxSeasons', renderFixtures);
  box.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => {
    if (tr.dataset.a === tr.dataset.b) return;
    setMode('country'); $('a').value = tr.dataset.a; $('b').value = tr.dataset.b;
    setView('h2h'); sync(); renderH2H(); window.scrollTo({top: 0, behavior: 'smooth'});
  });
}

// ---------- views, state in the URL hash
function setView(v){
  view = ['h2h', 'rankings', 'clubs'].includes(v) ? v : 'fixtures';
  document.querySelectorAll('#tabs a').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  $('fxView').hidden = view !== 'fixtures';
  $('rkView').hidden = view !== 'rankings';
  $('clView').hidden = view !== 'clubs';
  $('h2hView').hidden = view !== 'h2h';
  if (view === 'fixtures') renderFixtures(); else if (view === 'rankings') renderRankings('country'); else if (view === 'clubs') renderRankings('club'); else renderH2H();
}
function setMode(m){
  mode = m;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('la').textContent = m === 'team' ? 'Team' : 'Country'; $('lb').textContent = 'Opponent (optional)';
  fillOptions();
}
function sync(){
  const q = new URLSearchParams({view});
  if (view === 'h2h'){
    if (mode !== 'country') q.set('mode', mode);
    if ($('a').value) q.set('a', $('a').value);
    if ($('b').value) q.set('b', $('b').value);
  }
  if (seasons !== DEFAULT_SEASONS) q.set('seasons', seasons || 'all');
  if (stages.size < STAGES.length) q.set('stages', STAGES.filter(x => stages.has(x)).join(','));
  history.replaceState(null, '', '#' + q.toString());
}
document.querySelectorAll('#tabs a').forEach(b => b.onclick = e => { if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return; e.preventDefault(); setView(b.dataset.view); sync(); });
document.querySelectorAll('[data-home]').forEach(a => a.onclick = e => {
  e.preventDefault(); setMode('country'); $('a').value = $('b').value = ''; seasons = DEFAULT_SEASONS; stages = new Set(STAGES);
  setView('fixtures'); history.replaceState(null, '', location.pathname); window.scrollTo({top: 0, behavior: 'smooth'});
});
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { setMode(b.dataset.mode); $('a').value = $('b').value = ''; sync(); renderH2H(); });
['a', 'b'].forEach(id => $(id).addEventListener('change', () => { sync(); renderH2H(); }));

const p = new URLSearchParams(location.hash.slice(1));
setMode(p.get('mode') === 'team' ? 'team' : 'country');
const n0 = +p.get('seasons');
if (p.get('seasons') === 'all') seasons = 0; else if (n0 >= 1 && n0 < ALL_SEASONS.length) seasons = Math.round(n0);
const st0 = (p.get('stages') || '').split(',').filter(x => STAGES.includes(x)); if (st0.length) stages = new Set(st0);
$('a').value = p.get('a') || ''; $('b').value = p.get('b') || '';
setView(p.get('view'));
</script>
</body>
