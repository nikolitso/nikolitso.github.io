<style>
:root{
  --bg:#0c1424; --panel:#131d33; --line:#26334f; --text:#f1ead9; --muted:#9aa4ba;
  --gold:#d4af37; --win:#6fcf97; --loss:#eb7a6c;
  --serif:'Playfair Display',Georgia,serif; --body:'Source Serif 4',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  /* shared base (assets/an.css): the page's own names mapped onto the tokens */
  --bg:var(--an-paper); --panel:var(--an-soft); --line:var(--an-rule); --text:var(--an-ink); --muted:var(--an-muted);
  --gold:var(--an-accent); --win:var(--an-accent); --loss:var(--an-muted);
  --serif:var(--an-display); --body:var(--an-body); --mono:var(--an-mono); --an-wrap:1180px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
.sub{font:400 14.5px var(--mono);color:var(--muted);letter-spacing:.04em;margin-bottom:22px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:0 0 18px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content}
.seg button{background:none;border:0;color:var(--muted);font:500 14.5px var(--mono);padding:8px 16px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
.seg button.on{background:var(--gold);color:var(--an-on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:500 13.5px var(--mono);padding:5px 12px;cursor:pointer}
.chip:hover{color:var(--text)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--an-on-accent)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.fact{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;color:var(--muted)}
.fact b{font:500 15px var(--mono);color:var(--gold);margin-right:4px}
h2{font:600 22px var(--serif);margin:30px 0 12px}
h2.day{font-size:20px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(520px,100%),1fr));gap:18px}
.grid>.card{min-width:0}
.grid>.mcard{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:0;align-content:start}
.mcard .top{padding-bottom:4px}
.card td:first-child{white-space:normal}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 18px 10px}
.card h3{font:600 24px var(--serif);margin:0}
.live{font:500 12.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--gold);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:1px}
.card .ko{font:500 15.5px var(--mono);color:var(--text);letter-spacing:.06em}
.wdl{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 6px;background:var(--line)}
.wdl i{display:block} .wdl i:nth-child(1){background:var(--gold)} .wdl i:nth-child(2){background:var(--an-muted)} .wdl i:nth-child(3){background:var(--an-bar)}
.wdlt{display:flex;justify-content:space-between;font:400 15.5px var(--mono);color:var(--muted)}
.wdlt b{color:var(--text);font-weight:500}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:400 12.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-size:16.5px;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:15px}
td.tot{color:var(--gold);font-weight:500}
.card table{margin-top:6px}
table.mk{margin-bottom:6px}table.mk td,table.mk th{padding:6px 7px}
.stack{display:grid;gap:18px}
.mkcols{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:start;margin-top:8px}
@media(max-width:900px){.mkcols{grid-template-columns:1fr}.mkcols table{display:block;overflow-x:auto}}
.stack>.card{min-width:0}
.wdlt i{font-style:normal;color:var(--gold)}
.wdlt span:nth-child(2){text-align:center}.wdlt span:last-child{text-align:right}
.coach .who{display:inline-block;min-width:118px;color:var(--muted)}
.tenure{font:400 13.5px/1.4 var(--mono);color:var(--muted);margin-top:2px}
.coach{font:400 15px/1.55 var(--mono);color:var(--muted);margin-top:2px}
.coach b{color:var(--text);font-weight:500}
.coach .wc{display:inline-block;width:7ch;text-align:right}
table.tm{max-width:1000px}table.tm .gl{border-left:1px solid var(--line);padding-left:12px}
table.tm tr.grp th{color:var(--gold);border-bottom:0;padding-bottom:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px 14px;flex-wrap:wrap}
.ref{font:400 15px/1.55 var(--mono);color:var(--muted);margin-top:6px}
.ref b{color:var(--text);font-weight:500}
.card tr:last-child td{border-bottom:0}
.ln{font:400 13.5px var(--mono);color:var(--muted);text-align:right}
.ln span{display:inline-block;min-width:92px}
.ln b{color:var(--text);font-weight:500}
.ln .hi{color:var(--win)} .ln .lo{color:var(--loss)}
th.sort{cursor:pointer;user-select:none} th.sort:hover,th.sort.on{color:var(--gold)}
.w{color:var(--win)} .l{color:var(--loss)}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.note{font:400 16.5px/1.55 var(--body);color:var(--muted);border-left:2px solid var(--gold);padding:2px 0 2px 14px;margin:0 0 14px;max-width:820px}
.note b{color:var(--text);font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 18px}
.mc .ref{font:400 13.5px var(--mono);color:var(--muted);margin:8px 0 0}
.mc .ref b{color:var(--text);font-weight:500}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.metric .lbl{font:400 12.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.metric .big{font:500 24px var(--mono);color:var(--gold)}
.scroll{overflow-x:auto}
.doc{max-width:860px}
.doc p,.doc li{font-size:16.5px;line-height:1.65;margin:0 0 14px}
.doc ul{padding-left:20px;margin:0 0 14px}
.doc h3{font:600 18px var(--serif);margin:28px 0 8px;display:flex;align-items:center;gap:10px}
.doc .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--an-on-accent);font:600 14.5px var(--mono);flex:none}
.calc{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:12px 16px;margin:0 0 14px;font:400 15.5px/2 var(--mono);overflow-x:auto}
.calc i{font-style:normal;color:var(--muted);font-size:13.5px}
.calc b{color:var(--gold);font-weight:500}
table.mini{margin:0 0 16px}
.abbr{display:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}.ln span{min-width:0;margin-left:8px}.card{padding:14px 10px 8px}td,th{padding:6px 4px}
  .card td{font-size:15.5px}.card td.n{font-size:14px}.full{display:none}.abbr{display:inline}.wdlt{flex-wrap:wrap;gap:2px 12px}}

.mc .sc{font:500 26px var(--mono);color:var(--gold);white-space:nowrap}
.mc .tm{font:600 20px var(--serif)}
.mc .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mc .meta{font:400 13.5px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.mc td.lbl{color:var(--muted);font:400 13.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.mc td.n{width:30%} .mc td.n.h{text-align:left}
.mc td.n b{color:var(--text);font-weight:500} .mc td.n.lo{color:var(--muted)}
.bar2{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line);margin-top:3px}
.bar2 i{display:block;background:var(--gold)} .bar2 i+i{background:#5b7bd5}
table.tt th.sort{text-align:right} table.tt th:first-child{text-align:left}
tr.sel td{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.odds{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px;font:400 14px var(--mono);color:var(--muted)}
.odds .od{border:1px solid var(--line);border-radius:5px;padding:2px 7px;white-space:nowrap}
.odds .od i{font-style:normal;margin-right:5px;font-size:12.5px}
.odds .od.hit{border-color:var(--gold);color:var(--gold)}
.odds .sep{flex:0 0 6px}
</style>
