<style>
:root{
  --bg:#0c1424; --panel:#131d33; --line:#26334f; --text:#f1ead9; --muted:#9aa4ba;
  --gold:#d4af37; --win:#6fcf97; --loss:#eb7a6c;
  --serif:'Playfair Display',Georgia,serif; --body:'Source Serif 4',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  /* shared base (assets/an.css): the page's own names mapped onto the tokens */
  --bg:var(--an-paper); --panel:var(--an-soft); --line:var(--an-rule); --text:var(--an-ink); --muted:var(--an-muted);
  --gold:var(--an-accent); --win:var(--an-accent); --loss:var(--an-muted);
  --serif:var(--an-display); --body:var(--an-body); --mono:var(--an-mono); --an-wrap:1180px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
.sub{font:400 14.5px var(--mono);color:var(--muted);letter-spacing:.04em;margin-bottom:22px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:0 0 18px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content}
.seg button{background:none;border:0;color:var(--muted);font:500 14.5px var(--mono);padding:8px 16px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
.seg button.on{background:var(--gold);color:var(--an-on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:500 13.5px var(--mono);padding:5px 12px;cursor:pointer}
.chip:hover{color:var(--text)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--an-on-accent)}
.flt{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 10px}
.fl{font:400 12.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;min-width:128px}
.flt+.facts,.flt+p.note{margin-top:18px}
table.lgs td,table.lgs th{padding-left:6px;padding-right:6px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.fact{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;color:var(--muted)}
.fact b{font:500 15px var(--mono);color:var(--gold);margin-right:4px}
h2{font:600 22px var(--serif);margin:30px 0 12px}
h2.day{font-size:20px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(520px,100%),1fr));gap:18px}
.grid>.card{min-width:0}
.grid>.mcard{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:0;align-content:start}
.mcard .top{padding-bottom:4px}
.card td:first-child{white-space:normal}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 18px 10px}
.card h3{font:600 24px var(--serif);margin:0}
.live{font:500 12.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--gold);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:1px}
.card .ko{font:500 15.5px var(--mono);color:var(--text);letter-spacing:.06em}
.wdl{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 6px;background:var(--line)}
.wdl i{display:block} .wdl i:nth-child(1){background:var(--gold)} .wdl i:nth-child(2){background:var(--an-muted)} .wdl i:nth-child(3){background:var(--an-bar)}
.wdlt{display:flex;justify-content:space-between;font:400 15.5px var(--mono);color:var(--muted)}
.wdlt b{color:var(--text);font-weight:500}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:400 12.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-size:16.5px;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:15px}
td.tot{color:var(--gold);font-weight:500}
.card table{margin-top:6px}
table.mk{margin-bottom:6px}table.mk td,table.mk th{padding:6px 7px}

.lede{font-size:16.5px;color:var(--muted);max-width:900px;margin:0 0 8px}
.note{font-size:15px;color:var(--muted);max-width:900px}
.pos{color:var(--gold);font-weight:500}.neg{color:#e0697a;font-weight:500}.few{opacity:.6}.mut{color:var(--muted)}
.hot{color:var(--gold)}.cold{color:var(--muted)}
.tag{font:500 12.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.tag.ok{background:var(--gold);border-color:var(--gold);color:var(--an-on-accent)}
tr.click{cursor:pointer}tr.click:hover td{background:color-mix(in srgb,var(--gold) 6%,transparent)}tr.sel td{background:color-mix(in srgb,var(--gold) 10%,transparent)}
td.wrapc{white-space:normal;min-width:260px}
.detail td{white-space:normal}
.mkcols2{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:6px 0 12px}
@media(max-width:900px){.mkcols2{grid-template-columns:1fr}table{display:block;overflow-x:auto}}
.lgtag{font:500 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.xgl{font:400 14px var(--mono);color:var(--muted);margin:4px 0 2px}
th[data-s]{cursor:pointer}
.prose{max-width:820px}.prose p{margin:0 0 14px}
table.mk td{font-size:15.5px}
</style>
