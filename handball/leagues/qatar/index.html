<script>
// click a heading to sort; numbers sort high to low first, names A to Z; "197:132" sorts by goals scored, "–" goes last
document.querySelectorAll('table.srt').forEach(t=>{const hs=[...t.rows[0].cells];hs.forEach((th,i)=>th.addEventListener('click',()=>{
  const rows=[...t.rows].slice(1),v=r=>{const x=r.cells[i].textContent.trim().replace('−','-');if(x==='–'||x==='')return null;const n=parseFloat(x.replace('+',''));return isNaN(n)?x.toLowerCase():n};
  const num=rows.some(r=>typeof v(r)==='number'),d=th.dataset.d?(th.dataset.d==='desc'?'asc':'desc'):(num?'desc':'asc');
  hs.forEach(h=>delete h.dataset.d);th.dataset.d=d;
  rows.sort((a,b)=>{const x=v(a),y=v(b);if(x===null)return 1;if(y===null)return -1;const c=x<y?-1:x>y?1:0;return d==='asc'?c:-c}).forEach(r=>t.tBodies[0].appendChild(r))}))});
</script>
