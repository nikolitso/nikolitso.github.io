<div class="wrap">
  <h1><a href="/volleyball/challenge-cup-women/">Challenge Cup Women</a></h1>
  <div class="sub" id="sub"></div>
  <div class="tabs" id="tabs">
    <a href="#view=fixtures" data-view="fixtures" class="on">Fixtures</a>
    <a href="#view=projector" data-view="projector">Projector</a>

<script src="data.js?v=3"></script>
<script>
const $ = id => document.getElementById(id);
const M = DATA.model, MS = DATA.matches;
const logit = p => Math.log(p / (1 - p)), sig = z => 1 / (1 + Math.exp(-z));
const pct = x => Math.round(x * 100) + '%';
const sgn = (x, d = 0) => (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(d);
const sgnPct = x => (x >= 0 ? '+' : '−') + Math.abs(x * 100).toFixed(1) + '%';
const COUNTRIES = [...new Set(MS.flatMap(m => [m.hc, m.ac]))].sort();
const OTHER = 'Other (no history)';
let view = 'fixtures', cSort = 'country', cDir = 1;
const st = {a: 'Greece', b: 'Italy', o1a: '', o1b: '', o2b: '', o2a: '', mode: 'tie', l1: '', ov1: '', un1: '', l2: '', ov2: '', un2: ''};
const OU_KEYS = ['l1', 'ov1', 'un1', 'l2', 'ov2', 'un2'];

$('sub').textContent = `Seasons ${DATA.seasons[0].replace('-', '–')} to ${DATA.seasons.at(-1).replace('-', '–')} · ${MS.length} matches between clubs of different countries · updated ${DATA.updated}`;

// the bookmaker chance of the host with the margin taken out
const fair = (h, a) => (1 / h) / (1 / h + 1 / a);
// model chance of the host: the opening-odds chance, stretched (favourites are too long), plus the second-leg home edge and the countries' venue adjustments
const model = (x, host, guest, leg2) => sig(M.slope * x + M.home + M.leg2 * leg2 + (M.H[host] || 0) + (M.A[guest] || 0));
const odd = v => { const x = parseFloat(String(v).replace(',', '.')); return x > 1 ? x : null; };

// --- Total points: the host's win chance -> the full points distribution (rally engine, table in DATA.ou) -----------------
const OU = DATA.ou;
const ouAt = (arr, p) => { const x = (Math.min(Math.max(p, .01), .99) - .01) * 100, i = Math.min(Math.floor(x), arr.length - 2), t = x - i; return [arr[i], arr[i + 1], t]; };
const lerp = (arr, p) => { const [a, b, t] = ouAt(arr, p); return a + (b - a) * t; };
// P(total points > line) for a .5 line
function pOver(p, line){
  const k = Math.floor(line) - OU.t0, [a, b, t] = ouAt(OU.over, p);
  if (k < 0) return 1;
  if (k >= a.length) return 0;
  return a[k] + (b[k] - a[k]) * t;
}
// the .5 line the model makes closest to evens
function fairLine(p){
  let best = null;
  for (let k = 0; k < OU.over[0].length; k++){ const q = pOver(p, OU.t0 + k + .5); if (!best || Math.abs(q - .5) < Math.abs(best[1] - .5)) best = [OU.t0 + k + .5, q]; }
  return best[0];
}
// model against a line: chance of the over, edge at the given prices (better side); high-line unders are the one angle the backtest liked
function ouEdge(p, line, o, u){
  const po = pOver(p, line), eo = po * o - 1, eu = (1 - po) * u - 1;
  return {po, e: Math.max(eo, eu), side: eo > eu ? 'Over' : 'Under', val: eu > eo && eu >= .03 && line >= OU.bt.low};
}
const ouLineInputs = (leg, lab) => `<div class="side"><h3>${lab}</h3><div class="odds3"><div><label for="l${leg}">Points line</label><input id="l${leg}" inputmode="decimal" placeholder="e.g. 168.5" value="${st['l' + leg]}"></div>` +
  `<div><label for="ov${leg}">Over</label><input id="ov${leg}" inputmode="decimal" placeholder="1.83" value="${st['ov' + leg]}"></div><div><label for="un${leg}">Under</label><input id="un${leg}" inputmode="decimal" placeholder="1.83" value="${st['un' + leg]}"></div></div></div>`;

// --- Projector -------------------------------------------------------------------------------------------------
function countrySel(id, val){
  return `<select id="${id}">${[...COUNTRIES, OTHER].map(c => `<option${c === val ? ' selected' : ''}>${c}</option>`).join('')}</select>`;
}
// a priced fixture: the opening-odds chance of the host (every book), the model chance and the edge at the best price now
function fxPrice(f){
  const oc = Object.values(f.odds_open || {}).length ? f.odds_open : f.odds, books = Object.values(oc || {});
  if (!books.length) return null;
  const now = Object.values(f.odds || {}).length ? Object.values(f.odds) : books;
  const ph = books.reduce((s, o) => s + fair(o[0], o[1]), 0) / books.length, p = model(logit(ph), f.hc, f.ac, f.leg === 2 ? 1 : 0);
  const bh = Math.max(...now.map(o => o[0])), ba = Math.max(...now.map(o => o[1])), eh = p * bh - 1, ea = (1 - p) * ba - 1;
  return {ph, p, oh: books.reduce((s, o) => s + o[0], 0) / books.length, oa: books.reduce((s, o) => s + o[1], 0) / books.length,
          bh, ba, e: Math.max(eh, ea), who: eh > ea ? f.home : f.away};
}
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

// today's priced matches (or the next day with prices), model against the odds; a click loads the match into the projector
function renderToday(){
  const fx = (DATA.fixtures || []).filter(f => f.hc !== f.ac && fxPrice(f)), today = ymd(new Date());
  const day = fx.some(f => f.date === today) ? today : fx.map(f => f.date).filter(d => d > today).sort()[0];
  if (!day) return '';
  const rows = fx.filter(f => f.date === day).sort((x, y) => x.time.localeCompare(y.time)).map(f => {
    const r = fxPrice(f), d = r.p - r.ph;
    return `<tr class="${r.e >= .05 ? 'val' : ''}"><td class="n muted">${f.time}</td>` +
      `<td><a href="#" class="go" data-fx="${f.id}">${f.home} <span class="muted">v</span> ${f.away}</a><div class="hint" style="margin:0">${f.hc} v ${f.ac}${f.leg ? ' · leg ' + f.leg : ''}</div></td>` +
      `<td class="n full">${r.oh.toFixed(2)} / ${r.oa.toFixed(2)}</td><td class="n">${pct(r.ph)}</td><td class="n tot">${pct(r.p)}</td>` +
      `<td class="n ${d >= 0 ? 'ok' : 'bad'}">${sgn(d * 100)}</td><td class="n big">${(1 / r.p).toFixed(2)} / ${(1 / (1 - r.p)).toFixed(2)}</td>` +
      `<td class="n full">${r.bh.toFixed(2)} / ${r.ba.toFixed(2)}</td><td class="n ${r.e >= 0 ? 'ok' : 'bad'}">${sgnPct(r.e)} <span class="muted">${r.who.split(' ')[0]}</span></td></tr>`;
  }).join('');
  return `<h2 style="margin-top:0">${day === today ? 'Today' : dayName(day)}: model v odds</h2>
    <div class="card scroll" style="margin-bottom:10px"><table class="res today"><thead><tr><th class="n">Time</th><th>Host v visitor</th><th class="n full">Opening odds</th><th class="n" title="The host's chance in the opening odds, margin taken out">Odds host</th><th class="n">Model host</th><th class="n" title="Model chance minus the odds' chance, percentage points">Diff</th><th class="n">Fair odds</th><th class="n full">Best now</th><th class="n">Edge</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint" style="margin-bottom:26px">Odds host = the opening odds' chance with the margin taken out (average over the bookmakers). Diff = model minus odds, in percentage points. Edge = model chance × best price now − 1, on the better side; rows from +5% are highlighted. Click a match to load it into the projector below.</p>` + todayTotals(fx.filter(f => f.date === day), day === today ? 'Today' : dayName(day));
}
// the same matches, total points: the model's points distribution (from its win chance) against the bookmakers' main line
function todayTotals(fs, lab){
  const rows = fs.sort((x, y) => x.time.localeCompare(y.time)).map(f => {
    const p = fxPrice(f).p, q = f.ou, r = q ? ouEdge(p, q.line, q.bo, q.bu) : null, fl = fairLine(p);
    return `<tr class="${r && r.val ? 'val' : ''}"><td class="n muted">${f.time}</td><td><a href="#" class="go" data-fx="${f.id}">${f.home} <span class="muted">v</span> ${f.away}</a></td>` +
      (q ? `<td class="n">${q.line}</td><td class="n full">${q.o.toFixed(2)} / ${q.u.toFixed(2)}</td><td class="n">${pct(fair(q.o, q.u))}</td><td class="n tot">${pct(r.po)}</td>`
         : '<td class="n muted">–</td><td class="n full muted">–</td><td class="n muted">–</td><td class="n muted">–</td>') +
      `<td class="n full">${Math.round(lerp(OU.mean, p))}</td><td class="n big">${fl}</td><td class="n">${pct(lerp(OU.sets3, p))}</td>` +
      (q ? `<td class="n ${r.e >= 0 ? 'ok' : 'bad'}">${r.side} ${sgnPct(r.e)}</td>` : '<td class="n muted">no line yet</td>') + '</tr>';
  }).join('');
  return `<h2>${lab}: total points v the line</h2>
    <div class="card scroll" style="margin-bottom:10px"><table class="res today"><thead><tr><th class="n">Time</th><th>Host v visitor</th><th class="n">Line</th><th class="n full">Over / under</th><th class="n" title="The over's chance in the bookmakers' prices, margin taken out">Book over</th><th class="n">Model over</th><th class="n full" title="Average total points the model expects">Model avg</th><th class="n" title="The line the model makes closest to evens">Fair line</th><th class="n" title="Chance the match ends 3–0 either way">3 sets</th><th class="n">Edge</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint" style="margin-bottom:26px">The model turns its win chance for the host into the whole distribution of total points (rally by rally, sets to 25 and a fifth to 15). Line = the bookmakers' main line, prices averaged; edge at the best price. In the backtest the totals model did <b>not</b> beat the bookmakers overall; the one pattern that held up is unders on high lines (${OU.bt.low} and up), so only those rows are highlighted, from +3%. See How it works.</p>`;
}

function renderProjector(){
  const tie = st.mode === 'tie';
  return renderToday() + `<p class="note">Pick the two countries and type the <b>opening</b> winner odds. The projector gives the fair price of each leg (no bookmaker margin) and the edge against the odds you typed. Before the second leg is priced, its odds are estimated from the first leg with the venue turned round.</p>
    <div class="card"><div class="seg" id="mode" style="margin-bottom:18px"><button data-m="tie" class="${tie ? 'on' : ''}">Both legs</button><button data-m="one" class="${st.mode === 'one' ? 'on' : ''}">First leg</button><button data-m="two" class="${st.mode === 'two' ? 'on' : ''}">Second leg</button></div>
    <div class="form">
      <div class="side"><h3>${tie ? 'Hosts leg 1' : 'Host'}</h3>
        <div class="field"><label for="ca">Country</label>${countrySel('ca', st.a)}</div>
        <div class="odds"><div><label for="o1a">${tie ? 'Leg 1 odds' : 'Odds'}</label><input id="o1a" inputmode="decimal" placeholder="e.g. 2.40" value="${st.o1a}"></div>
        ${tie ? `<div><label for="o2a">Leg 2 odds</label><input id="o2a" inputmode="decimal" placeholder="once out" value="${st.o2a}"></div>` : ''}</div></div>
      <div class="side"><h3>${tie ? 'Hosts leg 2' : 'Visitor'}</h3>
        <div class="field"><label for="cb">Country</label>${countrySel('cb', st.b)}</div>
        <div class="odds"><div><label for="o1b">${tie ? 'Leg 1 odds' : 'Odds'}</label><input id="o1b" inputmode="decimal" placeholder="e.g. 1.55" value="${st.o1b}"></div>
        ${tie ? `<div><label for="o2b">Leg 2 odds</label><input id="o2b" inputmode="decimal" placeholder="once out" value="${st.o2b}"></div>` : ''}</div></div>
    </div>
    <div class="form pts">${ouLineInputs(1, tie ? 'Leg 1 total points' : 'Total points')}${tie ? ouLineInputs(2, 'Leg 2 total points') : '<div class="side"><p class="hint" style="margin-top:22px">Optional: the bookmaker line and prices, to compare with the model.</p></div>'}</div>${tie ? '' : st.mode === 'one' ? '<p class="hint">A first leg (or a single match): no second-leg home edge.</p>' : '<p class="hint">A second leg: the host gets the second-leg home edge. Use odds posted after the first leg, which already know its score.</p>'}</div>
    <div id="result"></div><div id="context"></div>`;
}

function renderResult(){
  const a = st.a, b = st.b, tie = st.mode === 'tie';
  const o1a = odd(st.o1a), o1b = odd(st.o1b), o2a = odd(st.o2a), o2b = odd(st.o2b);
  if (!o1a || !o1b){ $('result').innerHTML = '<p class="empty">Type both leg 1 odds (decimal, above 1.00) to see the prices.</p>'; return; }
  const x1 = logit(fair(o1a, o1b)), legs = [[tie ? 'Leg 1' : st.mode === 'two' ? 'Leg 2' : 'Match', a, b, x1, [o1a, o1b], st.mode === 'two' ? 1 : 0]];
  if (tie){
    if (o2a && o2b) legs.push(['Leg 2', b, a, logit(fair(o2b, o2a)), [o2b, o2a], 1]);
    else legs.push(['Leg 2', b, a, -x1 + 2 * M.market_home_edge, null, 1]);
  }
  const rows = legs.map(([lab, h, g, x, off, l2]) => {
    const p = model(x, h, g, l2), po = sig(x);

// --- Power rankings: country Elo over every match in date order ---------------------------------------------------
// Start 1500, K 20, home advantage 50 Elo points (hosts win 57%). A 3-0 counts more than a 3-2, damped when the
// favourite wins (as in FiveThirtyEight's Elo). Matches between clubs of the same country are not in the data.
const ELO = {K: 20, HCA: 50};
let RANK = null, rkSeasons = 0, rkSort = {k: 'place', dir: 1};
function computeRankings(){
  const elo = {}, snaps = {}, last = {};
  const get = c => (elo[c] ??= 1500);
  const snap = s => { snaps[s] = Object.fromEntries(Object.entries(elo).sort((x, y) => y[1] - x[1]).map(([c], i) => [c, i + 1])); };
  let prev = null;
  for (const m of [...MS].sort((x, y) => x.date.localeCompare(y.date))){
    if (prev !== null && m.season !== prev) snap(prev);
    prev = m.season;
    const rh = get(m.hc), ra = get(m.ac), exp = 1 / (1 + 10 ** ((ra - rh - ELO.HCA) / 400)), won = m.hs > m.as ? 1 : 0;
    const diff = won ? rh + ELO.HCA - ra : ra - rh - ELO.HCA;
    const mult = [0, .75, 1, 1.25][Math.abs(m.hs - m.as)] * 2.2 / (2.2 + .001 * diff);
    const d = ELO.K * mult * (won - exp);
    elo[m.hc] = rh + d; elo[m.ac] = ra - d; last[m.hc] = last[m.ac] = m.season;
  }
  const rows = Object.keys(elo).map(c => ({c, elo: elo[c], last: last[c]})).sort((x, y) => y.elo - x.elo);
  rows.prev = snaps[DATA.seasons.at(-2)] || {};                  // places before the latest season
  return rows;
}
const eloOf = c => { RANK ||= computeRankings(); return RANK.find(r => r.c === c)?.elo ?? 1500; };
const rankOf = c => { RANK ||= computeRankings(); const i = RANK.findIndex(r => r.c === c); return i < 0 ? '' : `#${i + 1}`; };
const eloHost = (hc, ac) => 1 / (1 + 10 ** ((eloOf(ac) - eloOf(hc) - ELO.HCA) / 400));

function renderRankings(){
  RANK ||= computeRankings();
  const seasons = DATA.seasons, ok = rkSeasons ? new Set(seasons.slice(-rkSeasons)) : null;
  const ms = MS.filter(m => !ok || ok.has(m.season));
  const list = RANK.map((r, i) => {
    const mine = ms.filter(m => m.hc === r.c || m.ac === r.c);
    const w = mine.filter(m => (m.hc === r.c) === (m.hs > m.as)).length;
    const sw = mine.reduce((s, m) => s + (m.hc === r.c ? m.hs : m.as), 0), sl = mine.reduce((s, m) => s + (m.hc === r.c ? m.as : m.hs), 0);
    const pm = mine.length ? mine.reduce((s, m) => s + (m.hc === r.c ? m.hp - m.ap : m.ap - m.hp), 0) / mine.length : null;
    const pr = mine.filter(m => m.p), vs = pr.length ? (pr.filter(m => (m.hc === r.c) === (m.hs > m.as)).length - pr.reduce((s, m) => s + (m.hc === r.c ? m.p : 1 - m.p), 0)) / pr.length : null;
    const before = RANK.prev[r.c], move = before ? before - (i + 1) : null;
    return {keys: {place: i + 1, country: r.c, rating: r.elo, move, n: mine.length, wl: mine.length ? 2 * w - mine.length : null,
                   pct: mine.length ? w / mine.length : null, sets: mine.length ? sw - sl : null, margin: pm, vs},
      html: `<tr><td class="n muted">${i + 1}</td><td>${r.c}</td><td class="n tot">${Math.round(r.elo)}</td>` +
        `<td class="n ${move > 0 ? 'ok' : move < 0 ? 'bad' : 'muted'}">${move === null ? 'new' : move > 0 ? '▲' + move : move < 0 ? '▼' + -move : '–'}</td>` +
        `<td class="n gl">${mine.length}</td><td class="n">${mine.length ? w + '–' + (mine.length - w) : '–'}</td><td class="n">${mine.length ? pct(w / mine.length) : '–'}</td>` +
        `<td class="n full">${mine.length ? sw + '–' + sl : '–'}</td><td class="n">${pm === null ? '–' : sgn(pm, 1)}</td>` +

    <div class="seg" id="rksel" style="margin-bottom:16px">${sel}</div>

    ${th('n', 'Matches', 'n gl')}${th('wl', 'W–L', 'n', 'Sorted by wins minus losses')}${th('pct', 'Win %', 'n')}${th('sets', 'Sets', 'n full', 'Sorted by sets won minus lost')}${th('margin', 'Pts +/−', 'n', 'Average points margin per match')}${th('vs', 'vs odds', 'n', 'Wins above the opening odds, percentage points')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

// --- Countries ------------------------------------------------------------------------------------------------
function rec(ms, home){

}

}

// --- How it works ------------------------------------------------------------------------------------------------
function renderMethod(){
  const b = M.bets, row = (t, l) => b.find(x => x.edge === t && x.legs === l);
  const bt = [0, .05, .10].map(t => `<tr><td>Edge above ${Math.round(t * 100)}%</td>` + ['leg 1', 'leg 2'].map(l => { const r = row(t, l); return r ? `<td class="n gl">${r.n}</td><td class="n ${r.profit >= 0 ? 'ok' : 'bad'}">${sgnPct(r.profit / r.n)}</td>` : '<td class="n gl muted">0</td><td class="n muted">–</td>'; }).join('') + '</tr>').join('');
  const gain = (1 - M.cv.logloss / M.cv.logloss_market) * 100;
  return `<div class="doc">
  <p>What goes in: every Challenge Cup Women match of the last five seasons between clubs from different countries, ${MS.length} in all, with the bookmakers' opening and closing winner odds. Matches between clubs of the same country, golden sets and awarded matches are left out. The host is the club playing at home.</p>

  <p>Taken at face value (margin removed), the opening odds make favourites too long: a club the odds give 70% wins about ${pct(sig(M.slope * logit(.7) + M.home))} of the time, and one given 85% about ${pct(sig(M.slope * logit(.85) + M.home))}. And in a <b>second leg</b> the host does clearly better than priced, while in a first leg the venue is priced about right.</p>
  <h3><span class="num">2</span>The projector</h3>
  <div class="calc">host chance = 1 / (1 + e<sup>−z</sup>)<br>z = ${M.slope.toFixed(2)} × logit(opening odds chance) ${sgn(M.home, 2)} ${sgn(M.leg2, 2)} × [second leg] + host country at home + visitor country away</div>
  <p>The country terms (Countries tab, <i>Adj.</i>) are shrunk towards zero; every one ended between ${sgn(Math.min(...Object.values(M.H), ...Object.values(M.A)), 2)} and ${sgn(Math.max(...Object.values(M.H), ...Object.values(M.A)), 2)}, so the country moves a price a little once the two general effects are in, not a lot. A second leg not yet priced gets the first leg's odds with the venue turned round, using the home edge the bookmakers themselves price in (${sgn(M.market_home_edge, 2)} on the logit scale, measured on ties where both legs had odds).</p>
  <h3><span class="num">3</span>How good is it</h3>
  <p>Checked season by season: fitted on four seasons, scored on the fifth, for each of the five. Log loss ${M.cv.logloss.toFixed(3)} against ${M.cv.logloss_market.toFixed(3)} for the opening odds alone, ${gain.toFixed(1)}% better.</p>
  <p>Betting one unit on the better side whenever the edge passed a threshold, at the typical opening price, in the left-out seasons:</p>
  <div class="scroll"><table class="mini"><thead><tr class="grp"><th></th><th class="gl" colspan="2">First legs</th><th class="gl" colspan="2">Second legs</th></tr><tr><th></th><th class="n gl">Bets</th><th class="n">Return</th><th class="n gl">Bets</th><th class="n">Return</th></tr></thead><tbody>${bt}</tbody></table></div>
  <p>Most of the gain is on clear favourites, where the price is short and the money small. The second-leg favourite is the angle to watch; the sample is too small to call it proven.</p>
  <h3><span class="num">4</span>Total points</h3>
  <p>The win chance above also prices the total points. A rally engine (the one behind the league over/under pages) finds the rally strength that gives the host exactly that chance of winning, then works out every way the match can go, rally by rally: sets to 25, a fifth set to 15, win by two. That gives the whole distribution of total points, so the chance of any over, the fair line and the chance of a 3–0. Lopsided matches project low (about ${Math.round(lerp(OU.mean, .97))} points at a 97% favourite), even ones high (about ${Math.round(lerp(OU.mean, .5))}).</p>
  <p>Checked the same way, season by season, against the bookmakers' opening main line in ${OU.bt.n} matches (the line sits where the over is priced about 50%): log loss ${OU.bt.ll_model.toFixed(4)} for the model against ${OU.bt.ll_book.toFixed(4)} for the bookmakers, so <b>overall the model does not beat the line</b>. By line:</p>
  <div class="scroll"><table class="mini"><thead><tr><th></th><th class="n gl">Matches</th><th class="n">Overs hit</th><th class="n">Model said</th><th class="n gl">All overs</th><th class="n">All unders</th><th class="n gl" title="Model edge above 3%">Model overs</th><th class="n" title="Model edge above 3%">Model unders</th></tr></thead><tbody>${OU.bt.groups.map(g => `<tr><td>${g.label}</td><td class="n gl">${g.n}</td><td class="n">${pct(g.over_hit)}</td><td class="n">${pct(g.model)}</td>` +
    `<td class="n gl ${g.blind_over >= 0 ? 'ok' : 'bad'}">${sgnPct(g.blind_over)}</td><td class="n ${g.blind_under >= 0 ? 'ok' : 'bad'}">${sgnPct(g.blind_under)}</td>` +
    [g.model_over, g.model_under].map(([n, roi], i) => `<td class="n${i ? '' : ' gl'} ${roi === null ? 'muted' : roi >= 0 ? 'ok' : 'bad'}">${roi === null ? '–' : sgnPct(roi) + ' <span class="muted">(' + n + ')</span>'}</td>`).join('') + '</tr>').join('')}</tbody></table></div>
  <p>On high lines the bookmakers price the over at 50% but it hit only ${pct(OU.bt.groups[1].over_hit)}, and the model saw that (it said ${pct(OU.bt.groups[1].model)}): its unders there returned ${sgnPct(OU.bt.groups[1].model_under[1])} over ${OU.bt.groups[1].model_under[0]} bets. On low lines it lost. Season by season the high-line unders went ${OU.bt.seasons.map(s => s.season + ' ' + sgnPct(s.high_under)).join(', ')}, so much of it is one season: an angle to track, not a proven edge.</p>
  <h3><span class="num">5</span>Limits</h3>
  <ul><li>The estimated second-leg price ignores the first-leg score. Once leg 1 is played the bookmakers price that in, so use the real leg 2 odds.</li>
  <li>Some home matches were played away from home, for example Israeli and Ukrainian clubs hosting abroad since the wars began.</li>
  <li>No team news or line-ups: clubs resting players in a decided second leg show up only through the odds.</li></ul>
  </div>`;
}

// --- wiring ------------------------------------------------------------------------------------------------------
function render(){
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.view === view));
  $('out').innerHTML = {fixtures: renderFixtures, projector: renderProjector, rankings: renderRankings, countries: renderCountries, method: renderMethod}[view]();
  if (view === 'projector'){ renderResult(); renderContext(); }
}
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  if (['fixtures', 'projector', 'rankings', 'countries', 'method'].includes(p.get('view'))) view = p.get('view');
  for (const k of ['a', 'b']) if ([...COUNTRIES, OTHER].includes(p.get(k))) st[k] = p.get(k);
  if (['tie', 'one', 'two'].includes(p.get('mode'))) st.mode = p.get('mode');
}
function writeHash(){ history.replaceState(null, '', `#view=${view}` + (view === 'projector' ? `&a=${encodeURIComponent(st.a)}&b=${encodeURIComponent(st.b)}&mode=${st.mode}` : '')); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-sort],[data-rk],#mode button,#rksel button,a.go');
  if (!t) return;
  e.preventDefault();
  if (t.dataset.fx){                                  // a match from a fixtures list: into the projector with its countries and odds
    const f = DATA.fixtures.find(x => x.id === t.dataset.fx), r = fxPrice(f), cc = c => COUNTRIES.includes(c) ? c : OTHER;
    view = 'projector';
    Object.assign(st, {a: cc(f.hc), b: cc(f.ac), mode: f.leg === 2 ? 'two' : f.leg === 1 ? 'tie' : 'one', o1a: r ? r.oh.toFixed(2) : '', o1b: r ? r.oa.toFixed(2) : '', o2a: '', o2b: '',
      l1: f.ou ? String(f.ou.line) : '', ov1: f.ou ? f.ou.bo.toFixed(2) : '', un1: f.ou ? f.ou.bu.toFixed(2) : '', l2: '', ov2: '', un2: ''});
    writeHash(); render(); $('mode').scrollIntoView({block: 'center'}); return;
  }
  if (t.matches('a.go')){ history.replaceState(null, '', t.getAttribute('href')); st.o1a = st.o1b = st.o2a = st.o2b = ''; OU_KEYS.forEach(k => st[k] = ''); readHash(); window.scrollTo({top: 0}); }
  else if (t.dataset.view) view = t.dataset.view;
  else if (t.dataset.sort){ const k = t.dataset.sort, def = C_COLS.find(c => c[0] === k)[3]; cDir = k === cSort ? -cDir : def; cSort = k; }
  else if (t.dataset.rk){ const k = t.dataset.rk; rkSort = k === rkSort.k ? {k, dir: -rkSort.dir} : {k, dir: k === 'place' || k === 'country' ? 1 : -1}; }
  else if (t.dataset.rs !== undefined) rkSeasons = +t.dataset.rs;
  else if (t.dataset.m) st.mode = t.dataset.m;
  writeHash(); render();
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (['o1a', 'o1b', 'o2a', 'o2b', ...OU_KEYS].includes(id)){ st[id] = e.target.value; renderResult(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'ca' || e.target.id === 'cb'){ st[e.target.id === 'ca' ? 'a' : 'b'] = e.target.value; writeHash(); renderResult(); renderContext(); }
});
addEventListener('hashchange', () => { readHash(); render(); });
readHash(); render();
</script>
</body>
</html>
