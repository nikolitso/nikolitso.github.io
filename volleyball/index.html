<style>
:root{
  --bg:#0c1424; --panel:#131d33; --line:#26334f; --text:#f1ead9; --muted:#9aa4ba;
  --gold:#d4af37; --win:#6fcf97; --loss:#eb7a6c;
  --serif:'Playfair Display',Georgia,serif; --body:'Source Serif 4',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding:40px 16px 80px}
h1{font:700 clamp(30px,5vw,46px)/1.1 var(--serif);margin:0 0 6px}
h1 a{color:inherit;text-decoration:none}
h1 a:hover{color:var(--gold)}
.home-link{display:inline-block;margin-bottom:14px;font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.home-link:hover{color:var(--gold)}
.sub{font:400 13px var(--mono);color:var(--muted);letter-spacing:.04em;margin-bottom:32px}
.tabs{display:flex;flex-wrap:wrap;gap:10px 28px;border-bottom:1px solid var(--line);margin:0 0 26px}
.tabs a{border-bottom:2px solid transparent;color:var(--muted);font:600 18px var(--serif);padding:0 0 10px;margin-bottom:-1px;cursor:pointer;text-decoration:none}
.tabs a.on{color:var(--text);border-color:var(--gold)}
.tabs a:hover{color:var(--text)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:0 0 18px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content}
.seg button{background:none;border:0;color:var(--muted);font:500 13px var(--mono);padding:8px 16px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
.seg button.on{background:var(--gold);color:#0c1424}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:500 12px var(--mono);padding:5px 12px;cursor:pointer}
.chip:hover{color:var(--text)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#0c1424}
h2{font:600 22px var(--serif);margin:30px 0 12px}
h2.day{font-size:20px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(520px,100%),1fr));gap:18px}
.grid>.card{min-width:0}
.grid>.mcard{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:0;align-content:start}
.mcard .top{padding-bottom:4px}
.card td:first-child{white-space:normal}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 18px 10px}
.card h3{font:600 24px var(--serif);margin:0}
.live{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--gold);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:1px}
.card .ko{font:500 14px var(--mono);color:var(--text);letter-spacing:.06em}
.wdl{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 6px;background:var(--line)}
.wdl i{display:block} .wdl i:nth-child(1){background:var(--gold)} .wdl i:nth-child(2){background:#59657f} .wdl i:nth-child(3){background:#5b7bd5}
.wdlt{display:flex;justify-content:space-between;font:400 14px var(--mono);color:var(--muted)}
.wdlt b{color:var(--text);font-weight:500}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:400 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-size:15px;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:13.5px}
td.tot{color:var(--gold);font-weight:500}
.card table{margin-top:6px}
table.mk{margin-bottom:6px}table.mk td,table.mk th{padding:6px 7px}
.stack{display:grid;gap:18px}
.mkcols{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:start;margin-top:8px}
@media(max-width:900px){.mkcols{grid-template-columns:1fr}.mkcols table{display:block;overflow-x:auto}}
.stack>.card{min-width:0}
.wdlt i{font-style:normal;color:var(--gold)}
.wdlt span:nth-child(2){text-align:center}.wdlt span:last-child{text-align:right}
.coach .who{display:inline-block;min-width:118px;color:var(--muted)}
.tenure{font:400 12px/1.4 var(--mono);color:var(--muted);margin-top:2px}
.coach{font:400 13.5px/1.55 var(--mono);color:var(--muted);margin-top:2px}
.coach b{color:var(--text);font-weight:500}
.coach .wc{display:inline-block;width:7ch;text-align:right}
table.tm{max-width:1000px}table.tm .gl{border-left:1px solid var(--line);padding-left:12px}
table.tm tr.grp th{color:var(--gold);border-bottom:0;padding-bottom:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px 14px;flex-wrap:wrap}
.ref{font:400 13.5px/1.55 var(--mono);color:var(--muted);margin-top:6px}
.ref b{color:var(--text);font-weight:500}
.card tr:last-child td{border-bottom:0}
.ln{font:400 12px var(--mono);color:var(--muted);text-align:right}
.ln span{display:inline-block;min-width:92px}
.ln b{color:var(--text);font-weight:500}
.ln .hi{color:var(--win)} .ln .lo{color:var(--loss)}
th.sort{cursor:pointer;user-select:none} th.sort:hover,th.sort.on{color:var(--gold)}
.w{color:var(--win)} .l{color:var(--loss)}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.note{font:400 15px/1.55 var(--body);color:var(--muted);border-left:2px solid var(--gold);padding:2px 0 2px 14px;margin:0 0 14px;max-width:820px}
.note b{color:var(--text);font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 18px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.metric .lbl{font:400 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.metric .big{font:500 24px var(--mono);color:var(--gold)}
.scroll{overflow-x:auto}
.doc{max-width:860px}
.doc p,.doc li{font-size:16.5px;line-height:1.65;margin:0 0 14px}
.doc ul{padding-left:20px;margin:0 0 14px}
.doc h3{font:600 18px var(--serif);margin:28px 0 8px;display:flex;align-items:center;gap:10px}
.doc .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#0c1424;font:600 13px var(--mono);flex:none}
.calc{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:12px 16px;margin:0 0 14px;font:400 14px/2 var(--mono);overflow-x:auto}
.calc i{font-style:normal;color:var(--muted);font-size:12px}
.calc b{color:var(--gold);font-weight:500}
table.mini{margin:0 0 16px}
.abbr{display:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}.ln span{min-width:0;margin-left:8px}.card{padding:14px 10px 8px}td,th{padding:6px 4px}
  .card td{font-size:14px}.card td.n{font-size:12.5px}.full{display:none}.abbr{display:inline}.wdlt{flex-wrap:wrap;gap:2px 12px}}
</style>

<div class="wrap">
  <a class="home-link" href="/">&#8962; Home</a>
  <h1><a href="/volleyball/">Volleyball</a></h1>
  <div class="sub" id="sub"></div>
  <div class="tabs" id="tabs">
    <a href="#view=projections" data-view="projections" class="on">Projections</a>
    <a href="#view=picks" data-view="picks">Picks</a>
    <a href="#view=season" data-view="season">Season</a>

  </div>

</div>
<script src="data.js?v=83abf1a2"></script>
<script>
const $ = id => document.getElementById(id);
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayName = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const short = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const pct = x => Math.round(x*100) + '%';
const sgn = (x, d=1) => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
const cls = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
let view = 'projections';

$('sub').textContent = `${DATA.league} (Turkey, women) · ${DATA.season.replace('-','–')} · updated ${DATA.updated} (Athens)`;

function card(g){
  const mk = g.mk ? `<div class="mk"><span>Line <b>${g.mk.line}</b> · over <b>${g.mk.over.toFixed(2)}</b></span>
      <span>Model over <b>${pct(g.p_over)}</b></span><span>Edge <b class="${cls(g.edge)}">${sgn(g.edge*100, 0)}%</b></span></div>`
    : '<div class="mk"><span>No bookmaker line yet</span></div>';
  return `<div class="card simple${g.pick ? ' pick' : ''}"><div class="ko">${g.dt.slice(11)} · ${g.round}</div>
    <h3>${g.home} <span class="muted">–</span> ${g.away}${g.pick ? `<span class="badge">Over ${g.mk.line}</span>` : ''}</h3>
    <div class="sets"><i style="width:${g.p3*100}%"></i><i style="width:${g.p4*100}%"></i><i style="width:${g.p5*100}%"></i></div>
    <div class="setst"><span>3 sets <b>${pct(g.p3)}</b></span><span>4 sets <b>${pct(g.p4)}</b></span><span>5 sets <b>${pct(g.p5)}</b></span></div>
    <div class="proj">Projected total <b>${g.med}</b> points · fair line <b>${g.fair}</b> · ${g.home} wins <b>${pct(g.ph)}</b></div>
    ${mk}${g.note ? `<div class="flag">${g.note}</div>` : ''}</div>`;
}

function renderProjections(){
  let h = `<p class="note">Every match in the next 7 days: the chance it goes 3, 4 or 5 sets, the projected total points and the model's own fair line. Once a bookmaker posts a line, the card shows the model's over chance against it. <b>Picks</b> (gold) are overs on lines below ${DATA.low}, the matches the market expects to end 3-0, where the edge is above ${DATA.edge*100}%.</p>`;
  if (!DATA.fixtures.length) return h + '<p class="empty">No matches in the next 7 days.</p>';
  const byDay = {};
  DATA.fixtures.forEach(g => (byDay[g.dt.slice(0,10)] ||= []).push(g));
  for (const [d, gs] of Object.entries(byDay)) h += `<h2 class="day">${dayName(d)}</h2><div class="grid">${gs.map(card).join('')}</div>`;
  return h;
}

function tiles(list){
  return `<div class="metrics">${list.map(([l, v, c]) => `<div class="metric"><div class="lbl">${l}</div><div class="big ${c||''}">${v}</div></div>`).join('')}</div>`;
}

function renderPicks(){
  const done = DATA.picks.filter(p => 'won' in p), open = DATA.picks.filter(p => !('won' in p));
  const w = done.filter(p => p.won).length, units = done.reduce((s, p) => s + p.profit, 0);
  let h = `<p class="note">Every pick since the page went live, logged before the first serve: an over on a line below ${DATA.low} when the model's chance × the average price is more than ${DATA.edge*100}% above 1. Stake 1 unit each. The page judges itself at <b>100 settled picks</b>; before that, the record is mostly noise.</p>`;
  h += tiles([['Settled picks', done.length], ['Record', `${w}–${done.length - w}`], ['Units', sgn(units, 2), cls(units)],
              ['ROI', done.length ? sgn(units / done.length * 100, 1) + '%' : '–', cls(units)], ['Open picks', open.length]]);
  if (!DATA.picks.length) return h + '<p class="empty">No picks yet. The first ones appear once bookmakers post lines for a match that qualifies.</p>';
  h += `<div class="scroll"><table><thead><tr><th>Date</th><th>Match</th><th class="n">Line</th><th class="n">Price</th><th class="n">Best</th><th class="n">Model</th><th class="n">Edge</th><th class="n">Sets</th><th class="n">Total</th><th class="n">Units</th></tr></thead><tbody>`;
  for (const p of DATA.picks){
    const res = 'won' in p ? `<td class="n">${p.sets}</td><td class="n ${p.won ? 'w' : 'l'}">${p.total}</td><td class="n ${cls(p.profit)}">${sgn(p.profit, 2)}</td>`
      : '<td class="n muted" colspan="3">to play</td>';
    h += `<tr><td>${short(p.dt)}</td><td class="wr">${p.home} – ${p.away}</td><td class="n">Over ${p.line}</td><td class="n">${p.px.toFixed(2)}</td>
      <td class="n muted">${p.best.toFixed(2)} ${p.book}</td><td class="n">${pct(p.p)}</td><td class="n">${sgn(p.edge*100, 0)}%</td>${res}</tr>`;
  }
  return h + '</tbody></table></div>';
}

function renderSeason(){
  let h = `<p class="note">This season's matches with the projection each one had before it was played (fitted on earlier matches only), next to the closing line. Ratings: the chance of winning a rally against an average team, from points won, recent matches weighted more.</p>`;
  h += '<div class="cols"><div><h2>Results</h2>';
  if (!DATA.results.length) h += '<p class="empty">No matches played yet.</p>';
  else {
    h += `<div class="scroll"><table><thead><tr><th>Date</th><th>Match</th><th class="n">Sets</th><th class="n">Total</th><th class="n">Proj.</th><th class="n">Line</th><th class="n">Over %</th></tr></thead><tbody>`;
    for (const r of DATA.results){
      const o = r.line == null ? '' : r.total > r.line ? 'w' : 'l';
      h += `<tr><td>${short(r.dt)}</td><td class="wr">${r.home} – ${r.away}</td><td class="n">${r.sets}</td><td class="n ${o}">${r.total}</td>
        <td class="n">${r.med}</td><td class="n">${r.line ?? '–'}</td><td class="n">${r.p_over == null ? '–' : pct(r.p_over)}</td></tr>`;
    }
    h += '</tbody></table></div>';
  }
  h += `</div><div><h2>Ratings</h2><table><thead><tr><th>Team</th><th class="n">Rally</th><th class="n">W–L</th></tr></thead><tbody>`;
  for (const r of DATA.ratings) h += `<tr><td>${r.team}${r.new ? ' <span class="muted">(new)</span>' : ''}</td><td class="n">${(r.rally*100).toFixed(1)}%</td><td class="n">${r.w}–${r.l}</td></tr>`;
  return h + `</tbody></table><p class="note" style="margin-top:12px">Home side: ${(DATA.home_adv*100).toFixed(1)}% of rallies between equal teams.</p></div></div>`;
}

function renderBacktest(){
  const B = DATA.backtest;
  let h = `<p class="note">The live rule run on every season since ${B.first.slice(0,4)}, each match projected only from matches before it, at the closing line and the average price. The settings were tuned on 2024-25 alone, so the totals below leave that season out. <b>Backing every low-line over without the model</b> returned ${sgn(B.blind_roi*100, 1)}% over ${B.blind_n} matches.</p>`;
  h += tiles([['Bets (unseen seasons)', B.n], ['Hit rate', pct(B.w / B.n)], ['ROI', sgn(B.roi*100, 1) + '%', cls(B.roi)],
              ['90% range', `${sgn(B.ci[0]*100, 0)}% to ${sgn(B.ci[1]*100, 0)}%`]]);
  h += `<table style="max-width:560px"><thead><tr><th>Season</th><th class="n">Bets</th><th class="n">Won</th><th class="n">Hit</th><th class="n">ROI</th></tr></thead><tbody>`;
  for (const s of B.seasons) h += `<tr><td>${s.season.replace('-','–')}${s.tuned ? ' <span class="muted">(tuned on)</span>' : ''}</td><td class="n">${s.n}</td><td class="n">${s.w}</td><td class="n">${pct(s.w/s.n)}</td><td class="n ${cls(s.roi)}">${sgn(s.roi*100, 1)}%</td></tr>`;
  return h + '</tbody></table>';
}

function renderMethod(){
  return `<div class="doc">
  <h3><span class="num">1</span>One number per team</h3>
  <p>Every team gets one rating: its chance of winning a rally against an average side. It is fitted on the points of every past match, with recent matches weighted more, plus a small home edge. Teams new to the league start a little below average.</p>
  <h3><span class="num">2</span>From rallies to the whole match</h3>
  <p>A set runs to 25 points (the fifth to 15) and must be won by two, and the match is best of five. From the two ratings the model works out the exact chance of every set score and every points total, allowing for some day-to-day variation in form.</p>
  <h3><span class="num">3</span>Why totals have two humps</h3>
  <p>A 3-0 ends around 131 points, a four-setter around 180 and a five-setter around 207. Few matches finish in between. Bookmakers set their line either low (they expect a 3-0) or high (a long match), so the over/under is mostly a bet on whether the match ends in straight sets.</p>
  <h3><span class="num">4</span>The bet</h3>
  <p>Only overs on low lines, below ${DATA.low}: across the backtest, unders and high-line overs did not beat the price. The model's job is to pick out the low-line matches most likely to go to a fourth set.</p>
  <h3><span class="num">5</span>What it cannot see</h3>
  <p>No news: injuries, transfers and rested players are invisible to it. Top teams rotate in Champions League and cup weeks, so those matches can be flagged by hand and the pick held back.</p></div>`;
}

const RENDER = {projections: renderProjections, picks: renderPicks, season: renderSeason, backtest: renderBacktest, method: renderMethod};
function render(){
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.view === view));
  $('out').innerHTML = RENDER[view]();
}
function fromHash(){ const m = location.hash.match(/view=(\w+)/); view = m && RENDER[m[1]] ? m[1] : 'projections'; render(); }
window.addEventListener('hashchange', fromHash);
fromHash();
