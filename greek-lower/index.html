  <div class="sub" id="sub"></div>
  <div class="seg lg" id="league"></div>
  <div class="tabs" id="tabs">
    <a href="#view=projections" data-view="projections" class="on">Projections</a>
    <a href="#view=market" data-view="market">Vs Bookie</a>

<script src="data.js?v=5495d8d0"></script>
<script>
const $ = id => document.getElementById(id);
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayName = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const pct = x => Math.round(x*100) + '%';
// model chances shown as odds with a 5% bookmaker-style margin (same as /superleague)
const MARGIN = 1.05;
const modelOdds = p => (p > 0 ? Math.max(1.01, 1 / (p * MARGIN)) : 99).toFixed(2);
const SHORT = {sl2: 'Super League 2', gamma: 'Gamma Ethniki 2', women: 'Women'};
let view = 'projections', edgeMin = .20, mkSeason = 'all', oddsWhen = 'close';
const betOn = new Set(['h', 'a', 'over', 'under']);   // picks that may get a bet (pills on Vs Bookie)
const lgs = new Set(['sl2']);                          // leagues picked with the pills (one or more)
const SEL = () => DATA.leagues.filter(l => lgs.has(l.key)), multi = () => lgs.size > 1;
const tagOf = s => s === 'up' ? '<span class="tag">promoted</span>' : s === 'down' ? '<span class="tag">relegated</span>' : '';

$('sub').textContent = `${DATA.season.replace('-','–')} · updated ${DATA.updated} (Athens)`;

function card(g){
  const pick = Math.max(g.h, g.d, g.a);
  const cls = p => p === pick ? ' class="pick"' : '';
  return `<div class="card simple"><div class="ko">${g.dt.slice(11)} · ${g.round}${g.flag ? ' · ' + g.flag : ''}</div>
    <h3>${g.home} <span class="muted">–</span> ${g.away}</h3>
    <div class="xg">Expected goals <b>${g.xh.toFixed(2)}</b> – <b>${g.xa.toFixed(2)}</b> · total <b>${g.tot.toFixed(2)}</b></div>
    <div class="wdl"><i style="width:${g.h*100}%"></i><i style="width:${g.d*100}%"></i><i style="width:${g.a*100}%"></i></div>
    <div class="wdlt"><span>1 <b${cls(g.h)}>${modelOdds(g.h)}</b></span><span>X <b${cls(g.d)}>${modelOdds(g.d)}</b></span><span>2 <b${cls(g.a)}>${modelOdds(g.a)}</b></span></div>
    <div class="ou"><span>Over 2.5 <b>${modelOdds(g.over)}</b></span><span>Under 2.5 <b>${modelOdds(g.under)}</b></span></div></div>`;
}

function renderProjections(){
  let h = '<p class="note">Model odds for the next round, with a 5% margin like a bookmaker price; the bold one is the most likely result.</p>';
  for (const L of SEL()){
    if (multi()) h += `<h2 class="lgh">${L.name}</h2>`;
    if (!L.fixtures.length){ h += '<p class="note">The next round is not scheduled yet.</p>'; continue; }
    const byDay = {};
    L.fixtures.forEach(g => (byDay[g.dt.slice(0,10)] ||= []).push(g));
    for (const [d, gs] of Object.entries(byDay)) h += `<h2 class="day">${dayName(d)}</h2><div class="grid">${gs.map(card).join('')}</div>`;
  }
  return h;
}

// --- Vs Bookie ---------------------------------------------------------------------------------------------------
const MK = [['1', 'x12', 0, 'h'], ['X', 'x12', 1, 'd'], ['2', 'x12', 2, 'a'], ['Over 2.5', 'ou', 0, 'over'], ['Under 2.5', 'ou', 1, 'under']];
const modelP = (g, k) => k === 'under' ? 1 - g.over : g[k];
// bookmaker chance with the margin taken out, averaged over every bookmaker that priced the game
function fairP(books, i){
  const v = Object.values(books || {});
  if (!v.length) return null;
  return v.reduce((s, o) => s + (1 / o[i]) / o.reduce((t, x) => t + 1 / x, 0), 0) / v.length;
}
function best(books, i){
  let b = null;
  for (const [name, o] of Object.entries(books || {})) if (!b || o[i] > b[0]) b = [o[i], name];
  return b;
}
// open = the bookmakers' first prices for the game instead of the latest (about closing)
function bets(g, open){
  const out = [];
  if (!g.odds) return out;
  for (const [lab, m, i, k] of MK){
    const b = best(g.odds[open ? 'o' + m : m], i);
    if (!b) continue;
    const p = modelP(g, k);
    out.push({lab, m, k, p, fair: fairP(g.odds[m], i), price: b[0], book: b[1], edge: p * b[0] - 1});
  }
  return out;
}
// the one pick per game that gets a bet: the biggest edge, if it reaches the chosen edge (never the draw)
function pick(bs){
  const top = bs.filter(b => betOn.has(b.k)).reduce((m, b) => !m || b.edge > m.edge ? b : m, null);
  return top && top.edge >= edgeMin ? top : null;
}
const won = (g, k) => ({h: g.hg > g.ag, d: g.hg === g.ag, a: g.hg < g.ag, over: g.hg + g.ag > 2, under: g.hg + g.ag < 3})[k];
const sgnPct = x => (x >= 0 ? '+' : '−') + Math.abs(x * 100).toFixed(0) + '%';
const units = x => (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(1) + 'u';

function vbCard(g){
  const bs = bets(g), top = pick(bs);
  const rows = bs.map(b => `<tr class="${b === top ? 'val' : ''}"><td>${b.lab}</td>`+
    `<td class="n">${modelOdds(b.p)}</td><td class="n tot">${b.price.toFixed(2)} <span class="bk">${b.book}</span></td>`+
    `<td class="n edge ${b.edge >= 0 ? 'ok' : 'bad'}">${sgnPct(b.edge)}</td></tr>`).join('');
  return `<div class="card simple"><div class="ko">${multi() ? SHORT[g._lg] + ' · ' : ''}${dayName(g.dt)} ${g.dt.slice(11)}</div><h3>${g.home} <span class="muted">–</span> ${g.away}</h3>` +
    (bs.length ? `<table class="vb"><thead><tr><th></th><th class="n">Model odds</th><th class="n">Best odds</th><th class="n">Edge</th></tr></thead><tbody>${rows}</tbody></table>`
               : '<p class="note">No bookmaker odds yet.</p>') + '</div>';
}

function record(rows){
  const all = {n: 0, w: 0, pl: 0}, by = {}, list = [];
  const ll = {m1: 0, b1: 0, n1: 0, m2: 0, b2: 0, n2: 0};
  for (const g of rows){
    const res = g.hg > g.ag ? 'h' : g.hg === g.ag ? 'd' : 'a', ov = g.hg + g.ag > 2;
    if (g.odds.x12 && Object.keys(g.odds.x12).length){
      ll.m1 -= Math.log(g[res]); ll.b1 -= Math.log(fairP(g.odds.x12, {h: 0, d: 1, a: 2}[res])); ll.n1++;
    }
    if (g.odds.ou && Object.keys(g.odds.ou).length){
      ll.m2 -= Math.log(ov ? g.over : 1 - g.over); ll.b2 -= Math.log(fairP(g.odds.ou, ov ? 0 : 1)); ll.n2++;
    }
    const b = pick(bets(g, oddsWhen === 'open'));
    if (b){
      const w = won(g, b.k), pl = w ? b.price - 1 : -1;
      for (const r of [all, by[b.lab] ||= {n: 0, w: 0, pl: 0}]){ r.n++; r.w += w; r.pl += pl; }
      list.push({g, b, w, pl});
    }
  }
  return {all, by, ll, list};
}

function llRow(lab, m, b, n){
  if (!n) return '';
  m /= n; b /= n;
  return `<tr><td>${lab}</td><td class="n">${n}</td><td class="n ${m <= b ? 'tot' : ''}">${m.toFixed(3)}</td><td class="n ${b < m ? 'tot' : ''}">${b.toFixed(3)}</td></tr>`;
}

function renderMarket(){
  const LS = SEL(), cur = +DATA.season.slice(0,4);
  const fixtures = LS.flatMap(L => L.fixtures.map(g => ({...g, _lg: L.key}))).sort((x, y) => x.dt.localeCompare(y.dt));
  let h = `<p class="note"><b>Model odds</b> are the model's odds with a 5% margin, like a bookmaker's; <b>best odds</b> the highest price among the Greek bookmakers; <b>edge</b> = model chance × best odds − 1, so the best odds must be about 5% above the model odds before the edge turns positive. Each game gets at most one bet, never on the draw: its biggest edge on 1, 2, over or under, highlighted when it reaches the chosen edge. The model disagrees with the bookmakers on almost every game and most of that is the model's own error, so a real edge should only turn up in a small share of games; the higher edges keep fewer. A very big gap usually means the bookmakers know something the model cannot see from scores alone (unpaid players, a youth side fielded, a coach change).</p>
    <div class="bar"><span class="muted" style="font:400 12px var(--mono);text-transform:uppercase;letter-spacing:.08em">Edge from</span><div class="chips" id="edge">${[.20, .30].map(x => `<button class="chip${x === edgeMin ? ' on' : ''}" data-e="${x}">${Math.round(x*100)}%+</button>`).join('')}</div></div>`;
  h += fixtures.length ? `<h2>Next round</h2><div class="grid">${fixtures.map(vbCard).join('')}</div>` : '<p class="note">The next round is not scheduled yet.</p>';

  const priced = LS.flatMap(L => L.results.filter(r => r.odds).map(r => ({...r, _lg: L.key})));
  const seasons = [...new Set(priced.map(r => r.season))].sort((a, b) => b - a);
  const pickS = mkSeason === 'cur' ? cur : +mkSeason;
  const rows = mkSeason === 'all' ? priced : priced.filter(r => r.season === pickS);
  const R = record(rows), a = R.all;
  h += `<h2>Record on played games</h2>
    <p class="note">Every played game with bookmaker odds: at most one 1-unit bet per game (1, 2, over or under, as picked in <b>Bet on</b>; never the draw), on its biggest edge among those picks if that is at least the <b>Edge from</b> value chosen above (20% unless you change it), at the best price among the Greek bookmakers. The model only used earlier games. <b>Closing</b> uses the last prices before kick-off, <b>opening</b> the first prices posted, which are softer but on the board days before the model is refitted after the previous round.</p>
    <div class="bar"><div class="seg" id="mkwhen"><button data-w="close" class="${oddsWhen === 'close' ? 'on' : ''}">Closing odds</button><button data-w="open" class="${oddsWhen === 'open' ? 'on' : ''}">Opening odds</button></div><div class="seg" id="mkseason"><button data-s="all" class="${mkSeason === 'all' ? 'on' : ''}">All</button>${seasons.map(s => `<button data-s="${s === cur ? 'cur' : s}" class="${mkSeason !== 'all' && pickS === s ? 'on' : ''}">${s}–${String(s+1).slice(2)}</button>`).join('')}</div></div>
    <div class="bar"><span class="muted" style="font:400 12px var(--mono);text-transform:uppercase;letter-spacing:.08em">Bet on</span><div class="chips" id="beton">${MK.filter(m => m[3] !== 'd').map(([lab, , , k]) => `<button class="chip${betOn.has(k) ? ' on' : ''}" data-k="${k}">${lab}</button>`).join('')}</div></div>
    <div class="metrics"><div class="metric"><div class="lbl">Games with odds</div><div class="big">${rows.length}</div></div>
    <div class="metric"><div class="lbl">Bets</div><div class="big">${a.n}</div></div>
    <div class="metric"><div class="lbl">Games bet</div><div class="big">${rows.length ? pct(a.n / rows.length) : '–'}</div></div>
    <div class="metric"><div class="lbl">Won</div><div class="big">${a.n ? pct(a.w / a.n) : '–'}</div></div>
    <div class="metric"><div class="lbl">Profit</div><div class="big ${a.pl >= 0 ? 'ok' : 'bad'}">${a.n ? units(a.pl) : '–'}</div></div>
    <div class="metric"><div class="lbl">Return</div><div class="big ${a.pl >= 0 ? 'ok' : 'bad'}">${a.n ? sgnPct(a.pl / a.n) : '–'}</div></div></div>`;
  h += `<div class="mkcols"><table class="mini"><thead><tr><th>Pick</th><th class="n">Bets</th><th class="n">Won</th><th class="n">Profit</th><th class="n">Return</th></tr></thead><tbody>` +
    MK.filter(m => m[3] !== 'd').map(([lab]) => { const r = R.by[lab]; return r ? `<tr><td>${lab}</td><td class="n">${r.n}</td><td class="n">${pct(r.w / r.n)}</td><td class="n ${r.pl >= 0 ? 'ok' : 'bad'}">${units(r.pl)}</td><td class="n ${r.pl >= 0 ? 'ok' : 'bad'}">${sgnPct(r.pl / r.n)}</td></tr>` : `<tr><td>${lab}</td><td class="n muted" colspan="4">no bets</td></tr>`; }).join('') +
    `</tbody></table><table class="mini"><thead><tr><th>Who is more accurate (log loss, lower is better)</th><th class="n">Games</th><th class="n">Model</th><th class="n">Bookie</th></tr></thead><tbody>` +
    llRow('1X2', R.ll.m1, R.ll.b1, R.ll.n1) + llRow('Over/under 2.5', R.ll.m2, R.ll.b2, R.ll.n2) + `</tbody></table></div>`;
  if (R.list.length){
    h += `<h2>The bets</h2><div class="scroll"><table class="bets"><thead><tr><th>Date</th><th>Match</th><th class="n">Score</th><th class="n">Bet</th><th class="n">Model odds</th><th class="n">Best odds</th><th class="n">Edge</th><th class="n">Profit</th></tr></thead><tbody>` +
      [...R.list].sort((x, y) => y.g.dt.localeCompare(x.g.dt)).map(({g, b, w, pl}) =>
        `<tr><td class="muted">${dayName(g.dt)} ${g.dt.slice(2, 4)}</td><td class="wr">${g.home} – ${g.away}${multi() ? ` <span class="bk">${SHORT[g._lg]}</span>` : ''}</td><td class="n">${g.hg}–${g.ag}</td><td class="n tot">${b.lab}</td>`+
        `<td class="n">${modelOdds(b.p)}</td><td class="n">${b.price.toFixed(2)} <span class="bk">${b.book}</span></td>`+
        `<td class="n">${sgnPct(b.edge)}</td><td class="n ${w ? 'ok' : 'bad'}">${units(pl)}</td></tr>`).join('') + `</tbody></table></div>`;
  }
  return h;
}

// Table & ratings sorting: click a header; first click puts the best first, a second click flips it
let tSort = 'pos', tDir = 1;
const T_COLS = [['pos', '#', 'n', 1], ['team', 'Team', '', 1], ['p', 'P', 'n', -1], ['w', 'W', 'n', -1], ['d', 'D', 'n', -1], ['l', 'L', 'n', 1],
  ['gd', 'Goals', 'n', -1], ['pts', 'Pts', 'n', -1], ['rgf', 'Rating for', 'n gl', -1], ['rga', 'against', 'n', 1], ['rd', 'diff', 'n', -1]];
function renderTable(){
  let h = '';
  for (const L of SEL()) h += leagueTable(L);
  return h + `<p class="note"><b>Rating</b> columns are the model's current expected goals scored and conceded per game against an average team of the league (home and away averaged), from the last three seasons with recent games counting most. Promoted and relegated teams are marked. Click a column heading to sort.</p>`;
}
function leagueTable(L){
  const R = Object.fromEntries(L.ratings.map(r => [r.team, r]));
  let h = multi() ? `<h2 class="lgh">${L.name}</h2>` : '';
  const rows = L.table.map((t, i) => {
    const r = R[t.team] || {gf: 0, ga: 0, status: ''};
    return {t, r, pos: i + 1, team: t.team, p: t.p, w: t.w, d: t.d, l: t.l, gd: t.gf - t.ga, pts: t.pts, rgf: r.gf, rga: r.ga, rd: r.gf - r.ga};
  });
  rows.sort((a, b) => (tSort === 'team' ? a.team.localeCompare(b.team) : a[tSort] - b[tSort]) * tDir || a.pos - b.pos);
  h += `<div class="scroll"><table class="tm"><thead><tr>` + T_COLS.map(([k, lab, cls]) =>
    `<th class="${cls} srt${k === tSort ? ' on' : ''}" data-sort="${k}">${lab}${k === tSort ? (tDir === T_COLS.find(c => c[0] === k)[3] ? ' ▾' : ' ▴') : ''}</th>`).join('') + `</tr></thead><tbody>`;
  for (const {t, r, pos, rd: d} of rows)
    h += `<tr><td class="n muted">${pos}</td><td>${t.team}${tagOf(r.status)}</td><td class="n">${t.p}</td><td class="n">${t.w}</td><td class="n">${t.d}</td><td class="n">${t.l}</td><td class="n">${t.gf}–${t.ga}</td><td class="n tot">${t.pts}</td>`+
      `<td class="n gl">${r.gf.toFixed(2)}</td><td class="n">${r.ga.toFixed(2)}</td><td class="n ${d >= 0 ? 'ok' : 'bad'}">${d >= 0 ? '+' : '−'}${Math.abs(d).toFixed(2)}</td></tr>`;
  h += '</tbody></table></div>';
  if (L.key === 'gamma') h += `<p class="note">Group 2 only. The ratings also learn from the other Gamma Ethniki groups, since teams move between groups from one season to the next.</p>`;
  return h;
}

function renderMethod(){
  const rows = DATA.leagues.map(l => {
    const b = l.backtest, g1 = (1 - b.ll_1x2 / b.base_1x2) * 100, g2 = (1 - b.ll_ou / b.base_ou) * 100;
    return `<tr><td>${l.name}</td><td class="n">${b.n}</td><td class="n">${b.ll_1x2.toFixed(3)}</td><td class="n muted">${b.base_1x2.toFixed(3)}</td><td class="n tot">${g1.toFixed(1)}%</td><td class="n gl">${b.ll_ou.toFixed(3)}</td><td class="n muted">${b.base_ou.toFixed(3)}</td><td class="n tot">${g2.toFixed(1)}%</td></tr>`;
  }).join('');
  const prm = DATA.leagues.map(l => `<tr><td>${l.name}</td><td class="n">${l.params['1x2'].half_life}</td><td class="n">${l.params['1x2'].k}</td><td class="n">${l.params['1x2'].a}</td><td class="n">${l.params['1x2'].u ?? 0}</td><td class="n gl">${l.params.ou.half_life}</td><td class="n">${l.params.ou.k}</td><td class="n">${l.params.ou.a}</td><td class="n">${l.params.ou.u ?? 0}</td><td class="n gl">${l.home.toFixed(2)} – ${l.away.toFixed(2)}</td></tr>`).join('');
  return `<div class="doc">
  <p>What goes in: every league game of the last three seasons, for Super League 2, all four Gamma Ethniki groups and Division A Women, plus the Super League and Super League 2 team lists to know who was relegated. For games already played in these three leagues, the closing bookmaker odds go in too (see below).</p>
  <h3><span class="num">1</span>Ratings</h3>
  <p>Each team gets an attack and a defence rating, plus one home advantage per league. Expected goals for a game are</p>
  <div class="calc">home goals = league average × home advantage × home attack × away defence<br>away goals = league average × away attack × home defence</div>
  <p>The ratings are fitted to the old scores (Poisson). Recent games count more: a game loses half its weight every <i>half-life</i> days. Every rating is also pulled (strength <i>k</i>) towards the club's own long-run level, a slower fit over the last three seasons, so a club with few recent games falls back to what it usually is (PAOK stay champions after the summer break) instead of to an average team. Newly promoted teams start a step below average and relegated teams a step above (size <i>a</i>).</p>
  <p>A final score is a noisy record of a game: a 1–0 can be a game the winner should have lost. So each past game also counts the goals its closing odds implied (the home and away expected goals that match the bookmakers' 1X2 and over/under prices), a stand-in for xG. A past game is fitted as (1 − <i>u</i>) × real goals + <i>u</i> × odds-implied goals. Only odds of games already played are used, never the odds of the game being predicted. In the backtest this made 1X2 about 1.5% more accurate in all three leagues; over/under gained less.</p>
  <h3><span class="num">2</span>Chances</h3>
  <p>The expected goals of each side give a Poisson chance for every score from 0–0 to 10–10. Adding them up gives home / draw / away and over / under 2.5. Odds shown are the chances with a 5% margin added, like a bookmaker price (1 / (chance × 1.05)), so a bookmaker price above them is worth a look.</p>
  <p>1X2 and over/under use two separate fits: the backtest showed that the goal total needs much more pull towards average than the home/away balance does. That is why the expected-goals line and the total can differ a little.</p>
  <h3><span class="num">3</span>Settings, picked by backtest</h3>
  <div class="scroll"><table class="mini"><thead><tr><th></th><th class="n">1X2 half-life</th><th class="n">k</th><th class="n">a</th><th class="n">u</th><th class="n gl">O/U half-life</th><th class="n">k</th><th class="n">a</th><th class="n">u</th><th class="n gl">Avg goals H–A</th></tr></thead><tbody>${prm}</tbody></table></div>
  <h3><span class="num">4</span>How good is it</h3>
  <p>Walk-forward test over 2024–25, 2025–26 and this season: before every week the model was refitted on earlier games only and then scored on that week. Log loss, lower is better; the baseline uses only how often home wins, draws, away wins and overs had happened so far.</p>
  <div class="scroll"><table class="mini"><thead><tr><th></th><th class="n">Games</th><th class="n">1X2 model</th><th class="n">baseline</th><th class="n">better</th><th class="n gl">O/U model</th><th class="n">baseline</th><th class="n">better</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p>1X2 is clearly better than knowing nothing about the teams. Over/under 2.5 is only slightly better: goal totals are hard to predict from scores alone, especially in Super League 2. There are no shots, line-ups or team news in these models, and the bookmakers are still more accurate (see Vs Bookie), so treat the numbers as a starting point, not as value on their own.</p>
  </div>`;
}

function render(){
  $('league').innerHTML = DATA.leagues.map(l => `<button data-l="${l.key}" class="${lgs.has(l.key) ? 'on' : ''}">${SHORT[l.key]}</button>`).join('');
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.view === view));
  $('league').style.display = view === 'method' ? 'none' : '';
  $('out').innerHTML = {projections: renderProjections, market: renderMarket, table: renderTable, method: renderMethod}[view]();
}

function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  if (['projections', 'market', 'table', 'method'].includes(p.get('view'))) view = p.get('view');
  const ks = (p.get('league') || '').split(',').filter(k => DATA.leagues.some(l => l.key === k));
  if (ks.length){ lgs.clear(); ks.forEach(k => lgs.add(k)); }
}
function writeHash(){ history.replaceState(null, '', `#view=${view}&league=${[...lgs].join(',')}`); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-l],[data-sort],#beton button,#edge button,#mkseason button,#mkwhen button');
  if (!t) return;
  e.preventDefault();
  if (t.dataset.k) { if (!betOn.has(t.dataset.k)) betOn.add(t.dataset.k); else if (betOn.size > 1) betOn.delete(t.dataset.k); }
  else if (t.dataset.sort) { const k = t.dataset.sort, def = T_COLS.find(c => c[0] === k)[3]; tDir = k === tSort ? -tDir : def; tSort = k; }
  else if (t.dataset.view) view = t.dataset.view;
  else if (t.dataset.l) { const k = t.dataset.l; if (!lgs.has(k)) lgs.add(k); else if (lgs.size > 1) lgs.delete(k); }
  else if (t.dataset.e) edgeMin = +t.dataset.e;
  else if (t.dataset.w) oddsWhen = t.dataset.w;
  else if (t.closest('#mkseason')) mkSeason = t.dataset.s;
  writeHash(); render();
});
readHash(); render();
</script>
</body>
