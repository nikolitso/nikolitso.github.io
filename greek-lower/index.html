<script src="data.js?v=e17cf016"></script>
<script>
const $ = id => document.getElementById(id);
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayName = s => { const d = new Date(s.slice(0,10)+'T12:00'); return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const pct = x => Math.round(x*100) + '%';
// model chances shown as odds with a 5% bookmaker-style margin (same as /superleague)
const MARGIN = 1.05;
const modelOdds = p => (p > 0 ? Math.max(1.01, 1 / (p * MARGIN)) : 99).toFixed(2);
const SHORT = {sl2: 'Super League 2', gamma: 'Gamma Ethniki 2', women: 'Women'};
let lg = 'sl2', view = 'projections', rsSeason = 'cur';
const LG = () => DATA.leagues.find(l => l.key === lg);
const tagOf = s => s === 'up' ? '<span class="tag">promoted</span>' : s === 'down' ? '<span class="tag">relegated</span>' : '';

$('sub').textContent = `${DATA.season.replace('-','–')} · updated ${DATA.updated} (Athens) · 1X2 and over/under 2.5 goals`;

function card(g){
  const pick = Math.max(g.h, g.d, g.a);
  const cls = p => p === pick ? ' class="pick"' : '';
  return `<div class="card simple"><div class="ko">${g.dt.slice(11)} · ${g.round}${g.flag ? ' · ' + g.flag : ''}</div>
    <h3>${g.home} <span class="muted">–</span> ${g.away}</h3>
    <div class="xg">Expected goals <b>${g.xh.toFixed(2)}</b> – <b>${g.xa.toFixed(2)}</b> · total <b>${g.tot.toFixed(2)}</b></div>
    <div class="wdl"><i style="width:${g.h*100}%"></i><i style="width:${g.d*100}%"></i><i style="width:${g.a*100}%"></i></div>
    <div class="wdlt"><span>1 <b${cls(g.h)}>${pct(g.h)}</b><br><i>${modelOdds(g.h)}</i></span><span>X <b${cls(g.d)}>${pct(g.d)}</b><br><i>${modelOdds(g.d)}</i></span><span>2 <b${cls(g.a)}>${pct(g.a)}</b><br><i>${modelOdds(g.a)}</i></span></div>
    <div class="ou"><span>Over 2.5 <b>${pct(g.over)}</b> <i>${modelOdds(g.over)}</i></span><span>Under 2.5 <b>${pct(g.under)}</b> <i>${modelOdds(g.under)}</i></span></div></div>`;
}

function renderProjections(){
  const L = LG();
  if (!L.fixtures.length) return '<p class="note">No fixtures scheduled in the next two weeks.</p>';
  const byDay = {};
  L.fixtures.forEach(g => (byDay[g.dt.slice(0,10)] ||= []).push(g));
  let h = '';
  for (const [d, gs] of Object.entries(byDay)) h += `<h2 class="day">${dayName(d)}</h2><div class="grid">${gs.map(card).join('')}</div>`;
  return h;
}

function renderResults(){
  const L = LG(), cur = +DATA.season.slice(0,4);
  const seasons = [...new Set(L.results.map(r => r.season))].sort((a, b) => b - a);
  const pickS = rsSeason === 'cur' ? cur : +rsSeason;
  const rows = L.results.filter(r => r.season === pickS).slice().reverse();
  let hit1 = 0, hitOU = 0;
  for (const r of rows){
    const res = r.hg > r.ag ? 'h' : r.hg === r.ag ? 'd' : 'a';
    const pk = ['h','d','a'].reduce((a, b) => r[b] > r[a] ? b : a);
    r._res = res; r._pk = pk;
    if (pk === res) hit1++;
    r._ouOk = (r.over >= .5) === (r.hg + r.ag > 2);
    if (r._ouOk) hitOU++;
  }
  const n = rows.length;
  let h = `<p class="note">Every league game, with the chances the model gave the day before it (only earlier games used). The <b>pick</b> is the most likely outcome.</p>
    <div class="bar"><div class="seg" id="rsseason">${seasons.map(s => `<button data-s="${s === cur ? 'cur' : s}" class="${s === pickS ? 'on' : ''}">${s}–${String(s+1).slice(2)}</button>`).join('')}</div></div>
    <div class="metrics"><div class="metric"><div class="lbl">Games</div><div class="big">${n}</div></div>
    <div class="metric"><div class="lbl">1X2 pick right</div><div class="big">${n ? pct(hit1/n) : '–'}</div></div>
    <div class="metric"><div class="lbl">Over/under 2.5 right</div><div class="big">${n ? pct(hitOU/n) : '–'}</div></div></div>`;
  h += `<div class="scroll"><table><thead><tr><th>Date</th><th>Match</th><th class="n">Score</th><th class="n">1</th><th class="n">X</th><th class="n">2</th><th class="n">Pick</th><th class="n">Exp. total</th><th class="n">Over 2.5</th><th class="n">O/U</th></tr></thead><tbody>`;
  const lab = {h: '1', d: 'X', a: '2'};
  for (const r of rows){
    const b = k => r._res === k ? ` class="n tot"` : ' class="n"';
    h += `<tr><td class="muted">${dayName(r.dt)}</td><td class="wr">${r.home} – ${r.away}</td><td class="n">${r.hg}–${r.ag}</td>`+
      `<td${b('h')}>${pct(r.h)}</td><td${b('d')}>${pct(r.d)}</td><td${b('a')}>${pct(r.a)}</td>`+
      `<td class="n ${r._pk === r._res ? 'ok' : 'bad'}">${lab[r._pk]}</td><td class="n">${r.tot.toFixed(2)}</td><td class="n">${pct(r.over)}</td>`+
      `<td class="n ${r._ouOk ? 'ok' : 'bad'}">${r.over >= .5 ? 'O' : 'U'}</td></tr>`;
  }
  return h + '</tbody></table></div>';
}

function renderTable(){
  const L = LG(), R = Object.fromEntries(L.ratings.map(r => [r.team, r]));
  let h = `<p class="note"><b>Rating</b> columns are the model's current expected goals scored and conceded per game against an average team of the league (home and away averaged), from the last three seasons with recent games counting most. Promoted and relegated teams are marked.</p>`;
  h += `<div class="scroll"><table class="tm"><thead><tr><th class="n">#</th><th>Team</th><th class="n">P</th><th class="n">W</th><th class="n">D</th><th class="n">L</th><th class="n">Goals</th><th class="n">Pts</th><th class="n gl">Rating for</th><th class="n">against</th><th class="n">diff</th></tr></thead><tbody>`;
  L.table.forEach((t, i) => {
    const r = R[t.team] || {gf: 0, ga: 0, status: ''};
    const d = r.gf - r.ga;
    h += `<tr><td class="n muted">${i+1}</td><td>${t.team}${tagOf(r.status)}</td><td class="n">${t.p}</td><td class="n">${t.w}</td><td class="n">${t.d}</td><td class="n">${t.l}</td><td class="n">${t.gf}–${t.ga}</td><td class="n tot">${t.pts}</td>`+
      `<td class="n gl">${r.gf.toFixed(2)}</td><td class="n">${r.ga.toFixed(2)}</td><td class="n ${d >= 0 ? 'ok' : 'bad'}">${d >= 0 ? '+' : '−'}${Math.abs(d).toFixed(2)}</td></tr>`;
  });
  h += '</tbody></table></div>';
  if (lg === 'gamma') h += `<p class="note">Group 2 only. The ratings also learn from the other Gamma Ethniki groups, since teams move between groups from one season to the next.</p>`;
  return h;
}

function renderMethod(){
  const rows = DATA.leagues.map(l => {
    const b = l.backtest, g1 = (1 - b.ll_1x2 / b.base_1x2) * 100, g2 = (1 - b.ll_ou / b.base_ou) * 100;
    return `<tr><td>${l.name}</td><td class="n">${b.n}</td><td class="n">${b.ll_1x2.toFixed(3)}</td><td class="n muted">${b.base_1x2.toFixed(3)}</td><td class="n tot">${g1.toFixed(1)}%</td><td class="n gl">${b.ll_ou.toFixed(3)}</td><td class="n muted">${b.base_ou.toFixed(3)}</td><td class="n tot">${g2.toFixed(1)}%</td></tr>`;
  }).join('');
  const prm = DATA.leagues.map(l => `<tr><td>${l.name}</td><td class="n">${l.params['1x2'].half_life}</td><td class="n">${l.params['1x2'].k}</td><td class="n">${l.params['1x2'].a}</td><td class="n gl">${l.params.ou.half_life}</td><td class="n">${l.params.ou.k}</td><td class="n">${l.params.ou.a}</td><td class="n gl">${l.home.toFixed(2)} – ${l.away.toFixed(2)}</td></tr>`).join('');
  return `<div class="doc">
  <p>Only final scores go in: every league game of the last three seasons from Flashscore, for Super League 2, all four Gamma Ethniki groups and Division A Women, plus the Super League and Super League 2 team lists to know who was relegated.</p>
  <h3><span class="num">1</span>Ratings</h3>
  <p>Each team gets an attack and a defence rating, plus one home advantage per league. Expected goals for a game are</p>
  <div class="calc">home goals = league average × home advantage × home attack × away defence<br>away goals = league average × away attack × home defence</div>
  <p>The ratings are fitted to the old scores (Poisson). Recent games count more: a game loses half its weight every <i>half-life</i> days. Every rating is also pulled towards average (strength <i>k</i>), so a team with few games stays near average. Newly promoted teams start a step below average and relegated teams a step above (size <i>a</i>).</p>
  <h3><span class="num">2</span>Chances</h3>
  <p>The expected goals of each side give a Poisson chance for every score from 0–0 to 10–10. Adding them up gives home / draw / away and over / under 2.5. Odds shown are the chances with a 5% margin added, like a bookmaker price (1 / (chance × 1.05)), so a bookmaker price above them is worth a look.</p>
  <p>1X2 and over/under use two separate fits: the backtest showed that the goal total needs much more pull towards average than the home/away balance does. That is why the expected-goals line and the total can differ a little.</p>
  <h3><span class="num">3</span>Settings, picked by backtest</h3>
  <div class="scroll"><table class="mini"><thead><tr><th></th><th class="n">1X2 half-life</th><th class="n">k</th><th class="n">a</th><th class="n gl">O/U half-life</th><th class="n">k</th><th class="n">a</th><th class="n gl">Avg goals H–A</th></tr></thead><tbody>${prm}</tbody></table></div>
  <h3><span class="num">4</span>How good is it</h3>
  <p>Walk-forward test over 2024–25, 2025–26 and this season: before every week the model was refitted on earlier games only and then scored on that week. Log loss, lower is better; the baseline uses only how often home wins, draws, away wins and overs had happened so far.</p>
  <div class="scroll"><table class="mini"><thead><tr><th></th><th class="n">Games</th><th class="n">1X2 model</th><th class="n">baseline</th><th class="n">better</th><th class="n gl">O/U model</th><th class="n">baseline</th><th class="n">better</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p>1X2 is clearly better than knowing nothing about the teams. Over/under 2.5 is only slightly better: goal totals are hard to predict from scores alone, especially in Super League 2. There are no shots, xG, line-ups or odds in these models, so treat the numbers as a starting point, not as value on their own.</p>
  </div>`;
}

function render(){
  $('league').innerHTML = DATA.leagues.map(l => `<button data-l="${l.key}" class="${l.key === lg ? 'on' : ''}">${SHORT[l.key]}</button>`).join('');
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.view === view));
  $('league').style.display = view === 'method' ? 'none' : '';
  $('out').innerHTML = {projections: renderProjections, results: renderResults, table: renderTable, method: renderMethod}[view]();
}

function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('view')) view = p.get('view');
  if (DATA.leagues.some(l => l.key === p.get('league'))) lg = p.get('league');
}
function writeHash(){ history.replaceState(null, '', `#view=${view}&league=${lg}`); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-l],#rsseason button');
  if (!t) return;
  e.preventDefault();
  if (t.dataset.view) view = t.dataset.view;
  else if (t.dataset.l) { lg = t.dataset.l; rsSeason = 'cur'; }
  else rsSeason = t.dataset.s;
  writeHash(); render();
});
readHash(); render();
</script>
</body>
</html>
