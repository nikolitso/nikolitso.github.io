<!doctype html>
<html lang="en" data-site="paok">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAOK Hub — News</title>
<style>
  :root{
    --ink: var(--an-ink);
    --sub: var(--an-muted);
    --line: var(--an-rule);
    --bg: var(--an-paper);
    --card: var(--an-soft);
    --accent: var(--an-accent);
    --accent-soft: var(--an-accent-soft);
    --an-wrap: 900px;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:44px 24px 72px;background:var(--bg);color:var(--ink);font-family:var(--an-body);}
  .wrap{max-width:900px;margin:0 auto;}

  .meta-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
  .meta-pill{font-family:var(--an-mono);font-size:13.5px;color:var(--sub);
       background:var(--accent-soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;}

  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
  .tab{font-family:var(--an-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
       color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;}
  .tab:hover{color:var(--ink);}
  .tab[aria-selected="true"]{color:var(--bg);background:var(--accent);border-color:var(--accent);}

  .day{font-family:var(--an-mono);font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);
       font-weight:600;margin:30px 0 4px;display:flex;align-items:center;gap:8px;}
  .day:first-child{margin-top:0;}
  .day .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}

  .item{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;}
  .item:hover .title{color:var(--accent);text-decoration:underline;}
  .item .time{flex:0 0 52px;font-family:var(--an-mono);font-size:14px;color:var(--sub);padding-top:2px;}
  .item .body{flex:1;min-width:0;}
  .item .title{display:block;font-size:17px;font-weight:600;line-height:1.4;}
  .item .source{display:block;font-family:var(--an-mono);font-size:12.5px;color:var(--sub);margin-top:4px;}

  .empty{color:var(--sub);font-size:15px;padding:18px 0;}
  .footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);color:var(--sub);font-size:13.5px;line-height:1.5;}

  @media (max-width:520px){
    body{padding:32px 16px 56px;}
    .item{gap:10px;}
    .item .title{font-size:16px;}
  }
</style>
<link rel="stylesheet" href="/assets/an.css?v=1">
</head>
<body>
<!-- sitebar:start (link back to antonisnikolitsopoulos.com; keep on every page) -->
<nav class="an-sitebar" aria-label="Main site"><div><a href="/books/">Books</a><a href="/#projects">Projects</a><a href="/about/">About</a><a href="/" title="Main site: antonisnikolitsopoulos.com" aria-label="Main site"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg></a></div></nav>
<!-- sitebar:end -->


<header class="an-head"><div>
  <a class="an-brand" href="index.html"><svg class="an-mark" aria-hidden="true"><use href="/assets/marks.svg#paok"/></svg><span><small class="an-kicker">PAOK Hub</small><h1>News</h1></span></a>
</div></header>
<div class="wrap">

<div class="meta-row">
  <span class="meta-pill" id="count">&hellip;</span>
  <span class="meta-pill" id="updated" hidden></span>
</div>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="football">Football</button>
  <button class="tab" role="tab" data-tab="basketball">Basketball</button>
  <button class="tab" role="tab" data-tab="all">All</button>
</div>

<div id="list"></div>

<div class="footer">Headlines from <a href="https://www.paok24.com/" target="_blank" rel="noopener">PAOK24</a>, <a href="https://paoktoday.gr/" target="_blank" rel="noopener">PAOK Today</a> and <a href="https://inpaok.com/" target="_blank" rel="noopener">inPAOK</a>, last 14 days. Each headline opens the original article on that site. Times are Athens time.</div>

</div>

<script>
(function () {
  var items = [], tab = 'football';
  var list = document.getElementById('list'), tabs = document.querySelectorAll('.tab');
  var zone = { timeZone: 'Europe/Athens' };
  function fmt(d, o) { return d.toLocaleString('en-GB', Object.assign({}, zone, o)); }
  function dayLabel(d) {
    var key = function (x) { return fmt(x, { year: 'numeric', month: '2-digit', day: '2-digit' }); };
    var now = new Date(), y = new Date(now.getTime() - 864e5);
    if (key(d) === key(now)) return 'Today';
    if (key(d) === key(y)) return 'Yesterday';
    return fmt(d, { weekday: 'long', day: 'numeric', month: 'long' });
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function render() {
    tabs.forEach(function (t) { t.setAttribute('aria-selected', t.dataset.tab === tab ? 'true' : 'false'); });
    var shown = items.filter(function (i) { return tab === 'all' || i.sport === tab; });
    document.getElementById('count').textContent = shown.length + ' headlines';
    list.textContent = '';
    if (!shown.length) { list.appendChild(el('div', 'empty', 'No headlines here right now.')); return; }
    var last = '';
    shown.forEach(function (i) {
      var d = new Date(i.time), label = dayLabel(d);
      if (label !== last) {
        var h = el('p', 'day');
        h.appendChild(el('span', 'dot'));
        h.appendChild(document.createTextNode(label));
        list.appendChild(h);
        last = label;
      }
      var a = el('a', 'item');
      a.href = i.link; a.target = '_blank'; a.rel = 'noopener';
      a.appendChild(el('span', 'time', fmt(d, { hour: '2-digit', minute: '2-digit' })));
      var b = el('span', 'body');
      b.appendChild(el('span', 'title', i.title));
      b.appendChild(el('span', 'source', i.source));
      a.appendChild(b);
      list.appendChild(a);
    });
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { tab = t.dataset.tab; render(); }); });
  fetch('news.json?_=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    items = d.items;
    var u = document.getElementById('updated');
    u.textContent = 'Updated ' + fmt(new Date(d.updated), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    u.hidden = false;
    render();
  }).catch(function () {
    document.getElementById('count').textContent = 'News unavailable';
    list.appendChild(el('div', 'empty', 'Could not load the headlines right now. Try refreshing.'));
  });
})();
</script>

</html>
