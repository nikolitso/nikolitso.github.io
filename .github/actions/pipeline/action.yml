name: Run a BettingSignal pipeline
description: >
  Check out the private repo nikolitso/BettingSignal, run one of its pipelines, publish the pages it wrote
  here, and save its refreshed data back to BettingSignal. Used by the Handball, Basketball, EuroCup,
  Volleyball, Challenge Cup Women, Greek Cup, Super League and PAOK Hub workflows (the last one
  publishes to nikolitso/paok-hub through `site`). If the pipeline fails nothing is published or saved.
inputs:
  dir:
    description: Folder inside BettingSignal to run in (e.g. eurocup, handball/projector)
    required: true
  run:
    description: The command(s) that refresh and rebuild the pages
    required: true
  requirements:
    description: pip arguments (package names or -r files, paths from the repo root)
    default: ""
  browser:
    description: "true to install Playwright's Chromium"
    default: "false"
  pages:
    description: Paths in this repo to publish (space-separated)
    required: true
  label:
    description: Commit message prefix, e.g. EuroCup
    required: true
  token:
    description: SITES_TOKEN (Contents read & write on nikolitso/BettingSignal, and on `site` if given)
    required: true
  site:
    description: "Another repo whose pages the pipeline writes (e.g. nikolitso/paok-hub); default: this one"
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        repository: nikolitso/BettingSignal
        token: ${{ inputs.token }}
        path: _bs
    - uses: actions/checkout@v5
      if: inputs.site != ''
      with:
        repository: ${{ inputs.site }}
        token: ${{ inputs.token }}
        path: _site
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install
      shell: bash
      run: |
        if [ -n "${{ inputs.requirements }}" ]; then pip install --quiet ${{ inputs.requirements }}; fi
        if [ "${{ inputs.browser }}" = "true" ]; then playwright install --with-deps chromium; fi
    - name: Update
      shell: bash
      working-directory: _bs/${{ inputs.dir }}
      env:
        TZ: Europe/Athens
        PYTHONIOENCODING: utf-8
        SITE_REPO: ${{ inputs.site != '' && format('{0}/_site', github.workspace) || github.workspace }}
      run: ${{ inputs.run }}
    - name: Publish the pages
      shell: bash
      working-directory: ${{ inputs.site != '' && '_site' || '.' }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add ${{ inputs.pages }}
        if git diff --cached --quiet; then echo "pages unchanged"; exit 0; fi
        git commit -q -m "${{ inputs.label }}: refresh $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')"
        # several pipelines push at once: on a rejected push, rebase and try again
        for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 5)); done
        exit 1
    - name: Save the data
      shell: bash
      working-directory: _bs
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then echo "data unchanged"; exit 0; fi
        git commit -q -m "${{ inputs.label }}: refresh $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')"
        # several pipelines push at once: on a rejected push, rebase and try again
        for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 5)); done
        exit 1
