name: Greek lower leagues

# /greek-lower/: this season's results and fixtures from Flashscore, 1X2 and O/U models, bookmaker odds, the
# page and the homepage block. Scripts and data in nikolitso/BettingSignal (greek-lower/). Nightly; "Update all
# sites" runs it too. Hand-added odds go in the BettingSignal checkout (git pull first).
on:
  schedule:
    - cron: "0 21 * * *"   # 23:00 Athens in winter (00:00 in summer)
  workflow_dispatch:        # Run workflow button: Actions tab, or the GitHub mobile app

permissions:
  contents: write

concurrency:
  group: greek-lower
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline
        with:
          dir: greek-lower
          requirements: -r _bs/greek-lower/requirements.txt
          browser: "true"
          run: python -u update.py
          pages: greek-lower index.html
          label: Greek lower leagues
          token: ${{ secrets.SITES_TOKEN }}
