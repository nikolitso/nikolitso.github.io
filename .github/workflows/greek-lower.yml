name: Greek lower leagues

# /greek-lower/: this season's results and fixtures from Flashscore, 1X2 and O/U models, bookmaker odds and the
# page. The pipeline also writes a "Picks this round" block into index.html; that is discarded, not published,
# so betting picks stay off the homepage. Scripts and data in nikolitso/BettingSignal (greek-lower/). Nightly; "Update all
# sites" runs it too. Hand-added odds go in the BettingSignal checkout (git pull first).
on:
  schedule:
    - cron: "0 21 * * *"   # 23:00 Athens in winter (00:00 in summer)
  workflow_dispatch:        # Run workflow button: Actions tab, or the GitHub mobile app

permissions:
  contents: write

concurrency:
  group: greek-lower
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline
        with:
          dir: greek-lower
          requirements: -r _bs/greek-lower/requirements.txt
          browser: "true"
          run: |
            python -u update.py
            git -C "$GITHUB_WORKSPACE" checkout -- index.html   # keep the picks block off the homepage
          pages: greek-lower
          label: Greek lower leagues
          token: ${{ secrets.SITES_TOKEN }}
