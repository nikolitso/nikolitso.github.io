name: Site · PAOK News

# PAOK Hub news page (/paok-hub/news.html): latest headlines from paok24.com, paoktoday.gr and inpaok.com into
# paok-hub/news.json. Only headline, link, time and source are stored. build_news.py lives in nikolitso/BettingSignal
# (paok-hub/). A run with no new headline publishes nothing.
on:
  schedule:
    - cron: "20 5-21/2 * * *"   # every two hours, 07:20 to 23:20 Athens in winter
  workflow_dispatch:             # Run workflow button: Actions tab, or the GitHub mobile app

permissions:
  contents: write

concurrency:
  group: paok-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline
        with:
          dir: paok-hub
          run: |
            export SITE_REPO="$GITHUB_WORKSPACE/paok-hub"
            python -X utf8 -u build_news.py
          pages: paok-hub/news.json
          label: PAOK News
          token: ${{ secrets.SITES_TOKEN }}
