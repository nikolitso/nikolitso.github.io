name: Feed · Women's basketball totals live test

# Live test of the two women's totals signals. Publishes basketball/women/live.js, game pages and sitemap; the rest of the page is fixed.
# Scripts, frozen rules and the record are in nikolitso/BettingSignal (women-totals/); read data/report.md there.
# Runs after each men's totals run, so it inherits that job's hourly outside timer. The schedule is only a backup.
on:
  workflow_run:
    workflows: ["Feed · Basketball totals live test"]
    types: [completed]
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basketball-women-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: nikolitso/BettingSignal
          token: ${{ secrets.SITES_TOKEN }}
          path: _bs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: pip install --quiet -r _bs/basketball-overs/requirements.txt
      - name: Update
        working-directory: _bs/women-totals
        env:
          PYTHONIOENCODING: utf-8
          SITE_REPO: ${{ github.workspace }}
        run: python -u wlive.py
      - name: Publish the page data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball/women/live.js basketball/women/games basketball/women/sitemap.xml
          if git diff --cached --quiet; then echo "page unchanged"; exit 0; fi
          git commit -q -m "Women's basketball totals: refresh $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
      - name: Save the data
        working-directory: _bs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add women-totals
          if git diff --cached --quiet; then echo "data unchanged"; exit 0; fi
          git commit -q -m "Women's basketball totals: live test $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
