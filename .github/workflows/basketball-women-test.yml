name: Feed · Women's basketball totals live test

# Live test of the two women's totals signals. Publishes basketball/women/live.js, game pages and sitemap; the rest of the page is fixed.
# Scripts, frozen rules and the record are in nikolitso/BettingSignal (women-totals/); read data/report.md there.
# Runs after each men's totals run, so it inherits that job's hourly outside timer. The schedule is only a backup.
on:
  workflow_run:
    workflows: ["Feed · Basketball totals live test"]
    types: [completed]
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basketball-women-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: nikolitso/BettingSignal
          token: ${{ secrets.SITES_TOKEN }}
          path: _bs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: pip install --quiet -r _bs/basketball-overs/requirements.txt
      - name: Update
        working-directory: _bs/women-totals
        env:
          PYTHONIOENCODING: utf-8
          SITE_REPO: ${{ github.workspace }}
        shell: bash
        run: python -u wlive.py 2>&1 | tee /tmp/wlive.log
      - name: Publish the page data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball/women/live.js basketball/women/games basketball/women/sitemap.xml
          if git diff --cached --quiet; then echo "page unchanged"; exit 0; fi
          git commit -q -m "Women's basketball totals: refresh $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
      - name: Message new picks
        # an ntfy push for every new record pick (11 Nov 2026), sent once the page has it; the topic is the NTFY_TOPIC secret
        if: ${{ success() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: python
        run: |
          import json, os, time, urllib.request
          topic = os.environ.get('NTFY_TOPIC', '').strip()
          line = next((l for l in open('/tmp/wlive.log', encoding='utf-8') if l.startswith('NEWPICKS ')), None)
          new = json.loads(line[9:]) if line and topic else []
          for s in new:
              body = (f"{s['home']} – {s['away']}\n{s['league']} · {s['when']} (Greek time)\n"
                      f"Price {s['px']:.2f} · edge {s['edge']*100:+.0f}% · model {s['mu']}").encode('utf-8')
              req = urllib.request.Request('https://ntfy.sh/' + topic, data=body, method='POST', headers={
                  'Title': f"Women's basketball pick: {s['side']} {s['line']}", 'Tags': 'basketball',
                  'Click': 'https://antonisnikolitsopoulos.com/basketball/women/#view=livetest'})
              try:
                  print(s['home'], urllib.request.urlopen(req, timeout=30).status)
              except Exception as e:
                  print(s['home'], 'not sent', e)
              time.sleep(2)
          print(len(new), 'new picks', '' if topic else '(no NTFY_TOPIC secret: nothing sent)')
      - name: Save the data
        working-directory: _bs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add women-totals
          if git diff --cached --quiet; then echo "data unchanged"; exit 0; fi
          git commit -q -m "Women's basketball totals: live test $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
      - name: Data check message
        # wlive.py check(): a league in season with no new result for 10 days, no odds for any game, or a feed failing both ways.
        # One message a day, on the first run after 05:00 UTC (the 6-hour backup runs at :37 past 0, 6, 12, 18, so it is not in that hour)
        if: ${{ always() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: python
        run: |
          import os, datetime, urllib.request
          try:
              warn = [l.split('::', 2)[2].strip() for l in open('/tmp/wlive.log', encoding='utf-8') if l.startswith("::warning title=Women's totals data check::")]
          except FileNotFoundError:
              warn = []
          print('\n'.join(warn) or 'data check: all fine')
          topic = os.environ.get('NTFY_TOPIC', '').strip()
          if warn and topic and datetime.datetime.now(datetime.UTC).hour == 5:
              req = urllib.request.Request('https://ntfy.sh/' + topic, data='\n'.join(warn).encode('utf-8'), method='POST', headers={
                  'Title': "Women's basketball totals data check", 'Tags': 'warning'})
              try:
                  print('sent', urllib.request.urlopen(req, timeout=30).status)
              except Exception as e:
                  print('not sent', e)
