name: Site · Thought Bank

# The quotes live in thought-bank/quotes.json and the page draws them in the browser. This writes the same quotes
# into thought-bank/index.html as plain HTML whenever they change, so the page also reads without its script.

on:
  push:
    branches: [main]
    paths:
      - "thought-bank/quotes.json"
      - "thought-bank/quotes.js"
      - "scripts/build_thought_bank.py"
      - ".github/workflows/thought-bank.yml"
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: thought-bank
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the page and publish it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the project pipelines push often: each try starts from the latest main, so a rejected push just tries again
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/build_thought_bank.py
            git add thought-bank/index.html
            if git diff --cached --quiet; then echo "page already up to date"; exit 0; fi
            git commit -q -m "Thought Bank: the quotes in the page itself"
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
