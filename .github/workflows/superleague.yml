name: Site · Super League

# /superleague/: results from ESPN and the season files, ratings, projections for the coming round,
# odds and value bets (markets left out in value.py: SKIP, HIDE, NO_BETS; closing odds from the "odds" branch, see superleague-closing-odds.yml), and the
# Referees tab's game list (referee-games.js, from our own match data: BettingSignal superleague/referees.py).
# Scripts and data in nikolitso/BettingSignal (superleague/): refs.txt, data/opta_manual.json and new data files are edited
# there (opta_manual.json fills stats ESPN lacks: throw-ins, goal kicks, woodwork). Three times a day; "Update all sites" too. 
on:
  schedule:
    - cron: "0 7,12,16 * * *"   # 09:00, 14:00 and 18:00 Athens in winter (10:00, 15:00, 19:00 in summer)
  workflow_dispatch:            # Run workflow button: Actions tab, or the GitHub mobile app
  push:                         # a change to this file runs it once
    branches: [main]
    paths: [".github/workflows/superleague.yml"]

permissions:
  contents: write

concurrency:
  group: superleague
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline
        with:
          dir: superleague
          requirements: -r _bs/superleague/requirements.txt
          run: |
            python -u update.py | tee /tmp/superleague.log
            python -u games.py
          pages: superleague/data.js superleague/index.html superleague/referee-games.js superleague/games superleague/sitemap.xml
          label: Super League
          token: ${{ secrets.SITES_TOKEN }}
      - name: Message new picks
        # an ntfy push for every value bet fixed for the first time on this run (EV at 10%+, value.py LOCK_EV),
        # sent once the page has it; the topic is the NTFY_TOPIC secret
        if: ${{ success() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONIOENCODING: utf-8
        shell: python
        run: |
          import base64, json, os, time, urllib.request
          enc = lambda t: t if t.isascii() else '=?UTF-8?B?' + base64.b64encode(t.encode('utf-8')).decode() + '?='
          topic = os.environ.get('NTFY_TOPIC', '').strip()
          line = next((l for l in open('/tmp/superleague.log', encoding='utf-8') if l.startswith('NEWPICKS ')), None)
          new = json.loads(line[9:]) if line and topic else []
          for b in new:
              bet = '1X2: ' + b['side'] if b['stat'] == 'result' else f"{b['label']} {b['side'].capitalize()} {b['line']:g}"
              when = f"{b['kickoff'][8:10]}/{b['kickoff'][5:7]} {b['kickoff'][11:16]}"
              body = (f"{b['home']} – {b['away']}\nKick-off {when} (Greek time)\n{bet}\n"
                      f"Price {b['odds']:.2f} · edge {b['ev']*100:+.0f}%").encode('utf-8')
              req = urllib.request.Request('https://ntfy.sh/' + topic, data=body, method='POST', headers={
                  'Title': enc(f"Super League pick: {bet}"), 'Tags': 'soccer',
                  'Click': 'https://antonisnikolitsopoulos.com/superleague/#view=picks'})
              try:
                  print(b['home'], urllib.request.urlopen(req, timeout=30).status)
              except Exception as e:
                  print(b['home'], 'not sent', e)
              time.sleep(2)
          print(len(new), 'new picks', '' if topic else '(no NTFY_TOPIC secret: nothing sent)')
