name: Delete old runs (one-off)

# Deletes every finished workflow run older than 7 days, and all but the latest 5 "pages build and deployment" runs.
# The repo's own token has 1000 API calls an hour, so a big backlog takes a few rounds with a pause in between.
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          cutoff=$(date -u -d '7 days ago' +%FT%TZ)
          echo "cutoff $cutoff"
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status=="completed") | [.id, .created_at, .name] | @tsv' > /tmp/runs.tsv
          echo "$(wc -l < /tmp/runs.tsv) finished runs"
          # old ones, plus pages builds beyond the latest 5 (the list is newest first)
          awk -F'\t' -v c="$cutoff" '$2 < c {print $1}' /tmp/runs.tsv > /tmp/del.txt
          awk -F'\t' '$3=="pages build and deployment"' /tmp/runs.tsv | tail -n +6 | cut -f1 >> /tmp/del.txt
          sort -u /tmp/del.txt > /tmp/ids.txt
          echo "$(wc -l < /tmp/ids.txt) to delete"
          n=0
          while read -r id; do
            until gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/runs/$id" --silent 2>/tmp/err; do
              if grep -q "rate limit" /tmp/err; then echo "rate limit after $n deletes, pausing 10 min"; sleep 600; else cat /tmp/err; break; fi
            done
            n=$((n+1)); [ $((n % 100)) -eq 0 ] && echo "$n deleted"
          done < /tmp/ids.txt
          echo "done: $n deleted"
