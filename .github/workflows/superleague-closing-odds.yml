name: Super League

# Every 15 minutes from 12:00 to 23:45 Athens (winter time): Superbet's odds for the Super League
# games kicking off within 45 minutes, saved on the "odds" branch (see close.py there). The site
# pipeline on the PC copies them in as each game's closing odds, to score the value bets (CLV).
# GitHub often runs schedules late or skips them, so the Cloudflare Worker x-daily-scheduler also
# triggers it every 30 minutes (workflow_dispatch). Run it by hand with minutes=10080 to pull the
# whole round's odds for the Vs Bookie tab. A push of this file runs it once with a week-wide window, as a test that the feed answers.
on:
  schedule:
    - cron: "*/15 10-21 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Pull the games kicking off within this many minutes (10080 = the whole week)
        default: "45"
  push:
    branches: [main]
    paths: [".github/workflows/superleague-closing-odds.yml"]

permissions:
  contents: write

concurrency:
  group: superleague-closing-odds
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: odds
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pull the odds
        run: python close.py ${{ github.event.inputs.minutes || (github.event_name == 'push' && '10080' || '45') }}
      - name: Save
        run: |
          git add data/odds
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Closing odds $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
