name: Handball

# /handball/: refresh from Flashscore, rebuild the pages, publish them, save the ledgers to nikolitso/BettingSignal
# (scripts in handball/projector there). Every 6 hours; the "Update all sites" button runs it too.
on:
  schedule:
    - cron: "0 1,7,13,19 * * *"   # every 6 hours: 03:00, 09:00, 15:00, 21:00 Athens in winter (an hour later in summer)
  workflow_dispatch:          # Run workflow button: Actions tab, or the GitHub mobile app

permissions:
  contents: write

concurrency:
  group: handball
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline
        with:
          dir: handball/projector
          requirements: numpy scipy
          run: |
            python -W ignore run_update.py | tee /tmp/update.log
            python ../site/make_site.py "$GITHUB_WORKSPACE/handball"
          pages: handball
          label: Handball
          token: ${{ secrets.SITES_TOKEN }}
      - name: Signals
        if: ${{ always() }}
        run: grep -h "^SIGNALS\|^SUMMARY" /tmp/update.log 2>/dev/null || true
      - name: Signal message for new picks
        if: ${{ success() }}
        env:
          SIGNAL_PHONE: ${{ secrets.SIGNAL_PHONE }}
          SIGNAL_APIKEY: ${{ secrets.SIGNAL_APIKEY }}
        shell: python
        run: |
          import json, os, re, datetime, urllib.parse, urllib.request
          line = next((l for l in open('/tmp/update.log', encoding='utf-8') if l.startswith('SIGNALS ')), None)
          new = json.loads(line[8:])['new'] if line and os.environ['SIGNAL_APIKEY'] else []   # no key set yet: nothing to send
          name = lambda s: re.sub(r'^(Women|Men) · ([^·]*?)( · .*)?$', lambda m: m.group(2).strip() + (' (W)' if m.group(1) == 'Women' else ' (M)'), s)
          team = lambda t: re.sub(r' W$', '', t)
          for s in new:
              day = datetime.date.fromisoformat(s['date']).strftime('%a %d %b')
              text = (f"New handball pick: {s['side'].title()} {s['line']}\n{team(s['home'])} – {team(s['away'])}\n"
                      f"{name(s['leagueName'])} · {day} {s['time'] or ''} (Greek time)\n"
                      f"Odds {s['odds']} · model {s['ours']}\nhttps://antonisnikolitsopoulos.com/handball/projections/")
              q = urllib.parse.urlencode(dict(phone=os.environ['SIGNAL_PHONE'], apikey=os.environ['SIGNAL_APIKEY'], text=text))
              print(s['home'], urllib.request.urlopen('https://signal.callmebot.com/signal/send.php?' + q, timeout=30).status)
