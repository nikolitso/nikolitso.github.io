name: Update project pills

# Every morning (about 06:30 Athens): read the live project sites and refresh the pills on the
# homepage's "Data & models" cards (scripts/update_projects.py). Commits only when something changed.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-projects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh the pills
        run: python scripts/update_projects.py
      - name: Save
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Homepage: refresh project pills"
          git pull --rebase
          git push
