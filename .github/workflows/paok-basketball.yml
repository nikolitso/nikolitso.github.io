name: Site · PAOK Basketball

# /paok-basketball/: PAOK's season game by game (EuroCup and the Greek Basket League), league-wide stats, power
# ratings and the next game's scouting. scripts/plan.py reads the schedules and decides what tonight needs; each
# part keeps its last good data if its source is down. Scripts in nikolitso/BettingSignal (paok-basketball/), the
# pages and data in paok-basketball/ here. Runs at 09:00, 14:00 and 23:00 Athens in winter (an hour later in summer), and from the button.
on:
  schedule:
    - cron: "0 7,12,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paok-basketball
  cancel-in-progress: false

defaults:
  run:
    working-directory: paok-basketball

env:
  PB_SITE: ${{ github.workspace }}/paok-basketball
  S: ${{ github.workspace }}/_bs/paok-basketball/scripts

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: nikolitso/BettingSignal
          token: ${{ secrets.SITES_TOKEN }}
          path: _bs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Excel reader (play-by-play sheets for plus/minus) and numbers library (player ratings)
        run: pip install --quiet openpyxl numpy
      - name: Plan tonight's update from the schedules
        id: plan
        run: python $S/plan.py
      - name: EuroCup
        id: eurocup
        if: steps.plan.outputs.eurocup == 'true'
        continue-on-error: true
        run: python $S/update_eurocup.py
      - name: Greek League (ESAKE)
        id: gbl
        if: steps.plan.outputs.gbl == 'true'
        continue-on-error: true
        run: python $S/update_gbl.py
      - name: League-wide team stats and averages
        id: league
        if: steps.plan.outputs.comps != ''
        continue-on-error: true
        run: python $S/league.py ${{ steps.plan.outputs.comps }}
      - name: Power ratings and season projections
        id: power
        if: steps.plan.outputs.comps != ''
        continue-on-error: true
        run: python $S/power.py ${{ steps.plan.outputs.comps }}
      - name: Re-fit the projection settings
        if: steps.plan.outputs.comps != ''
        continue-on-error: true
        run: python $S/learn.py
      - name: Next-game scouting and projections
        id: scout
        if: steps.plan.outputs.comps != ''
        continue-on-error: true
        run: python $S/scout.py ${{ steps.plan.outputs.comps }}
      - name: Player Offence and Defence ratings
        id: ratings
        if: steps.plan.outputs.comps != ''
        continue-on-error: true
        run: python $S/ratings.py
      - name: Highlight videos
        if: steps.plan.outputs.comps != ''
        run: python $S/highlights.py ${{ steps.plan.outputs.comps }} || echo "highlights unavailable, keeping previous links"
      - name: Player photos and profiles (paokbc.gr)
        if: steps.plan.outputs.full == 'true'
        run: python $S/update_paokbc.py || echo "paokbc.gr unavailable, keeping previous data"
      - name: Commit if anything changed
        run: |
          git add -A data
          # ignore the "updated" timestamp so we only commit real changes
          if git diff --cached --quiet -I '"updated"'; then echo "No new data"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "PAOK Basketball: refresh $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')"
          # several pipelines push at once: on a rejected push, rebase and try again
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
      - name: Report any step that failed (its data was kept from the last good run)
        if: steps.eurocup.outcome == 'failure' || steps.gbl.outcome == 'failure' || steps.league.outcome == 'failure' || steps.power.outcome == 'failure' || steps.scout.outcome == 'failure' || steps.ratings.outcome == 'failure'
        run: |
          echo "EuroCup: ${{ steps.eurocup.outcome }} | Greek League: ${{ steps.gbl.outcome }} | League: ${{ steps.league.outcome }} | Power: ${{ steps.power.outcome }} | Scouting: ${{ steps.scout.outcome }} | Ratings: ${{ steps.ratings.outcome }}"
          echo "Everything that succeeded has been saved. Re-run to retry the failed part."
          exit 1
