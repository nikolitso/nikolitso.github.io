name: Feed · Basketball totals live test

# Live test of the basketball totals rule (the leagues in data/live_leagues.json): this season's results and odds, projections for
# the next 7 days, picks logged at the line on offer and settled after the game. Scripts and data in
# nikolitso/BettingSignal (basketball-overs/); the record is basketball-overs/data/live/report.md there.
# Publishes basketball/overs/live.js (projections + live record; the backtest part of the page is fixed) and a page per game.
# Hourly: GitHub drops most scheduled runs, so a cron-job.org job starts this through the API (workflow_dispatch).
# Its token expires 30 Oct 2027. The schedule below is only a backup.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basketball-overs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: nikolitso/BettingSignal
          token: ${{ secrets.SITES_TOKEN }}
          path: _bs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: pip install --quiet -r _bs/basketball-overs/requirements.txt
      - name: Update
        working-directory: _bs/basketball-overs
        env:
          TZ: Europe/Athens
          PYTHONIOENCODING: utf-8
          SITE_REPO: ${{ github.workspace }}
        run: |
          set -o pipefail
          python -u livetest.py 2>&1 | tee /tmp/live.log
      - name: Publish the page data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball/overs/live.js basketball/overs/games basketball/overs/sitemap.xml
          if git diff --cached --quiet; then echo "page unchanged"; exit 0; fi
          git commit -q -m "Basketball totals: refresh $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
      - name: Message new picks
        # an ntfy push for every new pick (11 Nov 2026), sent once the page has it; the topic is the NTFY_TOPIC secret
        if: ${{ success() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: python
        run: |
          import json, os, time, urllib.request
          topic = os.environ.get('NTFY_TOPIC', '').strip()
          line = next((l for l in open('/tmp/live.log', encoding='utf-8') if l.startswith('NEWPICKS ')), None)
          new = json.loads(line[9:]) if line and topic else []
          for s in new:
              h1 = s.get('h1')                                  # 1H test picks too (14 Nov 2026)
              body = (f"{s['home']} – {s['away']}\n{s['league']} · {s['when']}\n"
                      f"Price {s['px']:.2f} · edge {s['edge']*100:+.0f}% · model {'1H ' if h1 else ''}{s['mu']}").encode('utf-8')
              req = urllib.request.Request('https://ntfy.sh/' + topic, data=body, method='POST', headers={
                  'Title': f"Basketball {'1H ' if h1 else ''}pick: Over {s['line']}" + (' (first half)' if h1 else ''), 'Tags': 'basketball',
                  'Click': 'https://antonisnikolitsopoulos.com/basketball/overs/#view=' + ('h1live' if h1 else 'livetest')})
              try:
                  print(s['home'], urllib.request.urlopen(req, timeout=30).status)
              except Exception as e:
                  print(s['home'], 'not sent', e)
              time.sleep(2)
          print(len(new), 'new picks', '' if topic else '(no NTFY_TOPIC secret: nothing sent)')
      - name: Save the data
        working-directory: _bs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "data unchanged"; exit 0; fi
          git commit -q -m "Basketball totals: live test $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
