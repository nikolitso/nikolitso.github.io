name: Site · FIBA Europe Cup

# The /fibaeuropecup/ pipeline (scripts in nikolitso/BettingSignal, fibaeuropecup/), on GitHub instead of the PC:
#   07:35 Athens   update.py          results, fixtures and odds (Flashscore), player stats and pace (FIBA), projections
#   hourly 10-21   matchday_odds.py   today's games: Flashscore lines, projections
# Both commit and push the fibaeuropecup/ files here. Runs on its own schedule.
# scripts/fiba_runner.py starts them: Flashscore shows a runner outside Greece other bookmakers than the Greek ones
# the pipeline looks for, so the runner lets it take the line from those (Stake.com, 1xBet ...) when no Greek book is listed.
on:
  schedule:
    - cron: "35 5 * * *"      # full update (UTC; 07:35 Athens in winter, 08:35 in summer)
    - cron: "5 7-18 * * *"    # matchday lines, 10:05-21:05 Athens in winter
  workflow_dispatch:
    inputs:
      job:
        description: "update = results, odds, fixtures; odds = today's matchday lines; probe = print what Flashscore shows the runner, publish nothing"
        type: choice
        options: [update, odds, probe]
        default: update

permissions:
  contents: write

concurrency:
  group: fiba-europe-cup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                 # the latest main, not the commit the run was queued on: a queued run must not publish over an older copy
      - uses: actions/checkout@v5
        with:
          repository: nikolitso/BettingSignal
          token: ${{ secrets.SITES_TOKEN }}
          path: _bs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: |
          pip install --quiet -r _bs/fibaeuropecup/requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
      - name: Run
        env:
          FIBA_SITE: ${{ github.workspace }}/fibaeuropecup
          FIBA_NO_MIRROR: "1"
          FIBA_PIPELINE: ${{ github.workspace }}/_bs/fibaeuropecup
          PYTHONIOENCODING: utf-8
          TZ: Europe/Athens          # time stamps and commit messages in Athens time, as on the PC
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          job="${{ inputs.job }}"
          [ "${{ github.event.schedule }}" = "5 7-18 * * *" ] && job=odds
          python -u scripts/fiba_runner.py "${job:-update}"
      - name: Game pages
        if: ${{ inputs.job != 'probe' }}
        env:
          FIBA_SITE: ${{ github.workspace }}/fibaeuropecup
          PYTHONIOENCODING: utf-8
          TZ: Europe/Athens
        run: |
          python -u _bs/fibaeuropecup/games.py
          git add fibaeuropecup/games fibaeuropecup/sitemap.xml
          if git diff --cached --quiet; then echo "game pages unchanged"; exit 0; fi
          git commit -q -m "FIBA Europe Cup: game pages $(date '+%Y-%m-%d %H:%M')"
          # several pipelines push at once: on a rejected push, rebase and try again
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
      - name: New picks
        # the open picks on the published Picks tab not announced yet (scripts/page_picks.py runs the page's own rule);
        # the list of announced picks is saved in BettingSignal before any message goes out, so each is sent once
        if: ${{ inputs.job != 'probe' }}
        working-directory: _bs
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -u ../scripts/page_picks.py ../fibaeuropecup fibaeuropecup/data/alerted_picks.json | tee /tmp/fiba-picks.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fibaeuropecup/data/alerted_picks.json
          if git diff --cached --quiet; then echo "no new picks"; exit 0; fi
          git commit -q -m "FIBA Europe Cup: picks announced $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
      - name: Message new picks
        # an ntfy push for every new pick on the Picks tab (scripts/page_picks.py runs the page's own rule),
        # sent once the page has it; the topic is the NTFY_TOPIC secret
        if: ${{ success() && inputs.job != 'probe' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONIOENCODING: utf-8
        shell: python
        run: |
          import base64, json, os, time, urllib.request
          enc = lambda t: t if t.isascii() else '=?UTF-8?B?' + base64.b64encode(t.encode('utf-8')).decode() + '?='
          topic = os.environ.get('NTFY_TOPIC', '').strip()
          line = next((l for l in open('/tmp/fiba-picks.log', encoding='utf-8') if l.startswith('NEWPICKS ')), None)
          new = json.loads(line[9:]) if line and topic else []
          for k in new:
              price = f"Price {k['pr']:.2f}" if k['logged'] else 'No price read yet'
              body = (f"{k['h']} – {k['a']}\nTip-off {k['date'][8:10]}/{k['date'][5:7]} {k['time']}\n"
                      f"Handicap: {k['bet']}\n{price} · model edge {k['gap']:.1f} pts").encode('utf-8')
              req = urllib.request.Request('https://ntfy.sh/' + topic, data=body, method='POST', headers={
                  'Title': enc(f"FIBA Europe Cup pick: {k['bet']}"), 'Tags': 'basketball',
                  'Click': 'https://antonisnikolitsopoulos.com/fibaeuropecup/#view=picks'})
              try:
                  print(k['h'], urllib.request.urlopen(req, timeout=30).status)
              except Exception as e:
                  print(k['h'], 'not sent', e)
              time.sleep(2)
          print(len(new), 'new picks', '' if topic else '(no NTFY_TOPIC secret: nothing sent)')
