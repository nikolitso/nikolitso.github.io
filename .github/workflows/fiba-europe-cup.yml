name: Site · FIBA Europe Cup

# The /fibaeuropecup/ pipeline (scripts in nikolitso/BettingSignal, fibaeuropecup/), on GitHub instead of the PC:
#   07:35 Athens   update.py          results, fixtures and odds (Flashscore), projections
#   hourly 10-21   matchday_odds.py   today's games: Flashscore lines, projections
# Both commit and push the fibaeuropecup/ files here. The "Update all sites" button runs the full update.
# scripts/fiba_runner.py starts them: Flashscore shows a runner outside Greece other bookmakers than the Greek ones
# the pipeline looks for, so the runner lets it take the line from those (Stake.com, 1xBet ...) when no Greek book is listed.
on:
  schedule:
    - cron: "35 5 * * *"      # full update (UTC; 07:35 Athens in winter, 08:35 in summer)
    - cron: "5 7-18 * * *"    # matchday lines, 10:05-21:05 Athens in winter
  workflow_dispatch:
    inputs:
      job:
        description: "update = results, odds, fixtures; odds = today's matchday lines; probe = print what Flashscore shows the runner, publish nothing"
        type: choice
        options: [update, odds, probe]
        default: update

permissions:
  contents: write

concurrency:
  group: fiba-europe-cup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: nikolitso/BettingSignal
          token: ${{ secrets.SITES_TOKEN }}
          path: _bs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: |
          pip install --quiet -r _bs/fibaeuropecup/requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
      - name: Run
        env:
          FIBA_SITE: ${{ github.workspace }}/fibaeuropecup
          FIBA_NO_MIRROR: "1"
          FIBA_PIPELINE: ${{ github.workspace }}/_bs/fibaeuropecup
          PYTHONIOENCODING: utf-8
          TZ: Europe/Athens          # time stamps and commit messages in Athens time, as on the PC
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          job="${{ inputs.job }}"
          [ "${{ github.event.schedule }}" = "5 7-18 * * *" ] && job=odds
          python -u scripts/fiba_runner.py "${job:-update}"
