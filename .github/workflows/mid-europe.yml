name: Site · Football Research

# /football/research/: the price gap (best price against the market's margin-free price) in 1X2 and over/under 2.5 in
# European men's leagues; the list is in BettingSignal mid-europe/leagues.py (women's leagues dropped 10 Nov 2026).
# Results, event ids and opening/closing odds, then the backtest bets for the page (data.js), one file of bets per
# league for the league pages (lg/) and the picks log.
# Scripts and data in nikolitso/BettingSignal (mid-europe/). Every hour, so prices are caught near the opening.
on:
  schedule:
    - cron: "23 * * * *"   # every hour (user, 10 Nov 2026); a run takes about 35 minutes
    # 11 Nov 2026: GitHub drops most of these (one scheduled run in 6 hours). For true hourly runs an outside timer
    # must start the workflow through the API (workflow_dispatch), as for basketball-overs.yml.
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/mid-europe.yml"]

permissions:
  contents: write

concurrency:
  group: mid-europe
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline
        with:
          dir: mid-europe
          requirements: -r _bs/mid-europe/requirements.txt
          browser: "true"
          run: |
            set -o pipefail
            python -u update.py 2>&1 | tee /tmp/research.log
          pages: football/research/data.js football/research/lg
          label: Football Research
          token: ${{ secrets.SITES_TOKEN }}
      - name: Message new picks
        # an ntfy push for every new pick of both groups (11 Nov 2026), sent once the page has it (the pipeline step above
        # publishes first); build.py prints the run's new picks as one NEWPICKS line. The topic is the NTFY_TOPIC secret.
        if: ${{ success() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: python
        run: |
          import json, os, time, urllib.request
          topic = os.environ.get('NTFY_TOPIC', '').strip()
          line = next((l for l in open('/tmp/research.log', encoding='utf-8') if l.startswith('NEWPICKS ')), None)
          new = json.loads(line[9:]) if line and topic else []
          for s in new:
              body = (f"{s['home']} – {s['away']}\n{s['league']} · {s['when']} (Greek time)\n"
                      f"Price {s['odds']:.2f} · EV {s['ev']*100:+.0f}%"
                      + ("" if s['group'] == 'main' else "\nPrice 3.00+: followed on paper")).encode('utf-8')
              req = urllib.request.Request('https://ntfy.sh/' + topic, data=body, method='POST', headers={
                  'Title': f"Football pick: {s['side']} {s['odds']:.2f}", 'Tags': 'soccer',
                  'Click': 'https://antonisnikolitsopoulos.com/football/research/#view=picks'})
              try:
                  print(s['home'], urllib.request.urlopen(req, timeout=30).status)
              except Exception as e:
                  print(s['home'], 'not sent', e)
              time.sleep(2)
          print(len(new), 'new picks', '' if topic else '(no NTFY_TOPIC secret: nothing sent)')
