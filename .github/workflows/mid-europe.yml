name: Site · Mid-Europe Gaps

# /football/mid-europe/: twenty mid-tier European leagues (list in BettingSignal mid-europe/leagues.py: Austria to
# Serbia found the BTTS gap; Belgium, Netherlands, Scotland, Greece, Turkey, Israel, Norway, Sweden, Finland, Ireland
# added 9 Nov 2026 as an out-of-sample check). Results, xG and box scores from FotMob, event ids and opening/closing odds from
# the odds feed, the xG model, the research tables and the live BTTS picks (data/picks_log.json, frozen at first post).
# Scripts and data in nikolitso/BettingSignal (mid-europe/). Three times a day, so picks are caught near the opening price.
on:
  schedule:
    - cron: "0 7,12,18 * * *"   # 09:00, 14:00 and 20:00 Athens in winter
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/mid-europe.yml"]

permissions:
  contents: write

concurrency:
  group: mid-europe
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline
        with:
          dir: mid-europe
          requirements: -r _bs/mid-europe/requirements.txt
          browser: "true"
          run: python -u update.py
          pages: football/mid-europe/data.js
          label: Mid-Europe Gaps
          token: ${{ secrets.SITES_TOKEN }}
