name: Site · Football Research

# /football/research/: the price gap (best price against the market's margin-free price) in 1X2 and over/under 2.5 in
# European men's leagues; the list is in BettingSignal mid-europe/leagues.py (women's leagues dropped 10 Nov 2026).
# Results, event ids and opening/closing odds, then the backtest bets for the page (data.js), one file of bets per
# league for the league pages (lg/) and the picks log.
# Scripts and data in nikolitso/BettingSignal (mid-europe/). Every hour, so prices are caught near the opening.
on:
  schedule:
    - cron: "23 * * * *"   # every hour (user, 10 Nov 2026); a run takes about 35 minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/mid-europe.yml"]

permissions:
  contents: write

concurrency:
  group: mid-europe
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline
        with:
          dir: mid-europe
          requirements: -r _bs/mid-europe/requirements.txt
          browser: "true"
          run: python -u update.py
          pages: football/research/data.js football/research/lg
          label: Football Research
          token: ${{ secrets.SITES_TOKEN }}
