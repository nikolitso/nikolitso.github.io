name: Super League referees

# /superleague/ Referees tab: each finished Super League game read once from Flashscore (referee, score,
# cards, 1X2 odds) into superleague/referee-games.js; the page works out every referee table from it.
# Twice a day, after the evening games and again the next morning. The first runs also backfill
# 2024-25 and 2025-26 (and Big-4 v Big-4 back to 2021-22), at most `limit` games a run.
on:
  schedule:
    - cron: "25 8 * * *"    # 10:25 Athens in winter (11:25 in summer)
    - cron: "40 21 * * *"   # 23:40 Athens in winter (00:40 in summer)
  workflow_dispatch:
    inputs:
      limit:
        description: Most games to read in this run
        default: "150"
  push:
    branches: [ccr-ec916b33-scivoa]
    paths: [".github/workflows/superleague-referees.yml", "scripts/superleague_refs.py"]

permissions:
  contents: write

concurrency:
  group: superleague-referees
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium
      - name: Read new games
        env:
          TZ: Europe/Athens
          PYTHONIOENCODING: utf-8
        run: python -u scripts/superleague_refs.py --limit ${{ github.event.inputs.limit || (github.event_name == 'push' && '40') || '150' }}
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add superleague/referee-games.js
          if git diff --cached --quiet; then echo "no new games"; exit 0; fi
          git commit -q -m "Super League referees: refresh $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
