name: Post · Daily X

# One post a day at 14:00 Athens, taking turns: book, quote (scripts/x_daily.py ROTATION; three a day until 18 Nov 2026,
# films too until 19 Nov 2026; films now go out on Bluesky).
# A Cloudflare Worker (x-daily-scheduler) triggers this at each slot and again 30 minutes later ("auto");
# GitHub's own hourly schedule is a backup. The day's post goes out once; a late run still posts it, never a burst.
# The 11:00 and 20:00 triggers no longer post; they still refresh the homepage cards below.
# Each run also refreshes the homepage's Today's picks card and its Latest books and films.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "What to post (auto = the regular check: the current slot, if not posted yet; redo-quote = delete the last quote and post it again)"
        type: choice
        options: [book, quote, auto, redo-quote]
        default: book
      dry_run:
        description: "Dry run (show the post, don't publish)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: x-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: nikolitso/whatalgomissed
          path: wam
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Post
        env:
          WAM_DIR: wam   # where the What Algo Missed repo is checked out above
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          # "auto" is what the Cloudflare scheduler sends: behave exactly like the scheduled check
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.kind }}" != "auto" ]; then
            KIND="${{ inputs.kind }}"
            FLAGS="--force"
            if [ "$KIND" = "redo-quote" ]; then KIND="quote"; FLAGS="redo $FLAGS"; fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
            python scripts/x_daily.py "$KIND" $FLAGS
          else
            # scheduled check: post the current 6-hour slot if it hasn't gone out yet
            python scripts/x_daily.py auto
          fi
      - name: Update the homepage's Today's picks card
        if: ${{ !cancelled() }}   # record a successful post even if the other kind failed
        env:
          WAM_DIR: wam
        run: python scripts/update_picks.py
      - name: Update the homepage's Latest books and films
        # here rather than only in its own daily workflow, whose GitHub schedule starts hours late: this job is
        # started on time at each slot, so a film dated 11:00 Athens reaches the homepage within minutes
        if: ${{ !cancelled() }}
        run: python scripts/update_posts.py || echo "latest posts update skipped"
      - name: Save what was posted
        if: ${{ !cancelled() }}   # record a successful post even if the other kind failed
        run: |
          if git diff --quiet -- _x index.html 2>/dev/null && [ -z "$(git ls-files --others -- _x)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _x index.html
          git commit -m "X: record daily post and update Today's picks"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 10 + 5)); done
          exit 1
