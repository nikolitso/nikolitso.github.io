name: Daily X posts

# Five posts a day (Athens time): 02:00 book, 08:00 film, 11:00 quote, 14:00 book, 20:00 film.
# A Cloudflare Worker triggers this every 30 minutes ("auto"); GitHub's own hourly schedule
# is a backup. Each slot posts once; late runs still post the current slot, never a burst.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "What to post (auto = the regular check: the current slot, if not posted yet)"
        type: choice
        options: [book, film, quote, auto]
        default: book
      dry_run:
        description: "Dry run (show the post, don't publish)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: x-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: nikolitso/whatalgomissed
          path: wam
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Post
        env:
          WAM_DIR: wam   # where the What Algo Missed repo is checked out above
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          # "auto" is what the Cloudflare scheduler sends: behave exactly like the scheduled check
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.kind }}" != "auto" ]; then
            KIND="${{ inputs.kind }}"
            FLAGS="--force"
            if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
            python scripts/x_daily.py "$KIND" $FLAGS
          else
            # scheduled check: post the current 6-hour slot if it hasn't gone out yet
            python scripts/x_daily.py auto
          fi
      - name: Update the homepage's Today's picks card
        if: ${{ !cancelled() }}   # record a successful post even if the other kind failed
        env:
          WAM_DIR: wam
        run: python scripts/update_picks.py
      - name: Save what was posted
        if: ${{ !cancelled() }}   # record a successful post even if the other kind failed
        run: |
          if git diff --quiet -- _x index.html 2>/dev/null && [ -z "$(git ls-files --others -- _x)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _x index.html
          git commit -m "X: record daily post and update Today's picks"
          git pull --rebase
          git push
