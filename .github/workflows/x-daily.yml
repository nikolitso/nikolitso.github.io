name: Daily X posts

# Book at 14:00 and film at 19:00 Athens time. GitHub's scheduler can run late or skip
# runs, so this checks every hour through the afternoon and evening; on each run the
# script posts a book and/or a film only if it's past that one's time and it hasn't
# gone out yet today, so extra checks never cause duplicates. (UTC 11-21 covers
# 14:00-24:00 Athens in both summer and winter time.)
on:
  schedule:
    - cron: "7 11-21 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "What to post"
        type: choice
        options: [book, film]
        default: book
      dry_run:
        description: "Dry run (show the post, don't publish)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: x-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: nikolitso/whatalgomissed
          path: wam
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Post
        env:
          WAM_DIR: wam   # where the What Algo Missed repo is checked out above
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            KIND="${{ inputs.kind }}"
            FLAGS="--force"
            if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
            python scripts/x_daily.py "$KIND" $FLAGS
          else
            # scheduled check: try both; each posts only when due
            status=0
            python scripts/x_daily.py book || status=1
            python scripts/x_daily.py film || status=1
            exit $status
          fi
      - name: Update the homepage's Today's picks card
        if: ${{ !cancelled() }}   # record a successful post even if the other kind failed
        env:
          WAM_DIR: wam
        run: python scripts/update_picks.py
      - name: Save what was posted
        if: ${{ !cancelled() }}   # record a successful post even if the other kind failed
        run: |
          if git diff --quiet -- _x index.html 2>/dev/null && [ -z "$(git ls-files --others -- _x)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _x index.html
          git commit -m "X: record daily post and update Today's picks"
          git pull --rebase
          git push
